      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];

          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {

          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }

        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;

        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];

/* ---------------- lexique du scénario (tiré des pages de glossaire) ---------------- */

      const doc = new DOMParser().parseFromString("<div>" + m.html + "</div>", "text/html");
      doc.querySelectorAll(".gl").forEach(gl => {
        let cat = "";

/* tirages reproductibles : le même questionnaire de vocabulaire pour tout le groupe */

/* ---------------- règles de jeu (cœur pur, rejouable) ---------------- */
const NOFX = { res() {}, tok() {} };
const UIFX = {
  res(k, before, after, r) { bumpRes(k); if (after > before) SND.up(); else if (after < before) { if (r.display === "stars") SND.down(); else SND.pay(); } },
  tok(k) { if (SC.hideTokens) setTimeout(renderHud, 0); setTimeout(() => bumpTok(k), 20); SND.up(); }
};
function newState(sc) { const res = {}; sc.resources.forEach(r => { res[r.key] = r.start; }); return { res, tok: new Set(), pile: [] }; }
function Rs(sc, k) { return sc.resources.find(r => r.key === k); }
function condS(S, c) {
  if (!c) return true;
  const ors = c.split("|");
  if (ors.length > 1) return ors.some(x => condS(S, x));
  const ands = c.split("&");
  if (ands.length > 1) return ands.every(x => condS(S, x));
  const p = c.split(":"), op = p[0], a = p[1];
  if (op === "n") return p[2].split(",").filter(t => S.tok.has(t)).length >= Number(a);
  if (op === "has") return S.tok.has(a);
  if (op === "not") return !S.tok.has(a);
  if (op === "zero") return (S.res[a] || 0) <= 0;
  if (op === "lte") return (S.res[a] || 0) <= Number(p[2]);
  return true;
}
function words(n, fem) { return n === 1 ? (fem ? "une" : "un") : ({ 2: "deux", 3: "trois", 4: "quatre", 5: "cinq" }[n] || String(n)); }
function qty(r, n) { return words(n, r.fem) + " " + (n === 1 ? r.unit : r.units); }
function de(w) { return /^[aeéèêiouyh]/i.test(w) ? "d’" : "de "; }
function resIcon(r, gain) { return r.display === "stars" ? (gain ? "star" : "starO") : r.icon; }

  S.res[k] = v; fx.res(k, before, v, r);

}

  if (!condS(S, ch.if)) return null;
  const pre = ch.if && ch.if.indexOf("not:") === 0 ? "Sans le jeton " + ch.if.slice(4) + NB + ": " : "";
  if (ch.res) {
    const r = Rs(sc, ch.res); changeResS(S, sc, ch.res, ch.d, fx);
    let t = ch.d > 0 ? (r.display === "stars" ? "Gagnez " : "Reprenez ") + qty(r, ch.d) : "Rendez " + qty(r, -ch.d);
    if (pre) t = pre + lc(t);
    return { ic: resIcon(r, ch.d > 0), txt: t };
  }
  if (S.tok.has(ch.tok)) return null;
  S.tok.add(ch.tok); fx.tok(ch.tok);

}

      else phrase = "plus " + de(r.unit) + r.unit + " ni " + de(f.unit) + f.unit + " à rendre";
    }

}

}

}

function parseSession(code) {
  const c = String(code || "").toUpperCase().replace(/\s/g, "");
  const m = c.match(/^(\d{1,2})([TPA]*)$/);
  if (!m) return null;
  const sc = scByNum(Number(m[1]));
  if (!sc) return null;
  const test = m[2].includes("T") && hasTest(sc), pressure = m[2].includes("P"), sa = m[2].includes("A") && hasSa(sc);
  return { sc, test, pressure, sa, code: sessionCode(sc.num, test, pressure, sa) };
}
function sessionCode(num, test, pressure, sa) { return String(num) + (test ? "T" : "") + (pressure ? "P" : "") + (sa ? "A" : ""); }

function startGame(id, mode, sessionCodeStr) {
  SC = scById(id); if (!SC) return;
  st.code = LIVE.code ? (st.code || "").trim() : "";
  SND.init(); SND.reset(); SND.cue("chime");
  st.mode = { test: !!mode.test && hasTest(SC), pressure: !!mode.pressure, sa: !!mode.sa && hasSa(SC) }; st.session = sessionCodeStr || "";
  st.learn = blankLearn(SC);
  st.g = newState(SC); st.dec = []; st.answer = ""; st.mood = null; st.moodText = ""; st.application = "";
  st.pre = null; st.post = null; st.avis = null; st.record = null; st.recId = uid(); st.recDate = null; st.reveal = false;
  st.tabsAll = new Set(); st.finPlayed = false; st.card = null; st.drawer.tab = SC.dossier[0].id;
  if (st.mode.test) { st.qphase = "pre"; st.qdraft = null; st.screen = "quest"; } else st.screen = "rules";
  render(); window.scrollTo({ top: 0 });
}

/* questionnaires avant / après (fiches joueur papier) */
function blankDraft() { return { a: SC.eval.questions.map(q => q.type === "multi" ? [] : q.type === "open" ? "" : null), q7: null }; }
function scoreOf(answers) {
  let s = 0;
  SC.eval.questions.forEach((q, i) => {
    const a = answers[i];
    if (q.type === "single" && a === q.answer) s++;
    if (q.type === "multi" && Array.isArray(a) && a.length === q.answer.length && q.answer.every(x => a.includes(x))) s++;
  });
  return s;
}
function nAuto(sc) { return (sc || SC).eval.questions.filter(q => q.type !== "open").length; }
function screenQuest() {

    else {

function bindQuest() {
  const d = st.qdraft;
  document.querySelectorAll(".qo").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.q), k = Number(b.dataset.o), q = SC.eval.questions[i];
    if (q.type === "multi") { const a = d.a[i]; const j = a.indexOf(k); if (j >= 0) a.splice(j, 1); else a.push(k); }
    else d.a[i] = d.a[i] === k ? null : k;
    document.querySelectorAll(`.qo[data-q="${i}"]`).forEach(o => { const kk = Number(o.dataset.o); o.setAttribute("aria-pressed", String(q.type === "multi" ? d.a[i].includes(kk) : d.a[i] === kk)); });
  });
  document.querySelectorAll("[data-open]").forEach(t => t.oninput = () => { d.a[Number(t.dataset.open)] = t.value; });
  document.querySelectorAll("[data-q7]").forEach(b => b.onclick = () => { const k = Number(b.dataset.q7); d.q7 = d.q7 === k ? null : k; document.querySelectorAll("[data-q7]").forEach(o => o.setAttribute("aria-pressed", String(Number(o.dataset.q7) === d.q7))); });
  const ok = el("b-qok"); if (ok) ok.onclick = () => {
    const res = { answers: JSON.parse(JSON.stringify(d.a)), score: scoreOf(d.a), q7: d.q7 };
    st.qdraft = null;
    if (st.qphase === "pre") { st.pre = res; st.screen = "rules"; }
    else { st.post = res; saveRecord(); st.screen = "avis"; }
    render(); window.scrollTo({ top: 0 });
  };
}

function decisionBack(n, d) {

    return `<button class="opt" type="button" data-to="${o.to}" aria-pressed="${st.sel === o.to}"${locked ? " disabled" : ""}><span class="t"><span>${o.text}</span>${cost}${locked ? `<span class="locked">Pas assez de ${esc(cr.units)}</span>` : ""}</span><span class="to"><small>CARTE</small><b>${o.to}</b></span></button>`;

function redrawCard() { el("stage").innerHTML = screenCard(); bind(); renderHud(); const c = el("card"); if (c) c.scrollIntoView({ block: "start" }); }

function suiteFront(n, s) {

  } else if (s.branch) {
    const has = st.g.tok.has(s.branch.tok);
    goto = `<div class="goto"><div class="g${has ? " taken" : ""}"><span>Avec le jeton ${esc(s.branch.tok)}</span><b>→ ${s.branch.a}</b></div><div class="g${!has ? " taken" : ""}"><span>Sans ce jeton</span><b>→ ${s.branch.b}</b></div></div>`;
  }
  return `<div class="band line"><div class="lab">Suite<small>Lisez, puis passez à la carte indiquée</small></div><div class="num">${n}</div></div>

    ${rowsHtml(st.rows, st.rows.length ? s.note || "" : "")}${goto}

function screenCard() {
  const n = st.card, k = kind(n);
  let inner = "";
  if (k === "decision") inner = st.confirm ? decisionConfirm(n, SC.decisions[n]) : st.flipped ? decisionBack(n, SC.decisions[n]) : decisionFront(n, SC.decisions[n]);
  else if (k === "suite") inner = suiteFront(n, SC.suites[n]);
  else inner = finFront(n, SC.fins[n]);
  return pileBar() + `<article class="card" id="card">${inner}</article>`;
}
function keyConsulted(d) { return !!(d.key && d.key.tabs.some(t => st.duringTabs.has(t))); }
function announce(timeout) {
  if (!st.sel) return;
  stopTimer();
  const d = SC.decisions[st.card], opt = d.options.find(o => o.to === st.sel), cost = optCost(opt);
  const time = Math.min((performance.now() - st.t0) / 1000, limit() || 1e9);
  for (let i = 0; i < cost; i++) setTimeout(() => SND.pay(), i * 140);
  if (cost && SC.costRes) st.g.res[SC.costRes] -= cost;
  st.dec.push({ d: d.idx, card: st.card, choice: opt.to, idx: d.options.indexOf(opt), cls: opt.cls, cost, time: Math.round(time * 10) / 10,
    dossier: Array.from(st.during), key: keyConsulted(d), conf: null, timeout: !!timeout, sa: null });
  const steps = [];
  if (timeout) steps.push("timeout"); else if (st.mode.test) steps.push("conf");
  if (st.mode.sa && d.sa && d.sa.length) steps.push("sa");
  if (steps.length) { closeDrawer(); st.confirm = { to: opt.to, timeout: !!timeout, steps, step: steps[0], sa: [] }; redrawCard(); }
  else go(opt.to);
  liveKick();
}
function timeoutDecision() {

/* points à discuter en priorité, calculés sur les réponses du groupe */
function talkPoints(sc, A) {
  const pts = [];
  decsInOrder(sc).forEach(n => {
    const d = sc.decisions[n], D = A.decs[n]; if (!D.reached) return;
    const counts = D.opts.map(o => o.n), top = Math.max.apply(null, counts), ti = counts.indexOf(top), share = top / D.reached, used = counts.filter(c => c > 0).length;
    const tag = `D${d.idx} · ${d.title}`, split = d.options.map((o, i) => "carte " + o.to + " : " + counts[i]).join(", ");
    if (D.reached >= 2 && used >= 2 && share <= 0.67) pts.push({ w: 4 - share, tag, t: `Groupe partagé (${split}). Donnez la parole à un tenant de chaque option avant toute explication.` });
    else if (D.reached >= 2 && share >= 0.8 && ti !== D.best) pts.push({ w: 3.6, tag, t: `Quasi-unanimité sur la carte ${d.options[ti].to}, qui n’est pas l’option la plus sûre (${split}). Qu’est-ce qui la rendait évidente ?` });
    else if (D.reached >= 2 && share >= 0.8) pts.push({ w: 1, tag, t: `Consensus sur l’option la plus sûre (${split}). Demandez ce qu’elle coûtait, et si chacun la prendrait un jour de retard.` });
    if (D.knew >= 1 && D.guessN) pts.push({ w: 3 + D.knew / D.guessN, tag, t: `${D.knew} joueur${D.knew > 1 ? "s désignent" : " désigne"} après coup l’option la plus sûre sans l’avoir prise. Écart entre savoir et faire : qu’est-ce qui pesait sur le moment ?` });
    d.options.forEach((o, i) => { const cm = mean(D.opts[i].conf); if (o.cls === "C" && D.opts[i].n >= 1 && cm != null && cm >= 3) pts.push({ w: 2.8, tag, t: `Carte ${o.to} prise avec une confiance moyenne de ${num(cm, 1)}/4 : la certitude n’a pas protégé. Sur quoi reposait-elle ?` }); });
    if (D.sa && D.saN >= 1) {
      let lo = -1, hi = -1;
      d.sa.forEach((it, k) => { if (it.ok && (lo < 0 || D.sa[k] < D.sa[lo])) lo = k; if (!it.ok && D.sa[k] > 0 && (hi < 0 || D.sa[k] > D.sa[hi])) hi = k; });
      if (lo >= 0 && D.sa[lo] / D.saN <= 0.5) pts.push({ w: 2.6 - D.sa[lo] / D.saN, tag, t: `Élément le moins repéré : « ${d.sa[lo].t} » (${D.sa[lo]} sur ${D.saN}). ${d.sa[lo].why}` });
      if (hi >= 0 && D.sa[hi] / D.saN >= 0.3) pts.push({ w: 2.2, tag, t: `Proposition fausse retenue par ${D.sa[hi]} joueur${D.sa[hi] > 1 ? "s" : ""} sur ${D.saN} : « ${d.sa[hi].t} ». ${d.sa[hi].why}` });
    }
    if (D.reached >= 3 && d.key && pct(D.key, D.reached) <= 25) pts.push({ w: 1.8, tag, t: `Page décisive du dossier ouverte par ${pct(D.key, D.reached)} % des joueurs. L’information existait : pourquoi n’est-on pas allé la chercher ?` });
  });

}

/* évolutions proposées : les mots qui reviennent d'une proposition à l'autre signalent une demande redondante */
const EVO_STOP = new Set("avoir aurait aussi autre autres avant avec beaucoup cette cela celle celui comme dans depuis entre encore être faire fait faut leurs mais même moins notre nous parce pendant peut peuvent plus pour pourrait pourquoi quand quelque quelques sans serait seulement sont sous tout toute toutes tous très votre vous était était plutôt chaque choix jeu scénario".split(" "));
function evoThemes(list) {
  const df = {}, shown = {};
  list.forEach(([, t]) => {
    const seen = new Set();
    plain(t).toLowerCase().split(/[^\p{L}\p{N}-]+/u).map(w => w.replace(/^-+|-+$/g, "")).filter(w => w.length >= 5).forEach(w => {
      const k = w.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/(es|s|x)$/, "");
      if (EVO_STOP.has(w) || EVO_STOP.has(k) || seen.has(k)) return;
      seen.add(k); df[k] = (df[k] || 0) + 1; if (!shown[k]) shown[k] = w;
    });
  });
  return Object.keys(df).filter(k => df[k] >= 2).sort((a, b) => df[b] - df[a] || a.localeCompare(b)).slice(0, 10).map(k => [shown[k], df[k]]);
}
function evoBlock(A, proj) {

}

      if (s.entries.some(e => e.rec.rcode === d.rec.rcode)) { errs.push(short + " déjà saisi."); return; }
      d.rec.code = label || ("Joueur " + (s.entries.length + 1));
      addEntries(s, [d.rec], "code"); oks.push(esc(d.rec.code) + ", fin " + sc_fin_label(d.rec));
    });
    if (!lines.length) return;
    st.dash.msg = [oks.length ? "ok" : "err", (oks.length ? `${oks.length} partie${oks.length > 1 ? "s" : ""} ajoutée${oks.length > 1 ? "s" : ""} : ${oks.join(" · ")}. ` : "") + (errs.length ? "Non ajouté : " + errs.join(" · ") : "")];
    render(); const rc = el("e-rc"); if (rc) { rc.value = keep.join("\n"); rc.focus(); }
  });
  const fi = el("e-file"); if (fi) fi.onchange = async () => {
    const s = curSession(); let recs = [], bad = 0;
    for (const f of Array.from(fi.files)) {
      try { const j = JSON.parse(await f.text()); if (j.type === "partie") recs.push(j.record); else if (j.type === "seance") recs = recs.concat(j.session.entries.map(e => e.rec)); else if (Array.isArray(j)) recs = recs.concat(j); else bad++; } catch (e) { bad++; }
    }
    const r = addEntries(s, recs, "fichier");
    st.dash.msg = [r.added ? "ok" : "err", `${r.added} partie(s) ajoutée(s)${r.skipped ? `, ${r.skipped} déjà présente(s)` : ""}${r.other ? `, ${r.other} d’un autre scénario` : ""}${bad ? `, ${bad} fichier(s) illisible(s)` : ""}.`]; render();
  };
  on("b-local", () => {
    const s = curSession(), recs = hist().filter(r => r.scenario === s.scenario && r.date && r.date >= s.created);
    const r = addEntries(s, recs, "ce poste");
    st.dash.msg = ["ok", `${r.added} partie(s) ajoutée(s) depuis ce poste.`]; render();
  });
  on("b-scsv", () => { const s = curSession(); saveFile(`seance-${s.code}-${s.created.slice(0, 10)}.csv`, toCsv(s.entries.map(e => Object.assign({}, e.rec, { code: e.label, session: s.code })))); });
  on("b-sjson", () => { const s = curSession(); saveFile(`seance-${s.code}-${s.created.slice(0, 10)}.json`, JSON.stringify({ type: "seance", app: "jeux-decision", v: 1, session: s }, null, 1)); });
  on("b-scopy", () => { const s = curSession(); copyText(toCsv(s.entries.map(e => Object.assign({}, e.rec, { code: e.label, session: s.code })))); });
  bindTips();
  bindGloss();
}
function sc_fin_label(r) { const sc = scById(r.scenario), f = sc.fins[r.fin]; return f.n + " (" + plain(f.title) + ")"; }

/* infobulles des graphiques */
let TIP = null;
function bindTips() {
  document.querySelectorAll("[data-tip]").forEach(n => {
    if (!n.dataset.tip) return;
    const show = (x, y) => { if (!TIP) { TIP = document.createElement("div"); TIP.className = "tip"; document.body.appendChild(TIP); } TIP.textContent = n.dataset.tip; TIP.style.display = "block"; const w = TIP.offsetWidth; TIP.style.left = Math.min(window.innerWidth - w - 8, x + 12) + "px"; TIP.style.top = (y + 14) + "px"; };
    n.onmousemove = e => show(e.clientX, e.clientY);
    n.onfocus = () => { const r = n.getBoundingClientRect(); show(r.left + 20, r.bottom - 10); };
    n.onmouseleave = n.onblur = () => { if (TIP) TIP.style.display = "none"; };
  });
}

/* ---------------- dossier et fiche mémo ---------------- */
function drawerPages() { return st.drawer.set === "memo" ? SC.debriefPages.memo : SC.dossier; }
function openDrawer(set, tab, focus) {
  if (!SC) return;
  st.drawer.set = set || "dossier";
  const pages = drawerPages();
  st.drawer.tab = tab || (pages.some(p => p.id === st.drawer.tab) ? st.drawer.tab : pages[0].id);
  st.drawer.focus = focus || null; st.drawer.open = true; renderDrawer();
  const c = el("d-close"); if (c && !focus) c.focus();
}
function logView() {
  if (st.drawer.set !== "dossier") return;
  const page = SC.dossier.find(d => d.id === st.drawer.tab); if (!page) return;
  st.tabsAll.add(page.id);
  if (st.screen === "card" && kind(st.card) === "decision" && st.flipped && !st.confirm) { st.during.add(plain(page.label)); st.duringTabs.add(page.id); }
}
function renderDrawer() {
  const d = el("drawer");
  if (!st.drawer.open || !SC) { d.hidden = true; d.innerHTML = ""; return; }
  logView();
  const pages = drawerPages(), page = pages.find(x => x.id === st.drawer.tab) || pages[0];
  const running = st.screen === "card" && kind(st.card) === "decision" && st.flipped && !st.confirm;
  const L = limit(), s = (performance.now() - st.t0) / 1000;
  const title = st.drawer.set === "memo" ? "Fiche mémo" : SC.dossierName;
  d.hidden = false;
  d.innerHTML = `<div class="drawer" id="d-bg"><div class="in" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="top"><span class="ttl">${esc(title)}</span>${running ? `<span class="run">${L ? "reste" : "chrono"} <span data-chrono>${fmt(L ? L - s : s)}</span></span>` : ""}<button class="tbtn" type="button" id="d-close" aria-label="Fermer">${I.close}<span class="l">Fermer</span></button></div>
    <div class="tabs" role="tablist">${pages.map(x => `<button class="tab" role="tab" type="button" data-tab="${x.id}" aria-selected="${x.id === page.id}">${x.label}</button>`).join("")}</div>
    <div class="docwrap" id="docwrap"><div class="doc${st.reveal && st.drawer.set === "dossier" ? " reveal" : ""}">${page.html}</div></div></div></div>`;
  el("d-close").onclick = closeDrawer;
  el("d-bg").onclick = e => { if (e.target.id === "d-bg") closeDrawer(); };
  d.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.drawer.tab = b.dataset.tab; st.drawer.focus = null; renderDrawer(); });
  if (st.drawer.focus) {
    const t = d.querySelector(`.doc [data-key~="${st.drawer.focus}"]`);
    if (t) { setTimeout(() => { t.scrollIntoView({ block: "center", behavior: "smooth" }); t.classList.add("flash"); }, 60); }
  }
}
function closeDrawer() { st.drawer.open = false; renderDrawer(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && st.drawer.open) closeDrawer(); });

/* ---------------- démarrage ---------------- */
render();
(async () => {
  try { if (window.claude && window.claude.use) DL = await window.claude.use("downloads"); } catch (e) { DL = null; }
  if (DL && ["code", "history", "dash"].includes(st.screen)) softRender();
})();
liveDetect();
setInterval(() => { if (LIVE.code) liveTick(); }, 4000);
setInterval(() => { if (st.screen === "dash") dashPoll(); }, 3000);
setInterval(flowTick, 1000);
window.__JD__ = { RL, relayKeys, seal, unseal, encodeRecord, decodeCode, simulate, scById, st, LIVE, LIST, learnScore, vocabQuiz, glossOf, glink, aggregate, guideSteps, stepSupport, talkPoints, hasSa, blankLearn, saScore };
})();
