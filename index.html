08\" x2=\"560\" y2=\"40\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"502\" cy=\"108\" r=\"2.4\" fill=\"#111\"/><text x=\"564\" y=\"44\" text-anchor=\"start\" font-weight=\"600\">Sélecteur carburant : G, D ou OFF<\/text><line x1=\"536\" y1=\"126\" x2=\"748\" y2=\"206\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"536\" cy=\"126\" r=\"2.4\" fill=\"#111\"/><text x=\"744\" y=\"210\" text-anchor=\"end\" font-weight=\"600\">Pompe auxiliaire, puis moteur<\/text><line x1=\"480\" y1=\"155\" x2=\"520\" y2=\"236\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"480\" cy=\"155\" r=\"2.4\" fill=\"#111\"/><text x=\"524\" y=\"240\" text-anchor=\"start\" font-weight=\"600\">Porte<\/text><line x1=\"479\" y1=\"112\" x2=\"300\" y2=\"76\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"479\" cy=\"112\" r=\"2.4\" fill=\"#111\"/><text x=\"296\" y=\"80\" text-anchor=\"end\" font-weight=\"600\">Pilote, place gauche<\/text><text x=\"30\" y=\"246\" fill=\"#555\" font-size=\"11\">Vue de dessus, nez à droite<\/text><\/svg><\/div>\n<div class=\"cols\" style=\"gap:6mm\">\n<div><h2 style=\"margin-top:0\">Fiche technique<\/h2><table class=\"small\" style=\"font-size:13.4px;color:#111\"><tr><td style='width:22mm'><b>Type<\/b><\/td><td>Monomoteur à pistons, 4 places, aile basse, train rentrant, empennage en T<\/td><\/tr><tr><td style='width:22mm'><b>Moteur<\/b><\/td><td>200 ch, injection, turbocompresseur, hélice bipale à vitesse constante<\/td><\/tr><tr><td style='width:22mm'><b>Carburant<\/b><\/td><td>Deux réservoirs d’aile, gauche et droit. Le pilote choisit le réservoir au sélecteur, ou coupe l’arrivée (OFF)<\/td><\/tr><tr><td style='width:22mm'><b>Plané<\/b><\/td><td>Moteur arrêté, train et volets rentrés : environ 1,5 NM (2,7 km) par 1 000 ft de hauteur. Ordre de grandeur<\/td><\/tr><tr data-key=\"d6\"><td style='width:22mm'><b>Chauffage<\/b><\/td><td>L’air de chauffage et de dégivrage est réchauffé autour de l’échappement, dans le compartiment moteur, puis soufflé aux pieds et à la base du pare-brise<\/td><\/tr><tr data-key=\"d1\"><td>Documentation<\/td><td>Manuel de vol de l’avionneur et carnet de route. Le moteur a sa propre documentation : manuel et bulletins de service du motoriste.<\/td><\/tr><\/table><\/div>\n<div><h2 style=\"margin-top:0\">Ce que vous avez à bord<\/h2><table class=\"eq\"><tr><td>À bord<\/td><td>Radio VHF, transpondeur, livret de check-lists sur anneau : normales et urgences.<\/td><\/tr><tr><td>Absents<\/td><td>Pas d’oxygène, pas de lunettes anti-fumée, pas d’extincteur.<\/td><\/tr><tr><td>Ventiler<\/td><td>Deux aérateurs orientables au tableau de bord ; une petite fenêtre d’aération ouvrante sur la vitre du pilote.<\/td><\/tr><tr><td>Sortir<\/td><td>Une seule porte, côté droit, au-dessus de l’aile. Assis à gauche, le pilote doit passer par la place droite pour sortir.<\/td><\/tr><tr><td>Radio<\/td><td>Tour de contrôle.<\/td><\/tr><\/table>\n<p class=\"small\">Ce cadre fait partie des règles du jeu : aucune autre ressource n’existe à bord.<\/p><\/div>\n<\/div>\n\n<p class=\"small\" style=\"margin:0\">Schémas de principe, sans échelle. Ils ne reproduisent pas un avion réel immatriculé.<\/p>"},{"id":"poste","label":"Poste de pilotage","html":"<div class=\"kicker\">Dossier de vol · 2/3<\/div>\n<h1>Votre poste de pilotage<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Repérez les commandes citées dans vos check-lists : vous en aurez besoin en vol.<\/p>\n<div style=\"margin:0 0 2mm\"><svg viewBox=\"0 0 760 470\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11\"><path d=\"M14 150 L14 70 Q16 54 34 48 L74 40 L74 150 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><rect x=\"30\" y=\"74\" width=\"30\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"56\" cy=\"91\" r=\"2\" fill=\"#111\"/><path d=\"M88 146 L170 32 L590 32 L672 146 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"380\" y1=\"32\ =\"#fff\">16<\/text><line x1=\"224\" y1=\"446\" x2=\"270\" y2=\"432\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"270\" cy=\"432\" r=\"10\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"270\" y=\"436\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" fill=\"#fff\">17<\/text><line x1=\"388\" y1=\"404\" x2=\"420\" y2=\"400\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"420\" cy=\"400\" r=\"10\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"420\" y=\"404\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" fill=\"#fff\">18<\/text><\/svg><\/div>\n<div class=\"leg\"><div><span class=\"n\">1<\/span><span>Aérateurs : deux bouches orientables<\/span><\/div><div><span class=\"n\">2<\/span><span>Fenêtre d’aération : petite vitre ouvrante côté pilote<\/span><\/div><div><span class=\"n\">3<\/span><span>Dégivrage : air chaud soufflé à la base du pare-brise<\/span><\/div><div><span class=\"n\">4<\/span><span>Instruments de vol<\/span><\/div><div><span class=\"n\">5<\/span><span>Commande du train et ses trois voyants<\/span><\/div><div><span class=\"n\">6<\/span><span>Radio et transpondeur<\/span><\/div><div><span class=\"n k\">7<\/span><span>Débit carburant<\/span><\/div><div><span class=\"n\">8<\/span><span>Jauges carburant, gauche et droite<\/span><\/div><div><span class=\"n\">9<\/span><span>Ampèremètre : charge de l’alternateur<\/span><\/div><div><span class=\"n\">10<\/span><span>Autres instruments moteur : régime, pression d’admission, huile, températures<\/span><\/div><div><span class=\"n\">11<\/span><span>Contact général : batterie et alternateur<\/span><\/div><div><span class=\"n\">12<\/span><span>Magnétos et démarreur (clé)<\/span><\/div><div><span class=\"n\">13<\/span><span>Pompe carburant auxiliaire<\/span><\/div><div><span class=\"n\">14<\/span><span>Commandes de chauffage et de dégivrage<\/span><\/div><div><span class=\"n\">15<\/span><span>Manettes : gaz, hélice, mélange. Mélange tiré à fond : étouffoir, le moteur s’arrête<\/span><\/div><div><span class=\"n\">16<\/span><span>Sélecteur carburant : GAUCHE, DROIT, OFF. Paroi gauche, près du genou du pilote<\/span><\/div><div><span class=\"n\">17<\/span><span>Bouches de chauffage : au plancher, aux pieds<\/span><\/div><div><span class=\"n\">18<\/span><span>Volets : levier entre les sièges<\/span><\/div><\/div>\n<h2 style=\"margin-top:3mm\">Les trois circuits de votre avion<\/h2>\n<div class=\"cols3\" style=\"gap:5mm;font-size:13.8px;line-height:1.4\">\n<div><h3 style=\"margin-top:0\">Électrique<\/h3>La batterie et l’alternateur alimentent la radio, le transpondeur et les instruments électriques. Le contact général (11) les coupe ; l’ampèremètre (9) indique la charge. Le moteur, lui, tourne grâce aux magnétos (12).<\/div>\n<div><h3 style=\"margin-top:0\">Carburant et moteur<\/h3>Réservoirs gauche et droit (8), sélecteur (16), pompe auxiliaire (13), puis moteur. Le débit carburant (7) et les autres instruments moteur (10) renseignent sur son état. Le mélange (15) tiré à fond coupe le carburant.<\/div>\n<div><h3 style=\"margin-top:0\">Air de cabine<\/h3>Les aérateurs (1) et la fenêtre d’aération (2) apportent l’air extérieur. Le chauffage (17) et le dégivrage (3) soufflent un air réchauffé dans le compartiment moteur ; leurs commandes (14) les ouvrent ou les ferment.<\/div>\n<\/div>\n\n<p class=\"small\" style=\"margin:0\">Schéma de principe, disposition simplifiée. Il ne reproduit pas le tableau de bord d’un avion réel. Bulle blanche : l’instrument que vous comparerez à vos valeurs de référence.<\/p>"},{"id":"meteo","label":"Météo et carte","html":"<div class=\"kicker\">Dossier de vol · 3/3<\/div>\n<h1>Votre vol et la météo<\/h1>\n<p class=\"lead\" style=\"margin-bottom:2mm\">Vol privé VFR, seul à bord. Retour vers votre terrain d’attache, au nord. Décollage prévu vers 10 h locale (08 h UTC).<\/p>\n<div class=\"mtr\"><b>METAR<\/b> ZZZZ 290730Z 34005KT 9999 BKN028 03/M03 Q1005=<br><b>TAF<\/b>&nbsp;&nbsp; ZZZZ 290500Z 2906/2915 34006KT 9999 BKN030 TEMPO 2907/2912 BKN020 BECMG 2912/2914 SCT035=<\/div>\n<div class=\"cols3\" style=\"gap:5mm;font-size:13.6px;line-height:1.4\">\n<div><h3 style=\"margin-top:0\">METAR en clair<\/h3>Le 29 à 07 h 30 UTC (09 h 30 locale) : vent du 340° pour 5 kt ; visibilité 10 km ou plus ; nuages fragmentés, 5 à 7 octas, à 2 800 ft au-dessus du terrain, soit ≈ 4 800 ft d’altitude ; température 3 °C, point de rosée −3 °C ; QNH 1005 hPa.<\/div>\n<div><h3 style=\"margin-top:0\">TAF en clair<\/h3>Valable le 29 de 06 h à 15 h UTC : vent du 340° pour 6 kt, nuages fragmentés à 3 000 ft. Temporairement de 07 h à 12 h UTC : base à 2 000 ft du terrain, ≈ 4 000 ft d’altitude, la couche descend et accroche le relief. Amélioration en début d’après-midi.<\/div>\n<div data-key=\"d9\"><h3 style=\"margin-top:0\">Situation générale<\/h3>Flux de nord-ouest faible. Couche de stratocumulus sur le relief, sommets vers 6 500 ft, accrochée aux crêtes ; quelques trous côté vallée. Turbulence modérée par endroits sous la couche. Au-dessus : ciel clair.<\/div>\n<\/div>\n<h2 style=\"margin-top:2mm\">Coupe le long de votre route<\/h2>\n<div><svg viewBox=\"0 26 760 210\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11\"><defs><pattern id=\"mh\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#bdbdbd\" stroke-width=\"1.8\"/><\/pattern><marker id=\"ca\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs><line x1=\"60\" y1=\"173.0\" x2=\"740\" y2=\"173.0\" stroke=\"#e2e2e2\" stroke-width=\"1\"/><text x=\"54\" y=\"177.0\" text-anchor=\"end\" fill=\"#555\">2 000 ft<\/text><line x1=\"60\" y1=\"132.0\" x2=\"740\" y2=\"132 h=\"50\" height=\"8\" fill=\"#111\" transform=\"rotate(-20 201 417)\"/><path d=\"M200 404 Q206 340 196 280 Q190 220 204 160 Q212 90 206 14\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\" marker-end=\"url(#ma)\"/><text x=\"200\" y=\"456\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">Terrain de départ, dans une cuvette<\/text><text x=\"212\" y=\"30\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">vers votre terrain d’attache<\/text><text x=\"200\" y=\"196\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">Plateau boisé, clairière (golf)<\/text><text x=\"222\" y=\"256\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">ville<\/text><text x=\"240\" y=\"318\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">champs<\/text><text x=\"20\" y=\"22\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">sommets 6 000 à 7 000 ft<\/text><line x1=\"330\" y1=\"150\" x2=\"330\" y2=\"414\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"324\" y1=\"150\" x2=\"336\" y2=\"150\" stroke=\"#111\"/><line x1=\"324\" y1=\"414\" x2=\"336\" y2=\"414\" stroke=\"#111\"/><text x=\"336\" y=\"286\" text-anchor=\"middle\" font-weight=\"600\" transform=\"rotate(-90 336 286)\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">≈ 20 km<\/text><path d=\"M370 60 l8 22 l-8 -6 l-8 6 z\" fill=\"#111\"/><text x=\"370\" y=\"54\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"13\">N<\/text><line x1=\"24\" y1=\"440\" x2=\"94\" y2=\"440\" stroke=\"#111\" stroke-width=\"3\"/><text x=\"59\" y=\"432\" text-anchor=\"middle\">5 km<\/text><\/svg><\/div>\n<div><h2 style=\"margin-top:0\">Carte de situation<\/h2>\n<p style=\"font-size:14.1px\">Votre terrain de départ est au fond d’une cuvette. Votre route remonte la vallée vers le nord, passe une ville, puis un plateau boisé avant les crêtes.<\/p>\n<p style=\"font-size:14.1px\" data-key=\"d9\">Le plateau et le terrain de départ sont séparés d’une vingtaine de kilomètres. Les fonds de vallée offrent des champs ; les versants sont boisés et raides.<\/p>\n<div class=\"box tint small\" style=\"margin-top:3mm\">METAR, TAF, coupe et carte sont des reconstitutions pédagogiques : indicateur fictif, lieux sans nom, schémas sans échelle exacte. Ne pas utiliser pour la navigation.<\/div>\n<\/div><\/div>"},{"id":"cl","label":"Check-lists","html":"<div class=\"kicker\">Livret de check-lists<\/div><h1>Check-lists<\/h1><section class=\"clf\"><h2>Check-lists <small>· Sommaire<\/small><\/h2><div class=\"cl-pg\">Monomoteur à pistons, train rentrant<\/div><div class=\"cl-sec norm\">Normales<\/div><div class=\"toc norm\"><div class=\"r\"><b>1<\/b><span>Prévol · avant mise en route<\/span><\/div><div class=\"r\"><b>2<\/b><span>Mise en route<\/span><\/div><div class=\"r\"><b>3<\/b><span>Après mise en route<\/span><\/div><div class=\"r\"><b>4<\/b><span>Roulage<\/span><\/div><div class=\"r\"><b>5<\/b><span>Point fixe<\/span><\/div><div class=\"r\"><b>6<\/b><span>Avant décollage<\/span><\/div><div class=\"r\"><b>7<\/b><span>Décollage · après décollage<\/span><\/div><div class=\"r\"><b>8<\/b><span>Croisière<\/span><\/div><div class=\"r\"><b>9<\/b><span>Descente · approche · atterrissage<\/span><\/div><div class=\"r\"><b>10<\/b><span>Après atterrissage · piste dégagée<\/span><\/div><div class=\"r\"><b>11<\/b><span>Arrêt moteur · stationnement<\/span><\/div><\/div><div class=\"cl-sec urg\">Urgences et anormales<\/div><d pan class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Contact général<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Porte<\/span><span class=\"dots\"><\/span><span class=\"st\">DÉVERROUILLÉE<\/span><\/div><div class=\"cl-note\">Après l’arrêt : évacuer par la porte droite et l’aile.<\/div><\/section><section class=\"clf urg\"><h2>Feu moteur <small>· Urgence U2<\/small><\/h2><div class=\"cl-sec\" data-key=\"d6\">En vol<\/div><div class=\"cl-row\" data-key=\"d16\"><span class=\"it\">Sélecteur carburant<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Manette des gaz<\/span><span class=\"dots\"><\/span><span class=\"st\">RÉDUITE<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Mélange<\/span><span class=\"dots\"><\/span><span class=\"st\">ÉTOUFFOIR<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Pompe auxiliaire<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Chauffage, dégivrage<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-note\" data-key=\"d16\">Puis : panne moteur en vol, atterrissage forcé.<\/div><div class=\"cl-sec\">Au sol<\/div><div class=\"cl-row\"><span class=\"it\">Mélange<\/span><span class=\"dots\"><\/span><span class=\"st\">ÉTOUFFOIR<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Sélecteur carburant<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Magnétos, contact général<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Avion<\/span><span class=\"dots\"><\/span><span class=\"st\">ÉVACUER<\/span><\/div><\/section><section class=\"clf urg\"><h2>Feu électrique · fumée en cabine <small>· Urgence U3<\/small><\/h2><div class=\"cl-row\" data-key=\"d6\"><span class=\"it\">Contact général<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Aérateurs, fenêtre<\/span><span class=\"dots\"><\/span><span class=\"st\">OUVERTS<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Chauffage<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Message d’urgence<\/span><span class=\"dots\"><\/span><span class=\"st\">ÉMETTRE<\/span><\/div><div class=\"cl-note\">Atterrir dès que possible : atterrissage de précaution.<\/div><\/section><section class=\"clf urg\"><h2>Panne d’alternateur · circuit électrique <small>· Urgence U4<\/small><\/h2><div class=\"cl-row\"><span class=\"it\">Disjoncteurs, fusibles<\/span><span class=\"dots\"><\/span><span class=\"st\">VÉRIFIER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Alternateur<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF PUIS ON<\/span><\/div><div class=\"cl-sub\">Pas de charge :<\/div><div class=\"cl-row\"><span class=\"it\">Alternateur<\/span><span class=\"dots\"><\/span><span class=\"st\">OFF<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Consommateurs non essentiels<\/span><span class=\"dots\"><\/span><span class=\"st\">COUPÉS<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Ampèremètre, batterie<\/span><span class=\"dots\"><\/span><span class=\"st\">SURVEILLER<\/span><\/div><div class=\"cl-note\">Atterrir avant l’épuisement de la batterie.<\/div><\/section><section class=\"clf urg\"><h2>Problème moteur partiel <small>· Urgence U5<\/small><\/h2><div class=\"cl-sub\">Pression d’huile, surchauffe, givrage, vibrations, ratés<\/div><div class=\"cl-row\"><span class=\"it\">Paramètres moteur<\/span><span class=\"dots\"><\/span><span class=\"st\">VÉRIFIER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Air alterné<\/span><span class=\"dots\"><\/span><span class=\"st\">OUVERT<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Mélange<\/span><span class=\"dots\"><\/span><span class=\"st\">AJUSTER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Pompe auxiliaire<\/span><span class=\"dots\"><\/span><span class=\"st\">ON<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Magnétos<\/span><span class=\"dots\"><\/span><span class=\"st\">G, D, LES DEUX<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Puissance<\/span><span class=\"dots\"><\/span><span class=\"st\">RÉDUIRE SI NÉCESSAIRE<\/span><\/div><div class=\"cl-note\">Rejoindre le terrain approprié le plus proche.<\/div><\/section><section class=\"clf urg\"><h2>Givrage <small>· Urgence U6<\/small><\/h2><div class=\"cl-row\"><span class=\"it\">Dégivrage<\/span><span class=\"dots\"><\/span><span class=\"st\">ON<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Air alterné<\/span><span class=\"dots\"><\/span><span class=\"st\">OUVERT<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Trajectoire<\/span><span class=\"dots\"><\/span><span class=\"st\">SORTIR DE LA ZONE<\/span><\/div><div class=\"cl-note\">Sortir par le chemin le plus sûr, relief compris.<\/div><\/section><section class=\"clf urg\"><h2>Train · freins · pneu <small>· Urgence U7<\/small><\/h2><div class=\"cl-row\"><span class=\"it\">Vitesse<\/span><span class=\"dots\"><\/span><span class=\"st\">RÉDUIRE<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Commande de train<\/span><span class=\"dots\"><\/span><span class=\"st\">BAS<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Voyants<\/span><span class=\"dots\"><\/span><span class=\"st\">3 VERTS<\/span><\/div><div class=\"cl-sub\">Pas de trois verts :<\/div><div class=\"cl-row\"><span class=\"it\">Disjoncteur du train<\/span><span class=\"dots\"><\/span><span class=\"st\">VÉRIFIER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Levier de secours<\/span><span class=\"dots\"><\/span><span class=\"st\">ACTIONNER<\/span><\/div><div class=\"cl-note\">Freins ou pneu défaillants : briefer l’atterrissage et la sortie de piste.<\/div><\/section><section class=\"clf urg\"><h2>Panne radio · instruments <small>· Urgence U8<\/small><\/h2><div class=\"cl-row\"><span class=\"it\">Transpondeur<\/span><span class=\"dots\"><\/span><span class=\"st\">7600<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Casque, fréquences<\/span><span class=\"dots\"><\/span><span class=\"st\">VÉRIFIER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Procédure de panne radio<\/span><span class=\"dots\"><\/span><span class=\"st\">APPLIQUER<\/span><\/div><div class=\"cl-sub\">Instruments :<\/div><div class=\"cl-row\"><span class=\"it\">Indications<\/span><span class=\"dots\"><\/span><span class=\"st\">RECOUPER<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Compas<\/span><span class=\"dots\"><\/span><span class=\"st\">UTILISER<\/span><\/div><\/section>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"12\" y=\"14\" width=\"24\" height=\"20\" rx=\"3\"/><path d=\"M16 14v-4h16v4M18 34v4M30 34v4M8 22h4M36 22h4\"/><circle cx=\"24\" cy=\"24\" r=\"4\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 30c3-6 9-6 12-2 2-5 10-6 13 0 4-2 9 0 11 4\"/><path d=\"M4 38h40\"/><path d=\"M14 16l14-6 4 2-10 6z\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M14 40c-4-4-2-8 2-10s4-6 0-10M24 40c-4-4-2-8 2-10s4-6 0-10M34 40c-4-4-2-8 2-10s4-6 0-10\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 38h40\"/><path d=\"M10 38V26l4-6 4 6v12M30 38V24l4-7 4 7v14\"/><path d=\"M14 14l16-6\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M12 30l22-4 6 2-6 3-20 2z\"/><path d=\"M8 40h32\" stroke-dasharray=\"3 4\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 38h40\"/><path d=\"M28 38c0-6 4-10 10-10 4 0 6 4 6 10\"/><path d=\"M8 32l16-3 4 2-4 2-14 1z\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 38h40\"/><path d=\"M6 34c6-2 12-2 18 0s12 2 18 0\" /><path d=\"M12 28l18-3 5 2-5 2-16 1z\"/><\/svg>","11":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M10 40V26l4-6 4 6v14M26 40V22l5-8 5 8v18\"/><path d=\"M4 40h40\"/><path d=\"M38 10l-6 6M32 10l6 6\"/><\/svg>"},"brief":"Vous êtes le pilote, seul à bord. Chaque option est celle qu’un pilote expérimenté pourrait choisir : décidez comme vous le feriez vraiment.","eval":{"questions":[{"t":"Selon la procédure type, quelle est la première étape du traitement d’un feu en vol ?","type":"single","options":["Couper le contact général","Identifier l’origine du feu","Faire demi-tour","Déclarer la détresse"],"answer":1,"notion":"Diagnostiquer avant de choisir la procédure"},{"t":"Quels indices orientent vers un feu moteur plutôt qu’électrique ?","type":"multi","options":["Baisse de puissance","Débit carburant anormal","Fumée arrivant par les bouches de chauffage","Disjoncteur sorti","Odeur d’isolant brûlé derrière le tableau de bord"],"answer":[0,1,2],"notion":"Croiser des indices convergents"},{"t":"Pourquoi la procédure feu moteur demande-t-elle de couper chauffage et dégivrage ?","type":"open","expected":"Leur air est réchauffé dans le compartiment moteur et peut amener fumées ou flammes en cabine","notion":"Trajet de la fumée"},{"t":"« Tant que le moteur tourne, mieux vaut l’utiliser pour rejoindre une piste, même en cas de feu moteur. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Biais de continuation du plan"},{"t":"Après un remplacement de cylindres, quelles sources définissent le vol de contrôle ?","type":"single","options":["La documentation de l’avionneur seule","Les documentations de l’avionneur et du motoriste, bulletins de service compris","L’expérience du technicien"],"answer":1,"notion":"Barrières de remise en service"},{"t":"« En atterrissage forcé, sortir la configuration complète tôt permet d’être prêt et améliore la sécurité. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Configuration tardive en atterrissage forcé"}],"q7":"« Je me sens capable de distinguer un feu moteur d’un feu électrique en vol. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de vol suffisait pour comprendre la situation.","La durée était adaptée."],"yn":["Connaissiez-vous l’accident réel avant la séance ?"],"open":["Quel choix vous a paru le plus difficile, et pourquoi ?","Qu’est-ce qui vous a semblé irréaliste ou confus ?"],"application":"Que ferez-vous différemment lors de votre prochain vol ?"},"criteria":{"traps":[10,13],"fin_max":70,"fin1":null,"extra":[["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un pair","aucune réserve technique majeure"]]},"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1><p class=\"lead\" style=\"margin-bottom:2mm\">Un cheminement en trois temps, après les réactions : les faits, l’analyse facteurs humains, ce que dit le BEA. Le fil rouge : mettre chaque choix du groupe en regard de ce que le pilote a réellement fait. Trois règles : faire parler avant d’expliquer ; analyser des décisions, pas des personnes ; toujours distinguer un fait établi par le BEA d’une interprétation.<\/p><div class=\"box tint small\" style=\"margin-bottom:2mm\">Recueillir (réactions), analyser (faits, analyse FH, BEA), synthétiser : modèle GAS du débriefing en simulation. En séance en direct, l’onglet Déroulé projette le support de chaque étape. À l’étape des faits, révélez le cas réel décision par décision, après avoir fait parler le groupe. En partie papier : fiche mémo pages 1 et 2, choix relevés à main levée.<\/div><div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Tour de table rapide, sans analyse.<\/div><div class=\"l\">Demander<\/div><div>« En un mot, comment vous sentiez-vous quand la fumée est apparue ? » puis « Quel moment vous a le plus pesé ? »<\/div><div class=\"l\">Repère<\/div><div>Les émotions sont des données : stress, doute, envie d’agir vite. Ne rien analyser encore.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:03<small>9 min<\/small><\/div><div><h3>Les faits : vos choix et le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Décision par décision : projeter la répartition du groupe, faire défendre chaque option par un joueur qui l’a choisie, puis révéler ce que le pilote a réellement fait. Terminer par l’issue et la chronologie (fiche mémo, page 1).<\/div><div class=\"l\">Dire<\/div><div>Un pilote de 1 323 heures, licencié depuis 2002, sur son propre avion sorti de visite un mois plus tôt. Aucune faute grossière isolée : une suite de décisions qui paraissaient raisonnables sur le moment.<\/div><div class=\"l\">Comparer<\/div><div>Environ 2 min 30 entre l’annonce du feu et celle de l’atterrissage d’urgence, puis 2 min jusqu’au dernier appel sans réponse. Vos temps de décision sont sur le tableau de bord.<\/div><div class=\"l\">Demander<\/div><div>« À quel moment de votre partie étiez-vous à la place de ce pilote ? »<\/div><div class=\"l\">Repère<\/div><div>Décision 2 : le rapport ne dit pas si un plan de repli existait. C’est une inconnue, pas une faute. Bannir le « il aurait dû » ; préférer « qu’est-ce qui rendait ce choix logique sur le moment ? »<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:12<small>10 min<\/small><\/div><div><h3>L’analyse facteurs humains<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Dessiner six tranches au tableau (modèle de Reason). Pour chaque tranche, laisser le groupe trouver le trou avant de compléter avec la fiche mémo (page 3). Puis nommer les mécanismes avec les mots du TEM et de Reason.<\/div><div class=\"l\">Demander<\/div><div>« Où était le trou dans cette barrière ? » · « Qu’est-ce qui l’aurait bouché ? » · « Quelle tranche auriez-vous pu boucher vous-même, à votre poste ? »<\/div><div class=\"l\">Mots<\/div><div>Menaces : maintenance récente, couche accrochant le relief. Erreur : check-list feu électrique sur un feu moteur. État indésirable de l’avion : cabine enfumée, puissance en baisse, au-dessus du relief. Défaillances latentes (tranches 1 à 5) et défaillance active (tranche 6). Effet de cadrage par le titre de la check-list, biais de continuation du plan, tunnelisation.<\/div><div class=\"l\">Question<\/div><div>« La pompe auxiliaire a été retrouvée sur ON, et le rapport ne dit pas pourquoi. Quelle check-list de votre livret la fait mettre sur ON ? » Réponse : panne moteur ou problème moteur partiel, alors que la check-list feu moteur la veut sur OFF.<\/div><div class=\"l\">Zoom<\/div><div>Maintenance : trois des « Dirty Dozen » se reconnaissent ici : manque de connaissances, distraction (interruptions), manque de ressources (outillage, éclairage).<\/div><div class=\"l\">Repère<\/div><div>Faire constater que le pilote a hérité de cinq trous avant même de décoller.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:22<small>5 min<\/small><\/div><div><h3>Le BEA : enseignements et recommandations<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les enseignements du rapport (fiche mémo, page 4). Dire clairement que ce rapport ne contient pas de recommandation de sécurité formelle : le BEA conclut par des enseignements. Montrer ensuite une recommandation formelle sur le même problème, la A00-19 du BST canadien (page 5).<\/div><div class=\"l\">Dire<\/div><div>Le vol de contrôle prévu par le motoriste « aurait pu » déceler l’anomalie : le BEA écrit « aurait pu », pas « aurait ».<\/div><div class=\"l\">Demander<\/div><div>« Si ce rapport concernait notre unité, quelle mesure prendrions-nous dès demain ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai : c’est ainsi qu’un enseignement devient une barrière.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:27<small>3 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir (fiche mémo, page 6). Distribuer la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Sur votre appareil, qui identifie l’origine d’une fumée, et comment l’information arrive-t-elle au poste de pilotage ? » Puis tour de table : « Une chose que je ferai différemment à mon prochain vol. »<\/div><div class=\"l\">Repère<\/div><div>La question de transposition prépare le scénario 2 : PNC et communication cabine–poste de pilotage.<\/div><\/div><\/div><\/div><div class=\"box dark\" style=\"margin-top:3mm\"><div class=\"kicker\" style=\"color:#ccc\">Ensuite · 5 min<\/div>Ouvrir les débriefings personnels : chacun relit ses choix et s’exerce au vocabulaire. En partie papier, récupérer les piles de vol et retrier les paquets.<\/div><div class=\"box small\" style=\"margin-top:1mm\">Si le temps manque, ne coupez ni les faits ni l’analyse : raccourcissez la synthèse, la fiche mémo reste à disposition.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · 1/7<\/div>\n<h1>Ce qui s'est réellement passé<\/h1>\n<p class=\"lead\" style=\"margin-bottom:2mm\">Le 29 mai 2013, près de Gap (Hautes-Alpes), un Piper PA-28RT-201T immatriculé aux États-Unis s’écrase lors d’un atterrissage d’urgence après un feu moteur. Le pilote, seul à bord, est tué ; l’avion est détruit.<\/p>\n<table style=\"font-size:13.8px;margin-bottom:2mm\">\n<tr><td style=\"width:30mm\"><b>Pilote<\/b><\/td><td>Licence de pilote privé depuis 2002, 1 323 heures de vol.<\/td><\/tr>\n<tr><td><b>Vol<\/b><\/td><td>Privé, de Gap-Tallard vers Mulhouse-Habsheim.<\/td><\/tr>\n<tr><td><b>Météo<\/b><\/td><td>Vent faible, visibilité supérieure à 10 km, stratocumulus accrochant parfois le relief, 3 °C, turbulence localement modérée.<\/td><\/tr>\n<\/table>\n<h2 style=\"margin-top:2mm\">Chronologie<\/h2>\n<div class=\"tl\"><div class=\"ev\"><div class=\"h\">09 h 56<\/div><div>Décollage de Gap-Tallard vers Mulhouse-Habsheim. Pilote seul à bord.<\/div><\/div><div class=\"ev\"><div class=\"h\">10 h 03<\/div><div>Contact avec Marseille Information : montée vers le niveau 80 pour passer au-dessus de la couche nuageuse.<\/div><\/div><div class=\"ev\"><div class=\"h\">10 h 06<\/div><div>Le pilote pense avoir un feu à bord, fait demi-tour vers Gap et se déclare en détresse. Pas de contact radar ; les secours de l’aérodrome sont prévenus.<\/div><\/div><div class=\"ev\"><div class=\"h\">≈ 10 h 07<\/div><div>Le contrôleur demande si le pilote voit Gap : pas de réponse.<\/div><\/div><div class=\"ev\"><div class=\"h\">≈ 10 h 07 ½<\/div><div>Question répétée ; la réponse du pilote est interrompue.<\/div><\/div><div class=\"ev\"><div class=\"h\">≈ 10 h 08 ½<\/div><div>Le pilote annonce un atterrissage d’urgence, à 4 000 ft.<\/div><\/div><div class=\"ev\"><div class=\"h\">≈ 10 h 10 ½<\/div><div>Plus de réponse. L’épave est retrouvée en lisière d’un bois, près d’un terrain de golf.<\/div><\/div><\/div>\n<p class=\"small\" style=\"margin-top:-1mm\">Les heures marquées ≈ sont déduites des intervalles cités par le BEA. Entre l’annonce du feu et celle de l’atterrissage d’urgence : environ 2 min 30.<\/p>\n<h2>Ce que l'enquête a établi<\/h2>\n<div class=\"cols\" style=\"gap:6mm;font-size:14.1px\">\n<div><ul style=\"margin:0\">\n<li>Un raccord de carburant, entre la pompe électrique et le régulateur, a été retrouvé desserré : trois filets seulement en prise.<\/li>\n<li>Il avait probablement été insuffisamment serré lors de l’entretien ; les vibrations ont accentué le desserrage jusqu’à la fuite.<\/li>\n<li>L’essence projetée sur des parties chaudes a provoqué un feu resté localisé ; ses fumées ont pénétré dans l’habitacle.<\/li>\n<li>La fuite a aussi fait chuter la pression aux injecteurs, donc la puissance du moteur.<\/li>\n<\/ul><\/div>\n<div><ul style=\"margin:0\">\n<li>Configuration retrouvée : batterie et alternateur sur OFF, magnétos et pompe auxiliaire sur ON, sélecteur carburant sur le réservoir droit, chauffage sur ON et dégivrage sur DEFROST, train sorti et verrouillé, volets en position intermédiaire.<\/li>\n<li>Le mois précédent : cinq cylindres remplacés, vol de contrôle de 30 minutes. Le bulletin de service du motoriste en préconisait au moins deux heures.<\/li>\n<li>Huit heures de vol ont suivi sans aucun problème détecté.<\/li>\n<\/ul><\/div>\n<\/div>"},{"id":"parallele","label":"Vos choix et le réel","html":"<div class=\"kicker\">Fiche mémo · 2/7<\/div><h1>Vos choix face au cas réel<\/h1><p class=\"lead\" style=\"margin-bottom:2mm\">Décision par décision, ce que le pilote a réellement fait, d’après le rapport du BEA. La dernière colonne indique l’option du jeu la plus proche.<\/p><table style=\"font-size:13.6px\"><tr><th>Décision du jeu<\/th><th>Ce qui s’est réellement passé<\/th><th class=\"c\">Option la plus proche<\/th><\/tr><tr><td style='width:36mm'><b>D1 · Remise en service<\/b><\/td><td>Le propriétaire fait lui-même un vol de contrôle de 30 minutes, sans le technicien. Le bulletin de service du motoriste, qui demandait au moins deux heures en surveillant débit carburant, pression d’huile et températures, était inconnu du technicien.<\/td><td class='c' style='width:24mm'>Carte 12<\/td><\/tr><tr><td style='width:36mm'><b>D2 · La couche<\/b><\/td><td>Le pilote monte au niveau 80 pour passer au-dessus de la couche. Le rapport ne dit pas s’il avait préparé un plan de repli : on ne le sait pas.<\/td><td class='c' style='width:24mm'>Non établi<\/td><\/tr><tr><td style='width:36mm'><b>D3 · Odeur âcre<\/b><\/td><td>À 10 h 06, il annonce un feu probable, fait demi-tour vers Gap et se déclare en détresse. Batterie et alternateur ont été retrouvés sur OFF : selon le BEA, il a probablement appliqué la procédure feu électrique, alors que le feu venait du moteur.<\/td><td class='c' style='width:24mm'>Carte 10<\/td><\/tr><tr><td style='width:36mm'><b>D4 · Sous la couche<\/b><\/td><td>Il annonce un atterrissage d’urgence à 4 000 ft. Sur l’épave : sélecteur carburant ouvert sur le réservoir droit, pompe auxiliaire sur ON, chauffage sur ON et dégivrage sur DEFROST, train sorti, volets entre 10 et 25°. Selon le BEA, les fumées ont probablement gêné l’atterrissage d’urgence. Le moment où train et volets ont été sortis n’est pas établi.<\/td><td class='c' style='width:24mm'>Carte 17<\/td><\/tr><tr><td><b>Issue<\/b><\/td><td>L’avion heurte des arbres en lisière de bois, près d’un terrain de golf, puis le sol. Le pilote est tué, l’avion détruit.<\/td><td class='c'>Fin 4<\/td><\/tr><\/table><div class=\"box tint small\" style=\"margin-top:2mm\"><b>À dire au groupe.<\/b> Le pilote décidait sans connaître la suite, comme vous pendant la partie. « Non établi » : le rapport ne permet pas de le savoir ; on ne comble pas ce vide par une supposition.<\/div>"},{"id":"raison","label":"Le raisonnement","html":"<div class=\"kicker\">Fiche mémo · 3/7<\/div>\n<h1>Pourquoi : six barrières traversées<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Modèle de Reason : un accident survient quand les trous de plusieurs barrières s’alignent. Ici, le pilote a hérité de cinq trous avant même de décoller.<\/p>\n<div style=\"margin:0 0 1mm\"><svg viewBox=\"0 0 690 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\">\n<defs><pattern id=\"h2\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#c4c4c4\" stroke-width=\"2\"/><\/pattern>\n<marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\".8\" fill=\"#111\">\n<path d=\"M78 22 V14 H530 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"304\" y=\"9\" text-anchor=\"middle\">DÉFAILLANCES LATENTES · AVANT LE VOL<\/text>\n<path d=\"M568 22 V14 H630 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"599\" y=\"9\" text-anchor=\"middle\">ACTIVE · EN VOL<\/text>\n<\/g>\n<path d=\"M82 46 L120 30 L120 178 L82 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"101\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"101\" cy=\"62\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M180 46 L218 30 L218 178 L180 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"199\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"199\" cy=\"160\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M278 46 L316 30 L316 178 L278 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"297\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"297\" cy=\"80\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M376 46 L414 30 L414 178 L376 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"395\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"395\" cy=\"150\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M474 46 L512 30 L512 178 L474 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"493\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"493\" cy=\"58\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M572 46 L610 30 L610 178 L572 194 Z\" fill=\"#bdbdbd\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"591\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"591\" cy=\"165\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/>\n<line x1=\"8\" y1=\"112\" x2=\"676\" y2=\"112\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ra)\"/>\n<g font-size=\"10\" fill=\"#111\" text-anchor=\"middle\"><text x=\"101\" y=\"216\" font-weight=\"600\">1 · Organisation<\/text><text x=\"101\" y=\"230\">maintenance<\/text><text x=\"199\" y=\"216\" font-weight=\"600\">2 · Documents<\/text><text x=\"199\" y=\"230\">du motoriste<\/text><text x=\"297\" y=\"216\" font-weight=\"600\">3 · Vol<\/text><text x=\"297\" y=\"230\">de contrôle<\/text><text x=\"395\" y=\"216\" font-weight=\"600\">4 · Détection<\/text><text x=\"395\" y=\"230\">sans symptôme<\/text><text x=\"493\" y=\"216\" font-weight=\"600\">5 · Check-list<\/text><text x=\"493\" y=\"230\">conception<\/text><text x=\"591\" y=\"216\" font-weight=\"600\">6 · Urgence<\/text><text x=\"591\" y=\"230\">gestion en vol<\/text><\/g>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" fill=\"#111\"><text x=\"8\" y=\"100\">RACCORD<\/text><text x=\"8\" y=\"134\">MAL SERRÉ<\/text><text x=\"676\" y=\"100\" text-anchor=\"end\">ACCIDENT<\/text><\/g>\n<\/svg><\/div>\n<table style=\"font-size:13.4px\"><tr><th>Barrière<\/th><th>Ce qui a cédé<\/th><th class=\"c\">Source<\/th><\/tr><tr><td style='width:42mm'><b>1 · Organisation de la maintenance<\/b><\/td><td>Technicien qualifié, mais sans expérience du PA-28 et peu familier des moteurs Continental. Hangar exigu et mal éclairé, outillage parfois emprunté, interruptions. Raccord probablement insuffisamment serré.<\/td><td class='c' style='width:20mm'><span class='src-tag us'>BEA<\/span><\/td><\/tr><tr><td style='width:42mm'><b>2 · Documentation du motoriste<\/b><\/td><td>Le bulletin de service du motoriste (SB M89-7R1, 1989) était inconnu du technicien ; la documentation avion ne demandait pas de vol particulier.<\/td><td class='c' style='width:20mm'><span class='src-tag us'>BEA<\/span><\/td><\/tr><tr><td style='width:42mm'><b>3 · Vol de contrôle après travaux<\/b><\/td><td>30 minutes, en l’absence du technicien, au lieu d’au moins deux heures avec surveillance du débit carburant, de la pression d’huile et des températures.<\/td><td class='c' style='width:20mm'><span class='src-tag us'>BEA<\/span><\/td><\/tr><tr><td style='width:42mm'><b>4 · Détection en exploitation<\/b><\/td><td>Huit heures de vol sans symptôme : le desserrage progresse sous les vibrations, sans signe visible.<\/td><td class='c' style='width:20mm'><span class='src-tag us'>BEA<\/span><\/td><\/tr><tr><td style='width:42mm'><b>5 · Conception de la check-list<\/b><\/td><td>La rubrique feu électrique est associée aux fumées en cabine, alors qu’un feu moteur enfume aussi la cabine.<\/td><td class='c' style='width:20mm'><span class='src-tag'>Analyse<\/span><\/td><\/tr><tr><td style='width:42mm'><b>6 · Gestion de l’urgence<\/b><\/td><td>Procédure feu électrique probablement appliquée ; sélecteur carburant resté ouvert, pompe auxiliaire sur ON ; fumée gênant l’atterrissage d’urgence ; relief et couche nuageuse. Chauffage et dégivrage retrouvés sur ON : leur rôle dans l’entrée des fumées est une hypothèse, non établie par le BEA.<\/td><td class='c' style='width:20mm'><span class='src-tag'>BEA + analyse<\/span><\/td><\/tr><\/table>\n<div class=\"box tint small\"><b>Zoom maintenance.<\/b> Trois des « Dirty Dozen » de Gordon Dupont, les douze facteurs d’erreur en maintenance, se reconnaissent ici : manque de connaissances (premier PA-28, bulletin inconnu), distraction (interruptions), manque de ressources (outillage, éclairage). « BEA » : fait établi par le rapport. « Analyse » : lecture pédagogique de ce kit.<\/div>"},{"id":"bea","label":"Ce que dit le BEA","html":"<div class=\"kicker\">Fiche mémo · 4/7<\/div>\n<h1>Ce que dit le BEA<\/h1>\n\n<p><b>Ce rapport ne contient pas de recommandation de sécurité formelle.<\/b> Il se conclut par une section « Enseignements et conclusion », dont on peut retenir trois points :<\/p>\n<ol>\n<li>Le raccord a probablement été insuffisamment serré lors de l’entretien ; les vibrations ont aggravé le desserrage jusqu’à la fuite, qui a provoqué à la fois un départ de feu et une perte de puissance.<\/li>\n<li>Le pilote a probablement appliqué la procédure feu électrique, et la fumée a probablement gêné la gestion de l’atterrissage d’urgence.<\/li>\n<li>Le vol de contrôle préconisé par le motoriste aurait pu permettre de déceler une anomalie des paramètres moteur. Le rapport dit « aurait pu », pas « aurait ».<\/li>\n<\/ol>\n<h3>Qu'est-ce qu'une recommandation de sécurité ?<\/h3>\n<p>C’est une proposition faite par une autorité d’enquête, à partir d’une enquête ou d’une étude, pour prévenir des accidents ou incidents. Le BEA l’adresse le plus souvent à une autorité de l’aviation civile ou à l’AESA, parfois directement à un organisme. Depuis 2019, la base européenne SRIS2 recense ces recommandations et les réponses apportées.<\/p>\n<h3>Notre lecture opérationnelle<\/h3>\n<p class=\"small\" style=\"margin-bottom:1mm\">Propositions de ce kit, déduites des enseignements : ce ne sont pas des recommandations du BEA.<\/p>\n<ul>\n<li><b>Propriétaires et ateliers<\/b> : après tout travail moteur, rechercher aussi les bulletins du motoriste ; écrire le vol de contrôle (durée, paramètres, valeurs attendues) ; faire vérifier les raccords de carburant par un second regard.<\/li>\n<li><b>Pilotes<\/b> : identifier l’origine d’une fumée avant de choisir la rubrique ; connaître ses valeurs moteur de référence.<\/li>\n<li><b>Formateurs<\/b> : entraîner la distinction feu électrique / feu moteur sur des indices ambigus, et le critère de bascule.<\/li>\n<\/ul>"},{"id":"reco","label":"Une recommandation réelle","html":"<div class=\"kicker\">Fiche mémo · 5/7<\/div>\n<h1>Une recommandation réelle sur le même sujet<\/h1>\n<p class=\"lead\">La difficulté au cœur de ce scénario, traiter vite une fumée d’origine incertaine avec la bonne procédure, a fait l’objet d’une vraie recommandation de sécurité, en aviation de transport.<\/p>\n<div class=\"box\">\n<div class=\"kicker\">Recommandation A00-19 · Bureau de la sécurité des transports du Canada (BST)<\/div>\n<p style=\"font-size:16.3px;margin-bottom:1.6mm\"><b>Les procédures d’urgence en cas d’odeurs ou de fumée d’origine inconnue doivent pouvoir être exécutées assez vite pour limiter le déclenchement et la propagation d’un feu en vol.<\/b><\/p>\n<p class=\"small\" style=\"margin:0\">Reformulation. Recommandation émise le 4 décembre 1999 et adressée aux autorités de réglementation compétentes.<\/p>\n<\/div>\n<div class=\"cols\" style=\"margin-top:2mm\">\n<div>\n<h2 style=\"margin-top:0\">L'origine<\/h2>\n<p>Le 2 septembre 1998, le vol Swissair 111, un MD-11 parti de New York pour Genève, se déroute vers Halifax à cause de fumée dans le poste de pilotage. L’équipage perd le contrôle à cause d’un incendie déclaré au-dessus du plafond ; les 229 occupants sont tués.<\/p>\n<p>Le BST constate que les check-lists fumée de l’époque n’étaient pas conçues pour être déroulées rapidement, alors qu’un feu qui s’entretient peut s’intensifier en peu de temps.<\/p>\n<\/div>\n<div>\n<h2 style=\"margin-top:0\">Ce qui a changé<\/h2>\n<ul>\n<li>2004-2005 : la Flight Safety Foundation conduit un travail international et produit un modèle générique de check-list fumée, feu et vapeurs.<\/li>\n<li>Airbus fusionne en 2002 trois procédures fumée en une seule ; Boeing adopte le modèle en 2007 pour ses avions de ligne.<\/li>\n<li>Février 2023 : le BST juge la réponse entièrement satisfaisante et clôt le dossier.<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<h2>Le lien avec notre cas<\/h2>\n<p>Contexte différent : avion de ligne, feu caché au-dessus du plafond. Mais une difficulté commune : traiter vite une fumée dont l’origine n’est pas évidente. Notre lecture : dans notre cas, la rubrique feu électrique portait l’étiquette « fumées dans la cabine », alors qu’un feu moteur produisait lui aussi de la fumée en cabine. Une check-list devrait aider à trancher, pas orienter d’emblée.<\/p>\n<div class=\"box tint small\">Question pour le groupe : vos check-lists fumée vous aident-elles à identifier l’origine, ou vous orientent-elles d’emblée vers une rubrique ?<\/div>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · 6/7<\/div>\n<h1>Les cinq éléments à retenir<\/h1>\n<div style=\"margin-bottom:3mm\"><div class=\"keep\"><div class=\"n\">1<\/div><div><b>La fumée est un symptôme, pas un diagnostic.<\/b><br>Identifiez l’origine en croisant au moins trois indices : d’où vient la fumée, ce que disent les paramètres moteur, ce que dit le circuit électrique.<\/div><\/div><div class=\"keep\"><div class=\"n\">2<\/div><div><b>Feu moteur : couper l’essence, même si cela coûte le moteur.<\/b><br>Un atterrissage moteur coupé et maîtrisé vaut mieux qu’un feu entretenu.<\/div><\/div><div class=\"keep\"><div class=\"n\">3<\/div><div><b>Fixez votre critère de bascule avant d’en avoir besoin.<\/b><br>Le biais de continuation du plan se combat avec un seuil décidé à froid, puis respecté.<\/div><\/div><div class=\"keep\"><div class=\"n\">4<\/div><div><b>Préparez le plan B quand les options se réduisent.<\/b><br>Couche, relief, nuit, mer : une minute d’anticipation vaut des secondes gagnées dans l’urgence.<\/div><\/div><div class=\"keep\"><div class=\"n\">5<\/div><div><b>Une remise en service se prépare avec toutes les documentations.<\/b><br>Avionneur et motoriste, bulletins de service compris. L’absence de symptôme n’est pas une preuve.<\/div><\/div><\/div>\n"},{"id":"gloss1","label":"Glossaire 1/2","html":"<div class=\"kicker\">Fiche mémo · 7/7 · glossaire 1/2<\/div>\n<h1>Les mots du scénario<\/h1>\n<div class=\"gl\"><h3>Avion et moteur<\/h3><div class=\"e\"><b>Moteur à injection.<\/b> Moteur à pistons sans carburateur : le carburant est dosé par un régulateur puis injecté dans chaque cylindre.<\/div><div class=\"e\"><b>Régulateur de carburant.<\/b> Organe qui dose le carburant envoyé au moteur selon la puissance et le mélange demandés.<\/div><div class=\"e\"><b>Répartiteur.<\/b> Organe situé après le régulateur, qui distribue le carburant aux injecteurs. Dans l’accident, la pression à son entrée était tombée sous celle du ralenti.<\/div><div class=\"e\"><b>Raccord, filets en prise.<\/b> Un raccord fileté relie deux tuyauteries. « Trois filets en prise » : seuls trois tours de filetage étaient engagés, signe d’un serrage insuffisant.<\/div><div class=\"e\"><b>Pompe carburant auxiliaire.<\/b> Pompe électrique d’appoint, en complément ou en secours de la pompe entraînée par le moteur.<\/div><div class=\"e\"><b>Sélecteur carburant.<\/b> Commande qui choisit le réservoir alimentant le moteur ; sur OFF, elle coupe l’arrivée de carburant.<\/div><div class=\"e\"><b>Mélange, étouffoir.<\/b> La manette de mélange règle la proportion air-carburant. En position étouffoir, elle coupe le carburant et arrête le moteur.<\/div><div class=\"e\"><b>Magnétos.<\/b> Générateurs d’allumage entraînés par le moteur, indépendants de la batterie : couper le contact général n’arrête pas le moteur.<\/div><div class=\"e\"><b>Contact général.<\/b> Interrupteur qui coupe l’alimentation électrique de bord : radio, transpondeur, équipements. Pas le moteur.<\/div><div class=\"e\"><b>Chauffage et dégivrage.<\/b> Air réchauffé autour de l’échappement, dans le compartiment moteur, puis envoyé en cabine et sur le pare-brise. D’où leur coupure en cas de feu moteur.<\/div><div class=\"e\"><b>Cloison pare-feu.<\/b> Cloison qui sépare le compartiment moteur de la cabine.<\/div><div class=\"e\"><b>Configuration.<\/b> Position du train et des volets. Sortie, elle augmente la traînée, donc le taux de descente à puissance donnée.<\/div><h3>Procédures et pilotage<\/h3><div class=\"e\"><b>Check-list d’urgence.<\/b> Liste des actions à effectuer face à une panne, dans l’ordre défini par le constructeur.<\/div><div class=\"e\"><b>Atterrissage forcé.<\/b> Atterrissage imposé par la perte de propulsion : moteur arrêté ou insuffisant.<\/div><div class=\"e\"><b>Atterrissage de précaution.<\/b> Atterrissage choisi hors aérodrome, moteur encore disponible, pour éviter qu’une situation ne se dégrade.<\/div><div class=\"e\"><b>Vitesse de plané.<\/b> Vitesse de finesse maximale : la plus grande distance parcourue par mètre de hauteur perdue, moteur arrêté.<\/div><div class=\"e\"><b>Niveau de vol (FL80).<\/b> Altitude lue avec l’altimètre calé sur 1013,25 hPa, en centaines de pieds : FL80 correspond à 8 000 ft pression.<\/div><div class=\"e\"><b>QNH.<\/b> Calage altimétrique qui fait lire l’altitude au-dessus du niveau moyen de la mer.<\/div><div class=\"e\"><b>Stratocumulus.<\/b> Nuages bas en couche, en galets ou en rouleaux. « Accrochant le relief » : leur base touche les sommets.<\/div><div class=\"e\"><b>Plan B, dégagement.<\/b> Solution de repli préparée à l’avance : où aller, par où, en combien de temps.<\/div><h3>Radio et circulation aérienne<\/h3><div class=\"e\"><b>Information de vol.<\/b> Service qui renseigne et alerte les vols sans les contrôler. « Marseille Information » en est un.<\/div><div class=\"e\"><b>Détresse (MAYDAY).<\/b> Danger grave et imminent ; assistance immédiate requise.<\/div><div class=\"e\"><b>Urgence (PAN PAN).<\/b> Situation préoccupante pour la sécurité, sans besoin d’assistance immédiate.<\/div><div class=\"e\"><b>Collationnement.<\/b> Répétition d’un message par celui qui le reçoit, pour confirmer qu’il l’a compris.<\/div><div class=\"e\"><b>Contact radar.<\/b> L’avion est identifié sur l’écran radar. Sans lui, le contrôleur ne peut pas donner de cap.<\/div><div class=\"e\"><b>« Attendez ».<\/b> Demande à l’interlocuteur de patienter. Libère le pilote d’une réponse immédiate.<\/div><\/div>"},{"id":"gloss2","label":"Glossaire 2/2","html":"<div class=\"kicker\">Fiche mémo · 7/7 · glossaire 2/2<\/div>\n<h1>Les mots du scénario<\/h1>\n<div class=\"gl\"><h3>Maintenance et navigabilité<\/h3><div class=\"e\"><b>Immatriculation N.<\/b> Avion immatriculé aux États-Unis, entretenu selon les règles de la FAA même s’il est basé en France.<\/div><div class=\"e\"><b>Visite annuelle.<\/b> Inspection périodique obligatoire de l’avion.<\/div><div class=\"e\"><b>Licence A&P.<\/b> Licence américaine de mécanicien cellule et moteur (Airframe and Powerplant).<\/div><div class=\"e\"><b>Habilitation IA.<\/b> Habilitation américaine (Inspection Authorization) qui permet d’approuver la remise en service après une visite annuelle.<\/div><div class=\"e\"><b>Remise en service.<\/b> Approbation, après maintenance, attestant que l’avion est apte au vol.<\/div><div class=\"e\"><b>Bulletin de service (SB).<\/b> Document du constructeur, ici le motoriste, qui recommande une inspection, une modification ou une procédure. En principe non obligatoire, sauf s’il est repris par une consigne de navigabilité.<\/div><div class=\"e\"><b>Consigne de navigabilité.<\/b> Exigence obligatoire émise par l’autorité (en anglais, AD).<\/div><div class=\"e\"><b>Vol de contrôle.<\/b> Vol qui vérifie le bon fonctionnement après maintenance, avec des paramètres et des valeurs à surveiller définis à l’avance.<\/div><div class=\"e\"><b>Rodage.<\/b> Période après un remplacement de cylindres où les pièces neuves se mettent en place ; le bulletin du motoriste fixait l’huile des 25 premières heures.<\/div><div class=\"e\"><b>Couple de serrage.<\/b> Force de serrage prescrite pour un raccord ou une vis, appliquée à la clé dynamométrique.<\/div><h3>Facteurs humains et sécurité<\/h3><div class=\"e\"><b>Modèle de Reason.<\/b> Dit du « fromage suisse » : un accident survient quand les défaillances de plusieurs barrières s’alignent.<\/div><div class=\"e\"><b>Défaillance latente.<\/b> Faiblesse présente dans le système, parfois depuis longtemps, sans effet visible : un raccord mal serré, un bulletin inconnu.<\/div><div class=\"e\"><b>Défaillance active.<\/b> Action ou omission en première ligne, à effet immédiat : une procédure inadaptée sous la fumée.<\/div><div class=\"e\"><b>Dirty Dozen.<\/b> Douze facteurs d’erreur en maintenance identifiés par Gordon Dupont, dont le manque de connaissances, la distraction et le manque de ressources.<\/div><div class=\"e\"><b>TEM.<\/b> Gestion des menaces et des erreurs : anticiper les menaces, détecter et rattraper les erreurs avant qu’elles ne mènent à un état indésirable de l’avion.<\/div><div class=\"e\"><b>FOR-DEC.<\/b> Méthode de décision en six temps : faits, options, risques et bénéfices, décision, exécution, contrôle.<\/div><div class=\"e\"><b>Biais de continuation du plan.<\/b> Tendance à poursuivre le plan initial malgré des signaux qui imposent d’en changer.<\/div><div class=\"e\"><b>Effet de cadrage.<\/b> La présentation d’une information, ici le titre d’une rubrique, oriente la décision.<\/div><div class=\"e\"><b>Biais de confirmation.<\/b> Tendance à retenir les indices qui confirment l’hypothèse déjà formée.<\/div><div class=\"e\"><b>Tunnelisation attentionnelle.<\/b> Focalisation sur une tâche ou un indice au détriment du reste de la situation.<\/div><div class=\"e\"><b>Critère de bascule.<\/b> Seuil fixé à l’avance qui déclenche un changement de plan sans nouvelle délibération.<\/div><div class=\"e\"><b>Piloter, naviguer, communiquer.<\/b> Ordre de priorité des tâches en situation anormale.<\/div><div class=\"e\"><b>Culture juste.<\/b> Climat où l’on peut signaler ses erreurs sans crainte de sanction, sans tolérer pour autant les négligences graves.<\/div><div class=\"e\"><b>Compétences OACI.<\/b> Neuf compétences comportementales de la formation par compétences : PRO, SAW, PSD, WLM, FPM, FPA, KNO, COM, LTW.<\/div><\/div>\n<h2>Sources<\/h2>\n<div class=\"src\">\n<p>BEA, rapport d’accident n-xm130529, février 2015 : <a href=\"https://bea.aero/fileadmin/documents/docspa/2013/n-xm130529/pdf/n-xm130529_05.pdf\">bea.aero, rapport n-xm130529<\/a>.<\/p>\n<p>Ministère de la Transition écologique, « Recommandations de sécurité », page mise à jour le 26 février 2024 : <a href=\"https://www.ecologie.gouv.fr/politiques-publiques/recommandations-securite\">ecologie.gouv.fr<\/a>.<\/p>\n<p>Bureau de la sécurité des transports du Canada, recommandation A00-19 et suivi jusqu’en février 2023 : <a href=\"https://bst.gc.ca/fra/recommandations-recommendations/aviation/2000/rec-a0019.pdf\">bst.gc.ca, rec. A00-19<\/a>.<\/p>\n<p class=\"small\">Réutilisation pédagogique non commerciale du rapport BEA, source citée, sans altération du sens. Les enquêtes du BEA visent uniquement l’amélioration de la sécurité, jamais la recherche de fautes.<\/p>\n<\/div>"}]},"pressureLimit":60,"noTest":true,"realEnd":{"fin":11,"src":"BEA","t":"L’avion heurte des arbres en lisière de bois, près d’un terrain de golf, puis le sol. Le pilote est tué, l’avion détruit."}},{"id":"s2","num":2,"version":"S2 v2","duration":"15 à 20 min","title":"Le numéro 2","short":"Le numéro 2","public":"Équipages de conduite","role":"Copilote du numéro 2 d’une noria de Canadair","pitch":"Une boutade d’autorité au briefing, un écopage en noria, un leader qui serre le port. Chaque parole qui contredit le commandant de bord se paie.","dossierName":"Dossier de mission","ambient":"turboprop","lamp":{"label":"ÉCOPAGE","colors":{"3":"green","18":"amber","12":"amber","7":"red"}},"resources":[{"key":"CRÉDIT","label":"Crédit","icon":"diamond","start":3,"max":null,"display":"count","unit":"jeton CRÉDIT","units":"jetons CRÉDIT","desc":"Ce que le CDB et le groupe vous passent. Chaque parole qui le contredit se paie."}],"costRes":"CRÉDIT","costIcon":"diamond","costName":"losanges","tokens":{"CONSIGNE":"La consigne parle pour vous : ce qu’elle prévoit ne se paie pas.","ALERTE":"Vous avez annoncé la convergence en finale."},"tokenIcons":{"CONSIGNE":"doc","ALERTE":"alert"},"start":1,"decisions":{"1":{"idx":1,"title":"Le ton du jour","front":[{"t":"9 h 15, base des Canadair, fin août. Après le briefing, devant l’affiche sécurité aux feux tricolores, vous lancez : « Pour moi, tous les feux sont au vert. »"},{"t":"Votre CDB du jour, le chef des personnels navigants, répond devant tout le monde : « Ça ne t’empêchera pas de la fermer en vol ! »"},{"t":"Les commandants de bord rient. Les deux copilotes à côté de vous regardent leurs chaussures. Lui file à son bureau : depuis le déménagement de la base, il croule sous les dossiers."}],"notes":[],"tail":"","question":"Que faites-vous ?","options":[{"to":4,"text":"Vous riez avec les autres. C’est son style, et ce n’est pas le jour de vous faire remarquer.","cost":0,"cls":"C","short":"Rire avec lui"},{"to":11,"text":"Vous le rattrapez dans le couloir : « Tout à l’heure, si je vois un truc qui me gêne, je te le dis. D’accord ? »","cost":2,"cls":"B","short":"Contrat dans le couloir"},{"to":17,"text":"Vous ne riez pas et ne répondez rien. Au secteur, vous rouvrez les consignes et recopiez sur votre planchette la règle de placement et la rubrique interruption.","cost":0,"cls":"A","short":"Consigne sur la planchette"}],"enter":[{"type":"add","res":"CRÉDIT","d":-1,"head":"Jeton CRÉDIT","text":"Il vient de vous le prendre, devant tout le monde : {effet}."}],"auto":[4,11],"key":{"tabs":["consignes","situation"],"tab":"consignes","mark":"d1","note":"Consignes, rubrique 4 : l’interruption est annoncée par le CDB ou par le copilote. Recopiée ou lue à voix haute, la consigne parle pour vous."}},"8":{"idx":2,"title":"L’oreille","front":[{"t":"18 h 34, l’alerte : un feu à 22 km au nord. Quatre Canadair, vous êtes numéro 2. Six minutes après le décollage, le plan d’eau : un fleuve large de 460 m, un port de plaisance sur la rive gauche."},{"t":"Le leader reconnaît le plan d’eau face au nord ; vous êtes à sa droite, à 150 m. Vent du sud-sud-ouest, 5 à 10 kt. Il annonce une oreille à gauche pour revenir face au sud."},{"t":"Dans l’oreille, votre CDB élargit et, sans un mot, se place à gauche du leader, sous le vent. Il n’appelle pas la check-list avant écopage. La lire à voix haute sans qu’il l’appelle, c’est lui faire remarquer son oubli."}],"notes":[{"if":"has:CONSIGNE","head":"Jeton CONSIGNE","text":"Votre planchette dit « nous, au vent, hors de son souffle ». Vous êtes sous le vent."},{"if":"zero:CRÉDIT","head":"Sans jeton CRÉDIT","text":"« On en reparle en décembre. » La phrase tourne encore."}],"tail":"","question":"Que faites-vous ?","options":[{"to":2,"text":"Sans le contredire en face, vous prévenez le leader sur la fréquence de la noria : « Deux, à ta gauche. »","cost":1,"cls":"B","short":"Prévenir le leader, seul"},{"to":19,"text":"Vous lisez la check-list à voix haute, item par item. Puis, du même ton : « Rappel, rubrique 4 : interruption annoncée par le CDB ou par le copilote. »","cost":0,"cls":"A","short":"Check-list et rubrique 4"},{"to":13,"text":"Vous déroulez seul la check-list, en silence, comme d’habitude. La trajectoire, c’est son affaire.","cost":0,"cls":"C","short":"Check-list en silence"}],"enter":[],"cue":"alert","auto":[13,2],"key":{"tabs":["noria","consignes"],"tab":"noria","mark":"d8","note":"Règle de placement : le leader prend le dessous du vent, les équipiers restent au vent, hors de son souffle. Votre CDB s’est placé sous le vent."}},"14":{"idx":3,"title":"Cinq secondes","front":[{"t":"Fin de l’oreille. Le CDB a pris une pente forte pour toucher l’eau au plus tôt : 100 kt au lieu de 90. Il fait un palier pour perdre la vitesse, et l’écart avec le leader fond."},{"t":"Le leader ne prend pas le milieu : il serre le port. Il est sur votre droite, à 80 m, et sa trajectoire se rapproche de la vôtre. À gauche, il reste de l’eau grâce au coude du fleuve ; plus loin, les quais."},{"t":"Cette position et cette proximité vous surprennent. Cinq à sept secondes avant l’eau."}],"notes":[{"if":"has:CONSIGNE","head":"Jeton CONSIGNE","text":"150 m au moins, dit la consigne. Il en reste 80."},{"if":"zero:CRÉDIT","head":"Sans jeton CRÉDIT","text":"Vous savez exactement ce qu’il faudrait dire. Vous n’avez plus de quoi le payer."}],"tail":"","question":"Que faites-vous ?","options":[{"to":10,"text":"Vous vous taisez : c’est le pilote le plus expérimenté de la base, il a forcément un plan.","cost":0,"cls":"C","short":"Silence"},{"to":6,"text":"Vous annoncez les faits, net : « Cent nœuds. Il serre le port, quatre-vingts mètres, on converge. »","cost":1,"cls":"A","short":"Alerte factuelle"},{"to":20,"text":"Vous glissez, à mi-voix : « Ça va passer ? »","cost":0,"cls":"B","short":"« Ça va passer ? »"}],"enter":[],"auto":[10,20],"key":{"tabs":["consignes","avion"],"tab":"consignes","mark":"d14","note":"Consignes : 150 m au moins entre deux avions. Avion : finale à 90 kt. Il restait 80 m, à 100 kt."}},"5":{"idx":4,"title":"Dans l’eau","front":[{"t":"Pleine puissance : 92 % à gauche, 82 % à droite. Vous corrigez la butée droite. L’avion bute sur le souffle du leader et part à gauche ; le CDB contre. À gauche, des bateaux amarrés au quai."}],"notes":[{"if":"has:ALERTE","head":"Jeton ALERTE","text":"L’écopage commence. Le CDB a vu le resserrement ; il vous jette un coup d’œil."},{"if":"not:ALERTE","head":"Sans le jeton ALERTE","text":"L’écopage se termine. Quatre tonnes et demie d’eau dans les soutes ; le resserrement saute aux yeux."}],"tail":"Interrompre l’écopage fait partie de vos prérogatives. Cela coûte dix minutes à vidanger sur l’eau, une noria à trois, et une décision retirée au chef des PN devant toute la noria.","question":"Que faites-vous ?","options":[{"to":16,"text":"Vous restez sur vos tâches : butées, remplissage. La trajectoire, c’est lui.","cost":0,"cls":"C","short":"Tâches, sans un mot"},{"to":15,"text":"Vous annoncez, fort : « Interruption ! »","cost":3,"free":"CONSIGNE","cls":"A","short":"« Interruption ! »"},{"to":9,"text":"Vous demandez au CDB : « On interrompt ? »","cost":0,"cls":"B","short":"« On interrompt ? »"}],"enter":[],"cue":"water","auto":[16,9],"key":{"tabs":["consignes"],"tab":"consignes","mark":"d5","note":"Rôles en écopage : l’interruption fait partie des tâches du copilote. Rubrique 4 : annoncée par le CDB ou par le copilote."}}},"suites":{"4":{"front":[{"t":"Vous riez avec eux. En passant, il vous donne une tape sur l’épaule."},{"t":"Au secteur, un autre copilote, à mi-voix : « Bien vu. Avec lui, tu fais tes butées et tu rentres. Moi, mon renouvellement passe en décembre. »"},{"t":"La journée s’étire, sans alerte, jusqu’au soir."}],"changes":[{"res":"CRÉDIT","d":1}],"debrief":[["Pourquoi c’était tentant","Rire, c’est rester du bon côté du groupe, et le jeu vous a rendu un jeton. Dans un clan, le silence se paie en tolérance : c’est ainsi qu’une norme se transmet, y compris par les autres copilotes."],["Le piège","Une boutade d’autorité fixe la règle du vol : « en vol, tu te tais ». Rire, c’est la contresigner. Le BEA-É y voit le point de départ des « comportements prévisibles de retrait » du copilote."],["Ce qui protège","Ne pas contresigner : ne pas rire suffit. Puis préparer ce qui parlera pour vous en vol : la consigne, la check-list, des critères d’interruption."]],"comp":"COM · LTW","note":"Le groupe vous le rend : vous êtes du bon côté de la blague.","go":8},"11":{"front":[{"t":"Il ne s’arrête pas. Devant le mécanicien de piste, sans se retourner : « Un contrat ? T’en as déjà un. On en reparle en décembre. »"},{"t":"Le mécanicien a entendu. À midi, tout le secteur le sait. La journée s’étire, sans alerte, jusqu’au soir ; vous ne le croisez plus."}],"changes":[],"debrief":[["Pourquoi c’était coûteux","C’est ce qu’enseigne le CRM, et vous l’avez fait. Mais vous avez demandé une permission, en public, à l’homme qui venait de fixer la règle inverse et qui pèse sur votre avenir. Dans ce secteur, une demande personnelle se paie au prix fort."],["Ce que vous avez vécu ensuite","Sans jeton, vous saviez quoi dire et ne pouviez plus le payer : c’est la situation du vrai copilote. Ce n’est pas votre contrat qui était faux ; c’est l’organisation qui en fixait le prix."],["Ce qui protège","Ce qui ne dépend pas de son accord : la consigne, la check-list dite à voix haute, des critères écrits. Et un contrat de parole porté par le CDB lui-même, au briefing, comme une règle de l’unité."]],"comp":"COM · LTW","box":"Vous avez payé deux jetons CRÉDIT. Il ne vous en reste aucun.","go":8},"17":{"front":[{"t":"Vous ne riez pas. Personne ne le remarque, sauf peut-être lui."},{"t":"Au secteur, vous recopiez sur votre planchette : « Leader sous le vent ; nous, au vent, hors de son souffle. 150 m au moins. Interruption : annoncée par le CDB ou par le copilote. »"},{"t":"Un autre copilote vous regarde faire : « Tu crois que ça va changer quoi ? » La journée s’étire, sans alerte, jusqu’au soir."}],"changes":[{"tok":"CONSIGNE"}],"debrief":[["Pourquoi c’était discret","Vous n’avez affronté personne : ni rire, ni réplique. Vous avez seulement mis la consigne entre vous et lui. C’est pourquoi l’option ne coûtait rien."],["Ce qui protège","Face à un gradient très fort, la parole la moins chère est celle qui s’appuie sur un texte : une ligne de consigne se discute moins qu’une opinion. Un critère d’interruption écrit avant le vol transforme une contestation en application."],["La limite","La planchette ne parle pas seule : encore faut-il lire la ligne, au bon moment. Et ce n’est pas au copilote de compenser seul le climat d’une unité : c’est l’objet des recommandations R2 et R6."]],"comp":"PRO · LTW","go":8},"19":{"front":[{"t":"« Oui, oui. » Il ne vous regarde pas."},{"t":"Mais la phrase a été dite, à voix haute, dans le cockpit. Elle n’est plus seulement dans le livret : elle est entre vous deux."}],"changes":[{"tok":"CONSIGNE"}],"debrief":[["Pourquoi c’était possible","La check-list est votre tâche : la lire à voix haute ne demande la permission de personne. Rappeler la rubrique interruption, c’est citer la consigne, pas critiquer le CDB. C’est pourquoi l’option ne coûtait rien."],["Ce qui protège","Un texte dit à voix haute devient un accord : plus tard, « interruption » ne sera pas une insolence, mais l’application de ce qui a été lu. C’est l’esprit de la recommandation R2 : des briefings systématiques aux phases clés."],["La limite","« Oui, oui » n’est pas une adhésion. Et le rappel ne dit rien de sa trajectoire : il est sous le vent, et vous ne l’avez pas dit."]],"comp":"COM · PRO","go":14},"2":{"front":[{"t":"Le leader répond : « Reçu. » Rien d’autre. Il garde sa trajectoire et accélère un peu."},{"t":"Le CDB vous jette un regard : « Occupe-toi de tes butées. » Toute la noria a entendu le numéro 2 parler à sa place."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Prévenir le leader évite de contredire le CDB en face."],["Le piège","Contourner coûte aussi : le CDB l’a vécu comme un désaveu sur la fréquence. Et une information n’est pas une demande : chef de noria depuis deux mois face à son propre chef, le leader accuse réception et ne demande rien. Le BEA-É parle d’inversion du gradient d’autorité dans la noria."],["Ce qui protège","Une demande claire plutôt qu’une information : « Où écopes-tu ? ». Et, dans le cockpit, s’appuyer d’abord sur ce que la consigne vous donne."]],"comp":"COM · LTW","go":14},"13":{"front":[{"t":"Check-list terminée, en silence. Vous préparez vos butées."},{"t":"Le CDB descend vers l’eau. Depuis le décollage, personne n’a parlé dans le cockpit."}],"changes":[],"debrief":[["Pourquoi c’était tentant","C’est ce que vous faites d’habitude, et ce qu’il attend : il ne l’a pas appelée. La lire à voix haute aurait souligné son oubli. Le vrai copilote a fait exactement cela."],["Le piège","Une check-list déroulée seule et en silence ne crée aucune conscience partagée. Le CDB ne sait pas ce que vous voyez ; vous ne savez pas ce qu’il prévoit."],["Ce qui protège","La check-list est le seul moment où votre parole est prévue : c’est la moins chère de toutes. S’en servir pour dire la rubrique qui compte."]],"comp":"COM · SAW","go":14},"6":{"front":[{"t":"Il a entendu."},{"t":"Vous ajoutez : « Cent cinquante prescrits. » Il répond « Vu », réduit encore et s’écarte de quelques mètres.","if":"has:CONSIGNE"},{"t":"« Je sais ! » Mais ses yeux vont au leader.","if":"not:CONSIGNE"}],"changes":[{"tok":"ALERTE"}],"debrief":[["Pourquoi c’était coûteux","Dire « on converge » au chef des PN, à cinq secondes de l’eau, c’est le contredire au pire moment. Cela vous a coûté un jeton ; certains joueurs n’en avaient plus."],["Ce qui protège","L’alerte factuelle : un chiffre, une direction, une conséquence, sans jugement. C’est le deuxième cran de la prise de parole graduée : questionner, alerter, contester, décider."],["Pourquoi la consigne aide","Une alerte adossée à un texte (« 150 m prescrits, on en a 80 ») parle de l’écart, pas de la personne. Elle se discute moins qu’un avis."]],"comp":"COM · SAW","go":5},"20":{"front":[{"t":"« Ça passe. »"},{"t":"Il ne quitte pas l’eau des yeux. Vous n’insistez pas."}],"changes":[],"debrief":[["Pourquoi c’était tentant","C’était la seule parole gratuite. Une question douce ménage la relation et laisse le dernier mot au CDB."],["Le piège","Le discours atténué : une question vague n’apporte aucun fait et invite à répondre « oui ». Plus l’écart de statut est grand, plus on atténue : c’est la forme que prend la parole quand on n’a plus de crédit."],["Ce qui protège","Un fait, un chiffre, une conséquence. Si la réponse ne convient pas, monter d’un cran."]],"comp":"COM","go":5},"10":{"front":[{"t":"Vous ne dites rien."},{"t":"Le CDB pose l’avion sur l’eau."}],"changes":[],"debrief":[["Pourquoi c’était tentant","La boutade du matin, son statut, votre contrat, les fiches RETEX restées sans suite : tout vous a appris que parler coûte et ne change rien."],["Le piège","L’effet spectateur : le vrai copilote s’est décrit comme « spectateur ». Sa surprise était une information que personne n’a reçue. Le BEA-É n’y voit pas un trait de caractère, mais un « comportement prévisible de retrait », produit par le climat du cockpit."],["Ce qui protège","Pour vous : dire ce qui surprend, en fait chiffré. Pour l’unité : faire en sorte que cette phrase ne coûte rien."]],"comp":"COM · LTW","go":5},"15":{"front":[{"t":"Le CDB réduit aussitôt."},{"t":"Ce n’est pas vous qui l’avez arrêté : c’est la rubrique 4.","if":"has:CONSIGNE"},{"t":"Vous savez déjà que ce soir, quelqu’un vous le fera payer.","if":"not:CONSIGNE"}],"changes":[],"debrief":[["Pourquoi c’était difficile","Retirer la décision au chef des PN, devant la noria : sans texte pour vous couvrir, cela coûtait trois jetons. Avec la rubrique 4 recopiée ou lue à voix haute, c’était gratuit : la consigne interrompt, pas vous."],["Ce qui protège","Un critère d’interruption fixé à l’avance : espacement, convergence, souffle. Plus l’alerte est tôt, plus l’interruption est sûre ; en fin d’écopage, elle peut devenir elle-même dangereuse."]],"comp":"PSD · LTW","branch":{"tok":"ALERTE","a":3,"b":18}},"9":{"front":[{"t":"« Non ! On sort. »"},{"t":"Vous posez le doigt sur la rubrique 4 du livret. Il voit la ligne, puis le leader, et comprend.","if":"has:CONSIGNE"},{"t":"L’écopage se termine. Le CDB veut arracher l’avion de l’eau au plus tôt, en se rapprochant du leader.","if":"not:CONSIGNE"}],"changes":[],"debrief":[["Pourquoi c’était tentant","Demander plutôt qu’annoncer laisse la décision au CDB. C’était gratuit, et c’est souvent ce qui reste quand annoncer paraît hors de prix."],["Le piège","Une question appelle un oui ou un non. Sous pression, celui qui a engagé l’action répond non : changer de plan a un coût élevé."],["Ce qui protège","Annoncer ce que vos prérogatives permettent : « Interruption ! » Le temps des questions, c’était avant."]],"comp":"COM · PSD","branch":{"tok":"CONSIGNE","a":12,"b":7}},"16":{"front":[{"t":"Butée réglée, remplissage annoncé. L’écopage se termine."},{"t":"Le CDB cherche à sortir l’avion de l’eau au plus tôt, en se rapprochant du leader, sans pouvoir entrer dans son souffle."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Votre rôle est cadré : butées, remplissage. Et rien de ce qui s’est passé aujourd’hui ne vous invitait à en sortir."],["Le piège","Faire parfaitement sa tâche pendant que l’avion va vers l’obstacle. Le BEA-É pointe une répartition des tâches très asymétrique : tout sur le CDB, presque rien sur le copilote."],["Ce qui protège","Surveiller la trajectoire autant que les butées. L’interruption est aussi une tâche du copilote."]],"comp":"WLM · SAW · LTW","go":7}},"fins":{"3":{"n":1,"title":"Renoncement à temps","front":[{"t":"L’avion s’enfonce, ralentit et s’arrête au milieu du fleuve, loin des quais. Le leader décolle seul."},{"t":"Dix minutes à vidanger les soutes ; la noria tourne à trois. Le CDB ne vous adresse pas la parole jusqu’au soir. Au débriefing, il résume : « On a interrompu. » On, pas tu."}],"changes":[],"back":"Trois choses ont fait cette fin : la consigne, écrite ou dite à voix haute ; l’alerte en finale ; puis l’interruption. La consigne a rendu la décision possible, l’alerte l’a rendue sûre. Un renoncement coûte toujours quelque chose : une culture de sécurité le partage et le valorise, au lieu de le faire payer au copilote.","question":"Un autre CDB lâche, devant les copilotes : « Dix minutes perdues pour un écopage qui passait. » Que répondez-vous ?","sound":"splashstop"},"18":{"n":2,"title":"Interruption tardive","front":[{"t":"L’écopage était terminé : soutes pleines, vitesse proche du décollage. L’avion freine mal et glisse à gauche dans le souffle du leader."},{"t":"Le ballonnet gauche racle un bateau amarré. Arrêt à quelques mètres du quai. Ballonnet enfoncé, bateau endommagé, personne de blessé."}],"changes":[],"back":"Bonne décision, trop tard. En fin d’écopage, l’interruption devient elle-même risquée : le BEA-É note qu’elle n’était plus envisageable sans risque de collision. Le moment de parler était en finale, et c’est là que la parole coûtait le plus.","question":"Le CDB, livide : « Fallait le dire avant ! » A-t-il raison ? Et qu’est-ce qui vous en empêchait ?","sound":"scrape"},"12":{"n":3,"title":"Passé de justesse","front":[{"t":"Le CDB a compris plus tôt que le leader ne prendrait pas le milieu. Il sort l’avion de l’eau dès la vitesse atteinte et l’incline autant qu’il ose."},{"t":"L’aile gauche passe quelques mètres au-dessus des mâts du port. Personne ne parle jusqu’au largage."}],"changes":[],"back":"La consigne a payé : le CDB a compris plus vite. Mais rien ne distingue cette fin de l’accident, sinon quelques mètres. Un événement sans dégât doit être signalé ; encore faut-il un circuit qui ne passe pas d’abord par la personne en cause. Au printemps, les fiches du binôme n’avaient abouti à aucune mesure.","question":"Posés, le CDB : « Rien de cassé. Inutile d’en faire une histoire. » Votre fiche d’événement serait traitée par le chef des PN : lui. La rédigez-vous ?","sound":"flyby"},"7":{"n":4,"title":"Abordage","front":[{"t":"Un choc, comme une collision aviaire. Le ballonnet gauche a disparu : l’aile a fauché le mât d’une péniche amarrée, occupée par des plaisanciers."},{"t":"Vous demandez le largage de secours ; le CDB attend la fin de la zone portuaire, puis largue. Retour vers la base à 120 kt."}],"changes":[],"back":"Vous avez rencontré l’issue réelle. Personne n’
