art d’une bretelle intermédiaire depuis votre prise de service.<\/td><\/tr><\/table>\n<h2>La nuit<\/h2><table class=\"cast\"><tr><td>Trafic<\/td><td>Vols supplémentaires après un grand match européen, surtout vers l’Espagne. Quelques cargos de nuit.<\/td><\/tr><tr><td>Météo<\/td><td>Nuit, pluie faible, visibilité supérieure à 10 km.<\/td><\/tr><tr data-key=\"d14\"><td>Langues<\/td><td>Français et anglais autorisés. Les équipages français sont contrôlés en français, les autres en anglais.<\/td><\/tr><\/table><\/div>\n<div><h2>L'équipe<\/h2><table class=\"cast\"><tr><td>Organisation<\/td><td>Les deux tours sont regroupées à la tour nord depuis 23 h : une position SOL, une position LOC, le chef de tour.<\/td><\/tr><tr><td>Chef de service<\/td><td>Fait passer les strips du SOL au LOC et donne un coup de main sur les décisions de roulage.<\/td><\/tr><tr data-key=\"d1\"><td>Coordination SOL-LOC<\/td><td>Par transfert du strip. Les transferts se font « à l’écoute », sans échange verbal systématique.<\/td><\/tr><tr><td>Ambiance<\/td><td>Pas de tension. Une certaine excitation : soirée inhabituelle, personnels en renfort.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Aéroport, compagnies, indicatifs et numéros transposés. Le scénario suit un événement réel présenté au débriefing.<\/p>"},{"id":"plateforme","label":"Plateforme et travaux","html":"<div class=\"kicker\">Dossier de position · 2/5<\/div><h1>Plateforme et travaux<\/h1>\n<div style=\"max-width:640px\"><svg viewBox=\"0 0 640 330\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" role=\"img\" aria-label=\"Plan schématique de la piste 08/26, des voies B et 12 et du chantier\">\n<rect width=\"640\" height=\"330\" fill=\"#fbfbf9\"/>\n<rect x=\"40\" y=\"150\" width=\"560\" height=\"22\" fill=\"#2b2f36\"/>\n<g stroke=\"#fbfbf9\" stroke-width=\"2\" stroke-dasharray=\"14 12\"><line x1=\"60\" y1=\"161\" x2=\"580\" y2=\"161\"/><\/g>\n<text x=\"584\" y=\"144\" font-weight=\"700\" fill=\"#111\">26<\/text><text x=\"44\" y=\"144\" font-weight=\"700\" fill=\"#111\">08<\/text>\n<text x=\"300\" y=\"140\" fill=\"#111\" font-weight=\"600\">piste 08/26 · 4 200 m<\/text>\n<path d=\"M100 250 L 600 250\" stroke=\"#8a9199\" stroke-width=\"10\" fill=\"none\"/>\n<text x=\"110\" y=\"276\" fill=\"#444\">voie parallèle<\/text>\n<path d=\"M592 250 L 592 172\" stroke=\"#8a9199\" stroke-width=\"10\"/>\n<text x=\"600\" y=\"214\" fill=\"#111\" font-weight=\"700\">B<\/text>\n<path d=\"M420 250 Q 380 236 330 172\" stroke=\"#b5651d\" stroke-width=\"10\" fill=\"none\"/>\n<text x=\"404\" y=\"226\" fill=\"#8a4a12\" font-weight=\"700\">12<\/text>\n<text x=\"300\" y=\"300\" fill=\"#8a4a12\">bretelle 12 : sortie rapide des atterrissages 08,<\/text>\n<text x=\"300\" y=\"316\" fill=\"#8a4a12\">rejoint la piste à angle aigu, orientée vers l'ouest<\/text>\n<g fill=\"#f2b705\" stroke=\"#8a6d00\"><rect x=\"470\" y=\"186\" width=\"60\" height=\"40\" rx=\"4\" opacity=\".55\"/><\/g>\n<text x=\"472\" y=\"242\" fill=\"#6b5600\" font-size=\"11\">chantier, voies 13<\/text>\n<g transform=\"translate(330 60)\"><rect x=\"-10\" y=\"-22\" width=\"20\" height=\"30\" fill=\"#2b2f36\"/><text x=\"16\" y=\"0\" fill=\"#111\" font-weight=\"700\">tour nord<\/text><\/g>\n<path d=\"M560 160 L 520 160\" stroke=\"#1d4f91\" stroke-width=\"3\"/><polygon points=\"512,160 524,154 524,166\" fill=\"#1d4f91\"/>\n<text x=\"470\" y=\"120\" fill=\"#1d4f91\" font-weight=\"600\">sens du décollage 26<\/text>\n<g transform=\"translate(40 30)\"><path d=\"M0 18 L 8 0 L 16 18 L 8 13 Z\" fill=\"#111\"/><text x=\"4\" y=\"32\" font-weight=\"700\">N<\/text><\/g>\n<\/svg><\/div>\n<div class=\"cols\"><div><h2>Repères<\/h2><table class=\"cast\"><tr><td>Piste 08/26<\/td><td>4 200 m. Ce soir, décollages et atterrissages face à l’ouest, en 26.<\/td><\/tr><tr><td>Voie B<\/td><td>Accès au seuil 26. Tous les départs de la soirée l’ont empruntée.<\/td><\/tr><tr data-key=\"d9\"><td>Bretelle 12<\/td><td>Sortie rapide des atterrissages en 08. Utilisable pour un départ intermédiaire sur demande. Elle rejoint la piste à angle aigu : un avion qui s’y trouve a le seuil 26 dans son dos.<\/td><\/tr><tr><td>Chantier<\/td><td>Voies 13 et 13.1 fermées. Éclairage de chantier très puissant près du seuil 26 : depuis la tour, suivre un avion à l’œil dans ce secteur n’est possible qu’en le poursuivant du regard.<\/td><\/tr><\/table><\/div>\n<div><h2>NOTAM de la nuit<\/h2><table><tr><th>N°<\/th><th>Objet<\/th><\/tr><tr><td class='num'>1<\/td><td>Travaux voies 13 et 13.1, de nuit. Engins et éclairage de chantier.<\/td><\/tr><tr><td class='num'>2<\/td><td>Départs depuis une bretelle intermédiaire sur demande de l’équipage, avec l’accord du contrôle.<\/td><\/tr><tr><td class='num'>3<\/td><td>Balisage lumineux de la voie 13 éteint.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Plan schématique transposé, sans échelle exacte.<\/p>"},{"id":"moyens","label":"Moyens de la tour","html":"<div class=\"kicker\">Dossier de position · 3/5<\/div><h1>Moyens de la tour<\/h1>\n<div class=\"cols\"><div><h2>Pour savoir où sont les avions<\/h2><table class=\"cast\"><tr><td>Radar sol principal<\/td><td>Visible des positions SOL et LOC. Cette nuit : nombreux plots fixes et mobiles autour du chantier, échos brouillés près des voies ; position exacte des avions difficile à établir.<\/td><\/tr><tr data-key=\"d14\"><td>Visualisation de surface<\/td><td>Image plus lisible des mobiles au sol. Accessible seulement aux positions SOL.<\/td><\/tr><tr><td>Vue directe<\/td><td>Nuit, pluie, éclairage du chantier : vue directe difficile vers le seuil 26 et la bretelle 12.<\/td><\/tr><tr><td>Radio<\/td><td>Une fréquence LOC. Tous les avions qui approchent de la piste l’écoutent.<\/td><\/tr><\/table><\/div>\n<div><h2>Les strips<\/h2><table class=\"cast\"><tr><td>Indicatif, type, destination<\/td><td>En tête du strip.<\/td><\/tr><tr><td>Piste, départ<\/td><td>Imprimés ; toute modification se fait au crayon et l’ancienne mention est barrée.<\/td><\/tr><tr data-key=\"d9\"><td>Point de départ<\/td><td>Seuil par défaut. Un départ d’une bretelle intermédiaire est noté au crayon : numéro de la bretelle, entouré.<\/td><\/tr><tr><td>Transfert<\/td><td>Le strip passe du SOL au LOC quand l’avion approche du point d’arrêt.<\/td><\/tr><\/table><\/div><\/div>"},{"id":"phraseo","label":"Phraséologie et langues","html":"<div class=\"kicker\">Dossier de position · 4/5<\/div><h1>Phraséologie et langues<\/h1>\n<p class=\"lead\">Extrait du manuel d’exploitation de la tour.<\/p>\n<table class=\"cast\"><tr><td>Alignement simple<\/td><td>« [Indicatif], line up runway 26 and wait » ; « [indicatif], alignez-vous piste 26 et attendez ».<\/td><\/tr><tr data-key=\"d6\"><td>Rang<\/td><td>« … number two » : rang dans la séquence de départ. Ne dit pas derrière qui.<\/td><\/tr><tr data-key=\"d6\"><td>Alignement conditionnel<\/td><td>« [Indicatif], behind [trafic], line up and wait behind ». La condition nomme le trafic concerné, et l’équipage la répète. Elle suppose que l’équipage voie ce trafic.<\/td><\/tr><tr><td>Point d’entrée<\/td><td>Pour un départ d’une bretelle intermédiaire, la clairance peut préciser la bretelle ; rien ne l’impose localement.<\/td><\/tr><tr><td>Décollage<\/td><td>« [Indicatif], runway 26, cleared for take-off » ; « [indicatif], piste 26, autorisé décollage ».<\/td><\/tr><\/table>\n<h2>Langues<\/h2><table class=\"cast\"><tr><td>Règle locale<\/td><td>Français et anglais autorisés sur la fréquence. Les équipages francophones sont contrôlés en français, les autres en anglais.<\/td><\/tr><tr><td>À retenir<\/td><td>Un équipage qui ne comprend pas la langue d’un message ne connaît pas la situation que ce message décrit.<\/td><\/tr><\/table>\n<p class=\"small\">Formules d’après la phraséologie de l’OACI ; règles locales reconstituées pour le jeu.<\/p>"},{"id":"trafic","label":"Le trafic","html":"<div class=\"kicker\">Dossier de position · 5/5<\/div><h1>Le trafic à venir<\/h1>\n<p class=\"lead\">Tableau de strips à la reprise de position, 2 h 05.<\/p>\n<table><tr><th>Indicatif<\/th><th>Vol<\/th><th>Point de départ prévu<\/th><\/tr><tr><td><b>Azur 807<\/b><\/td><td>Biréacteur, compagnie française, 150 passagers, vers Madrid. Revenu d’une panne technique ; strip corrigé à la main.<\/td><td>Seuil 26<\/td><\/tr><tr><td><b>Northline 200<\/b><\/td><td>Biturbopropulseur cargo, compagnie britannique, deux pilotes, vers Londres.<\/td><td>Voir strip<\/td><\/tr><tr><td><b>B737 à l’arrivée<\/b><\/td><td>Atterrissage 26, vers 2 h 50.<\/td><td>—<\/td><\/tr><tr><td><b>Trois départs<\/b><\/td><td>Repoussage en cours aux postes du terminal.<\/td><td>Seuil 26<\/td><\/tr><\/table>\n<p class=\"small\">Le strip fait foi : un départ d’une bretelle intermédiaire y est noté au crayon par le SOL.<\/p>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"16\" cy=\"18\" r=\"5\"/><circle cx=\"32\" cy=\"18\" r=\"5\"/><path d=\"M8 38c0-6 4-10 8-10s8 4 8 10M24 38c0-6 4-10 8-10s8 4 8 10\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"8\" y=\"14\" width=\"32\" height=\"20\" rx=\"2\"/><path d=\"M12 20h14M12 26h10\"/><circle cx=\"33\" cy=\"25\" r=\"4\"/><\/svg>","14":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 30h36\"/><path d=\"M12 26l20-8 6 1-4 4-20 6z\"/><path d=\"M30 12c3 0 5 2 5 5M30 6c6 0 11 5 11 11\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M10 34l14-14\"/><path d=\"M28 24h10M33 19l5 5-5 5\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 34h40\"/><path d=\"M8 28l16-6 5 1-3 3-16 5z\"/><path d=\"M24 22l14-6 5 1-3 3-14 5z\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"8\" y=\"10\" width=\"26\" height=\"18\" rx=\"4\"/><path d=\"M14 28l-4 8 10-8\"/><path d=\"M18 17h10M18 22h6\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 34h40\"/><path d=\"M8 28l18-6 5 1-3 3-18 5z\"/><path d=\"M38 14v10M33 19h10\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 36h40\"/><path d=\"M8 30l14-5 4 1-3 3-14 4z\"/><path d=\"M26 20l10 10M36 20L26 30\"/><\/svg>"},"brief":"Vous êtes contrôleur à la tour d’un grand aéroport international, en position LOC : la piste est à vous. Lisez votre dossier de position comme à chaque reprise.","eval":{"questions":[{"t":"Une clairance d’alignement conditionnelle doit comporter :","type":"single","options":["L’identification du trafic concerné et la condition","Seulement le rang dans la séquence","La fréquence de départ","Le QNH"],"answer":0,"notion":"Clairance conditionnelle"},{"t":"Quels moyens permettent au contrôleur de vérifier la position d’un avion au sol ?","type":"multi","options":["La vue directe","Le radar sol","Le strip","La radio : demander sa position","L’ATIS"],"answer":[0,1,2,3],"notion":"Vérifier une position"},{"t":"Qu’est-ce qu’une image mentale, en conscience de la situation ?","type":"open","expected":"La représentation que l’on se fait de la situation ; elle guide ce que l’on perçoit et ce que l’on attend, et peut rester fausse malgré des indices","notion":"Image mentale"},{"t":"« Sur une fréquence où l’on parle deux langues, chaque équipage connaît la situation de tous les avions. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Langue commune"},{"t":"« Une information écrite sur un strip transmis suffit : la dire n’apporte rien. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Information écrite et information dite"},{"t":"Depuis votre prise de service, aucun avion n’est parti d’une bretelle intermédiaire. Cela rend un tel départ :","type":"single","options":["Impossible","Plus probable","Plus difficile à envisager, donc à vérifier"],"answer":2,"notion":"Routine et biais d’attente"}],"q7":"« Je me sens capable de vérifier la position d’un avion même quand je crois la connaître. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les choix étaient difficiles : aucune option n’était évidente.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de position ressemblait à un vrai dossier.","La durée était adaptée."],"yn":["Connaissiez-vous l’événement réel avant la séance ?"],"choice":[{"t":"À quel moment avez-vous reconnu l’événement réel ?","options":["Dès le dossier de position","À la décision 2 (le strip)","À la décision 3 (le décollage)","À la décision 4 (l’alignement)","Je ne l’ai pas reconnu"]}],"open":["Quel choix vous a paru le plus difficile, et pourquoi ?","Qu’est-ce qui vous a semblé irréaliste ou confus ?"],"application":"À votre prochaine prise de position, quelle information demanderez-vous de vive voix ?"},"criteria":{"traps":[3,13],"fin_max":70,"fin1":null,"extra":[["Reconnaissance de l'événement (avis)","comparer les choix de ceux qui l'ont reconnu avant la décision 3 et des autres"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un contrôleur d'aérodrome","aucune réserve technique majeure"]]},"pressureLimit":60,"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\">Comprendre comment un contrôleur expérimenté autorise un décollage sur une piste où un autre avion s’aligne : l’image mentale, la routine, la coordination, la phrase et la langue. Trois règles : faire parler avant d’expliquer ; analyser des décisions, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Tour de table rapide, avant toute explication. Afficher les réactions saisies au tableau de bord.<\/div><div class=\"l\">Demander<\/div><div>« En un mot : qu’avez-vous ressenti à la fin ? » puis « Où était le cargo, dans votre tête, au moment du décollage ? »<\/div><div class=\"l\">Repère<\/div><div>Faire dire l’image mentale avant de montrer la réalité : c’est l’objet de la séance.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Les choix du groupe<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Projeter la répartition des choix et des fins, puis l’avis « À quel moment avez-vous reconnu l’événement réel ? »<\/div><div class=\"l\">Demander<\/div><div>« Qui a lu le 12 entouré sur la carte, et l’a quand même rangé ? Pourquoi ? »<\/div><div class=\"l\">Repère<\/div><div>Le joueur a lu l’information ; le contrôleur dans le jeu, absorbé par le biréacteur, ne l’a pas intégrée. C’est la différence entre voir et comprendre.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:07<small>5 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter la nuit à partir de la chronologie de la fiche mémo, sans la lire : tours regroupées, chantier, biréacteur en panne, strip transmis sans un mot, autorisation en français, « number two » en anglais cinq secondes plus tard.<\/div><div class=\"l\">Dire<\/div><div>Le contrôleur réel était un instructeur expérimenté. Le rapport décrit une image mentale cohérente et fausse, que rien dans l’organisation ne venait corriger.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:12<small>6 min<\/small><\/div><div><h3>L’image mentale et ce qui la corrige<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Reprendre les moyens de vérifier la position : strip, vue, radar, radio. Pour chacun, pourquoi il n’a pas servi cette nuit-là.<\/div><div class=\"l\">Demander<\/div><div>« Combien de temps faut-il, chez nous, pour qu’une routine devienne une certitude ? » · « Qui peut corriger votre image quand vous êtes seul à tenir la piste ? »<\/div><div class=\"l\">Repère<\/div><div>Les trois niveaux de la conscience de la situation (Endsley) : percevoir, comprendre, anticiper. Ici, l’information était perçue (le strip), pas comprise.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:18<small>4 min<\/small><\/div><div><h3>La phrase et la langue<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Comparer les trois clairances d’alignement du jeu, puis les deux langues de la fréquence.<\/div><div class=\"l\">Demander<\/div><div>« Quelle clairance reste juste si votre image est fausse ? » · « Que savait l’équipage britannique de l’avion qui décollait ? »<\/div><div class=\"l\">Repère<\/div><div>Une bonne clairance protège aussi contre vos propres erreurs.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:22<small>4 min<\/small><\/div><div><h3>Ce qu’a relevé l’enquête<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter les domaines de recommandation et les pratiques étrangères de la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Laquelle existe chez nous ? Laquelle manque ? Qui la porterait ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:26<small>2 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler quatre distinctions : rang et condition · information écrite et information dite · séquence et position · percevoir et comprendre.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir. Distribuer ou projeter la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« À votre prochaine prise de position, quelle information demanderez-vous de vive voix ? » Puis tour de table.<\/div><\/div><\/div><\/div><div class=\"box tint small\">Si des pilotes jouent ce scénario : leur faire jouer ensuite la question inverse. Qu’aurait pu faire l’équipage du cargo ? (Confirmer sa position, demander qui est le numéro un.) <\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · le cas réel<\/div><h1>Le cas réel<\/h1>\n<p class=\"lead\">25 mai 2000, Paris-Charles-de-Gaulle, 2 h 52 heure locale. Collision sur la piste 27 entre un MD-83 au décollage et un Shorts 330 qui s’alignait depuis une bretelle intermédiaire. Rapport d’enquête du BEA.<\/p>\n<div class=\"tl\"><div class=\"ev\"><span class=\"h\">Soirée<\/span><span>Les deux tours de Paris-Charles-de-Gaulle sont regroupées à la tour nord. Vols supplémentaires après la finale de la Ligue des champions disputée la veille au Stade de France. Travaux et éclairage de chantier près du seuil 27 ; pluie.<\/span><\/div><div class=\"ev\"><span class=\"h\">Position LOC<\/span><span>Tenue par un contrôleur instructeur de l’ENAC, au sixième jour d’une période de maintien de qualification de deux semaines, en fin de période de contrôle. Aucun départ d’une bretelle intermédiaire depuis sa prise de service.<\/span><\/div><div class=\"ev\"><span class=\"h\">Le MD-83<\/span><span>Air Liberté 8807, 151 passagers et 6 membres d’équipage, vers Madrid. Après un problème technique, il revient vers le seuil 27 ; son strip est raturé (piste et départ).<\/span><\/div><div class=\"ev\"><span class=\"h\">Le Shorts 330<\/span><span>Streamline 200, cargo vers Luton, deux pilotes. À sa demande, le contrôleur sol lui accorde la bretelle 16, une sortie rapide qui rejoint la piste à angle aigu. Il le note sur le strip, transmis sans mention verbale.<\/span><\/div><div class=\"ev\"><span class=\"h\">0 h 50 min 52 s UTC<\/span><span>Le MD-83 est autorisé à décoller, en français.<\/span><\/div><div class=\"ev\"><span class=\"h\">0 h 50 min 57 s UTC<\/span><span>Le Shorts reçoit, en anglais : « line up runway 27 and wait, number two ». Le contrôleur le croit au seuil, derrière le MD-83.<\/span><\/div><div class=\"ev\"><span class=\"h\">Vers 0 h 52 UTC<\/span><span>Le Shorts, qui cherche le numéro un devant lui, s’avance sur la piste. Son équipage voit les feux du MD-83 au dernier moment et freine. À environ 155 kt, l’aile gauche du MD-83 frappe le poste du Shorts. Le copilote du Shorts est tué, le commandant grièvement blessé. Le MD-83 interrompt son décollage ; personne n’y est blessé.<\/span><\/div><\/div>\n<p class=\"small\">Chronologie d’après le rapport du BEA. Dans le jeu, la piste 27 devient la 26 et la bretelle 16 devient la 12.<\/p>"},{"id":"barrieres","label":"Les barrières","html":"<div class=\"kicker\">Fiche mémo · les barrières<\/div><h1>Une image cohérente et fausse<\/h1>\n<p class=\"lead\">Lecture par barrières, à la manière du modèle de Reason. Le rapport retient l’erreur de représentation du contrôleur (il croyait le Shorts derrière le MD-83) et ce qui l’a empêchée d’être corrigée.<\/p>\n<table><tr><th>Barrière<\/th><th>Ce qui s'est passé<\/th><th>État<\/th><\/tr><tr><td><b>Organisation de la nuit<\/b><\/td><td>Tours regroupées, strips passés par un tiers, pas de briefing d’équipe.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Coordination SOL-LOC<\/b><\/td><td>Départ de la bretelle 16 noté sur le strip, sans mention verbale.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Strip<\/b><\/td><td>Information présente (16 entouré), non exploitée ; attention prise par le strip raturé du MD-83.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Vue directe<\/b><\/td><td>Nuit, pluie, éclairage de chantier.<\/td><td>Inopérante<\/td><\/tr><tr><td><b>Radar sol<\/b><\/td><td>Image encombrée et brouillée au LOC ; écran plus lisible réservé au SOL.<\/td><td>Inopérante<\/td><\/tr><tr><td><b>Radio<\/b><\/td><td>Non utilisée pour confirmer la position du Shorts.<\/td><td>Non utilisée<\/td><\/tr><tr><td><b>Langue<\/b><\/td><td>Autorisation de décollage en français, incomprise de l’équipage britannique.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Phraséologie<\/b><\/td><td>« Number two » sans trafic nommé ni point d’entrée ; jugée incorrecte par le rapport.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Vue des équipages<\/b><\/td><td>Bretelle à angle aigu : seuil dans le dos du Shorts ; contact visuel trop tardif des deux côtés.<\/td><td>Inopérante<\/td><\/tr><tr><td><b>Maintien de qualification<\/b><\/td><td>Périodes discontinues ; pas de procédure de reprise de fonctions pour les instructeurs.<\/td><td>Manquante (système)<\/td><\/tr><\/table>"},{"id":"image","label":"L’image mentale","html":"<div class=\"kicker\">Fiche mémo · conscience de la situation<\/div><h1>Percevoir, comprendre, anticiper<\/h1>\n<div class=\"cols\"><div><h2>Les trois niveaux (Endsley)<\/h2><ul>\n<li>Percevoir : le strip portait le 16 entouré ; le radar et la vue ne montraient rien d’exploitable.<\/li>\n<li>Comprendre : l’information n’a pas été intégrée. L’image restait « tous les départs au seuil ».<\/li>\n<li>Anticiper : « number two » supposait le Shorts derrière ; l’équipage, lui, cherchait un numéro un devant.<\/li><\/ul><\/div>\n<div><h2>Ce qui fabrique l'image<\/h2><ul>\n<li>La routine : des heures de départs au seuil, aucun départ intermédiaire depuis la prise de service.<\/li>\n<li>L’attention captée : le strip raturé du MD-83.<\/li>\n<li>L’information écrite non dite : un strip transmis « à l’écoute ».<\/li>\n<li>Les moyens dégradés : nuit, pluie, chantier, radar brouillé.<\/li><\/ul><\/div><\/div>\n<div class=\"box tint\"><p style=\"margin:0\">Une image mentale fausse est rarement absurde : elle est cohérente avec tout ce que l’on attend. C’est pour cela qu’on ne la corrige qu’avec des vérifications prévues, et pas au hasard d’un indice.<\/p><\/div>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · à retenir<\/div><h1>Cinq éléments à retenir<\/h1><div class=\"keep\"><span class=\"n\">1<\/span><div><b>Une routine est une image, pas une information<\/b><br>Des heures de départs au seuil ne disent rien du prochain départ.<\/div><\/div><div class=\"keep\"><span class=\"n\">2<\/span><div><b>Ce qui sort de la routine se dit<\/b><br>Une bretelle intermédiaire, une piste changée : de vive voix, pas seulement au crayon.<\/div><\/div><div class=\"keep\"><span class=\"n\">3<\/span><div><b>Une clairance doit rester juste si votre image est fausse<\/b><br>Nommer le trafic et la condition, et le point d’entrée.<\/div><\/div><div class=\"keep\"><span class=\"n\">4<\/span><div><b>Une langue commune, une image commune<\/b><br>Un équipage qui ne comprend pas un message ignore la situation qu’il décrit.<\/div><\/div><div class=\"keep\"><span class=\"n\">5<\/span><div><b>Reprendre une position, c’est se mettre d’accord<\/b><br>Un point d’équipe à chaque configuration inhabituelle.<\/div><\/div>"},{"id":"reco","label":"Ce qu’a relevé l’enquête","html":"<div class=\"kicker\">Fiche mémo · recommandations<\/div><h1>Ce qu'a relevé l'enquête<\/h1>\n<p class=\"lead\">Le rapport du BEA regroupe ses recommandations en cinq domaines. Pour chacun, ce que son analyse met en cause ; formulations résumées, à compléter par la lecture du rapport.<\/p>\n<table class=\"rec\"><tr><td>Occupation des pistes<\/td><td>Encadrer les alignements multiples et les départs de bretelles intermédiaires, en particulier de nuit.<\/td><\/tr><tr><td>Organisation du contrôle<\/td><td>Coordination entre positions sol et local, briefing d’équipe, rôle des personnes qui assistent un contrôleur, accès aux moyens radar.<\/td><\/tr><tr><td>Perception des informations visuelles et radio<\/td><td>Langue des communications, moyens de connaître la position des avions au sol.<\/td><\/tr><tr><td>Reprise de fonctions<\/td><td>Procédures de reprise pour les contrôleurs qui maintiennent leur qualification par périodes discontinues.<\/td><\/tr><tr><td>Retour d’expérience<\/td><td>Exploiter les événements précurseurs.<\/td><\/tr><\/table>\n<h2>Pratiques relevées ailleurs par l'enquête<\/h2><table class=\"cast\"><tr><td>Londres Heathrow<\/td><td>Tout alignement derrière un autre avion fait l’objet d’une clairance conditionnelle. Coordination sol-local obligatoire pour un départ d’une bretelle intermédiaire.<\/td><\/tr><tr><td>Amsterdam<\/td><td>Mention conditionnelle « behind + type » quel que soit le point d’entrée. Le contrôleur local ne peut être assisté que par un autre contrôleur qualifié.<\/td><\/tr><tr><td>Francfort, Amsterdam<\/td><td>Toutes les communications se font en anglais.<\/td><\/tr><\/table>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · glossaire<\/div><h1>Les mots du scénario<\/h1><div class=\"gl\"><h3>Contrôle<\/h3><div class=\"e\"><b>LOC.<\/b> Position de contrôle local : la piste, les décollages et les atterrissages.<\/div><div class=\"e\"><b>SOL.<\/b> Position de contrôle sol : le roulage jusqu’au point d’arrêt.<\/div><div class=\"e\"><b>Strip.<\/b> Bande de progression de vol : support papier des informations d’un vol, transmis d’une position à l’autre.<\/div><div class=\"e\"><b>Bretelle intermédiaire.<\/b> Accès à la piste entre le seuil et l’extrémité ; souvent une sortie rapide pour les atterrissages.<\/div><div class=\"e\"><b>Clairance conditionnelle.<\/b> Autorisation soumise à une condition qui nomme un trafic : « derrière le … qui décolle, alignez-vous et attendez derrière ».<\/div><div class=\"e\"><b>Alignement multiple.<\/b> Plusieurs avions alignés ou autorisés à s’aligner sur la même piste.<\/div><div class=\"e\"><b>Maintien de qualification.<\/b> Pratique minimale exigée pour garder le droit de contrôler sur un terrain.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>Conscience de la situation.<\/b> Percevoir, comprendre, anticiper (Endsley).<\/div><div class=\"e\"><b>Image mentale.<\/b> Représentation de la situation qui guide ce que l’on perçoit et ce que l’on attend.<\/div><div class=\"e\"><b>Biais d’attente.<\/b> Tendance à percevoir ce que l’on s’attend à percevoir.<\/div><div class=\"e\"><b>TRM.<\/b> Gestion des ressources de l’équipe : l’équivalent du CRM pour le contrôle aérien.<\/div><\/div><h2>Sources<\/h2><div class=\"src\">\n<p>BEA, rapport sur l’accident survenu le 25 mai 2000 sur l’aérodrome de Paris-Charles-de-Gaulle (MD-83 F-GHED et Shorts 330 G-SSWN) : <a href=\"https://www.bea.aero/fileadmin/documents/docspa/2000/f-ed000525/pdf/f-ed000525.pdf\">bea.aero<\/a> ; version anglaise : <a href=\"https://www.bea.aero/fileadmin/documents/docspa/2000/f-ed000525a/pdf/f-ed000525a.pdf\">bea.aero<\/a>.<\/p>\n<p class=\"small\">Les enquêtes du BEA visent l’amélioration de la sécurité, non la recherche de responsabilités. Ce scénario utilise le rapport dans ce seul but ; aéroport, compagnies et indicatifs du jeu sont transposés.<\/p><\/div>"}]}},{"id":"s7","num":7,"version":"S7 v1","duration":"15 à 20 min","title":"Cinq véhicules","short":"Cinq véhicules","public":"Loadmasters, équipes de chargement et équipages cargo","role":"Loadmaster d’un quadriréacteur cargo affrété","pitch":"Un vol cargo affrété, cinq véhicules blindés, une escale de ravitaillement. Quatre décisions, du chargement à la signature.","dossierName":"Dossier de chargement","pileLabel":"Votre rotation","ambient":"jet","hideTokens":true,"compLabel":"Facteurs","lamp":{"label":"ARRIMAGE","colors":{"16":"green","8":"amber","19":"amber","5":"red"}},"resources":[],"costRes":null,"costIcon":null,"costName":"","tokens":{"CALCUL":"Vous avez calculé la retenue avec les données du constructeur : vous savez que la méthode du manuel ne suffit pas.","CONSTAT":"Vous avez mesuré le déplacement en vol et donné au commandant des faits précis.","REPRISE":"À l’escale, le chargement a été repris selon les données du constructeur.","RENFORT":"À l’escale, deux sangles ont été ajoutées sur le véhicule arrière."},"tokenIcons":{"CALCUL":"doc","CONSTAT":"search","REPRISE":"gauge","RENFORT":"gauge"},"start":1,"decisions":{"1":{"idx":1,"title":"La méthode","front":[{"t":"Base avancée, fin de matinée. Cinq véhicules blindés attendent au pied de l’avion : deux de 12 t, trois de 18 t. L’équipe au sol, une société du groupe, les monte sur des palettes flottantes, en position centrale, calées sur bois."},{"t":"Le chef d’équipe vous dit qu’ils n’ont jamais chargé les véhicules de 18 t, et qu’ils n’ont pas votre manuel sur place. Il attend vos consignes : combien de sangles, et où."},{"t":"Le manuel de la compagnie a un chapitre « charges spéciales ». Les manuels du constructeur de l’avion et du système de chargement sont dans votre sac."}],"notes":[],"tail":"","question":"Comment définissez-vous l’arrimage ?","options":[{"to":4,"text":"L’équipe arrime comme elle le fait pour les véhicules de 12 t depuis des mois. Vous vérifiez ensuite que tout est bien tendu.","cost":0,"cls":"C","short":"Leur méthode habituelle"},{"to":7,"text":"Vous sortez les manuels du constructeur et calculez la retenue : charges admissibles des points d’attache, angles des sangles, directions. Quitte à retarder le chargement.","cost":0,"cls":"A","short":"Calculer avec les données du constructeur"},{"to":12,"text":"Vous appliquez le chapitre « charges spéciales » du manuel de la compagnie, accepté par l’autorité : 24 sangles par véhicule de 12 t, 26 par véhicule de 18 t.","cost":0,"cls":"B","short":"Le manuel de la compagnie"}],"enter":[],"auto":[4,12],"key":{"tabs":["constructeur","manuel"],"tab":"constructeur","mark":"d1","note":"Données du constructeur : un seul véhicule de 12 t peut être retenu sur palette flottante, avec une soixantaine de sangles ; les véhicules de 18 t, aucun. Le manuel de la compagnie ne contient pas de quoi le savoir."}},"9":{"idx":2,"title":"En vol","front":[{"t":"Premier tronçon, vers la base de ravitaillement. En croisière, le copilote passe la tête dans le pont principal, revient et annonce : « Il y a une sangle cassée. Et toutes les sangles qui retiennent vers l’arrière sont lâches. »"},{"t":"Le commandant, à l’interphone : « Ça a bougé de combien ? »"}],"notes":[{"if":"has:CALCUL","head":"Vos calculs","text":"Selon le constructeur, un seul véhicule de 12 t peut voyager sur palette flottante en position centrale, avec une soixantaine de sangles. Les véhicules de 18 t, aucun."},{"if":"not:CALCUL","head":"Vous","text":"En service depuis bientôt quinze heures."}],"tail":"","question":"Que répondez-vous, et que faites-vous ?","options":[{"to":15,"text":"Vous allez voir avec une lampe : vous mesurez le déplacement de chaque véhicule, relevez les sangles lâches et cassées, puis vous donnez au commandant les chiffres, et ce qu’ils signifient : la retenue a cédé.","cost":0,"cls":"A","short":"Mesurer et donner des faits"},{"to":3,"text":"« Quelques centimètres. Ça bouge toujours un peu, ce genre de charge. On resserrera à l’escale. »","cost":0,"cls":"B","short":"« Quelques centimètres »"},{"to":18,"text":"Vous resserrez seul, en vol, les sangles que vous pouvez atteindre, pour arriver à l’escale avec une charge propre.","cost":0,"cls":"C","short":"Resserrer en vol ce qui est accessible"}],"enter":[],"auto":[18,3],"key":{"tabs":["constructeur","rex"],"tab":"constructeur","mark":"d9","note":"Constructeur : une charge qui a bougé a dépassé sa retenue. Retour d’expérience : la rotation est le moment le plus sollicité vers l’arrière."}},"14":{"idx":3,"title":"L’escale","front":[{"t":"Base de ravitaillement : une heure et demie au sol, plein de carburant, aucun chargement. L’équipe au sol monte à la porte cargo ; elle ne parle qu’à vous."},{"t":"Au poste, le commandant dit qu’il espère qu’on va renforcer l’arrimage, pas seulement remplacer la sangle cassée. Le copilote : « Ils sont en train de tout resserrer. »"}],"notes":[{"if":"has:CONSTAT","head":"Vos relevés","text":"Le véhicule arrière a reculé de plusieurs centimètres ; toutes les sangles arrière étaient lâches."},{"if":"has:CALCUL","head":"Vos calculs","text":"Avec les données du constructeur, ce chargement ne peut pas être retenu tel qu’il est."}],"tail":"","question":"Que faites-vous du chargement ?","options":[{"to":20,"text":"Vous faites tout reprendre selon les données du constructeur, quitte à retarder le vol et à laisser des véhicules au sol.","cost":0,"cls":"A","short":"Tout reprendre selon le constructeur"},{"to":2,"text":"On resserre toutes les sangles et on remplace la sangle cassée. La charge est de nouveau tendue.","cost":0,"cls":"B","short":"Resserrer et remplacer la sangle"},{"to":11,"text":"On resserre tout, on remplace la sangle cassée, et on ajoute deux sangles sur le véhicule arrière, celui qui a le plus bougé.","cost":0,"cls":"C","short":"Ajouter deux sangles à l’arrière"}],"enter":[],"auto":[11,2],"key":{"tabs":["constructeur"],"tab":"constructeur","mark":"d14","note":"Constructeur : le nombre de sangles se calcule direction par direction. Resserrer ou ajouter deux sangles ne change pas l’ordre de grandeur : il en faudrait une soixantaine pour un seul véhicule de 12 t."}},"6":{"idx":4,"title":"La porte","front":[{"t":"Le plein est fait. Le commandant passe la tête dans le pont principal : « C’est bon derrière ? On a un créneau. »"},{"t":"Il vous reste à signer la feuille de chargement. Vous êtes en service depuis plus de vingt heures."}],"notes":[{"if":"has:REPRISE","head":"Chargement","text":"Le chargement a été repris selon le constructeur."},{"if":"not:REPRISE","head":"Chargement","text":"Les sangles sont tendues. Rien d’autre n’a changé depuis la base avancée."}],"tail":"","question":"Que répondez-vous au commandant ?","options":[{"to":13,"text":"« C’est resserré, ça devrait tenir. » Vous signez.","cost":0,"cls":"B","short":"« C’est resserré, ça devrait tenir »"},{"to":17,"text":"Vous signez la feuille de chargement et lui laissez la décision : c’est lui le commandant.","cost":0,"cls":"C","short":"Signer : la décision est au commandant"},{"to":10,"text":"« Je ne signe pas tant que la retenue n’est pas vérifiée selon les données du constructeur. La charge a bougé au premier vol. »","cost":0,"cls":"A","short":"« Je ne signe pas »"}],"enter":[],"auto":[17,13],"key":{"tabs":["rotation","rex"],"tab":"rotation","mark":"d6","note":"Votre rotation : plus de vingt heures de service, sans limite pour votre fonction. Retour d’expérience : une charge qui recule à la rotation atteint l’empennage."}}},"suites":{"7":{"front":[{"t":"Une heure de calcul sur le capot d’un véhicule. Les manuels du constructeur imposent ce que le manuel de la compagnie ne dit pas : la charge admissible de chaque point d’attache, l’effet de l’angle des sangles, une direction de travail par point."},{"t":"Résultat : un seul véhicule de 12 t peut voyager sur palette flottante, avec une soixantaine de sangles. Aucun véhicule de 18 t."},{"t":"Vous appelez les opérations. Réponse : « Le manuel est accepté par l’autorité, on l’applique depuis des mois. Chargez. » L’équipe arrime selon le manuel. Vous gardez vos calculs."}],"changes":[{"tok":"CALCUL"}],"go":9,"debrief":[["Pourquoi c’était coûteux","Une heure de retard, des opérations agacées, et l’air de mettre en doute un manuel accepté par l’autorité."],["Ce qui protège","Les données approuvées du constructeur. Le rapport établit que le manuel de la compagnie omettait des informations de retenue essentielles et contenait des méthodes fausses ; une étude a montré que la cargaison du vol ne pouvait pas être retenue en sécurité."],["La limite","Savoir ne suffit pas : il faut encore que quelqu’un vous écoute, ou que vous refusiez. Cette nuit-là, la cause était dans l’organisation, pas dans le loadmaster."]],"comp":"Données approuvées · Normes"},"12":{"front":[{"t":"L’équipe pose 24 sangles par véhicule de 12 t, 26 par véhicule de 18 t, accrochées aux rails de sièges et aux points de structure, sans verrous de plancher. Vous vérifiez la tension de chaque sangle."},{"t":"La feuille de chargement est conforme au manuel de la compagnie."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","Un manuel accepté par l’autorité, appliqué depuis des mois sans incident, et qui prévoit précisément ce cas. C’est ce qu’a fait le loadmaster réel."],["Le piège","Le manuel était incomplet et faux : ni charges admissibles par point d’attache, ni effet de l’angle des sangles, ni règle de direction. Des mois sans incident ne valident pas une méthode : le véhicule de 18 t n’avait encore jamais voyagé ainsi."],["Ce qui protège","Quand une charge sort de l’ordinaire, revenir aux données du constructeur. Et faire remonter l’écart, pour que le manuel soit corrigé."]],"comp":"Normes · Connaissances"},"4":{"front":[{"t":"L’équipe arrime comme d’habitude, vite et bien tendu. Vous faites le tour : les sangles sonnent comme des cordes de guitare."},{"t":"Personne n’a compté les sangles par direction, ni regardé les angles."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","L’équipe a l’habitude, vous avez confiance, et une sangle bien tendue rassure."],["Le piège","La tension ne dit rien de la résistance : un point d’attache sollicité dans la mauvaise direction, ou une sangle trop inclinée, cède bien avant sa charge nominale. Et l’équipe n’avait ni procédure pour ces véhicules ni le manuel."],["Ce qui protège","Une méthode écrite, issue des données du constructeur, et un contrôle par celui qui en a la responsabilité."]],"comp":"Normes · Supervision"},"15":{"front":[{"t":"Lampe en main, mètre ruban. Le véhicule arrière a reculé de plusieurs centimètres ; toutes les sangles arrière sont lâches, une est rompue."},{"t":"À l’interphone : « Le véhicule arrière a reculé de plusieurs centimètres, toutes les sangles arrière ont lâché et une a cassé. Ça veut dire que la retenue vers l’arrière a cédé, pas seulement que ça s’est détendu. »"},{"t":"Un silence. Le commandant : « Bien reçu. On en reparle à l’escale. »"}],"changes":[{"tok":"CONSTAT"}],"go":14,"debrief":[["Pourquoi c’était coûteux","Inquiéter un équipage en vol, et reconnaître que votre chargement n’a pas tenu."],["Ce qui protège","Des faits mesurés et leur signification. Une charge qui bouge n’est pas « une charge qui se détend » : c’est une retenue insuffisante. Dans le cas réel, la réponse a été : quelques centimètres, et tout bouge si ce n’est pas arrimé."],["La limite","Un constat ne décide de rien : il donne au commandant de quoi décider."]],"comp":"Communication · Conscience de la situation"},"3":{"front":[{"t":"« Quelques centimètres. »"},{"t":"Le commandant : « Ça fait peur. » Vous : « Tout bouge, si ce n’est pas arrimé. On resserrera à l’escale. » Le vol continue."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Une charge lourde se tasse toujours un peu ; quelques centimètres, sur un tronçon court, c’est rassurant. C’est presque mot pour mot l’échange enregistré dans le cas réel."],["Le piège","La normalisation : un signal anormal (une sangle rompue, toutes les sangles arrière lâches) est ramené à du normal (« ça bouge toujours »). Le commandant avait dit son inquiétude ; la réponse l’a refermée."],["Ce qui protège","Mesurer, et dire ce que le signal signifie. « La retenue a cédé » n’appelle pas la même suite que « ça s’est détendu »."]],"comp":"Communication · Normes"},"18":{"front":[{"t":"Seul, dans le pont principal, vous resserrez ce que vous pouvez atteindre. Deux sangles arrière sont hors de portée, derrière un véhicule."},{"t":"À l’escale, la charge paraît propre. Au poste, on ne sait pas grand-chose de ce qui s’est passé derrière."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Agir tout de suite, ne pas laisser un problème en suspens, arriver avec une charge présentable."],["Le piège","Resserrer efface le signal : la charge a l’air propre, mais la retenue est la même que celle qui vient de céder. Et l’équipage n’a pas les faits."],["Ce qui protège","Garder la trace du signal (mesures, sangles rompues) et le transmettre, avant de le corriger."]],"comp":"Communication · Conscience de la situation"},"20":{"front":[{"t":"Vous annoncez au commandant : « Je reprends tout selon le constructeur. » Il appelle les opérations, qui protestent, puis cèdent devant vos chiffres et le premier vol."},{"t":"Trois heures plus tard, quatre véhicules sont restés au sol. Un seul véhicule de 12 t voyage, arrimé avec une soixantaine de sangles, chacune dans sa direction."}],"changes":[{"tok":"REPRISE"}],"go":6,"debrief":[["Pourquoi c’était coûteux","Un vol retardé de plusieurs heures, un client militaire mécontent, des véhicules laissés au sol, et une compagnie qui devra s’expliquer."],["Ce qui protège","Le premier vol avait montré que la retenue ne suffisait pas : resserrer remet la même retenue. Seule une reprise selon les données du constructeur change la capacité de retenue."],["En plus","L’écart remonte : le manuel de la compagnie devra être corrigé, pour les rotations suivantes."]],"comp":"Décision · Données approuvées"},"2":{"front":[{"t":"L’équipe resserre chaque sangle et remplace celle qui a cassé. Les sangles sonnent de nouveau."},{"t":"Rien n’a été ajouté. La retenue est celle qui a cédé au premier vol, retendue."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","La charge est de nouveau tendue, la sangle cassée est remplacée : visuellement, c’est réparé. C’est ce qui a été fait dans le cas réel."],["Le piège","Retendre ne change ni le nombre de sangles par direction, ni les points d’attache, ni les angles. La retenue qui a cédé une fois cédera encore, au moment le plus chargé : la rotation."],["Ce qui protège","Traiter la cause (la capacité de retenue), pas le symptôme (des sangles lâches)."]],"comp":"Normes · Décision"},"11":{"front":[{"t":"Resserrage complet, sangle cassée remplacée, et deux sangles de plus sur le véhicule arrière."},{"t":"Le commandant, rassuré : « Bien, on renforce. »"}],"changes":[{"tok":"RENFORT"}],"go":6,"debrief":[["Pourquoi c’était tentant","C’est exactement ce que le commandant espérait : renforcer, pas seulement remplacer. Deux sangles, là où ça a bougé."],["Le piège","Deux sangles là où il en faudrait des dizaines, sans calcul : on rassure, sans savoir ce qu’on a gagné. Et les véhicules de 18 t restent sur une méthode non admissible."],["Ce qui protège","Un renfort se calcule. Sans calcul, il donne surtout le sentiment d’avoir agi."]],"comp":"Décision · Normes"},"10":{"front":[{"t":"Le commandant vous regarde longtemps. « Combien de temps ? »"},{"t":"Vous refaites le tour, point par point, données du constructeur en main : la reprise est conforme. Vous signez, dix minutes plus tard.","if":"has:REPRISE"},{"t":"Vous montrez vos chiffres : le premier vol, les sangles, le constructeur. Il appelle les opérations et tranche : on reprend tout.","if":"not:REPRISE&has:CALCUL|not:REPRISE&has:CONSTAT"},{"t":"Vous n’avez que votre inquiétude et une charge qui a bougé. Il appelle les opérations, qui citent le manuel. Vous tenez bon. Le ton monte.","if":"not:CALCUL&not:REPRISE&not:CONSTAT"}],"changes":[],"goto":[{"if":"has:CALCUL|has:REPRISE|has:CONSTAT","to":16,"label":"Avec le jeton CALCUL, REPRISE ou CONSTAT"},{"to":8,"label":"Sinon"}],"debrief":[["Pourquoi c’était coûteux","Dire non à un commandant fatigué, pressé par un créneau, avec une compagnie et un client qui attendent. Le loadmaster est seul dans sa fonction."],["Ce qui protège","Une prise de parole qui énonce un fait, un risque et une proposition. Avec des faits (calcul, mesures), elle est entendue ; sans eux, elle tient au courage seul."],["La limite","Le rapport rappelle que le personnel de chargement n’avait ni certification, ni normes de formation, ni limites de temps de service. Son autorité reposait sur sa personne."]],"comp":"Assertivité · Communication"},"13":{"front":[{"t":"« C’est resserré, ça devrait tenir. » Vous signez. Le commandant hoche la tête et repart vers le poste."},{"t":"Mise en route, roulage. Piste 03."}],"changes":[],"goto":[{"if":"has:REPRISE","to":16,"label":"Avec le jeton REPRISE"},{"if":"has:RENFORT","to":19,"label":"Avec le jeton RENFORT"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","C’est ce que tout le monde veut entendre, et c’est peut-être vrai. Vous avez fait ce qu’on vous a appris."],["Le piège","« Ça devrait tenir » transmet une conviction, pas une information. Le commandant n’a rien pour en juger, et la question qu’il posait (« C’est bon ? ») appelait des faits."],["Ce qui protège","Répondre par ce qu’on sait et ce qu’on ne sait pas : « La charge a bougé au premier vol ; la retenue n’a pas changé. »"]],"comp":"Communication · Assertivité"},"17":{"front":[{"t":"Vous signez. « La décision est à vous, commandant. »"},{"t":"Il a vos relevés du premier vol en tête. Il hésite, puis : « Non. On ne part pas comme ça. »","if":"has:CONSTAT&not:REPRISE"},{"t":"Il regarde la feuille de chargement signée et repart vers le poste. Mise en route, roulage. Piste 03.","if":"not:CONSTAT|has:REPRISE"}],"changes":[],"goto":[{"if":"has:REPRISE","to":16,"label":"Avec le jeton REPRISE"},{"if":"has:CONSTAT","to":8,"label":"Avec le jeton CONSTAT"},{"if":"has:RENFORT","to":19,"label":"Avec le jeton RENFORT"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","C’est la hiérarchie normale : le loadmaster prépare, le commandant décide. Signer, c’est faire son travail ; décider, c’est le sien."],["Le piège","Votre signature dit au commandant que la charge est sûre. Lui laisser la décision sans les faits, c’est lui demander de décider à l’aveugle."],["Ce qui protège","Ne signer que ce que l’on peut garantir. Et si le commandant décide, qu’il décide avec vos faits."]],"comp":"Assertivité · Travail en équipe"}},"fins":{"16":{"n":1,"title":"Ce qui peut voyager","front":[{"t":"L’avion décolle plusieurs heures plus tard, avec ce qui peut être retenu selon le constructeur. Les autres véhicules attendront une solution adaptée."},{"t":"Le lendemain, vous rédigez un compte rendu : le chapitre « charges spéciales » du manuel ne correspond pas aux données du constructeur."}],"changes":[],"question":"Les opérations : « Des mois qu’on charge comme ça sans problème. » Que leur répondez-vous ?","back":"Vos faits ont fait cette fin : un calcul, des mesures, une reprise du chargement. Dans le cas réel, la méthode venait d’un manuel faux, que personne n’avait confronté aux données du constructeur ; le loadmaster l’appliquait.","sound":"takeoff"},"8":{"n":2,"title":"Au sol","front":[{"t":"Le vol ne part pas. Des heures de discussion avec les opérations, un commandant à bout de patience, un client furieux."},{"t":"Le lendemain, un spécialiste de la compagnie refait le calcul avec les données du constructeur : la cargaison ne pouvait pas être retenue ainsi. Le manuel est suspendu."}],"changes":[],"question":"Le chef des opérations vous reproche d’avoir bloqué un vol sans preuve. Que lui répondez-vous ?","back":"Votre refus a tenu, et il avait raison. Mais il reposait sur votre seule personne. Le rapport réel le souligne : le personnel de chargement n’avait ni certification ni cadre qui donne du poids à sa parole.","sound":"stop"},"19":{"n":3,"title":"La secousse","front":[{"t":"À la rotation, un choc sourd dans le pont principal : le véhicule arrière recule, arrache des sangles et s’arrête contre la cloison arrière, qu’il enfonce. Les deux sangles ajoutées ont tenu."},{"t":"Le commandant garde le contrôle, revient se poser. Personne n’est blessé."}],"changes":[],"question":"On vous félicite d’avoir ajouté deux sangles. Était-ce une bonne décision ?","back":"Deux sangles sans calcul vous ont sauvé, cette fois. Un précédent réel ressemble à cette fin : en 2008, chez un autre exploitant, une charge a reculé à la rotation et percé la cloison arrière ; l’avion s’est posé. Ce signal n’avait pas suffi à changer les pratiques.","sound":"landing"},"5":{"n":4,"title":"Rotation","front":[{"t":"Rotation. Le véhicule arrière rompt sa retenue et recule dans la queue de l’avion. Il traverse la cloison arrière, coupe des circuits hydrauliques et le vérin du plan horizontal."},{"t":"Le nez monte sans que l’équipage puisse le retenir. L’avion décroche à basse hauteur et s’écrase près de la piste. Les sept personnes à bord sont tuées."}],"changes":[],"question":"Le rapport retient une cause organisationnelle. Qu’est-ce que cela change, pour vous, dans la façon de regarder cette partie ?","back":"Vous avez rencontré l’issue réelle. Le loadmaster réel appliquait la méthode de son manuel, signalée par personne comme fausse ; il est mort avec l’équipage. Le débriefing va montrer où la chaîne pouvait être coupée, et par qui.","sound":"bigcrash"}},"dossier":[{"id":"rotation","label":"Votre rotation","html":"<div class=\"kicker\">Dossier de chargement · 1/5<\/div><h1>Votre rotation<\/h1>\n<p class=\"lead\">Quadriréacteur cargo gros porteur, vol affrété. Vous êtes le seul spécialiste du chargement à bord.<\/p>\n<div class=\"cols\"><div><h2>Itinéraire<\/h2><table class=\"cast\"><tr><td>Tronçon 1<\/td><td>Base en Europe vers la base avancée, à vide.<\/td><\/tr><tr><td>Base avancée<\/td><td>Chargement de cinq véhicules blindés, pour un contrat de transport militaire.<\/td><\/tr><tr><td>Tronçon 2<\/td><td>Base avancée vers une base de ravitaillement. Escale prévue : 1 h 30, carburant seulement.<\/td><\/tr><tr><td>Tronçon 3<\/td><td>Base de ravitaillement vers un aéroport du Golfe.<\/td><\/tr><\/table><\/div>\n<div><h2>À bord et au sol<\/h2><table class=\"cast\"><tr><td>Équipage<\/td><td>Quatre pilotes (équipage renforcé), vous, deux mécaniciens navigants.<\/td><\/tr><tr><td>Vous<\/td><td>Loadmaster de la compagnie : vous calculez la masse et le centrage, vous inspectez la cargaison, vous vous assurez qu’elle est arrimée avec les moyens fournis. Vous signez la feuille de chargement.<\/td><\/tr><tr><td>Équipe au sol<\/td><td>Société du même groupe. Elle charge et arrime sous votre contrôle.<\/td><\/tr><tr data-key=\"d6\"><td>Temps de service<\/td><td>Même planning que l’équipage. À l’arrivée au Golfe : plus de 24 heures. Aucune limite réglementaire de temps de service ne s’applique à votre fonction.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Compagnie, bases et avion transposés. Le scénario suit un événement réel présenté au débriefing.<\/p>"},{"id":"cargaison","label":"La cargaison","html":"<div class=\"kicker\">Dossier de chargement · 2/5<\/div><h1>La cargaison<\/h1>\n<table><tr><th>N°<\/th><th>Véhicule<\/th><th>Masse<\/th><th>Conditionnement<\/th><\/tr><tr><td class='num'>1, 2 et 3<\/td><td>Véhicule blindé lourd, de grande hauteur<\/td><td class='num'>18 t<\/td><td>Palette flottante, position centrale, calage bois<\/td><\/tr><tr><td class='num'>4 et 5<\/td><td>Véhicule blindé léger<\/td><td class='num'>12 t<\/td><td>Palette flottante, position centrale, calage bois<\/td><\/tr><\/table>\n<table class=\"cast\"><tr><td>Masse totale<\/td><td>Environ 94 t de cargaison.<\/td><\/tr><tr><td>Sangles<\/td><td>Sangles textiles de 5 000 lb (environ 2 270 kg) de charge de rupture.<\/td><\/tr><tr><td>Verrous de plancher<\/td><td>Non utilisés : palettes flottantes, retenues par les seules sangles.<\/td><\/tr><tr><td>Précédent<\/td><td>Les véhicules de 12 t ont déjà voyagé ainsi. Aucun exploitant de ce type d’avion n’avait encore accepté les véhicules de 18 t.<\/td><\/tr><\/table>\n<p class=\"small\">Ordre de chargement : du nez vers la queue, véhicule 5 en position arrière.<\/p>"},{"id":"manuel","label":"Manuel de la compagnie","html":"<div class=\"kicker\">Dossier de chargement · 3/5<\/div><h1>Manuel de la compagnie · charges spéciales<\/h1>\n<p class=\"lead\">Manuel d’exploitation cargo, chapitre 7. Accepté par l’autorité.<\/p>\n<table class=\"cast\"><tr><td>Charges spéciales<\/td><td>Véhicules et charges hors gabarit, sur palette flottante en position centrale.<\/td><\/tr><tr><td>Arrimage<\/td><td>Sangles de 5 000 lb. Minimum : 24 sangles pour un véhicule de 12 t ; 26 pour un véhicule de 18 t.<\/td><\/tr><tr><td>Points d’attache<\/td><td>Rails de sièges et points de structure du pont principal.<\/td><\/tr><tr><td>Contrôle<\/td><td>Le loadmaster vérifie la tension des sangles et signe la feuille de chargement.<\/td><\/tr><\/table>\n<div class=\"box tint\"><p style=\"margin:0\" data-key=\"d1\">Le chapitre ne donne ni la charge admissible de chaque point d’attache, ni l’effet de l’angle des sangles, ni le calcul du nombre de sangles par direction.<\/p><\/div>\n<p class=\"small\">Extrait reconstitué pour le jeu.<\/p>"},{"id":"constructeur","label":"Données du constructeur","html":"<div class=\"kicker\">Dossier de chargement · 4/5<\/div><h1>Données du constructeur<\/h1>\n<p class=\"lead\">Manuel de masse et centrage de l’avion et manuel du système de chargement du pont principal. Extraits.<\/p>\n<table class=\"cast\"><tr><td>Points d’attache<\/td><td>Chaque point a une charge admissible, et ne travaille que dans une seule direction. Un rail de sièges n’est pas un point de structure.<\/td><\/tr><tr><td>Angle des sangles<\/td><td>Plus la sangle est inclinée, moins elle retient dans l’axe : à 45°, environ 70 % de sa capacité.<\/td><\/tr><tr data-key=\"d14\"><td>Nombre de sangles<\/td><td>Se calcule direction par direction (avant, arrière, côtés, haut), à partir de la masse et des facteurs de retenue.<\/td><\/tr><tr data-key=\"d9\"><td>Charge déplacée<\/td><td>Une charge qui a bougé a dépassé sa retenue : la retendre ne rétablit pas une retenue suffisante.<\/td><\/tr><\/table>\n<h2>Application à votre cargaison<\/h2><table class=\"cast\"><tr data-key=\"d14\"><td>Véhicule de 12 t, palette flottante, position centrale<\/td><td>Environ 60 sangles. Un seul véhicule de ce type peut être retenu ainsi.<\/td><\/tr><tr data-key=\"d1\"><td>Véhicule de 18 t, palette flottante, position centrale<\/td><td>Non admissible.<\/td><\/tr><\/table>\n<p class=\"small\">Valeurs reconstituées pour le jeu, cohérentes avec l’étude citée par l’enquête.<\/p>"},{"id":"rex","label":"Retour d'expérience","html":"<div class=\"kicker\">Dossier de chargement · 5/5<\/div><h1>Retour d'expérience<\/h1>\n<p class=\"lead\">Note d’information sécurité, rubrique cargo.<\/p>\n<table class=\"cast\"><tr data-key=\"d9 d6\"><td>Événement<\/td><td>Quadriréacteur cargo d’un autre exploitant, 2008. À la rotation, une partie de la charge recule, perce la cloison arrière pressurisée et endommage la structure du vérin du plan horizontal. L’avion se pose.<\/td><\/tr><tr><td>Enseignement<\/td><td>La rotation est le moment où la retenue vers l’arrière est la plus sollicitée. Une charge qui recule atteint l’empennage, ses circuits et ses commandes.<\/td><\/tr><tr><td>Diffusion<\/td><td>Note d’information sécurité diffusée aux loadmasters. Lecture non suivie.<\/td><\/tr><\/table>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"6\" y=\"22\" width=\"30\" height=\"14\" rx=\"2\"/><circle cx=\"14\" cy=\"38\" r=\"3\"/><circle cx=\"28\" cy=\"38\" r=\"3\"/><path d=\"M36 26h6v10h-6\"/><path d=\"M4 22L14 10M38 22L28 10\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 26l26-10 8 2-6 4-26 8z\"/><path d=\"M18 22v6M24 20v6\"/><path d=\"M38 34l-4 4M42 30l-6 6\"/><\/svg>","14":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"8\" y=\"16\" width=\"26\" height=\"16\" rx=\"2\"/><path d=\"M8 24h26M21 16v16\"/><path d=\"M38 12v20M34 16h8\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"10\" y=\"6\" width=\"22\" height=\"34\" rx=\"2\"/><path d=\"M15 14h12M15 20h12M15 26h8\"/><path d=\"M28 34l12-12\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M10 28l24-10 6 1-4 5-22 8z\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 36h36\"/><rect x=\"12\" y=\"20\" width=\"24\" height=\"12\" rx=\"2\"/><path d=\"M24 8v6M20 12h8\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M10 28l24-10 6 1-4 5-22 8z\"/><path d=\"M14 16l-4-4M18 12l-2-6\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 40h40\"/><path d=\"M14 30l10-18 4 2-8 18z\"/><path d=\"M30 34l6 6M36 34l-6 6\"/><\/svg>"},"brief":"Vous êtes le loadmaster d’une compagnie cargo, à bord d’un quadriréacteur affrété. Lisez votre dossier de chargement comme avant chaque rotation.","eval":{"questions":[{"t":"Pour une charge qui sort de l’ordinaire, une méthode d’arrimage doit d’abord s’appuyer sur :","type":"single","options":["L’habitude des rotations précédentes","Les données approuvées du constructeur de l’avion et du système de chargement","L’avis de l’équipe au sol","Le nombre de sangles disponibles"],"answer":1,"notion":"Données approuvées"},{"t":"Qu’est-ce qui réduit la capacité de retenue d’une sangle ?","type":"multi","options":["Son angle par rapport à l’axe de la charge","Un point d’attache sollicité hors de sa direction","Une sangle détendue","Sa couleur","Un déplacement préalable de la charge"],"answer":[0,1,2,4],"notion":"Retenue et tension"},{"t":"Qu’appelle-t-on la normalisation de la déviance ?","type":"open","expected":"L’acceptation progressive d’un écart, qui devient normal parce qu’il n’a pas encore eu de conséquence","notion":"Normalisation de la déviance"},{"t":"« Un manuel accepté par l’autorité est forcément juste. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Manuel accepté et données approuvées"},{"t":"« Une charge qui a bougé en vol, puis a été resserrée, est de nouveau sûre. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Traiter la cause, pas le symptôme"},{"t":"Face à un commandant pressé, quelle formulation exprime le mieux un doute de sécurité ?","type":"single","options":["« Ça devrait tenir. »","« C’est vous qui voyez. »","« Je ne signe pas : la charge a bougé et la retenue n’est pas vérifiée. Il me faut une heure. »"],"answer":2,"notion":"Assertivité : fait, risque, proposition"}],"q7":"« Je me sens capable de refuser de signer un document de sécurité face à un équipage pressé. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les choix étaient difficiles : aucune option n’était évidente.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de chargement ressemblait à un vrai dossier.","La durée était adaptée."],"yn":["Connaissiez-vous l’événement réel avant la séance ?"],"choice":[{"t":"À quel moment avez-vous reconnu l’événement réel ?","options":["Dès le dossier de chargement","À la décision 2 (en vol)","À la décision 3 (l’escale)","À la fin","Je ne l’ai pas reconnu"]}],"open":["Quel choix vous a paru le plus difficile, et pourquoi ?","Qu’est-ce qui vous a semblé irréaliste ou confus ?"],"application":"Dans votre prochain chargement, quelle donnée irez-vous vérifier à la source ?"},"criteria":{"traps":[12,2],"fin_max":70,"fin1":null,"extra":[["Reconnaissance de l'événement (avis)","comparer les choix de ceux qui l'ont reconnu avant la décision 2 et des autres"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un loadmaster","aucune réserve technique majeure"]]},"pressureLimit":60,"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\">Comprendre comment une méthode d’arrimage fausse arrive jusqu’à la piste : le manuel, le signal du premier vol, l’escale, la parole du loadmaster. Trois règles : faire parler avant d’expliquer ; analyser des décisions, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Tour de table rapide, avant toute explication. Afficher les réactions saisies au tableau de bord.<\/div><div class=\"l\">Demander<\/div><div>« En un mot : qu’avez-vous ressenti à la fin ? » puis « À quel moment avez-vous senti que la charge était un problème ? »<\/div><div class=\"l\">Repère<\/div><div>La fin 4 est lourde : sept morts, dont le loadmaster. Laisser un temps de silence si besoin.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Les choix du groupe<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Projeter la répartition des choix et des fins, puis l’avis « À quel moment avez-vous reconnu l’événement réel ? »<\/div><div class=\"l\">Demander<\/div><div>« Qui a ouvert les données du constructeur avant la décision 1 ? Et le retour d’expérience ? »<\/div><div class=\"l\">Repère<\/div><div>La réponse était dans le dossier, page 4. La difficulté réelle était de la confronter au manuel de sa propre compagnie.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:07<small>5 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter la rotation à partir de la chronologie de la fiche mémo, sans la lire : le chargement, le premier vol, « quelques centimètres », l’escale, la rotation.<\/div><div class=\"l\">Dire<\/div><div>La cause probable retenue par le NTSB est organisationnelle : des procédures d’arrimage inadéquates, écrites par la compagnie. Le loadmaster les appliquait.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:12<small>6 min<\/small><\/div><div><h3>Le signal et sa normalisation<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Reprendre l’échange du premier vol, presque mot pour mot dans le jeu.<\/div><div class=\"l\">Demander<\/div><div>« Qu’aurait-il fallu dire pour que le commandant n’entende pas « tout va bien » ? » · « Chez nous, quel signal ramène-t-on au normal ? »<\/div><div class=\"l\">Repère<\/div><div>Normaliser un écart : le rendre acceptable parce qu’il n’a pas encore eu de conséquence (Vaughan).<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:18<small>4 min<\/small><\/div><div><h3>Dire non, seul<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Comparer les fins 1 et 2 : un refus avec des faits, un refus sans faits.<\/div><div class=\"l\">Demander<\/div><div>« Qu’est-ce qui donne du poids à la parole d’un spécialiste seul face à un équipage ? »<\/div><div class=\"l\">Repère<\/div><div>Fait, risque, proposition. Et une organisation qui donne un statut à cette parole.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:22<small>4 min<\/small><\/div><div><h3>Ce que recommande le NTSB<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter les recommandations de la fiche mémo : données approuvées pour l’arrimage des charges spéciales, certification du personnel de chargement, contrôle des manuels, formation des inspecteurs.<\/div><div class=\"l\">Demander<\/div><div>« Laquelle existe chez nous ? Laquelle manque ? Qui la porterait ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:26<small>2 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler quatre distinctions : tension et retenue · manuel accepté et données approuvées · resserrer et reprendre · conviction et information.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir. Distribuer ou projeter la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Dans votre prochain chargement, quelle donnée irez-vous vérifier à la source ? » Puis tour de table.<\/div><\/div><\/div><\/div><div class=\"box tint small\">Ce scénario met le joueur à la place d’une personne morte dans l’accident. Le débriefing ne juge pas le loadmaster réel : il montre comment une organisation a placé une méthode fausse entre ses mains.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · le cas réel<\/div><h1>Le cas réel<\/h1>\n<p class=\"lead\">29 avril 2013, base aérienne de Bagram (Afghanistan), Boeing 747-400 cargo de National Airlines, vol 102. Rapport d’enquête : NTSB AAR-15/01.<\/p>\n<div class=\"tl\"><div class=\"ev\"><span class=\"h\">La rotation<\/span><span>Vol cargo affrété pour le transport militaire américain : Châteauroux, Camp Bastion, Bagram, puis Dubaï. Équipage renforcé de quatre pilotes, un loadmaster, deux mécaniciens.<\/span><\/div><div class=\"ev\"><span class=\"h\">Camp Bastion<\/span><span>L’équipe au sol d’une société du groupe charge cinq véhicules blindés MRAP : deux de 12 t, trois de 18 t, sur palettes flottantes en position centrale, sans verrous de plancher. 24 sangles par véhicule de 12 t, 26 par véhicule de 18 t. Aucun exploitant de 747 n’avait encore accepté le véhicule de 18 t ; l’équipe au sol n’avait ni procédure pour lui, ni le manuel de la compagnie.<\/span><\/div><div class=\"ev\"><span class=\"h\">Vers Bagram<\/span><span>La charge bouge ; des sangles se détendent, une se rompt. Le copilote signale que toutes les sangles retenant vers l’arrière sont lâches. Le commandant demande de combien la charge a bougé : « quelques pouces », répond le loadmaster ; « ça fait peur », dit le commandant ; tout bouge si ce n’est pas arrimé, répond le loadmaster.<\/span><\/div><div class=\"ev\"><span class=\"h\">Bagram, environ 1 h 30<\/span><span>Ravitaillement, aucun chargement. Les sangles sont resserrées et la sangle rompue remplacée. Le commandant espère qu’on renforce l’arrimage. L’enregistreur ne montre pas que des sangles ont été ajoutées. L’équipe au sol ne parle qu’au loadmaster, à la porte cargo.<\/span><\/div><div class=\"ev\"><span class=\"h\">15 h 26<\/span><span>Rotation, piste 03. Le véhicule de 12 t arrière rompt sa retenue et recule. Il met hors service les enregistreurs, traverse la cloison arrière pressurisée, endommage les circuits hydrauliques 1 et 2 et sectionne le vérin du plan horizontal.<\/span><\/div><div class=\"ev\"><span class=\"h\">Quelques secondes plus tard<\/span><span>Montée à très forte assiette, décrochage sous 1 000 ft, impact près de la piste. Les sept personnes à bord sont tuées. Le commandant, et avec lui le loadmaster, était en service depuis environ 21 heures.<\/span><\/div><\/div>\n<p class=\"small\">Chronologie d’après le rapport NTSB et la synthèse de la FAA. Heures locales. L’enquête n’a trouvé aucun indice d’acte hostile.<\/p>"},{"id":"barrieres","label":"Les barrières","html":"<div class=\"kicker\">Fiche mémo · les barrières<\/div><h1>Une méthode fausse jusqu'à la piste<\/h1>\n<p class=\"lead\">Lecture par barrières, à la manière du modèle de Reason. Cause probable retenue par le NTSB : les procédures inadéquates de la compagnie pour l’arrimage des charges spéciales. Facteur contributif : la surveillance insuffisante de l’autorité.<\/p>\n<table><tr><th>Barrière<\/th><th>Ce qui s'est passé<\/th><th>État<\/th><\/tr><tr><td><b>Manuel de la compagnie<\/b><\/td><td>Incomplet et faux : ni charges admissibles, ni angles, ni directions, méthodes dangereuses.<\/td><td>A cédé (système)<\/td><\/tr><tr><td><b>Données du constructeur<\/b><\/td><td>Existantes, non reprises dans le manuel ni utilisées sur place.<\/td><td>Non utilisées<\/td><\/tr><tr><td><b>Équipe au sol<\/b><\/td><td>Sans procédure pour le véhicule de 18 t, sans le manuel sur place.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Statut du personnel de chargement<\/b><\/td><td>Ni certification, ni normes de formation, ni limites de temps de service.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Signal du premier vol<\/b><\/td><td>Charge déplacée, sangles lâches, une rompue : ramené à « quelques pouces ».<\/td><td>Normalisé<\/td><\/tr><tr><td><b>Escale<\/b><\/td><td>Resserrage et remplacement de la sangle rompue : même retenue.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Communication équipage-loadmaster<\/b><\/td><td>Inquiétude du commandant exprimée, puis refermée.<\/td><td>Partielle<\/td><\/tr><tr><td><b>Surveillance de l’autorité<\/b><\/td><td>Pas d’analyse de risque sur les charges lourdes ; inspections en route reportées, faute de moyens.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Retour d’expérience<\/b><\/td><td>Précédent de 2008 (charge reculée à la rotation, avion posé) sans effet sur les pratiques.<\/td><td>Non exploité<\/td><\/tr><\/table>"},{"id":"norm","label":"La normalisation","html":"<div class=\"kicker\">Fiche mémo · la normalisation<\/div><h1>« Tout bouge, si ce n'est pas arrimé »<\/h1>\n<div class=\"cols\"><div><h2>Le mécanisme<\/h2><ul>\n<li>Un écart apparaît : une charge qui bouge, une sangle qui casse.<\/li>\n<li>Il n’a pas de conséquence immédiate : on arrive quand même.<\/li>\n<li>Il est rangé parmi les choses normales : « ça bouge toujours un peu ».<\/li>\n<li>La marge restante devient invisible, jusqu’au moment où elle manque.<\/li><\/ul><\/div>\n<div><h2>Ce qui l'interrompt<\/h2><ul>\n<li>Mesurer, plutôt qu’estimer.<\/li>\n<li>Dire ce que le signal signifie : « la retenue a cédé ».<\/li>\n<li>Revenir à la référence : les données du constructeur, pas l’habitude.<\/li>\n<li>Garder une trace, et la faire remonter.<\/li><\/ul><\/div><\/div>\n<div class=\"box tint\"><p style=\"margin:0\">Diane Vaughan a décrit la normalisation de la déviance à propos de l’accident de la navette Challenger : un écart répété sans conséquence finit par devenir la norme.<\/p><\/div>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · à retenir<\/div><h1>Cinq éléments à retenir<\/h1><div class=\"keep\"><span class=\"n\">1<\/span><div><b>La tension n’est pas la retenue<\/b><br>Une sangle bien tendue peut céder bien avant sa charge nominale : point d’attache, direction, angle.<\/div><\/div><div class=\"keep\"><span class=\"n\">2<\/span><div><b>Un manuel accepté n’est pas une donnée approuvée<\/b><br>Quand une charge sort de l’ordinaire, revenir aux données du constructeur.<\/div><\/div><div class=\"keep\"><span class=\"n\">3<\/span><div><b>Une charge qui a bougé a dépassé sa retenue<\/b><br>La resserrer remet la même retenue. Traiter la cause, pas le symptôme.<\/div><\/div><div class=\"keep\"><span class=\"n\">4<\/span><div><b>Donner des faits, pas une conviction<\/b><br>« Elle a reculé de tant, toutes les sangles arrière ont lâché » plutôt que « ça devrait tenir ».<\/div><\/div><div class=\"keep\"><span class=\"n\">5<\/span><div><b>Ne signer que ce que l’on peut garantir<\/b><br>Une signature dit au commandant que la charge est sûre.<\/div><\/div>"},{"id":"reco","label":"Les recommandations","html":"<div class=\"kicker\">Fiche mémo · recommandations<\/div><h1>Ce que recommande le NTSB<\/h1>\n<p class=\"lead\">Les six recommandations du rapport AAR-15/01, adressées à la FAA. Formulations résumées.<\/p>\n<table class=\"rec\"><tr><td>Données approuvées<\/td><td>Réviser les orientations destinées aux exploitants cargo : les méthodes d’arrimage des charges spéciales doivent reposer sur des données approuvées.<\/td><\/tr><tr><td>Personnel de chargement<\/td><td>Créer une certification pour les personnes qui chargent, arriment et documentent les charges spéciales.<\/td><\/tr><tr><td>Contrôle des manuels<\/td><td>Faire vérifier par les inspecteurs les manuels cargo des exploitants au regard des données approuvées.<\/td><\/tr><tr><td>Responsabilités de surveillance<\/td><td>Définir qui, à l’autorité, surveille la manutention des charges spéciales.<\/td><\/tr><tr><td>Formation des inspecteurs<\/td><td>Former les inspecteurs principaux aux charges spéciales.<\/td><\/tr><tr><td>Surveillance reportée<\/td><td>Mettre en place des mesures de réduction du risque quand des contrôles prévus sont reportés.<\/td><\/tr><\/table>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · glossaire<\/div><h1>Les mots du scénario<\/h1><div class=\"gl\"><h3>Chargement<\/h3><div class=\"e\"><b>Loadmaster.<\/b> Responsable à bord de la masse et du centrage, de l’inspection et de l’arrimage de la cargaison.<\/div><div class=\"e\"><b>Palette flottante.<\/b> Palette non verrouillée au plancher, retenue par ses seules sangles.<\/div><div class=\"e\"><b>Position centrale.<\/b> Palette placée dans l’axe du pont principal, à cheval sur les rails de verrouillage.<\/div><div class=\"e\"><b>Charge spéciale.<\/b> Charge qui sort des conditionnements standard : véhicule, charge lourde ou de grande hauteur.<\/div><div class=\"e\"><b>Point d’attache.<\/b> Point du plancher ou de la structure qui reçoit une sangle ; il a une charge admissible et une direction de travail.<\/div><div class=\"e\"><b>Facteurs de retenue.<\/b> Accélérations que l’arrimage doit supporter dans chaque direction.<\/div><div class=\"e\"><b>Cloison arrière pressurisée.<\/b> Paroi qui ferme la cabine pressurisée à l’arrière ; derrière elle passent circuits et commandes de l’empennage.<\/div><div class=\"e\"><b>Vérin du plan horizontal.<\/b> Vis qui règle l’incidence du plan horizontal (le trim) ; sans lui, le tangage n’est plus contrôlable.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>Normalisation de la déviance.<\/b> Acceptation progressive d’un écart, devenu normal parce qu’il n’a pas eu de conséquence.<\/div><div class=\"e\"><b>Assertivité.<\/b> Exprimer un désaccord de sécurité clairement : un fait, un risque, une proposition.<\/div><div class=\"e\"><b>Temps de service.<\/b> Durée de travail continue ; au-delà de 20 heures, vigilance et jugement sont nettement dégradés.<\/div><\/div><h2>Sources<\/h2><div class=\"src\">\n<p>NTSB, rapport d’accident AAR-15/01, « Crash During Takeoff of Boeing 747-400 BCF, N949CA, Bagram, Afghanistan, April 29, 2013 » : <a href=\"https://www.faa.gov/sites/faa.gov/files/2022-11/AAR1501.pdf\">copie hébergée par la FAA<\/a>.<\/p>\n<p>FAA, bibliothèque « Lessons Learned », N949CA : <a href=\"https://www.faa.gov/lessons_learned/transport_airplane/accidents/N949CA\">faa.gov<\/a>.<\/p>\n<p class=\"small\">Les enquêtes du NTSB visent l’amélioration de la sécurité, non la recherche de responsabilités. Ce scénario utilise le rapport dans ce seul but ; compagnie, bases et avion du jeu sont transposés.<\/p><\/div>"}]}}],"engine":"0.4","moods":["Sérénité","Soulagement","Surprise","Frustration","Malaise","Agacement"]}</script>

var qrcode = function() {
