/* Vol de nuit : la scène est sombre, les cartes sont du papier, les voyants parlent (ambre = attention, vert = issue favorable, rouge = accident). */
:root {
  --night: #0c131c;
  --night-2: #131d29;
  --night-3: #1b2735;
  --line: #2a394b;
  --fg: #e4e9ef;
  --mute: #8f9db0;
  --paper: #f2f3f1;
  --paper-2: #e6e8e6;
  --ink: #141a21;
  --ink-2: #4b5664;
  --rule: #c5cbd1;
  --amber: #ffb224;
  --green: #36c98a;
  --red: #ff5f5f;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-read: 'Lora', Georgia, serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- barre de bord ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--night) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--f-disp); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 17px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand small { font-weight: 600; color: var(--mute); letter-spacing: .12em; font-size: 12px; white-space: nowrap; }
.gauges { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; flex: 1 1 auto; }
.gauge { display: flex; align-items: center; gap: 6px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; font-size: 13px; color: var(--mute); text-transform: uppercase; }
.gauge .ic { display: flex; gap: 2px; align-items: center; }
.gauge svg { width: 18px; height: 18px; }
.gauge.bump, .chip.bump { animation: bump .5s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 7px; font-family: var(--f-disp); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; color: var(--mute); white-space: nowrap; }
.chip svg { width: 15px; height: 15px; }
.chip.on { background: var(--fg); color: var(--night); border-color: var(--fg); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--night-3); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13.5px; }
.tbtn svg { width: 17px; height: 17px; }
.tbtn:hover { border-color: var(--mute); }
.tbtn.armed { border-color: var(--amber); color: var(--amber); }
.annun { font-family: var(--f-disp); font-weight: 800; font-size: 12px; letter-spacing: .14em; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; color: #3c4a5c; background: #0a1017; white-space: nowrap; transition: color .25s, background .25s, border-color .25s, box-shadow .25s; }
.annun.green { color: #04170e; background: var(--green); border-color: var(--green); box-shadow: 0 0 14px color-mix(in srgb, var(--green) 60%, transparent); }
.annun.amber { color: #1d1300; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 55%, transparent); }
.annun.red { color: #200606; background: var(--red); border-color: var(--red); box-shadow: 0 0 14px color-mix(in srgb, var(--red) 55%, transparent); }

/* ---------- scène ---------- */
.stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 22px 28px; padding-inline: 16px; }
.stage > * { min-width: 0; max-width: 100%; }
.pile { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pile span { width: 34px; height: 44px; border-radius: 5px; border: 1px dashed var(--line); display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 16px; color: var(--mute); }
.pile span.f { border-style: solid; background: var(--night-3); color: var(--fg); }
.pile span.now { border-color: var(--amber); color: var(--amber); }
.pile-lab { font-family: var(--f-disp); letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; color: var(--mute); text-align: center; margin-bottom: -10px; }

.card { width: 100%; max-width: 600px; background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 0 22px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.04) inset; padding: 20px 22px 20px; display: flex; flex-direction: column; gap: 14px; transform-origin: 50% 50%; }
.card.flipping { animation: flip .44s ease-in-out; }
@keyframes flip { 0% { transform: perspective(1200px) rotateY(0); } 50% { transform: perspective(1200px) rotateY(90deg); } 100% { transform: perspective(1200px) rotateY(0); } }
.card.shake { animation: shake .6s ease; }
@keyframes shake { 0%,100% { transform: translate(0); } 15% { transform: translate(-7px,2px) rotate(-.6deg); } 35% { transform: translate(6px,-2px) rotate(.5deg); } 55% { transform: translate(-4px,1px); } 75% { transform: translate(3px,0); } }
.band { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 9px; padding: 9px 14px; }
.band.dark { background: var(--ink); color: var(--paper); }
.band.line { border: 2px solid var(--ink); }
.band.fin { background: var(--ink); color: var(--paper); outline: 2px solid var(--ink); outline-offset: 3px; margin: 3px; }
.band .lab { font-family: var(--f-disp); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: 19px; line-height: 1.1; }
.band .lab small { display: block; font-size: 11.5px; letter-spacing: .13em; opacity: .7; font-weight: 600; }
.band .num { font-family: var(--f-disp); font-weight: 800; font-size: 42px; line-height: 1; }
.band .chrono { font-family: var(--f-mono); font-weight: 600; font-size: 18px; color: var(--amber); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.band .chrono::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.head h2 { font-family: var(--f-disp); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin: 4px 0 0; text-wrap: balance; }
.head svg { width: 54px; height: 54px; flex: 0 0 auto; color: var(--ink); }
.txt { display: flex; flex-direction: column; gap: 10px; }
.txt p { margin: 0; font-family: var(--f-read); font-size: 17px; line-height: 1.58; }
.txt p.radio { font-family: var(--f-mono); font-size: 15px; border-left: 3px solid var(--ink); padding: 4px 0 4px 12px; background: var(--paper-2); border-radius: 0 6px 6px 0; }
.txt p.radio::before { content: "RADIO · "; font-weight: 600; letter-spacing: .06em; }
.tail { font-family: var(--f-read); font-style: italic; font-size: 16px; margin: 0; color: var(--ink-2); }
.q { font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 20px; margin: 2px 0 0; }
.notice { border: 1.5px dashed var(--ink-2); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; }
.notice svg { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 1px; }
.notice b { font-family: var(--f-disp); letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
.notice.solid { border-style: solid; border-color: var(--ink); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: stretch; gap: 12px; width: 100%; text-align: left; background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 11px; padding: 12px 12px 12px 14px; transition: background .15s, color .15s, transform .15s; }
.opt:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.opt .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; line-height: 1.45; }
.opt .cost { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; font-size: 13px; text-transform: uppercase; color: var(--ink-2); }
.opt .cost svg { width: 15px; height: 15px; }
.opt .cost s { opacity: .6; }
.opt .to { flex: 0 0 56px; border-left: 1.5px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.opt .to small { font-family: var(--f-disp); font-size: 11px; letter-spacing: .14em; color: var(--ink-2); }
.opt .to b { font-family: var(--f-disp); font-weight: 800; font-size: 30px; line-height: 1; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.opt[aria-pressed="true"] .cost, .opt[aria-pressed="true"] .to small { color: var(--paper-2); }
.opt:disabled { opacity: .5; border-style: dashed; cursor: not-allowed; }
.opt .locked { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; color: #9b2c2c; }
.rows { display: flex; flex-direction: column; gap: 0; background: var(--paper-2); border-radius: 10px; padding: 4px 12px; }
.rows .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15.5px; }
.rows .r + .r { border-top: 1px solid var(--rule); }
.rows .r svg { width: 20px; height: 20px; flex: 0 0 auto; }
.rows .r.new { animation: rowin .6s ease both; }
@keyframes rowin { from { background: color-mix(in srgb, var(--amber) 35%, transparent); } to { background: transparent; } }
.rows small { display: block; font-family: var(--f-body); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--ink-2); padding: 0 0 7px; }
.goto { display: flex; flex-direction: column; gap: 6px; }
.goto .g { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--rule); border-radius: 9px; padding: 8px 12px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; color: var(--ink-2); }
.goto .g.taken { border-color: var(--ink); color: var(--ink); background: #fff; }
.goto .g b { font-size: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: 18px; padding: 12px 20px; border-radius: 10px; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.go { background: var(--amber); color: #1b1200; border-color: var(--amber); }
.btn.night { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.wide { width: 100%; }
.hint { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.hint svg { width: 16px; height: 16px; flex: 0 0 auto; }
textarea { width: 100%; min-height: 110px; resize: vertical; border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 12px; font-family: var(--f-read); font-size: 16px; background: #fff; color: var(--ink); color-scheme: light; }
.lastq { border: 2px solid var(--ink); border-radius: 11px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.lastq b { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.lastq p { margin: 0; font-size: 15.5px; }

/* ---------- accueil ---------- */
.hero { width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 20px; padding-top: 3vh; }
.hero .over { font-family: var(--f-disp); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; color: var(--mute); }
.hero h1 { font-family: var(--f-disp); font-weight: 800; font-size: clamp(52px, 12vw, 116px); line-height: .86; text-transform: uppercase; letter-spacing: -.005em; margin: 0; }
.hero p.pitch { font-family: var(--f-read); font-size: 18px; line-height: 1.6; color: var(--fg); max-width: 62ch; margin: 0; }
.panel { background: var(--night-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-family: var(--f-disp); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12.5px; color: var(--mute); }
.field input { background: var(--night); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 10px 12px; font-family: var(--f-mono); font-size: 16px; width: 140px; }
.panel .muted { color: var(--mute); flex: 1 1 240px; font-size: 13.5px; }
.scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.sc { background: var(--night-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s; }
.sc:hover, .sc:focus-within { border-color: var(--mute); }
.sc:hover .annun, .sc:focus-within .annun { color: #1d1300; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 55%, transparent); }
.sc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sc .no { font-family: var(--f-disp); font-weight: 800; font-size: 46px; line-height: .9; color: var(--fg); }
.sc .no small { display: block; font-size: 11.5px; letter-spacing: .14em; color: var(--mute); font-weight: 700; text-transform: uppercase; }
.sc .pub { font-family: var(--f-disp); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12.5px; color: var(--amber); }
.sc h2 { font-family: var(--f-disp); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0; text-wrap: balance; }
.sc p { font-family: var(--f-read); font-size: 15.5px; line-height: 1.55; margin: 0; flex: 1 1 auto; }
.sc .meta { font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--mute); }
.sc .btn { align-self: stretch; margin-top: 4px; }
.linkbtn { background: none; border: none; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: 14px; }
.foot { color: var(--mute); font-size: 13px; max-width: 70ch; margin: 0; }

/* ---------- règle ---------- */
.brief { font-family: var(--f-read); font-size: 16.5px; line-height: 1.55; margin: 0; }
.rules { display: grid; grid-template-columns: 1fr; gap: 10px; }
.rule { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
.rule .n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--f-disp); font-weight: 800; font-size: 15px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.legend div { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; }
.legend svg { width: 20px; height: 20px; flex: 0 0 auto; }
.legend b { font-family: var(--f-disp); letter-spacing: .06em; }

/* ---------- débriefing ---------- */
.sheet { width: 100%; max-width: 820px; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 22px 60px rgba(0,0,0,.5); }
.sheet h2 { font-family: var(--f-disp); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; margin: 0; }
.sheet h3 { font-family: var(--f-disp); font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; margin: 6px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
.tile span { display: block; font-family: var(--f-disp); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 11.5px; color: var(--ink-2); }
.tile b { font-family: var(--f-disp); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tscroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12.5px; text-align: left; border-bottom: 2px solid var(--ink); padding: 6px 8px; }
.tbl td { border-bottom: 1px solid var(--rule); padding: 7px 8px; vertical-align: top; font-variant-numeric: tabular-nums; }
.deb { display: flex; flex-direction: column; gap: 10px; }
.debc { border: 1.5px solid var(--rule); border-radius: 11px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.debc .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--ink-2); }
.debc .h b { font-size: 22px; color: var(--ink); }
.debc dt { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; margin-top: 4px; }
.debc dd { margin: 0; font-size: 14.5px; line-height: 1.5; }
.debc.fin { border: 2px solid var(--ink); }
.debc p { margin: 0; font-family: var(--f-read); font-size: 15.5px; line-height: 1.55; }
.muted { color: var(--ink-2); font-size: 13px; }
.copybox { width: 100%; min-height: 80px; font-family: var(--f-mono); font-size: 12px; }

/* ---------- dossier ---------- */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(4,8,12,.55); }
.drawer .in { width: min(820px, 100%); height: 100%; background: var(--night-2); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer .top .ttl { font-family: var(--f-disp); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 18px; flex: 1 1 auto; min-width: 0; }
.drawer .top .run { font-family: var(--f-mono); color: var(--amber); font-size: 13px; white-space: nowrap; }
.tabs { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tab { flex: 0 0 auto; background: var(--night-3); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-size: 13.5px; color: var(--mute); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--night); border-color: var(--fg); }
.docwrap { flex: 1 1 auto; overflow: auto; padding: 16px; }
.doc { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 22px 22px 26px; font-size: 14px; line-height: 1.45; max-width: 100%; overflow-x: auto; }
.doc h1 { font-family: var(--f-disp); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; margin: 0 0 8px; }
.doc h2 { font-family: var(--f-disp); font-weight: 700; font-size: 17px; letter-spacing: .07em; text-transform: uppercase; margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1.5px solid var(--ink); }
.doc .kicker { font-family: var(--f-disp); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.doc .lead { font-size: 15px; margin: 0 0 10px; }
.doc p { margin: 0 0 8px; }
.doc .small { font-size: 12.5px; color: #39424c; }
.doc ul { margin: 0 0 8px; padding-left: 20px; } .doc li { margin-bottom: 4px; }
.doc table { width: 100%; border-collapse: collapse; margin: 4px 0 10px; font-size: 13.5px; }
.doc th { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; text-align: left; border-bottom: 2px solid var(--ink); padding: 5px 7px; vertical-align: bottom; }
.doc td { border-bottom: 1px solid #b9c0c7; padding: 6px 7px; vertical-align: top; }
.doc td.c, .doc th.c { text-align: center; }
.doc table.grid td, .doc table.grid th { border: 1px solid #a3abb3; }
.doc table.grid th { background: var(--paper-2); }
.doc .num { font-family: var(--f-disp); font-weight: 800; }
.doc .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.doc .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.doc .box { border: 1.5px solid var(--ink); border-radius: 10px; padding: 12px 14px; margin: 4px 0 10px; }
.doc .box.tint { background: var(--paper-2); border-color: #a3abb3; }
.doc .rot p { font-family: var(--f-read); font-size: 15.5px; line-height: 1.55; margin: 0 0 6px; }
.doc .cast td:first-child, .doc .eq td:first-child { width: 110px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.doc .ck, .doc .cl-row { display: flex; align-items: baseline; font-family: var(--f-mono); font-size: 13px; line-height: 1.75; }
.doc .ck .it, .doc .cl-row .it { white-space: normal; min-width: 0; }
.doc .ck .d, .doc .cl-row .dots { flex: 1 1 auto; border-bottom: 1px dotted #333; margin: 0 6px; transform: translateY(-3px); min-width: 12px; }
.doc .ck .st, .doc .cl-row .st { font-weight: 600; white-space: nowrap; }
.doc .ck-sec, .doc .cl-sec { font-family: var(--f-disp); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin: 10px 0 2px; border-bottom: 1.5px solid var(--ink); }
.doc .ck-note, .doc .cl-note { font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: #333; margin: 6px 0 0; }
.doc .cl-note { font-weight: 600; }
.doc .cl-sub { font-family: var(--f-mono); font-size: 12px; color: #333; margin: 2px 0 3px; }
.doc .clf { border: 1.5px solid var(--ink); border-radius: 10px; padding: 4px 14px 12px; margin: 12px 0; }
.doc .clf h2 { margin-top: 10px; }
.doc .clf h2 small { font-size: 12px; color: var(--ink-2); letter-spacing: .1em; font-weight: 600; }
.doc .cl-pg { font-family: var(--f-disp); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.doc .toc .r { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; line-height: 1.9; }
.doc .toc .r b { font-family: var(--f-disp); font-weight: 800; font-size: 17px; min-width: 18px; }
.doc .toc .dots, .doc .toc .p { display: none; }
.doc .tok { border: 1.5px solid var(--ink); border-radius: 8px; padding: 7px 10px; margin: 10px 0 4px; font-size: 13.5px; }
.doc .tok.plain { border-style: dashed; border-color: #777; }
.doc .clp { margin: 4px 0 0; padding-left: 20px; } .doc .clp li { margin-bottom: 5px; }
.doc .roles { width: 100%; border-collapse: collapse; }
.doc .roles td { font-size: 13.5px; padding: 5px 7px; vertical-align: top; border-bottom: 1px solid #bbb; }
.doc .roles td:first-child { font-family: var(--f-disp); font-weight: 700; width: 96px; }
.doc .mtr { font-family: var(--f-mono); font-size: 13px; line-height: 1.55; background: var(--paper-2); border: 1px solid #999; border-radius: 6px; padding: 8px 11px; margin-bottom: 8px; overflow-wrap: anywhere; }
.doc .mtr b { font-weight: 600; }
.doc .leg { columns: 3 190px; column-gap: 18px; font-size: 13px; line-height: 1.4; }
.doc .leg div { break-inside: avoid; margin-bottom: 5px; display: flex; gap: 6px; }
.doc .leg .n { flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--f-disp); font-weight: 700; font-size: 11.5px; text-align: center; line-height: 18px; }
.doc .leg .n.k { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); line-height: 15px; }
.doc svg { max-width: 100%; height: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 700px) {
  .doc .cols, .doc .cols3, .doc [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  .doc .ck .st, .doc .cl-row .st { white-space: normal; text-align: right; }
  .legend { grid-template-columns: 1fr; }
  .card { padding: 16px 16px 18px; }
  .txt p { font-size: 16px; }
  .head h2 { font-size: 26px; }
  .tools { margin-left: 0; }
}
@media (max-width: 560px) {
  .hud { gap: 8px 10px; padding: 8px 12px; }
  .brand { font-size: 15px; flex: 1 1 0; }
  .brand small { display: none; }
  .tools { order: 2; margin-left: auto; flex-wrap: nowrap; }
  .gauges { order: 3; flex: 1 1 100%; gap: 6px 12px; }
  .tbtn { padding: 7px 9px; }
  .hud .tbtn .l { display: none; }
  .hud .tbtn.armed .l { display: inline; }
  .hud .annun.idle { display: none; }
  .doc { padding: 16px 14px 20px; }
  .doc table { font-size: 12.5px; }
  .doc th { font-size: 11px; letter-spacing: .02em; padding: 4px 5px; }
  .doc td { padding: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  .card.flipping, .card.shake, .gauge.bump, .chip.bump, .rows .r.new { animation: none; }
  .band .chrono::before { animation: none; }
}

/* ---------- v0.3 : mesure, séance, débriefing ---------- */
.btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
.btn.night { white-space: nowrap; }
.sheet dt { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; margin-top: 6px; }
.sheet dd { margin: 0; font-size: 14.5px; line-height: 1.5; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--mute); }
.tag.on { color: var(--amber); border-color: var(--amber); }
.panel .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; width: 100%; }
.panel .join { display: flex; gap: 8px; align-items: flex-end; }
.panel .join input { width: 110px; text-transform: uppercase; }
.panel .btn.small, .btn.small { font-size: 14px; padding: 9px 14px; }
.opts-solo { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--mute); font-size: 13.5px; width: 100%; }
.opts-solo label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.opts-solo input { width: 18px; height: 18px; accent-color: var(--amber); }
.hero .links { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.chrono.warn { color: var(--red) !important; }
.chrono.warn::before { background: var(--red) !important; }
.conf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.conf button { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.conf button b { font-family: var(--f-disp); font-size: 26px; line-height: 1; }
.conf button span { font-size: 12.5px; line-height: 1.25; text-align: center; color: var(--ink-2); }
.conf button:hover { background: var(--ink); color: var(--paper); } .conf button:hover span { color: var(--paper-2); }

/* questionnaires */
.qi { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.qi:first-of-type { border-top: none; padding-top: 0; }
.qi .qt { display: flex; gap: 10px; font-size: 15.5px; line-height: 1.45; }
.qi .qt b.n { font-family: var(--f-disp); font-weight: 800; font-size: 20px; line-height: 1; min-width: 20px; }
.qi .qt small { color: var(--ink-2); font-size: 12.5px; }
.qopts { display: flex; flex-direction: column; gap: 6px; padding-left: 30px; }
.qopts.inline { flex-direction: row; flex-wrap: wrap; }
.qo { text-align: left; background: #fff; color: var(--ink); border: 1.5px solid var(--rule); border-radius: 9px; padding: 8px 12px; font-size: 14.5px; line-height: 1.35; display: flex; gap: 10px; align-items: flex-start; }
.qo::before { content: ""; flex: 0 0 16px; height: 16px; margin-top: 1px; border: 1.5px solid var(--ink-2); border-radius: 50%; }
.qo.multi::before { border-radius: 4px; }
.qo[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }
.qo[aria-pressed="true"]::before { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--paper-2); }
.qi textarea { min-height: 70px; margin-left: 30px; width: calc(100% - 30px); }
.scale { display: flex; gap: 6px; padding-left: 30px; flex-wrap: wrap; align-items: center; }
.scale button { width: 44px; height: 40px; border-radius: 8px; border: 1.5px solid var(--rule); background: #fff; color: var(--ink); font-family: var(--f-disp); font-weight: 800; font-size: 18px; }
.scale button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.scale small { color: var(--ink-2); font-size: 12px; }
.lk { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.lk .scale { padding-left: 0; }
.lk > span { font-size: 14.5px; line-height: 1.4; }
.moods { display: flex; flex-wrap: wrap; gap: 8px; }
.moods button { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 16px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; }
.moods button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* débriefing individuel */
.phase { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.phase b { font-size: 26px; color: var(--ink); line-height: 1; }
.keynote { border-left: 4px solid #c98500; background: #fff4dc; border-radius: 0 10px 10px 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; line-height: 1.45; }
.keynote .h { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.keynote .h .st { color: var(--ink-2); }
.keynote button { align-self: flex-start; background: transparent; border: 1.5px solid var(--ink); border-radius: 8px; padding: 5px 10px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--ink); }
details.others { border: 1.5px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
details.others summary { cursor: pointer; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13.5px; color: var(--ink-2); }
details.others .oo { border-top: 1px solid var(--rule); margin-top: 8px; padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
details.others .oo p { margin: 0; font-size: 14.5px; }
details.others .oo .to { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; color: var(--ink-2); }
.decblk { border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.decblk > .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; }
.decblk > .h b { font-size: 22px; }
.decblk .chosen { font-size: 15px; line-height: 1.45; background: var(--paper-2); border-radius: 8px; padding: 8px 10px; }
.opt-blk { display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--rule); padding-left: 10px; }
.opt-blk .lbl { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
.opt-blk.safe { border-left-color: #1f8a5b; background: #e6f4ec; border-radius: 0 10px 10px 0; padding: 10px 12px; }
.opt-blk.safe .lbl { color: #146c43; }
.opt-blk.safe .chosen { background: #fff; box-shadow: inset 0 0 0 1.5px #9fd3b8; }
.decblk > .h b.safe-num { color: #146c43; }
.tbl td.safe-cell { background: #e6f4ec; box-shadow: inset 4px 0 0 #1f8a5b; }
.safe-tag { display: inline-block; margin-top: 5px; background: #17784e; color: #fff; border-radius: 999px; padding: 2px 9px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 11.5px; white-space: nowrap; }
.tbl td .safe-tag { display: block; width: fit-content; }
.tbl td .safe-tag + .muted { display: block; margin-top: 2px; }
.yes { color: #146c43; font-weight: 600; } .no { color: #9b2c2c; font-weight: 600; }
.rcode { font-family: var(--f-mono); font-weight: 600; font-size: clamp(24px, 7vw, 40px); letter-spacing: .06em; text-align: center; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 16px 10px; word-break: break-all; user-select: all; }
.rcode-help { text-align: center; color: var(--ink-2); font-size: 14px; margin: 0; }

/* animateur */
.sheet.wide { max-width: 1040px; }
.dtabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.dtabs button { background: transparent; border: 1.5px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; font-size: 14px; color: var(--ink-2); }
.dtabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.scode { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 16px; }
.scode b { font-family: var(--f-mono); font-size: 34px; letter-spacing: .08em; line-height: 1; }
.scode span { font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; opacity: .8; }
.chart { display: flex; flex-direction: column; gap: 6px; }
.chart .ttl { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart .ttl small { font-family: var(--f-body); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--ink-2); }
.br { display: grid; grid-template-columns: minmax(150px, 1.1fr) 2fr minmax(78px, auto); gap: 4px 12px; align-items: center; padding: 3px 0; border-radius: 6px; }
.br:hover, .br:focus-visible { background: var(--paper-2); outline: none; }
.br .bl { font-size: 14px; line-height: 1.3; min-width: 0; }
.br .bl .clsk { margin-right: 6px; vertical-align: 1px; }
.br .bl .k { font-family: var(--f-disp); font-weight: 800; font-size: 15px; white-space: nowrap; }
.br .bl .sub { display: block; color: var(--ink-2); font-size: 12.5px; }
.br .bt { height: 16px; background: #e2e5e3; border-radius: 0 4px 4px 0; position: relative; }
.br .bf { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.br .bv { font-family: var(--f-disp); font-weight: 700; font-size: 15px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.clsk { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 4px; color: #fff; font-family: var(--f-disp); font-weight: 800; font-size: 13px; }
.dstat { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.dstat b { color: var(--ink); font-family: var(--f-disp); font-size: 14px; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend-inline i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend-inline i.dot { border-radius: 50%; }
.db { display: grid; grid-template-columns: minmax(150px, 1.4fr) 2fr minmax(96px, auto); gap: 4px 12px; align-items: center; padding: 4px 0; }
.db .bl { font-size: 13.5px; line-height: 1.3; }
.db .trk { position: relative; height: 18px; }
.db .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #e2e5e3; }
.db .seg { position: absolute; top: 8px; height: 2px; background: #2a78d6; opacity: .45; }
.db .pt { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--paper); }
.db .bv { font-family: var(--f-disp); font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
.quotes { display: flex; flex-direction: column; gap: 6px; }
.quotes p { margin: 0; font-family: var(--f-read); font-size: 15px; line-height: 1.5; border-left: 3px solid var(--rule); padding-left: 10px; }
.quotes p small { font-family: var(--f-body); color: var(--ink-2); font-size: 12px; }
.verdict { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; white-space: nowrap; }
.verdict.ok { color: #146c43; } .verdict.ko { color: #9b2c2c; } .verdict.na { color: var(--ink-2); }
.entry { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.entry .f { display: flex; flex-direction: column; gap: 4px; }
.entry label { font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--ink-2); }
.entry input[type=text] { border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px 12px; font-family: var(--f-mono); font-size: 16px; background: #fff; color: var(--ink); color-scheme: light; }
.entry input.rc { width: min(330px, 100%); text-transform: uppercase; letter-spacing: .05em; }
.entry input.pl { width: 110px; }
.msg { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--paper-2); }
.msg.err { background: #fde8e8; color: #7a1f1f; } .msg.ok { background: #e3f4ea; color: #145232; }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-list button { text-align: left; background: #fff; border: 1.5px solid var(--rule); border-radius: 10px; padding: 10px 12px; color: var(--ink); display: flex; gap: 12px; align-items: center; }
.radio-list button b { font-family: var(--f-disp); font-weight: 800; font-size: 26px; line-height: 1; min-width: 24px; }
.radio-list button span { font-family: var(--f-disp); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 16px; }
.radio-list button small { display: block; font-family: var(--f-body); letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--ink-2); font-size: 13px; }
.radio-list button[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); box-shadow: inset 4px 0 0 var(--ink); }
.checks { display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; cursor: pointer; }
.checks input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); }
.sheet.proj { font-size: 17px; }
.sheet.proj .anim-only { display: none !important; }
.sheet.proj .br .bl { font-size: 16px; } .sheet.proj .br .bv { font-size: 18px; } .sheet.proj .br .bt { height: 20px; }
.sheet.proj .chart .ttl { font-size: 18px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.35; padding: 6px 9px; border-radius: 7px; max-width: 280px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

/* pages du module de débriefing papier */
.doc .blk { display: grid; grid-template-columns: 86px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid #bbb; }
.doc .blk:last-child { border-bottom: none; }
.doc .blk .t { font-family: var(--f-disp); font-weight: 800; font-size: 22px; line-height: 1; }
.doc .blk .t small { display: block; font-weight: 600; font-size: 12px; letter-spacing: .08em; color: #4a4a4a; margin-top: 4px; text-transform: uppercase; }
.doc .blk h3, .doc h3 { font-family: var(--f-disp); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; margin: 10px 0 5px; }
.doc .blk h3 { margin-top: 0; }
.doc .blk .r { display: grid; grid-template-columns: 86px 1fr; gap: 6px 12px; font-size: 14px; line-height: 1.45; }
.doc .blk .r .l { font-family: var(--f-disp); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding-top: 1px; }
.doc .tl .ev { display: grid; grid-template-columns: 104px 1fr; gap: 12px; padding: 5px 0; border-bottom: 1px dotted #999; font-size: 14px; }
.doc .tl .ev .h { font-family: var(--f-disp); font-weight: 800; font-size: 17px; }
.doc .keep { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid #bbb; }
.doc .keep .n { font-family: var(--f-disp); font-weight: 800; font-size: 38px; line-height: .9; }
.doc .gl { columns: 2 260px; column-gap: 26px; font-size: 13.5px; line-height: 1.42; }
.doc .gl h3 { break-after: avoid; border-bottom: 1px solid #111; padding-bottom: 2px; }
.doc .gl .e { break-inside: avoid; margin-bottom: 6px; }
.doc .ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; align-items: end; margin: 4px 0 8px; }
.doc .ladder .st { border: 1.5px solid #111; border-radius: 6px; padding: 8px; font-size: 13px; line-height: 1.35; }
.doc .ladder .st b { display: block; font-family: var(--f-disp); font-weight: 800; font-size: 17px; text-transform: uppercase; margin-bottom: 3px; }
.doc .ladder .st i { display: block; font-style: normal; color: #444; font-size: 12px; margin-top: 4px; }
.doc .ladder .s1 { min-height: 90px; } .doc .ladder .s2 { min-height: 112px; } .doc .ladder .s3 { min-height: 134px; }
.doc .ladder .s4 { min-height: 156px; background: #111; color: #fff; } .doc .ladder .s4 i { color: #ccc; }
.doc .rec td:first-child { font-family: var(--f-disp); font-weight: 800; font-size: 15px; width: 44px; }
.doc .box.dark { background: #111; color: #fff; border-color: #111; } .doc .box.dark .kicker { color: #ccc; }
.doc .src p { font-size: 13px; }
.doc a { color: #1d4f91; }
.doc ol { margin: 0 0 8px; padding-left: 22px; } .doc ol li { margin-bottom: 4px; }
.doc.reveal [data-key] { background: #ffe9b8; box-shadow: 0 0 0 3px #ffe9b8; border-radius: 3px; }
.doc.reveal .flash { animation: flash 1.6s ease 2; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 3px #ffe9b8; } 50% { box-shadow: 0 0 0 6px #c98500; } }
.memo-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.memo-tabs button { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
.memo-tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sheet .doc { padding: 0; background: transparent; }

@media (max-width: 700px) {
  .br, .db { grid-template-columns: 1fr auto; }
  .br .bt, .db .trk { grid-column: 1 / -1; grid-row: 2; }
  .doc .blk, .doc .blk .r, .doc .tl .ev { grid-template-columns: 1fr; gap: 4px; }
  .doc .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lk { grid-template-columns: 1fr; }
  .conf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qopts, .scale { padding-left: 0; }
  .qi textarea { margin-left: 0; width: 100%; }
}
table { color: inherit; }

/* ---------- v0.4 : vocabulaire actif, arrêts sur image, séance en direct, déroulé, compte rendu ---------- */
:root {
  --f-disp: 'Barlow Condensed', 'Bahnschrift SemiCondensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-read: 'Lora', Georgia, 'Times New Roman', serif;
  --f-mono: 'IBM Plex Mono', Consolas, 'SF Mono', ui-monospace, monospace;
}
.gt { display: inline; padding: 0; margin: 0; border: none; background: none; font: inherit; color: inherit; cursor: help; text-decoration: underline dotted #8a5a00; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.gt:hover, .gt:focus-visible { background: #fff4dc; }
.gpop { position: absolute; z-index: 70; width: min(340px, calc(100vw - 16px)); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.45; }
.gpop b { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; color: var(--amber); }
.gpop small { color: #a9b4c2; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-family: var(--f-disp); }

.decblk.ask { border-style: dashed; border-color: var(--ink); }
.askq, .recul { display: flex; flex-direction: column; gap: 2px; border-left: 4px solid var(--ink); background: var(--paper-2); border-radius: 0 10px 10px 0; padding: 9px 12px; font-size: 14.5px; line-height: 1.45; }
.askq b, .recul b { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.recul.ok { border-left-color: #1f8a5b; background: #e6f4ec; }
.recul.warn { border-left-color: #c98500; background: #fff4dc; }
.recul.ko { border-left-color: #b23b3b; background: #fbeaea; }
.qo span b { font-family: var(--f-disp); letter-spacing: .04em; }

.sa-blk { border: 1.5px solid var(--rule); border-radius: 11px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.sa-blk > .h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.sa-blk > .h .st { color: var(--ink-2); }
.sa-r { display: grid; grid-template-columns: 104px 1fr; gap: 10px; align-items: start; font-size: 14px; line-height: 1.45; }
.sa-r .mk { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; border-radius: 999px; padding: 3px 9px; text-align: center; color: #fff; background: #5b6672; margin-top: 1px; }
.sa-r.hit .mk { background: #17784e; } .sa-r.miss .mk { background: #b97700; } .sa-r.lure .mk { background: #b23b3b; } .sa-r.skip .mk { background: #8b949e; }
.sa-r .tg { font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }

.lq { border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lqh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 16px; }
.lqh b { font-size: 22px; font-variant-numeric: tabular-nums; }
.klegend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 14px; background: var(--paper-2); border-radius: 9px; padding: 8px 10px; font-size: 13px; line-height: 1.35; }
.klegend b { display: block; font-family: var(--f-disp); letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
.kq { border-top: 1px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.kq p { margin: 0; font-family: var(--f-read); font-size: 15.5px; line-height: 1.5; }
.kbs { display: flex; flex-wrap: wrap; gap: 6px; }
.kb { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 7px 14px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 14px; }
.kb:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.kb:disabled { cursor: default; opacity: .45; border-color: var(--rule); }
.kb.good { opacity: 1; background: #17784e; border-color: #17784e; color: #fff; }
.kb.bad { opacity: 1; background: #fbeaea; border-color: #b23b3b; color: #7a1f1f; text-decoration: line-through; }
.kwhy { font-size: 14px; line-height: 1.45; border-left: 3px solid var(--rule); padding-left: 10px; }
.kq.ok .kwhy { border-left-color: #1f8a5b; } .kq.ko .kwhy { border-left-color: #b23b3b; }

/* réponses de chacun */
.mxt th small { display: block; font-family: var(--f-body); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--ink-2); max-width: 150px; }
.mxt th[scope=row] { font-family: var(--f-mono); font-weight: 600; font-size: 14px; letter-spacing: 0; text-transform: none; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.mxt td { vertical-align: middle; }
.mxt td small { margin-left: 6px; color: var(--ink-2); font-size: 12px; }
.mx { display: inline-grid; place-items: center; min-width: 38px; height: 30px; padding: 0 6px; border-radius: 7px; color: #fff; font-family: var(--f-disp); font-weight: 800; font-size: 18px; }
.mx.best { box-shadow: 0 0 0 2px var(--paper), 0 0 0 5px #17784e; }
.mx.fin { background: #5b6672; } .mx.fin.green { background: #1f9d6a; } .mx.fin.amber { background: #d18a00; } .mx.fin.red { background: #d64545; }
.mxlg { display: flex; flex-direction: column; gap: 4px; }
.mxl { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); align-items: center; }
.mxl b { font-family: var(--f-disp); color: var(--ink); min-width: 26px; }
.mxl i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mxl u { text-decoration-color: #17784e; text-decoration-thickness: 2px; text-underline-offset: 3px; color: var(--ink); }
ol.talk { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
ol.talk li { font-size: 14.5px; line-height: 1.45; }
ol.talk li b { display: block; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
details.sa-d { margin-top: 4px; }
ul.plain { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.6; }

/* séance en direct */
.lphs { display: flex; flex-wrap: wrap; gap: 8px; }
.lph { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 14px 5px 6px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; color: var(--ink-2); }
.lph b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--rule); color: var(--ink); font-size: 14px; }
.lph.on { border-color: var(--ink); background: var(--ink); color: var(--paper); } .lph.on b { background: var(--amber); color: #1b1200; }
.lph.past { color: var(--ink); } .lph.past b { background: #17784e; color: #fff; }
.ljoin { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: center; background: var(--ink); color: var(--paper); border-radius: 14px; padding: 18px 20px; }
.lqr { flex: 0 0 auto; background: #fff; border-radius: 10px; padding: 4px; line-height: 0; }
.qr { width: min(240px, 60vw); height: auto; display: block; }
.lj { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lj .k { font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; opacity: .75; margin-top: 8px; }
.lurl { font-family: var(--f-mono); font-size: clamp(18px, 3.2vw, 30px); word-break: break-all; }
.lcode { font-family: var(--f-mono); font-size: clamp(44px, 9vw, 84px); letter-spacing: .12em; line-height: 1; color: var(--amber); }
.ljoin .muted { color: #a9b4c2; }
.lrost th[scope=row] { font-family: var(--f-mono); font-weight: 600; font-size: 14.5px; letter-spacing: 0; text-transform: none; border-bottom: 1px solid var(--rule); }
.lrost tr.off { opacity: .55; }
.pres { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #b9c0c7; margin-right: 8px; }
.pres.on { background: #1f9d6a; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ink-2); }
.dots i.f { background: var(--ink); border-color: var(--ink); }
.rcode.small { font-size: clamp(15px, 4vw, 20px); padding: 10px; }
.entry textarea.rc { min-height: 66px; width: 100%; font-family: var(--f-mono); font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }

/* déroulé du débriefing */
.flow { display: flex; flex-direction: column; gap: 14px; }
.flow-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.flow-nav button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 1.5px solid var(--rule); border-radius: 9px; padding: 5px 11px 5px 6px; font-family: var(--f-disp); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
.flow-nav button b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--paper-2); color: var(--ink); }
.flow-nav button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.flow-nav button[aria-selected="true"] b { background: var(--amber); color: #1b1200; }
.flow-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.flow-head .k, .fc .k { font-family: var(--f-disp); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12.5px; color: var(--ink-2); }
.flow-t { font-family: var(--f-disp); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; }
.flow-timer { display: flex; align-items: center; gap: 10px; }
.flow-timer span { font-family: var(--f-mono); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }
.flow-timer span.over { color: #b23b3b; }
.flow-rows { display: flex; flex-direction: column; gap: 8px; }
.fr { display: grid; grid-template-columns: 96px 1fr; gap: 12px; font-size: 15px; line-height: 1.5; }
.fr .l { font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; padding-top: 2px; color: var(--ink-2); }
.fr.ask { background: #fff4dc; border-left: 4px solid #c98500; border-radius: 0 10px 10px 0; padding: 9px 12px; font-family: var(--f-read); font-size: 17px; }
.fr.say { background: var(--paper-2); border-left: 4px solid var(--ink); border-radius: 0 10px 10px 0; padding: 9px 12px; }
.flow-sup { display: flex; flex-direction: column; gap: 14px; }
.fc { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.fc-def { margin: 0; font-family: var(--f-read); font-size: 20px; line-height: 1.45; }
.fc-term { font-family: var(--f-disp); font-weight: 800; font-size: 30px; text-transform: uppercase; color: var(--rule); }
.fc-term.on { color: var(--ink); }
.sheet.proj .fr.ask { font-size: 22px; } .sheet.proj .flow-t { font-size: 44px; } .sheet.proj .fc-def { font-size: 26px; } .sheet.proj .fc-term { font-size: 42px; }
.sheet.proj .mx { min-width: 46px; height: 36px; font-size: 22px; }
.sheet.proj ol.talk li { font-size: 18px; }

/* compte rendu */
.field-line { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 10px; align-items: end; font-family: var(--f-disp); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
.field-line i { border-bottom: 1px solid var(--ink-2); height: 22px; }
.blank { display: flex; flex-direction: column; }
.blank i { border-bottom: 1px solid var(--rule); height: 34px; }
.report .doc { padding: 0; }

@media (max-width: 700px) {
  .sa-r { grid-template-columns: 1fr; gap: 4px; } .sa-r .mk { justify-self: start; }
  .fr { grid-template-columns: 1fr; gap: 2px; }
  .flow-t { font-size: 26px; }
  .field-line { grid-template-columns: auto 1fr; }
}
@media print {
  :root { color-scheme: light; }
  html, body { height: auto; background: #fff !important; }
  .hud, .noprint, #drawer, .tip, .gpop, .dtabs, .scode { display: none !important; }
  .stage { padding: 0; display: block; }
  .sheet, .card { box-shadow: none !important; max-width: none !important; border-radius: 0; padding: 0; background: #fff; }
  .sheet > * + * { margin-top: 12px; }
  .chart, .tbl tr, .kq, .decblk, ol.talk li, .doc .keep { break-inside: avoid; }
  .sheet h3 { break-after: avoid; }
  .tscroll { overflow: visible; }
  details.others > *:not(summary) { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.keynote button.gt, .opt-blk button.gt { align-self: auto; display: inline; border: none; border-radius: 0; padding: 0; font: inherit; letter-spacing: 0; text-transform: none; background: none; }
.lurl.long { font-size: clamp(14px, 2vw, 20px); }
.lcode.long { font-size: clamp(34px, 6.5vw, 64px); letter-spacing: .08em; }
/* ---------- marque 3D ---------- */
.hero .brand { display: flex; align-items: center; gap: 10px 26px; flex-wrap: wrap; }
.hero .brand h1 { font-size: clamp(96px, 22vw, 168px); line-height: .8; letter-spacing: -.02em; }
.triad { display: flex; flex-direction: column; gap: 2px; font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: clamp(17px, 2.6vw, 24px); line-height: 1.15; color: var(--fg); }
.triad b { color: var(--amber); font-weight: 800; }
.hero p.slogan { font-family: var(--f-read); font-style: italic; font-size: clamp(20px, 2.8vw, 26px); line-height: 1.35; margin: 0; color: var(--fg); }
.hero p.slogan span { white-space: nowrap; color: var(--mute); }
/* la barre d'onglets du dossier ne doit jamais être écrasée par une page longue */
.drawer .top, .drawer .tabs { flex: none; }
.docwrap { min-height: 0; }

/* v0.5 · livret : normales encadrées de vert, urgences et anormales de rouge */
.doc .clf.norm { border: 3px solid #1E7B3A; }
.doc .clf.urg { border: 3px solid #B42318; }
.doc .clf.norm h2 small { color: #1E7B3A; }
.doc .clf.urg h2 small { color: #B42318; }
.doc .cl-sec.norm { color: #1E7B3A; border-bottom-color: #1E7B3A; }
.doc .cl-sec.urg { color: #B42318; border-bottom-color: #B42318; }
.doc .toc.norm, .doc .toc.urg { border-left: 4px solid; padding-left: 10px; }
.doc .toc.norm { border-left-color: #1E7B3A; }
.doc .toc.urg { border-left-color: #B42318; }

/* v0.5 · déroulé : les faits, groupe et cas réel en parallèle */
.par-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chart.par { border: 1.5px solid var(--line, #c9ced4); border-radius: 12px; padding: 12px 14px; }
.par-g { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.par-c { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.par-c.real { background: #f4f5f2; border-radius: 10px; padding: 10px 12px; }
.par-c.real p { margin: 0; font-family: var(--f-read); font-size: 16px; line-height: 1.45; }
.par-k { font-family: var(--f-disp); font-weight: 700; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.par-src { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.par-tag { display: inline-block; font-family: var(--f-disp); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: #141a21; color: #fff; border-radius: 6px; padding: 1px 7px; vertical-align: 1px; }
.bf.par-hit { outline: 2px solid #141a21; outline-offset: 1px; }
.sheet.proj .par-c.real p { font-size: 21px; }
@media (max-width: 720px) { .par-g { grid-template-columns: 1fr; } }

.band .num.who { font-size: 22px; white-space: nowrap; }

moteur tourne, il vous rapproche de la piste et des secours : vous gardez la puissance restante pour rejoindre le terrain.","cost":0,"cls":"B","short":"Garder le moteur pour la piste"},{"to":2,"text":"Procédure feu moteur complète, puis atterrissage moteur coupé sur la clairière : marge au-dessus des arbres, configuration sortie tard.","cost":0,"cls":"A","short":"Procédure feu moteur, moteur coupé"},{"to":17,"text":"Vous allez droit sur la clairière avec la puissance qui reste, configuration d’atterrissage sortie tout de suite pour être prêt.","cost":0,"cls":"C","short":"Configuration tôt, essence non coupée"}],"enter":[],"cue":"engineDown","auto":[17,13],"key":{"tabs":["cl"],"tab":"cl","mark":"d16","note":"Check-list feu moteur : couper l’essence, puis enchaîner sur l’atterrissage forcé, train et volets sortis une fois le terrain assuré."},"real":{"card":17,"src":"BEA","t":"Il annonce un atterrissage d’urgence à 4 000 ft. Sur l’épave : sélecteur carburant ouvert sur le réservoir droit, pompe auxiliaire sur ON, chauffage sur ON et dégivrage sur DEFROST, train sorti, volets entre 10 et 25°. Selon le BEA, les fumées ont probablement gêné l’atterrissage d’urgence. Le moment où train et volets ont été sortis n’est pas établi."}}},"suites":{"7":{"front":[{"t":"Le technicien ne connaît pas de document particulier. En cherchant, vous trouvez un bulletin de service du motoriste : après un remplacement de cylindres, il prévoit un vol de contrôle d’au moins deux heures, en surveillant débit carburant, pression d’huile et températures."},{"t":"Votre voyage est décalé d’un week-end. Le vol de deux heures se passe bien ; vous notez vos valeurs de croisière dans le carnet de route."}],"changes":[{"tok":"PARAMÈTRES"}],"debrief":[["Pourquoi c’était coûteux","Un week-end perdu, et le sentiment de faire du zèle."],["Ce qui protège","Une remise en service se prépare avec la documentation de l’avion et celle du motoriste, bulletins de service compris. Les valeurs relevées deviennent une référence de diagnostic."],["Limite","Ce vol ne garantit pas de détecter un défaut qui s’aggrave ensuite sous les vibrations. C’est une barrière, pas une assurance."]],"comp":"PRO · KNO","go":9},"12":{"front":[{"t":"Le vol de 30 minutes est sans histoire. Les températures restent dans le vert. Vous signez : l’avion est remis en service."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Vous avez appliqué la documentation dont vous disposiez. Personne ne vous a parlé d’autre chose, et le résultat semblait conforme."],["Le piège","On n’applique pas ce qu’on ignore. Ici, la documentation du motoriste demandait un vol plus long et une surveillance plus large."],["Ce qui protège","Une question systématique après tout travail moteur : quels documents de l’avionneur et du motoriste s’appliquent ?"]],"comp":"PRO · KNO","go":9},"4":{"front":[{"t":"Vous rentrez chez vous. Le week-end suivant, vous partez en voyage : le moteur tourne rond."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Des essais au sol réussis et un technicien qualifié rassurent. Les heures de vol sans incident semblent ensuite confirmer le choix."],["Le piège","L’absence de symptôme n’est pas une preuve. Un vol de voyage n’est pas un vol de contrôle : on n’y surveille pas les mêmes paramètres, et on est loin de son terrain."],["Ce qui protège","Séparer clairement le vol de contrôle du vol utile, avec ses propres critères."]],"comp":"PRO · PSD","go":9},"15":{"front":[{"t":"Vous repérez deux trous côté vallée, et un grand pré à la sortie de la cuvette du terrain de départ, sur la route du retour. Retour possible en moins de dix minutes."},{"t":"Vous poursuivez la montée."}],"changes":[{"tok":"PLAN B"}],"debrief":[["Pourquoi c’était coûteux","Une minute de charge de travail en pleine montée, pour une situation qui n’arrivera « sûrement pas »."],["Ce qui protège","La gestion des menaces et des erreurs (TEM) : identifier la menace (relief, couche qui se ferme, monomoteur) et préparer la parade avant d’en avoir besoin. Une décision préparée se prend en secondes le jour où il le faut."]],"comp":"SAW · PSD","go":6},"3":{"front":[{"t":"Vous poursuivez la montée. Le terrain de départ est derrière vous, quelque part sous la couche."}],"changes":[],"debrief":[["Pourquoi c’était tentant","La proximité du terrain de départ donne un sentiment de sécurité."],["Le piège","« Revenir au terrain » n’est pas un plan si vous ne savez ni par où redescendre, ni combien de temps il faut. Au-dessus d’une couche qui accroche le relief, la distance à vol d’oiseau ne dit rien de la route praticable."],["Ce qui protège","Un plan B précis : un trou identifié, un cap, un temps, un champ de dégagement."]],"comp":"SAW · PSD","go":6},"18":{"front":[{"t":"La montée est calme, la radio claire. Vous réglez soigneusement votre croisière. Le relief a disparu sous un tapis blanc."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Les tâches immédiates (navigation, radio, réglages) sont concrètes et gratifiantes ; anticiper une panne reste abstrait."],["Le piège","La tâche du moment occupe toute l’attention et chasse l’anticipation. C’est une question de gestion de la charge de travail, pas d’habileté au pilotage."],["Ce qui protège","Un rituel court à chaque changement de phase : quelles menaces, quelle parade ?"]],"comp":"WLM · SAW","go":6},"20":{"front":[{"t":"La fumée sort par les bouches de chauffage et de dégivrage, dont l’air est réchauffé dans le compartiment moteur. La puissance baisse, le débit carburant aussi. Le circuit électrique ne montre rien d’anormal."},{"t":"Les trois indices convergent : feu moteur probable. Vous déclarez la détresse et faites demi-tour."}],"changes":[{"tok":"DIAGNOSTIC"}],"debrief":[["Pourquoi c’était coûteux","Dans la fumée, chaque seconde paraît une éternité. S’arrêter pour réfléchir va contre l’instinct d’agir."],["Ce qui protège","Identifier l’origine du feu avant d’ouvrir une check-list. C’est FOR-DEC en version courte, les faits avant les options. Croiser au moins trois indices : provenance de la fumée, paramètres moteur, circuit électrique."]],"comp":"SAW · PSD · PRO","go":16},"10":{"front":[{"t":"Vous coupez le contact général. La radio se tait au milieu d’une phrase du contrôleur."},{"t":"Les aérateurs apportent de l’air froid, mais la fumée continue d’arriver à vos pieds et sur le pare-brise. Le moteur tire de moins en moins. Vous faites demi-tour vers le terrain de départ."}],"changes":[],"debrief":[["Pourquoi c’était tentant","La check-list associe elle-même fumée en cabine et feu électrique. Sous stress, on choisit la rubrique dont le titre ressemble le plus à ce qu’on vit : l’étiquette guide le diagnostic."],["Le piège","La fumée est un symptôme, pas un diagnostic. Un feu moteur peut enfumer la cabine par le chauffage. Couper l’électricité ne traite pas un feu alimenté en carburant, et vous prive de la radio."],["Ce qui protège","Ne jamais choisir une procédure sur un seul indice : établir d’abord l’origine du feu."]],"comp":"PRO · SAW","go":16},"14":{"front":[{"t":"Demi-tour, message de détresse. La tour collationne : pas de contact radar, les secours du terrain sont prévenus."},{"t":"Vous avez le visuel sur le terrain ?","radio":true},{"t":"Vous n’avez pas le temps de répondre. La question revient trente secondes plus tard. La fumée s’épaissit, et vous n’avez encore appliqué aucune procédure."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Revenir vers un terrain connu et alerter les secours donne le sentiment d’agir. Et la radio réclame des réponses."],["Le piège","L’ordre des priorités. La navigation et la communication ont pris la place du traitement du feu, qui continue de progresser."],["Ce qui protège","Piloter, naviguer, communiquer, et traiter la panne avant de répondre. Un « attendez » au contrôleur est une réponse légitime."]],"comp":"WLM · COM · PSD","go":16,"cue":"radio"},"2":{"front":[{"t":"Essence coupée, gaz réduits, mélange sur étouffoir, pompe auxiliaire coupée, chauffage et dégivrage coupés. Le moteur s’arrête. Vous affichez la vitesse de plané."},{"t":"Privée de l’air venu du compartiment moteur, la cabine s’éclaircit peu à peu. Le silence est impressionnant, mais vous voyez la clairière. Vous gardez de la marge au-dessus des arbres et ne sortez la configuration qu’une fois le terrain assuré."}],"changes":[],"debrief":[["Pourquoi c’était difficile","Couper volontairement un moteur qui tourne encore va contre tous les réflexes de pilote. Le moteur ressemble à une ressource ; ici, c’est lui qui alimente le feu."],["Ce qui protège","La procédure feu moteur assume ce choix : un atterrissage moteur coupé et maîtrisé vaut mieux qu’un feu entretenu. Marge au-dessus des obstacles, configuration tardive."]],"comp":"PRO · PSD · FPM","branch":{"tok":"DIAGNOSTIC","a":19,"b":8}},"13":{"front":[{"t":"Le moteur tourne encore, mais de moins en moins. La fumée s’épaissit, vous lisez mal vos instruments."},{"t":"À mi-chemin, la puissance ne suffit plus à tenir le palier."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Une piste, des secours qui attendent, un moteur qui tourne encore. Chaque minute semble vous rapprocher de la solution."],["Le piège","Le biais de continuation du plan. Un moteur qui tourne continue d’alimenter la fuite et le feu : le temps joue contre vous."],["Ce qui protège","Un critère de bascule fixé à l’avance, et respecté : si la fumée ne diminue pas, ou si je ne tiens plus le palier, je me pose là où je suis."]],"comp":"PSD · SAW","branch":{"tok":"PLAN B","a":5,"b":11}},"17":{"front":[{"t":"Configuration complète, puissance faible : l’avion s’enfonce plus vite que prévu."},{"t":"La fumée vous empêche de juger la hauteur. Les arbres de bordure grandissent dans le pare-brise."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Un terrain en vue, l’envie d’être prêt tôt. Sortir la configuration rassure : on a l’impression d’avancer."],["Le piège","Avec une puissance réduite, la traînée de la configuration consomme la hauteur qui restait. Et la fumée, alimentée par l’essence non coupée, dégrade la perception au pire moment."],["Ce qui protège","En atterrissage forcé, configuration tardive, une fois le terrain assuré ; et traiter la source de la fumée avant l’approche."]],"comp":"FPM · PRO · WLM","go":11}},"fins":{"19":{"n":1,"title":"Atterrissage maîtrisé","front":[{"t":"Vous vous posez en début de clairière. L’avion roule, puis s’arrête. Vous coupez tout et évacuez."},{"t":"Les secours arrivent quelques minutes plus tard. Le capot porte des traces de brûlé, mais l’avion est réparable, et vous êtes indemne."}],"changes":[],"back":"Deux décisions ont fait cette fin : le diagnostic avant la procédure, puis la coupure du moteur. Relisez votre parcours : vos autres choix ont-ils pesé, ou avez-vous eu de la marge sans le savoir ?","question":"","sound":"landing"},"8":{"n":2,"title":"Posé, mais à quel prix","front":[{"t":"Le diagnostic tardif vous a coûté de la hauteur et du temps. Vous touchez plus loin que prévu ; l’avion sort de la clairière et finit sa course dans une haie."},{"t":"Train arraché, aile endommagée. Vous sortez seul, choqué mais indemne."}],"changes":[],"back":"Bonne décision finale, mais trop tard : la fumée et la hauteur perdue ont mangé vos marges. La bonne procédure appliquée sur un mauvais diagnostic, puis corrigée, coûte du temps que vous n’aviez pas.","question":"","sound":"crash"},"5":{"n":3,"title":"Rattrapé de justesse","front":[{"t":"Le pré repéré pendant votre briefing est là, à portée de plané. Vous coupez enfin l’essence et vous vous posez dans l’herbe haute, juste avant la haie du fond."},{"t":"Le train cède, la cabine est enfumée : vous évacuez par la porte. Vous êtes indemne."}],"changes":[],"back":"Votre décision du moment vous a mis en danger. C’est l’anticipation faite en montée, le plan B, qui vous a sauvé. Une barrière préparée tôt rattrape parfois une erreur faite tard ; il ne faut pas compter dessus.","question":"","sound":"crash"},"11":{"n":4,"title":"Accident","front":[{"t":"L’aile droite heurte la cime d’un arbre de bordure et se rompt. L’avion bascule, touche d’autres arbres, puis le sol."},{"t":"Fin du vol."}],"changes":[],"back":"Vous avez rencontré la même issue que l’accident réel dont ce scénario s’inspire. Le débriefing va montrer pourquoi un pilote expérimenté peut y arriver par une suite de décisions qui, chacune, paraissaient raisonnables.","question":"","sound":"bigcrash"}},"dossier":[{"id":"avion","label":"Votre avion","html":"<div class=\"kicker\">Dossier de vol · 1/3<\/div>\n<h1>Votre avion<\/h1>\n<p class=\"lead\" style=\"margin-bottom:0\">Lisez ce dossier avant la carte 1. Il reste à votre disposition pendant toute la partie, comme en vol.<\/p>\n<div style=\"margin:0 0 1mm\"><svg viewBox=\"0 0 760 330\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\"><defs><marker id=\"pa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><pattern id=\"ph\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#cfcfcf\" stroke-width=\"2\"/><\/pattern><\/defs><line x1=\"20\" y1=\"282\" x2=\"740\" y2=\"282\" stroke=\"#bbb\" stroke-width=\"1.2\"/><path d=\"M168 136 L118 52 L88 50 L84 146 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"104\" y1=\"52\" x2=\"98\" y2=\"146\" stroke=\"#111\" stroke-width=\"0.9\"/><path d=\"M44 47 L138 41 Q156 42 156 47 Q156 52 138 53 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\"/><path d=\"M80 152 L80 144 L180 126 L340 100 L450 92 L512 120 L612 124 L664 132 Q700 148 664 166 L622 178 L572 186 L470 192 L340 190 L210 172 L80 156 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M512 120 L612 124 L664 132 L664 166 L622 178 L572 186 L512 188 Z\ troke-dasharray=\"3 3\" marker-end=\"url(#pa)\"/><line x1=\"600\" y1=\"140\" x2=\"748\" y2=\"24\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"600\" cy=\"140\" r=\"2.6\" fill=\"#111\"/><text x=\"744\" y=\"28\" text-anchor=\"end\" font-weight=\"600\">Moteur 200 ch à injection,<\/text><text x=\"744\" y=\"43\" text-anchor=\"end\" fill=\"#333\">turbocompressé<\/text><line x1=\"578\" y1=\"182\" x2=\"748\" y2=\"300\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"578\" cy=\"182\" r=\"2.6\" fill=\"#111\"/><text x=\"744\" y=\"304\" text-anchor=\"end\" font-weight=\"600\">Réchauffeur autour de l’échappement :<\/text><text x=\"744\" y=\"319\" text-anchor=\"end\" fill=\"#333\">air chaud vers pieds et pare-brise<\/text><line x1=\"512\" y1=\"116\" x2=\"520\" y2=\"60\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"512\" cy=\"116\" r=\"2.6\" fill=\"#111\"/><text x=\"524\" y=\"64\" text-anchor=\"start\" font-weight=\"600\">Cloison pare-feu<\/text><line x1=\"432\" y1=\"168\" x2=\"290\" y2=\"218\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"432\" cy=\"168\" r=\"2.6\" fill=\"#111\"/><text x=\"286\" y=\"222\" text-anchor=\"end\" font-weight=\"600\">Porte unique, côté droit<\/text><text x=\"286\" y=\"237\" text-anchor=\"end\" fill=\"#333\">sortie par l’aile droite<\/text><line x1=\"410\" y1=\"199\" x2=\"290\" y2=\"262\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"410\" cy=\"199\" r=\"2.6\" fill=\"#111\"/><text x=\"286\" y=\"266\" text-anchor=\"end\" font-weight=\"600\">Réservoirs dans les ailes :<\/text><text x=\"286\" y=\"281\" text-anchor=\"end\" fill=\"#333\">gauche et droit<\/text><line x1=\"406\" y1=\"230\" x2=\"290\" y2=\"304\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"406\" cy=\"230\" r=\"2.6\" fill=\"#111\"/><text x=\"286\" y=\"308\" text-anchor=\"end\" font-weight=\"600\">Train rentrant (ici sorti)<\/text><line x1=\"110\" y1=\"46\" x2=\"200\" y2=\"26\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"110\" cy=\"46\" r=\"2.6\" fill=\"#111\"/><text x=\"204\" y=\"30\" text-anchor=\"start\" font-weight=\"600\">Empennage en T<\/text><line x1=\"360\" y1=\"116\" x2=\"330\" y2=\"60\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"360\" cy=\"116\" r=\"2.6\" fill=\"#111\"/><text x=\"326\" y=\"64\" text-anchor=\"end\" font-weight=\"600\">Cabine 4 places<\/text><\/svg><\/div>\n<div style=\"margin:0 0 2mm\"><svg viewBox=\"0 0 760 252\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\"><defs><pattern id=\"th\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#bdbdbd\" stroke-width=\"2\"/><\/pattern><marker id=\"ta\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs><path d=\"M392 104 L392 58 L404 14 L462 14 L470 58 L470 104 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M392 148 L392 194 L404 238 L462 238 L470 194 L470 148 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"398\" y=\"62\" width=\"66\" height=\"34\" fill=\"url(#th)\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"398\" y=\"156\" width=\"66\" height=\"34\" fill=\"url(#th)\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M100 126 L104 74 L138 74 L146 126 L138 178 L104 178 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M96 126 Q96 118 110 117 L300 104 L390 98 L520 98 L600 106 L640 116 Q664 126 640 136 L600 146 L520 154 L390 154 L300 148 L110 135 Q96 134 96 126 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M520 98 L600 106 L640 116 Q664 126 640 136 L600 146 L520 154 Z\" fill=\"url(#th)\" stroke=\"none\"/><path d=\"M640 116 Q664 126 640 136 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><line x1=\"520\" y1=\"96\"
