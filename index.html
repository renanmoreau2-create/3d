 à 20 min","title":"Première nuit","short":"Première nuit","public":"Mécaniciens et techniciens de maintenance","role":"Chef d’équipe de nuit en maintenance en ligne","pitch":"Vendredi soir, une équipe de nuit incomplète et un avion à rendre pour le lavage de 6 h 30. Quatre décisions, de la prise de poste à la signature.","dossierName":"Dossier de vacation","pileLabel":"Votre nuit","ambient":"hangar","hideTokens":true,"compLabel":"Facteurs (Dirty Dozen)","lamp":{"label":"APRS","colors":{"16":"green","8":"amber","19":"amber","5":"red"}},"resources":[],"costRes":null,"costIcon":null,"costName":"","tokens":{"TOT":"Le pare-brise a été fait en début de nuit, avant le creux de fin de nuit.","CONTROLE":"Vous avez prévu, dès la prise de poste, qu’un mécanicien licencié contrôlerait votre travail.","CATALOGUE":"Vous avez pris la référence des vis dans le catalogue illustré des pièces.","SERRAGE":"Vous avez serré avec un outil étalonné, au couple du manuel, en voyant chaque tête de vis.","FRAISURE":"Vous avez repéré les têtes trop enfoncées et remonté le pare-brise avec les bonnes vis.","SIGNE":"Vous avez signé la remise en service sans aucun contrôle."},"tokenIcons":{"TOT":"gauge","CONTROLE":"search","CATALOGUE":"doc","SERRAGE":"gauge","FRAISURE":"search","SIGNE":"doc"},"start":1,"decisions":{"1":{"idx":1,"title":"La prise de poste","front":[{"t":"Vendredi, 21 h 30. Vous prenez la vacation de nuit de l’atelier de maintenance en ligne. Deux absents : un superviseur et un mécanicien licencié. Le week-end, le renfort de nuit ne vient pas."},{"t":"Au programme : le remplacement du pare-brise gauche de l’avion 3, un biréacteur de la flotte régionale ; l’escale technique d’un B737 d’une autre compagnie ; trois défauts significatifs, la routine, la cabine."},{"t":"L’avion 3 ne vole que dimanche matin, mais son lavage est programmé à 6 h 30, en heures supplémentaires : l’équipe de lavage attend un avion prêt. Vous connaissez ce pare-brise par cœur."}],"notes":[],"tail":"","question":"Comment organisez-vous le pare-brise ?","options":[{"to":4,"text":"Vous lancez l’équipe sur le B737 et les défauts, et vous gardez le pare-brise pour vous, en fin de nuit, quand l’atelier sera calme.","cost":0,"cls":"C","short":"En fin de nuit, au calme"},{"to":7,"text":"Vous faites le pare-brise maintenant, en début de nuit, et vous prévenez le mécanicien licencié : il contrôlera votre travail avant la signature.","cost":0,"cls":"A","short":"Tôt, et un contrôle prévu"},{"to":12,"text":"Vous faites le pare-brise maintenant, pendant que vous êtes frais. L’équipe avance sans vous sur le reste : ils savent faire.","cost":0,"cls":"B","short":"Tôt, seul"}],"enter":[],"auto":[4,12],"key":{"tabs":["nuit"],"tab":"nuit","mark":"d1","note":"Votre nuit : première nuit après une heure et demie de sommeil, et le travail du chef d’équipe n’est revu par personne. Le seul second regard possible est celui que vous organisez."}},"9":{"idx":2,"title":"La vis","front":[{"t":"22 h 40.","if":"has:TOT"},{"t":"3 h 10.","if":"not:TOT"},{"t":"Le pare-brise est déposé. Plusieurs têtes de vis sont abîmées ou corrodées : vous décidez de remplacer les 90 vis."},{"t":"Vous tenez une vis déposée entre deux doigts. Tête fraisée, filetage fin, rien de particulier. Vos lunettes de lecture sont dans la poche de votre combinaison."}],"notes":[{"if":"not:TOT","head":"Vous","text":"Une heure et demie de sommeil avant la prise de poste. Les chiffres gravés sur les têtes dansent un peu."},{"if":"has:CONTROLE","head":"Équipe","text":"Le mécanicien licencié sait qu’il contrôlera votre travail en fin de tâche."}],"tail":"","question":"Comment trouvez-vous les vis de remplacement ?","options":[{"to":15,"text":"Vous ouvrez le catalogue illustré des pièces, lunettes sur le nez, et vous relevez la référence et la quantité.","cost":0,"cls":"A","short":"Le catalogue d’abord"},{"to":3,"text":"Vous allez au magasin avec la vis déposée : le magasinier l’identifiera, et vous prendrez les mêmes.","cost":0,"cls":"B","short":"Faire identifier la vis déposée"},{"to":18,"text":"Les mêmes que celles déposées : direction le carrousel libre-service de l’aérogare B, ouvert la nuit et plus proche que le magasin.","cost":0,"cls":"C","short":"Les mêmes, au carrousel"}],"enter":[],"auto":[18,3],"key":{"tabs":["ipc","amm"],"tab":"ipc","mark":"d9","note":"Catalogue, figure 12 : 90 vis VC 340-8D, tous avions. Manuel : une pièce s’identifie par sa référence, jamais par comparaison avec une pièce déposée."}},"14":{"idx":3,"title":"Le serrage","front":[{"t":"23 h 50.","if":"has:TOT"},{"t":"4 h 20.","if":"not:TOT"},{"t":"Le nouveau pare-brise est en place sur son joint. Il reste à serrer 90 vis."},{"t":"La clé dynamométrique du tableau d’outils va de 5 à 120 lbf·in : peu précise aux faibles couples. Le magasinier vous tend un tournevis limiteur de couple ; son étiquette d’étalonnage est échue."},{"t":"La plate-forme de nez est mal placée : pour atteindre la rangée du haut, il faut se pencher par-dessus le nez, hors de la rambarde. L’embout ne tient pas dans la douille : vous devez le tenir de la main gauche, qui cache la tête de la vis."}],"notes":[{"if":"not:TOT","head":"Vous","text":"Fin de première nuit. Vos gestes sont sûrs ; vos yeux, moins."}],"tail":"","question":"Comment serrez-vous ?","options":[{"to":20,"text":"Vous faites déplacer la plate-forme et chercher un outil étalonné au hangar principal, quitte à perdre vingt minutes. Vous serrez au couple du manuel, chaque tête sous les yeux.","cost":0,"cls":"A","short":"Plate-forme et outil étalonné"},{"to":2,"text":"Vous vérifiez le tournevis limiteur sur deux jauges et le réglez à 20 lbf·in, un peu au-dessus du manuel, par sécurité. La plate-forme reste où elle est.","cost":0,"cls":"B","short":"Tournevis vérifié, réglé un peu plus haut"},{"to":11,"text":"Tournevis ordinaire : sur des vis de cette taille, votre main connaît le couple depuis trente ans.","cost":0,"cls":"C","short":"Au jugé, à la main"}],"enter":[],"auto":[11,2],"key":{"tabs":["amm","outils"],"tab":"amm","mark":"d14","note":"Manuel : 15 lbf·in, avec un outil étalonné de plage adaptée. Magasin : le tournevis proposé est hors étalonnage ; un tournevis étalonné attend au hangar principal, à dix minutes, et la plate-forme se déplace en un quart d’heure."}},"6":{"idx":4,"title":"La signature","front":[{"t":"0 h 50.","if":"has:TOT"},{"t":"5 h 20.","if":"not:TOT"},{"t":"Le pare-brise est monté. L’équipe de lavage arrive à 6 h 30."},{"t":"Le remplacement d’un pare-brise ne figure pas dans la liste des points vitaux de l’atelier : aucune inspection double n’est exigée. Vous êtes habilité à certifier seul."}],"notes":[{"if":"has:CONTROLE","head":"Équipe","text":"Le mécanicien licencié que vous aviez prévenu termine un panneau sur le B737 : il peut venir dans dix minutes."},{"if":"not:CONTROLE","head":"Équipe","text":"Le mécanicien licencié est pris sur le B737 de l’autre compagnie, qui repart à 7 h."}],"tail":"","question":"Que faites-vous avant de rendre l’avion ?","options":[{"to":13,"text":"Vous faites le contrôle fonctionnel du chauffage du pare-brise, prévu par le manuel, puis vous signez la remise en service.","cost":0,"cls":"B","short":"Contrôle fonctionnel, puis signature"},{"to":17,"text":"Vous signez : le travail est fait, le lavage n’attendra pas, et la remise en service vous appartient.","cost":0,"cls":"C","short":"Signer et rendre l’avion"},{"to":10,"text":"Vous faites contrôler le montage par le mécanicien licencié, catalogue en main, même si rien ne l’exige.","cost":0,"cls":"A","short":"Faire contrôler, catalogue en main"}],"enter":[],"auto":[17,13],"key":{"tabs":["regles","amm"],"tab":"regles","mark":"d6","note":"Règles : une inspection double peut être demandée sur toute tâche. Manuel : le seul contrôle prévu porte sur le chauffage ; il ne dit rien de la fixation, que seule la pressurisation éprouvera."}}},"suites":{"7":{"front":[{"t":"« Pour un pare-brise ? D’accord, chef. » Le mécanicien licencié note de passer en fin de tâche."},{"t":"Vous répartissez l’équipe sur le B737 et les défauts, puis vous attaquez la dépose avec le superviseur avionique, qui débranche le chauffage."}],"changes":[{"tok":"TOT"},{"tok":"CONTROLE"}],"go":9,"debrief":[["Pourquoi c’était coûteux","Demander qu’on contrôle votre travail alors que vous êtes le plus expérimenté et que rien ne l’exige : on peut le vivre comme un aveu de faiblesse."],["Ce qui protège","Le chef d’équipe était le seul dont le travail n’était revu par personne. Un contrôle prévu dès la prise de poste crée la barrière qui manque, avant que la fatigue et l’heure ne la rendent pénible à demander."],["La limite","Faire le travail critique en début de nuit réduit la fatigue, sans l’annuler : vous n’avez dormi qu’une heure et demie."]],"comp":"Fatigue · Travail d'équipe"},"12":{"front":[{"t":"Vous répartissez l’équipe sur le B737 et les défauts, puis vous attaquez la dépose avec le superviseur avionique, qui débranche le chauffage."},{"t":"Dans l’atelier, personne ne vous attend : l’équipe sait où vous trouver."}],"changes":[{"tok":"TOT"}],"go":9,"debrief":[["Pourquoi c’était tentant","Vous êtes le plus expérimenté, vous êtes frais, et l’équipe est autonome. Faire le travail critique tôt, c’est même une bonne idée."],["Le piège","En prenant le chantier, vous quittez votre rôle : plus personne ne supervise l’atelier, et personne ne revoit votre travail. Votre expérience devient la seule barrière."],["Ce qui protège","Tôt, oui, mais avec un contrôle prévu. Ce qui fait défaut cette nuit n’est pas la compétence : c’est un second regard."]],"comp":"Travail d'équipe · Complaisance"},"4":{"front":[{"t":"L’équipe part sur le B737. Les défauts s’enchaînent, la nuit passe vite."},{"t":"Vers 3 h, l’atelier se calme. Vous attaquez la dépose du pare-brise avec le superviseur avionique, qui débranche le chauffage puis repart sur ses tâches."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","Au calme, sans interruption, en fin de nuit : c’est souvent là qu’on se garde le travail soigné. Et c’est ce que l’atelier fait d’habitude."],["Le piège","Entre 3 h et 5 h, à la fin d’une première nuit et après une heure et demie de sommeil, la vigilance et la perception visuelle sont au plus bas. Le rapport retient la privation de sommeil et les effets circadiens parmi les facteurs."],["Ce qui protège","Placer les tâches critiques tôt dans la vacation, et prévoir qui contrôlera."]],"comp":"Fatigue · Pression"},"15":{"front":[{"t":"Catalogue, figure 12, pare-brise gauche : 90 vis VC 340-8D, tous avions."},{"t":"Vous regardez la vis déposée sous la lampe : une VC 340-7D, un dixième de pouce plus courte. Le pare-brise précédent était monté avec des vis trop courtes."},{"t":"Au magasin, le tiroir des -8D est plein. Vous prenez vos 90 vis et notez l’écart pour un compte rendu : d’autres avions sont peut-être dans le même cas."}],"changes":[{"tok":"CATALOGUE"}],"go":14,"debrief":[["Pourquoi c’était coûteux","Ouvrir le catalogue pour une vis que l’on a dans la main, chausser ses lunettes : cinq minutes et un peu d’amour-propre."],["Ce qui protège","La référence vient d’une donnée approuvée, pas d’une pièce déposée. La pièce déposée peut être fausse : ici, elle l’était, et vous l’avez découvert."],["En plus","Signaler l’écart protège les autres avions. Après l’accident réel, d’autres avions de la flotte présentaient des vis trop courtes."]],"comp":"Normes · Connaissances"},"3":{"front":[{"t":"Le magasinier, seize ans de maison, fait tourner la vis sous sa lampe : « Une -7D. Il y a d’autres longueurs sur ces pare-brise, selon les avions, mais celle-là, c’est une -7D. »"},{"t":"Il ouvre le tiroir : quatre vis, pour un stock minimum de cinquante. Il vous en manque 86."},{"t":"Le carrousel libre-service de l’aérogare B en a sûrement. Sous l’aérogare, la lumière est faible, les étiquettes des casiers sont anciennes et délavées. Vous vous placez entre la lampe et le carrousel, et vous comparez les vis côte à côte avec la vôtre. Même tête, même filetage au toucher : vous remplissez votre sachet."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Demander au magasinier, c’est consulter quelqu’un qui connaît les pièces mieux que vous. Et prendre la même vis que celle qui était montée paraît la définition même du travail bien fait."],["Le piège","Le magasinier a identifié correctement la vis déposée ; c’est la vis déposée qui était fausse. Deux signaux faibles sont passés : « d’autres longueurs selon les avions », et un tiroir presque vide pour une vis censée être courante. Puis le carrousel : sans éclairage, sans étiquettes, sans lunettes."],["Ce qui protège","Identifier par la référence du catalogue, jamais par comparaison. Et quand un signal ne colle pas, comme un stock presque vide, s’arrêter pour comprendre."]],"comp":"Normes · Communication · Ressources"},"18":{"front":[{"t":"Le carrousel libre-service de l’aérogare B est à deux minutes. Sous l’aérogare, la lumière est faible, les étiquettes des casiers sont anciennes et délavées."},{"t":"Vous vous placez entre la lampe et le carrousel et comparez les vis côte à côte avec la vôtre. Même tête, même filetage au toucher : vous remplissez votre sachet de 90 vis."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Remplacer à l’identique est un réflexe de métier, et le carrousel évite le détour par le magasin. Trente ans d’expérience : vous savez reconnaître une vis."],["Le piège","Remplacer à l’identique recopie l’erreur de la pièce déposée. Et la comparaison à l’œil, dans la pénombre, sans lunettes, ne distingue pas un diamètre de 0,66 mm de moins."],["Ce qui protège","La référence d’abord, dans le catalogue applicable. Un carrousel non surveillé n’est pas une source de pièces fiable."]],"comp":"Normes · Ressources · Vigilance"},"20":{"front":[{"t":"Vingt minutes plus tard, la plate-forme est en face du pare-brise et vous avez un tournevis étalonné du hangar principal. Vous serrez en croix, au couple du manuel, chaque tête de vis sous les yeux."},{"t":"Les têtes affleurent, comme sur le pare-brise droit.","if":"has:CATALOGUE"},{"t":"Sous la lampe, quelque chose accroche votre regard : un anneau de fraisure vide autour de chaque tête. Elles s’enfoncent trop. Sur le pare-brise droit, les têtes affleurent. Vous retournez au catalogue : 90 vis VC 340-8D. Dans votre sachet : des -8C, même longueur, diamètre plus petit. Vous déposez tout et recommencez avec les bonnes vis.","if":"not:CATALOGUE&has:TOT"},{"t":"Un léger liseré autour des têtes, peut-être. À cette heure-ci, vous l’attribuez à l’état de modification de l’avion, et vous continuez.","if":"not:CATALOGUE&not:TOT"}],"changes":[{"tok":"SERRAGE"},{"tok":"FRAISURE","if":"not:CATALOGUE&has:TOT"}],"go":6,"debrief":[["Pourquoi c’était coûteux","Déplacer une plate-forme et aller chercher un outil à l’autre bout de la base, pour 90 petites vis et vingt minutes de nuit."],["Ce qui protège","Un poste de travail en face de la pièce, un outil étalonné de plage adaptée, le couple du manuel : ce sont aussi les conditions pour voir. Avec de mauvaises vis, l’anneau de fraisure vide était visible ; encore fallait-il pouvoir le regarder, et être assez frais pour l’interpréter."],["La limite","En fin de nuit, voir ne suffit pas : on explique ce qu’on voit par ce qu’on attend. Le chef d’équipe réel a lui-même attribué une différence de vis à l’état de modification des avions."]],"comp":"Ressources · Vigilance · Fatigue"},"2":{"front":[{"t":"Deux jauges confirment le réglage : 20 lbf·in. Penché par-dessus le nez, la main gauche sur l’embout, vous serrez vis après vis. Le déclic arrive comme d’habitude : la sensation est celle que vous attendez."},{"t":"Vous ne voyez pas les têtes : votre main les cache."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","Vérifier l’outil sur deux jauges, serrer un peu plus que le manuel « par sécurité » : tout cela ressemble à de la rigueur. C’est exactement ce qu’a fait le chef d’équipe réel."],["Le piège","Un outil hors étalonnage reste hors étalonnage, et un couple au-dessus du manuel n’est pas une marge : c’est un écart. Surtout, la position de travail empêchait de voir les têtes, et une vis trop fine dans un écrou trop grand donne le même déclic qu’une bonne vis."],["Ce qui protège","Le couple du manuel, un outil étalonné, et un poste de travail qui permet de voir ce qu’on serre."]],"comp":"Normes · Ressources · Complaisance"},"11":{"front":[{"t":"Vous serrez au tournevis ordinaire, au jugé, en croix. Ferme, sans forcer. La plate-forme est mal placée : vous travaillez au bout du bras, la main gauche sur l’embout."},{"t":"Vous ne voyez pas les têtes : votre main les cache."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","Sur de petites vis, beaucoup d’ateliers serrent « à la main » : l’outil dynamométrique paraît réservé aux gros couples. Votre main a trente ans de métier."],["Le piège","C’est une norme : une pratique non conforme, devenue habituelle parce qu’elle n’a jamais posé de problème. Le couple n’est plus maîtrisé, et rien ne signale une vis qui prend mal."],["Ce qui protège","Le couple du manuel, avec l’outil prévu. Une habitude se juge à la règle, pas au nombre de fois où elle a marché."]],"comp":"Normes · Complaisance"},"10":{"front":[{"t":"« Contrôler un pare-brise ? » Le mécanicien licencié vient quand même, prend le catalogue et une lampe."},{"t":"Il compare les références, regarde les têtes, vérifie quelques couples. « Rien à dire. » Vous signez la remise en service.","if":"has:CATALOGUE|has:FRAISURE"},{"t":"Il s’arrête sur la première rangée : « Tes têtes s’enfoncent. C’est quoi, ta référence ? » Le catalogue dit -8D. Votre sachet contient des -8C : même longueur, diamètre plus petit. Et quelques -7D, trop courtes.","if":"not:CATALOGUE&not:FRAISURE"}],"changes":[],"goto":[{"if":"has:CATALOGUE|has:FRAISURE","to":16,"label":"Avec le jeton CATALOGUE ou le jeton FRAISURE"},{"to":8,"label":"Sinon"}],"debrief":[["Pourquoi c’était coûteux","Demander un contrôle que rien n’exige, à 5 h, à un collègue occupé, quand on est le chef : il faut le vouloir."],["Ce qui protège","Le rapport conclut qu’une inspection indépendante aurait probablement détecté l’erreur. Un second regard, catalogue en main, voit ce que la fatigue et l’habitude cachent à celui qui a fait le travail."],["La limite","Un contrôle vaut ce qu’il regarde : un coup d’œil sans le catalogue n’aurait rien vu."]],"comp":"Travail d'équipe · Assertivité"},"13":{"front":[{"t":"Chauffage alimenté : le pare-brise chauffe normalement. Vous signez la remise en service : « contrôle fonctionnel satisfaisant »."},{"t":"En passant, le mécanicien que vous aviez prévenu s’arrête devant le nez : « Je regarde quand même. » Il s’arrête sur la première rangée : « Tes têtes s’enfoncent. »","if":"has:CONTROLE&not:CATALOGUE&not:FRAISURE"}],"changes":[],"goto":[{"if":"has:CATALOGUE&has:SERRAGE|has:FRAISURE","to":16,"label":"Avec CATALOGUE et SERRAGE, ou avec FRAISURE"},{"if":"has:CATALOGUE","to":19,"label":"Avec le jeton CATALOGUE seul"},{"if":"has:CONTROLE","to":8,"label":"Avec le jeton CONTROLE"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","Le manuel prévoit ce contrôle, il est réussi, la signature est conforme aux règles de l’atelier. C’est ce qu’a fait le chef d’équipe réel."],["Le piège","Le contrôle fonctionnel vérifie que le chauffage chauffe. Il ne dit rien de la fixation. Le premier essai réel du montage, c’était la pressurisation, en vol, avec des passagers."],["Ce qui protège","Se demander ce que le contrôle prouve vraiment. Et sur une tâche dont une erreur ne se verrait qu’en vol, demander un second regard, même non exigé."]],"comp":"Complaisance · Vigilance"},"17":{"front":[{"t":"Vous signez la remise en service. L’équipe de lavage arrive à l’heure ; l’avion 3 est prêt."},{"t":"En partant, le mécanicien que vous aviez prévenu passe devant le nez : « Je regarde quand même. » Il s’arrête sur la première rangée : « Tes têtes s’enfoncent. »","if":"has:CONTROLE&not:CATALOGUE&not:FRAISURE"}],"changes":[{"tok":"SIGNE"}],"goto":[{"if":"has:CATALOGUE|has:FRAISURE","to":19,"label":"Avec le jeton CATALOGUE ou le jeton FRAISURE"},{"if":"has:CONTROLE","to":8,"label":"Avec le jeton CONTROLE"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","Les règles vous y autorisent, le lavage attend, et vous avez fait ce travail des dizaines de fois."],["Le piège","L’auto-certification sans aucun essai fait de vous la seule barrière, à la fin d’une nuit. Le rapport retient précisément cela : une tâche critique, confiée à une seule personne, jamais testée avant un vol commercial."],["Ce qui protège","Au minimum, le contrôle prévu par le manuel ; mieux, un second regard. Ce que la règle n’exige pas, le chef d’équipe peut le demander."]],"comp":"Complaisance · Pression"}},"fins":{"16":{"n":1,"title":"Avion prêt","front":[{"t":"L’équipe de lavage trouve un avion prêt. Dimanche matin, l’avion 3 décolle à l’heure, monte vers son niveau de croisière ; la cabine se pressurise, le pare-brise tient."},{"t":"Personne, à bord, ne saura jamais rien de votre nuit."}],"changes":[],"question":"Un collègue : « Tu t’es compliqué la nuit pour un pare-brise. » Que lui répondez-vous ?","back":"Vos barrières ont fait cette fin : la bonne référence, un serrage dans de bonnes conditions, ou un second regard qui rattrape ce que la nuit cache. Le chef d’équipe réel, compétent et respecté, n’en a dressé aucune cette nuit-là.","sound":"takeoff"},"8":{"n":2,"title":"Rattrapé au sol","front":[{"t":"Le pare-brise est déposé une seconde fois et remonté avec 90 vis VC 340-8D, au couple du manuel. Le lavage est décalé d’une heure ; l’avion part à l’heure dimanche."},{"t":"Vous rédigez un compte rendu d’événement. Le lundi, le service qualité fait vérifier les pare-brise des autres avions de la flotte."}],"changes":[],"question":"Le chef d’atelier vous demande ce compte rendu. Qu’y écrivez-vous, en plus de « mauvaises vis » ?","back":"Une erreur rattrapée au sol, c’est le système qui fonctionne : le second regard a fait ce que la fatigue empêchait. Le compte rendu vaut surtout par ce qu’il dit des conditions : stock, carrousel, outillage, plate-forme, absence de contrôle prévu.","sound":"stop"},"19":{"n":3,"title":"Il a tenu","front":[{"t":"Dimanche, l’avion 3 décolle à l’heure. Le pare-brise tient."},{"t":"Trois semaines plus tard, un audit qualité épluche vos dossiers de la nuit."},{"t":"Il relève un serrage fait hors des conditions du manuel : outil hors étalonnage ou serrage au jugé, couple différent, poste de travail inadapté.","if":"not:SERRAGE"},{"t":"Il relève une remise en service signée sans aucun contrôle, pas même celui que prévoit le manuel.","if":"has:SIGNE"}],"changes":[],"question":"À l’auditeur, vous répondez : « L’avion vole très bien. » Qui a raison ?","back":"Une bonne issue ne fait pas une bonne pratique. Les bonnes vis vous ont protégé ; le reste relevait de normes d’atelier qui ne posent problème que le jour où une autre barrière manque. C’est ainsi qu’elles durent : le rapport réel parle d’un manquement ancien aux procédures, que rien n’avait jamais révélé.","sound":"takeoff"},"5":{"n":4,"title":"17 300 ft","front":[{"t":"Dimanche, 8 h 20. L’avion 3 décolle avec 81 passagers. Treize minutes plus tard, il monte à travers 17 300 ft ; la cabine pressurisée pousse sur le pare-brise de toute sa force."},{"t":"Une détonation. Le pare-brise gauche est arraché. Le commandant est aspiré à moitié hors du poste ; un steward le saisit par les jambes, d’autres le relaient. Le copilote reprend l’avion, descend, se pose 22 minutes plus tard. Le commandant survit, gravement blessé."}],"changes":[],"question":"L’enquêteur : « Pourquoi ces vis-là ? » Que répondez-vous ?","back":"Vous avez rencontré l’issue réelle. Aucune de vos décisions n’était absurde ; chacune avait une raison. C’est leur enchaînement, sans aucune barrière pour l’interrompre, qui a envoyé en vol un pare-brise que rien n’avait jamais testé. Le débriefing va reprendre la chaîne, maillon par maillon.","sound":"decompress"}},"dossier":[{"id":"nuit","label":"Votre nuit","html":"<div class=\"kicker\">Dossier de vacation · 1/5<\/div><h1>Votre nuit<\/h1>\n<p class=\"lead\">Vendredi, vacation de nuit, atelier de maintenance en ligne d’une compagnie régionale. Prise de poste : 21 h 30.<\/p>\n<div class=\"cols\"><div><h2>Vous<\/h2><table class=\"cast\"><tr><td>Fonction<\/td><td>Chef d’équipe de nuit : vous répartissez le travail, vous supervisez, vous certifiez.<\/td><\/tr><tr><td>Expérience<\/td><td>Trente ans de métier, habilité sur quatre types d’avions. Réputé pour votre sérieux.<\/td><\/tr><tr data-key=\"d1\"><td>Repos<\/td><td>Première nuit de votre série. Couché vers 17 h 30, réveillé à 20 h 30 : environ une heure et demie de sommeil. Arrivé trois quarts d’heure en avance.<\/td><\/tr><tr><td>Vue<\/td><td>Presbyte : lunettes de lecture, que vous portez peu à l’atelier.<\/td><\/tr><\/table>\n<h2>Équipe<\/h2><table class=\"cast\"><tr><td>Présents<\/td><td>Vous ; un mécanicien licencié ; un mécanicien non licencié (cellule et moteurs) ; un superviseur avionique ; un technicien avionique ; un magasinier.<\/td><\/tr><tr><td>Absents<\/td><td>Un superviseur et un mécanicien licencié (congés, maladie). Le renfort de nuit ne vient pas le week-end.<\/td><\/tr><tr data-key=\"d1\"><td>Organisation<\/td><td>Le travail de chaque mécanicien est revu par son chef d’équipe. Le travail du chef d’équipe de nuit n’est revu par personne.<\/td><\/tr><\/table><\/div>\n<div><h2>Travaux de la nuit<\/h2><table class=\"cast\"><tr><td>Avion 3<\/td><td>Remplacement du pare-brise gauche (pièce neuve livrée). Lavage programmé à 6 h 30, en heures supplémentaires. Prochain vol : dimanche, 8 h 20.<\/td><\/tr><tr><td>B737, autre compagnie<\/td><td>Escale technique, départ samedi 7 h.<\/td><\/tr><tr><td>Flotte<\/td><td>Trois défauts significatifs, travaux de routine, défauts cabine mineurs.<\/td><\/tr><\/table>\n<div class=\"box tint\"><p style=\"margin:0\">Consigne du chef d’atelier : les heures supplémentaires du lavage sont payées ; ne faites pas attendre l’équipe.<\/p><\/div><\/div><\/div>\n<p class=\"small\">Atelier, compagnie, avion et personnes transposés. Le scénario suit un événement réel présenté au débriefing.<\/p>"},{"id":"amm","label":"Manuel de maintenance","html":"<div class=\"kicker\">Dossier de vacation · 2/5<\/div><h1>Manuel de maintenance · extrait<\/h1>\n<p class=\"lead\">Tâche 56-11 · Pare-brise gauche du poste : dépose et pose.<\/p>\n<div class=\"cols\"><div><h2>Procédure<\/h2><table><tr><th>Étape<\/th><th>Action<\/th><\/tr><tr><td>1<\/td><td>Débrancher le chauffage du pare-brise. Déposer les baguettes de finition.<\/td><\/tr><tr><td>2<\/td><td>Déposer les vis de fixation (90). Références et quantités : catalogue illustré des pièces, figure 12.<\/td><\/tr><tr><td>3<\/td><td>Déposer le pare-brise. Nettoyer le cadre ; contrôler l’état des écrous prisonniers.<\/td><\/tr><tr><td>4<\/td><td>Poser le pare-brise neuf sur joint neuf.<\/td><\/tr><tr data-key=\"d14\"><td>5<\/td><td>Serrer les vis en croix au couple de 15 lbf·in (1,7 N·m), outil étalonné de plage adaptée.<\/td><\/tr><tr><td>6<\/td><td>Recontrôler le couple après les 100 premières heures de vol.<\/td><\/tr><tr data-key=\"d6\"><td>7<\/td><td>Rebrancher le chauffage. Contrôle fonctionnel du chauffage pare-brise.<\/td><\/tr><\/table><\/div>\n<div><h2>Généralités<\/h2><table class=\"cast\"><tr data-key=\"d9\"><td>Pièces de rechange<\/td><td>Toute pièce s’identifie par sa référence dans le catalogue applicable, jamais par comparaison avec une pièce déposée.<\/td><\/tr><tr><td>Outillage<\/td><td>Clé ou tournevis dynamométrique étalonné, de plage adaptée au couple (par exemple 5 à 30 lbf·in).<\/td><\/tr><tr><td>Montage<\/td><td>Ce pare-brise se monte par l’extérieur : la pression cabine tend à le pousser vers l’extérieur, et les vis reprennent cet effort.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Extrait reconstitué pour le jeu : il ne reproduit le manuel d’aucun constructeur.<\/p>"},{"id":"ipc","label":"Catalogue des pièces","html":"<div class=\"kicker\">Dossier de vacation · 3/5<\/div><h1>Catalogue illustré des pièces · figure 12<\/h1>\n<p class=\"lead\">Chapitre 56 · Fenêtres du poste. Pare-brise gauche.<\/p>\n<div style=\"max-width:600px\"><svg viewBox=\"0 0 600 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" role=\"img\" aria-label=\"Figure 12 : pare-brise gauche et ses vis de fixation\">\n<rect width=\"600\" height=\"270\" fill=\"#fbfbf9\"/>\n<path d=\"M60 50 L 510 50 L 512 232 L 40 240 Z\" fill=\"#e3edf4\" stroke=\"#2b2f36\" stroke-width=\"2\"/>\n<g fill=\"#2b2f36\"><circle cx=\"70\" cy=\"58\" r=\"3\"/><circle cx=\"48\" cy=\"232\" r=\"3\"/><circle cx=\"84\" cy=\"58\" r=\"3\"/><circle cx=\"62\" cy=\"232\" r=\"3\"/><circle cx=\"99\" cy=\"58\" r=\"3\"/><circle cx=\"77\" cy=\"232\" r=\"3\"/><circle cx=\"114\" cy=\"58\" r=\"3\"/><circle cx=\"92\" cy=\"232\" r=\"3\"/><circle cx=\"128\" cy=\"58\" r=\"3\"/><circle cx=\"106\" cy=\"232\" r=\"3\"/><circle cx=\"142\" cy=\"58\" r=\"3\"/><circle cx=\"120\" cy=\"232\" r=\"3\"/><circle cx=\"157\" cy=\"58\" r=\"3\"/><circle cx=\"135\" cy=\"232\" r=\"3\"/><circle cx=\"172\" cy=\"58\" r=\"3\"/><circle cx=\"150\" cy=\"232\" r=\"3\"/><circle cx=\"186\" cy=\"58\" r=\"3\"/><circle cx=\"164\" cy=\"232\" r=\"3\"/><circle cx=\"200\" cy=\"58\" r=\"3\"/><circle cx=\"178\" cy=\"232\" r=\"3\"/><circle cx=\"215\" cy=\"58\" r=\"3\"/><circle cx=\"193\" cy=\"232\" r=\"3\"/><circle cx=\"230\" cy=\"58\" r=\"3\"/><circle cx=\"208\" cy=\"232\" r=\"3\"/><circle cx=\"244\" cy=\"58\" r=\"3\"/><circle cx=\"222\" cy=\"232\" r=\"3\"/><circle cx=\"258\" cy=\"58\" r=\"3\"/><circle cx=\"236\" cy=\"232\" r=\"3\"/><circle cx=\"273\" cy=\"58\" r=\"3\"/><circle cx=\"251\" cy=\"232\" r=\"3\"/><circle cx=\"288\" cy=\"58\" r=\"3\"/><circle cx=\"266\" cy=\"232\" r=\"3\"/><circle cx=\"302\" cy=\"58\" r=\"3\"/><cir cx=\"500\" cy=\"198\" r=\"3\"/><circle cx=\"38\" cy=\"208\" r=\"3\"/><circle cx=\"500\" cy=\"208\" r=\"3\"/><circle cx=\"37\" cy=\"219\" r=\"3\"/><circle cx=\"499\" cy=\"219\" r=\"3\"/><\/g>\n<text x=\"250\" y=\"150\" fill=\"#3d6f96\" font-weight=\"600\">10 · pare-brise gauche<\/text>\n<path d=\"M520 58 L 560 40\" stroke=\"#2b2f36\"/><text x=\"530\" y=\"34\" font-weight=\"700\">20<\/text>\n<text x=\"40\" y=\"262\" fill=\"#444\">Vue extérieure · 90 vis à tête fraisée (repère 20)<\/text>\n<\/svg><\/div>\n<table><tr><th>Rep.<\/th><th>Désignation<\/th><th>Référence<\/th><th>Qté<\/th><\/tr><tr><td class='num'>10<\/td><td>Pare-brise gauche, chauffant<\/td><td style='white-space:nowrap'><b>PB 56-110-3<\/b><\/td><td class='num'>1<\/td><\/tr><tr data-key=\"d9\"><td class='num'>20<\/td><td>Vis de fixation, tête fraisée 100°<\/td><td style='white-space:nowrap'><b>VC 340-8D<\/b><\/td><td class='num'>90<\/td><\/tr><tr><td class='num'>30<\/td><td>Écrou prisonnier<\/td><td style='white-space:nowrap'><b>EP 22-10<\/b><\/td><td class='num'>90<\/td><\/tr><tr><td class='num'>40<\/td><td>Joint de pare-brise<\/td><td style='white-space:nowrap'><b>JT 56-118<\/b><\/td><td class='num'>1<\/td><\/tr><tr><td class='num'>50<\/td><td>Baguette de finition<\/td><td style='white-space:nowrap'><b>BG 56-120<\/b><\/td><td class='num'>4<\/td><\/tr><\/table>\n<p class=\"small\">Applicabilité : tous avions de la flotte, tous standards de modification.<\/p>\n<div class=\"box tint\"><p style=\"margin:0\"><b>Lire une référence de vis VC 340<\/b><br>Le chiffre après le tiret donne la longueur, en dixièmes de pouce : -7 = 0,7 in ; -8 = 0,8 in. La lettre donne le diamètre et le filetage : C = n° 8-32 ; D = n° 10-32. Une -8C a la longueur d’une -8D, mais un diamètre inférieur de 0,66 mm.<\/p><\/div>\n<p class=\"small\">Références fictives, reconstituées pour le jeu.<\/p>"},{"id":"outils","label":"Magasin et outillage","html":"<div class=\"kicker\">Dossier de vacation · 4/5<\/div><h1>Magasin et outillage<\/h1>\n<div class=\"cols\"><div><h2>Stock · vis de pare-brise<\/h2><table><tr><th>Référence<\/th><th>Stock<\/th><th>Mini<\/th><th>Emplacement<\/th><\/tr><tr><td><b>VC 340-7D<\/b><\/td><td class='num'>4<\/td><td class='num'>50<\/td><td>Magasin principal, tiroir 14<\/td><\/tr><tr><td><b>VC 340-8C<\/b><\/td><td class='num'>210<\/td><td class='num'>50<\/td><td>Magasin principal, tiroir 15<\/td><\/tr><tr><td><b>VC 340-8D<\/b><\/td><td class='num'>160<\/td><td class='num'>50<\/td><td>Magasin principal, tiroir 16<\/td><\/tr><tr><td><b>VC 340-9D<\/b><\/td><td class='num'>80<\/td><td class='num'>30<\/td><td>Magasin principal, tiroir 17<\/td><\/tr><\/table>\n<h2>Carrousel<\/h2><table class=\"cast\"><tr><td>Carrousel libre-service<\/td><td>Sous l’aérogare B. Ouvert la nuit, non surveillé, contenu non inventorié.<\/td><\/tr><tr><td>Éclairage<\/td><td>Une lampe murale.<\/td><\/tr><tr><td>Étiquettes<\/td><td>Anciennes ; plusieurs délavées ou illisibles.<\/td><\/tr><\/table><\/div>\n<div><h2>Outillage disponible cette nuit<\/h2><table class=\"cast\"><tr><td>Clé dynamométrique à cadran<\/td><td>Plage 5 à 120 lbf·in. Étalonnée. Tableau d’outils de l’atelier en ligne.<\/td><\/tr><tr data-key=\"d14\"><td>Tournevis limiteur de couple n° 14<\/td><td>Plage 5 à 40 lbf·in. Magasin de l’atelier en ligne. Étalonnage échu depuis quatre mois.<\/td><\/tr><tr><td>Tournevis limiteur de couple n° 22<\/td><td>Plage 5 à 40 lbf·in. Étalonné. Hangar principal, à dix minutes à pied.<\/td><\/tr><tr><td>Plate-forme de nez<\/td><td>Déplaçable : deux personnes, une quinzaine de minutes.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">État au vendredi 21 h.<\/p>"},{"id":"regles","label":"Règles de l'atelier","html":"<div class=\"kicker\">Dossier de vacation · 5/5<\/div><h1>Règles de l'atelier · extrait<\/h1>\n<div class=\"cols\"><div><h2>Liste des points vitaux<\/h2><ul><li>Commandes de vol : tout démontage ou réglage<\/li><li>Commandes moteurs et hélices<\/li><li>Trains d’atterrissage : verrouillages<\/li><li>Circuits carburant : raccords haute pression<\/li><li>Toute tâche désignée par le bureau technique<\/li><\/ul>\n<p class=\"small\">Le remplacement des pare-brise ne figure pas dans la liste.<\/p><\/div>\n<div><h2>Contrôles et certification<\/h2><table class=\"cast\"><tr><td>Points vitaux<\/td><td>Une erreur de montage sur un point vital peut compromettre le vol : l’inspection double est obligatoire, par une seconde personne habilitée qui n’a pas fait le travail.<\/td><\/tr><tr data-key=\"d6\"><td>Inspection double hors points vitaux<\/td><td>Possible sur toute tâche, à la demande du certificateur ou du chef d’équipe.<\/td><\/tr><tr><td>Auto-certification<\/td><td>Hors points vitaux, un mécanicien habilité peut certifier seul son propre travail, après les contrôles prévus par le manuel.<\/td><\/tr><tr><td>Remise en service<\/td><td>Signée par le certificateur. L’avion est alors réputé apte au vol.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Règles reconstituées pour le jeu.<\/p>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"24\" cy=\"24\" r=\"16\"/><path d=\"M24 14v10l7 5\"/><path d=\"M33 9a10 10 0 1 0 6 6\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M16 10h16l-8 8z\"/><path d=\"M24 18v22\"/><path d=\"M20 22l8 3M20 28l8 3M20 34l8 3\"/><\/svg>","14":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M10 38l14-14\"/><rect x=\"22\" y=\"10\" width=\"8\" height=\"18\" rx=\"3\" transform=\"rotate(45 26 19)\"/><path d=\"M34 30a8 8 0 1 0 4-10\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M8 40h32\"/><path d=\"M14 34l20-20 4 4-20 20H14z\"/><path d=\"M30 18l4 4\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M10 28l24-10 6 1-4 5-22 8z\"/><path d=\"M22 22l-4-8h4l8 6\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"20\" cy=\"20\" r=\"10\"/><path d=\"M27 27l12 12\"/><path d=\"M15 20h10\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 34h36\"/><path d=\"M10 28l24-10 6 1-4 5-22 8z\"/><path d=\"M38 8v8M38 20v1\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M8 12h32l-4 24H12z\"/><path d=\"M18 16l6 8-4 4 8 6M30 14l-3 6\"/><\/svg>"},"brief":"Vous êtes chef d’équipe de nuit dans l’atelier de maintenance en ligne d’une compagnie régionale. Lisez votre dossier de vacation comme à chaque prise de poste.","eval":{"questions":[{"t":"Pour identifier une pièce de rechange, la référence fait foi si elle provient :","type":"single","options":["De la pièce déposée","Du catalogue illustré des pièces applicable","D’un collègue expérimenté","De l’étiquette du casier"],"answer":1,"notion":"Données approuvées"},{"t":"Quels facteurs dégradent la détection d’une erreur en fin de nuit ?","type":"multi","options":["Le manque de sommeil","Le creux circadien","Un éclairage faible","Un travail que personne ne revoit","Un outil étalonné"],"answer":[0,1,2,3],"notion":"Fatigue et conditions de travail"},{"t":"Qu’appelle-t-on une norme, au sens des facteurs humains en maintenance ?","type":"open","expected":"Une pratique non conforme devenue habituelle et tolérée par le groupe, parce qu’elle n’a jamais posé de problème","notion":"Normes (Dirty Dozen)"},{"t":"« Un contrôle fonctionnel réussi prouve que la pièce est correctement fixée. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Ce que prouve un contrôle"},{"t":"« Quand une tâche n’impose pas d’inspection double, il est inutile d’en demander une. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Second regard non exigé"},{"t":"Un avion qui vole sans incident après votre intervention prouve-t-il que votre travail était conforme ?","type":"single","options":["Oui : le vol le démontre","Non : la conformité se juge à la règle et aux données, pas à l’issue","Seulement après 100 heures de vol"],"answer":1,"notion":"Biais de résultat"}],"q7":"« Je me sens capable de demander un contrôle de mon travail, même quand rien ne l’exige. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les choix étaient difficiles : aucune option n’était évidente.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de vacation ressemblait à un vrai dossier.","La durée était adaptée."],"yn":["Connaissiez-vous l’événement réel avant la séance ?"],"choice":[{"t":"À quel moment avez-vous reconnu l’événement réel ?","options":["Dès le dossier de vacation","À la décision 2 (la vis)","À la décision 3 (le serrage)","À la fin","Je ne l’ai pas reconnu"]}],"open":["Quel choix vous a paru le plus difficile, et pourquoi ?","Qu’est-ce qui vous a semblé irréaliste ou confus ?"],"application":"À votre prochaine vacation, quelle tâche ferez-vous contrôler alors que rien ne l’exige ?"},"criteria":{"traps":[3,13],"fin_max":70,"fin1":null,"extra":[["Reconnaissance de l'événement (avis)","comparer les choix de ceux qui l'ont reconnu avant la décision 3 et des autres"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un mécanicien licencié","aucune réserve technique majeure"]]},"pressureLimit":60,"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\">Comprendre comment un mécanicien compétent envoie en vol un pare-brise mal fixé : la fatigue, les normes, les signaux faibles, et les barrières absentes. Trois règles : faire parler avant d’expliquer ; analyser des décisions, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Tour de table rapide, avant toute explication. Afficher les réactions saisies au tableau de bord.<\/div><div class=\"l\">Demander<\/div><div>« En un mot : qu’avez-vous ressenti en découvrant la fin ? » puis « À quel moment avez-vous pensé que quelque chose clochait ? »<\/div><div class=\"l\">Repère<\/div><div>Ceux qui arrivent en fin 4 n’ont pas fait de faute grossière : c’est le cœur de la séance.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Les choix du groupe<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Projeter la répartition des choix et des fins, puis l’avis « À quel moment avez-vous reconnu l’événement réel ? »<\/div><div class=\"l\">Demander<\/div><div>« Qui a ouvert le catalogue avant de choisir les vis ? Qui a ouvert la page des règles avant de signer ? »<\/div><div class=\"l\">Repère<\/div><div>Le dossier contenait la bonne référence. La question n’est pas de la connaître, mais de la chercher quand on croit déjà savoir.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:07<small>5 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter la nuit, puis le vol, à partir de la chronologie de la fiche mémo, sans la lire : une heure et demie de sommeil, la vis déposée, le magasinier, le carrousel, le tournevis, la signature, puis 17 300 ft.<\/div><div class=\"l\">Dire<\/div><div>Le chef d’équipe réel avait trente-trois ans de métier et une excellente réputation. Le rapport ne décrit pas un mauvais mécanicien : il décrit des pratiques installées, et un système qui ne les voyait pas.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:12<small>6 min<\/small><\/div><div><h3>La chaîne et les barrières<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Reprendre la table des barrières : pour chacune, ce qui aurait pu interrompre la chaîne.<\/div><div class=\"l\">Demander<\/div><div>« Combien de maillons fallait-il casser pour éviter l’accident ? » · « Lesquels dépendaient du chef d’équipe, lesquels de l’organisation ? »<\/div><div class=\"l\">Repère<\/div><div>Un seul suffisait. C’est le sens du constat du rapport : chacune des erreurs aurait pu être interrompue.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:18<small>4 min<\/small><\/div><div><h3>Les normes et le biais de résultat<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Comparer les fins 3 et 4 : mêmes pratiques de serrage et de signature, issues opposées.<\/div><div class=\"l\">Demander<\/div><div>« Dans votre atelier, quelle pratique tient seulement parce qu’elle n’a jamais posé de problème ? »<\/div><div class=\"l\">Repère<\/div><div>Une norme se juge à la règle, pas au nombre de fois où elle a marché.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:22<small>4 min<\/small><\/div><div><h3>Ce que recommande le rapport<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter les recommandations de la fiche mémo : auto-certification et points vitaux, assurance qualité, surveillance des pratiques réelles, formation continue, verres correcteurs.<\/div><div class=\"l\">Demander<\/div><div>« Laquelle existe chez nous ? Laquelle manque ? Qui la porterait ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:26<small>2 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler quatre distinctions : référence et échantillon · contrôle fonctionnel et contrôle de montage · inspection double et auto-certification · bonne issue et bonne pratique.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir. Distribuer ou projeter la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« À votre prochaine vacation, quelle tâche ferez-vous contrôler alors que rien ne l’exige ? » Puis tour de table.<\/div><\/div><\/div><\/div><div class=\"box tint small\">Si le groupe cherche un coupable : rappeler que le rapport décrit aussi l’organisation qui n’a rien vu (audits, surveillance, liste des points vitaux), et que l’enquête vise la prévention, pas la sanction.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · le cas réel<\/div><h1>Le cas réel<\/h1>\n<p class=\"lead\">Juin 1990, un BAC One-Eleven de British Airways, vol BA 5390 Birmingham–Malaga. Sur 90 vis, 84 avaient un diamètre trop petit et 6 étaient trop courtes. Rapport d’enquête : AAIB 1/92.<\/p>\n<div class=\"tl\"><div class=\"ev\"><span class=\"h\">Vendredi 8 juin<\/span><span>Le chef d’équipe de nuit dort environ une heure et demie avant sa première nuit. Équipe réduite : un superviseur et un mécanicien licencié absents.<\/span><\/div><div class=\"ev\"><span class=\"h\">Vers 3 h à 5 h<\/span><span>Il décide de remplacer lui-même le pare-brise gauche, pour que l’avion soit prêt pour l’équipe de lavage. Il consulte brièvement le manuel de maintenance, pas le catalogue des pièces.<\/span><\/div><div class=\"ev\"><span class=\"h\">Au magasin<\/span><span>Le magasinier identifie la vis déposée : une A211-7D, trop courte d’un dixième de pouce. Il en reste quatre ou cinq, pour un stock minimum de 50.<\/span><\/div><div class=\"ev\"><span class=\"h\">Au carrousel<\/span><span>Carrousel non surveillé, éclairage faible, étiquettes délavées, sans lunettes : il compare les vis côte à côte. Il prend des A211-8C, de diamètre inférieur de 0,026 in (0,66 mm), au lieu des A211-8D prescrites.<\/span><\/div><div class=\"ev\"><span class=\"h\">Le serrage<\/span><span>Tournevis limiteur hors étalonnage, réglé à 20 lbf·in au lieu de 15. Plate-forme mal placée, main gauche sur l’embout : les têtes trop enfoncées ne sont pas vues.<\/span><\/div><div class=\"ev\"><span class=\"h\">La signature<\/span><span>Contrôle fonctionnel du chauffage. Pas de point vital, donc pas d’inspection double. Il certifie seul.<\/span><\/div><div class=\"ev\"><span class=\"h\">Dimanche 10 juin, 7 h 20 UTC<\/span><span>Décollage de Birmingham pour Malaga : 81 passagers, 6 membres d’équipage. Premier vol depuis le remplacement, 27 heures plus tôt.<\/span><\/div><div class=\"ev\"><span class=\"h\">7 h 33 UTC<\/span><span>Vers 17 300 ft, le pare-brise gauche est expulsé. Le commandant est aspiré à moitié hors du poste ; un steward le retient, d’autres membres de l’équipage de cabine le relaient.<\/span><\/div><div class=\"ev\"><span class=\"h\">7 h 55 UTC<\/span><span>Le copilote, qui a repris l’avion et émis un message de détresse, se pose à Southampton. Le commandant survit : fractures, gelures. Aucun mort.<\/span><\/div><\/div>\n<p class=\"small\">Chronologie d’après le rapport AAIB 1/92. Les heures de nuit sont celles du rapport, en ordre de grandeur.<\/p>"},{"id":"barrieres","label":"Les barrières","html":"<div class=\"kicker\">Fiche mémo · les barrières<\/div><h1>Une chaîne de maillons<\/h1>\n<p class=\"lead\">Lecture par barrières, à la manière du modèle de Reason. Le rapport conclut que l’accident résulte d’une chaîne d’erreurs, dont chacune aurait pu être interrompue.<\/p>\n<table><tr><th>Barrière<\/th><th>Ce qui s'est passé<\/th><th>État<\/th><\/tr><tr><td><b>Organisation de la nuit<\/b><\/td><td>Équipe réduite ; le travail du chef d’équipe n’est revu par personne.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Repos<\/b><\/td><td>Une heure et demie de sommeil ; fin d’une première nuit.<\/td><td>Dégradée<\/td><\/tr><tr><td><b>Données approuvées<\/b><\/td><td>Catalogue des pièces non consulté ; identification par la pièce déposée.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Magasin<\/b><\/td><td>Signal faible du magasinier non poussé ; stock presque vide non questionné.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Carrousel<\/b><\/td><td>Non surveillé, mal éclairé, étiquettes délavées.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Vue<\/b><\/td><td>Lunettes de lecture non portées pour choisir les vis.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Outillage<\/b><\/td><td>Tournevis hors étalonnage, couple au-dessus du manuel.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Poste de travail<\/b><\/td><td>Plate-forme mal placée : têtes de vis masquées.<\/td><td>A cédé<\/td><\/tr><tr><td><b>Indices visuels<\/b><\/td><td>Anneaux de fraisure vides, différence avec le pare-brise droit.<\/td><td>Non détectés<\/td><\/tr><tr><td><b>Inspection double<\/b><\/td><td>Non exigée : le pare-brise n’est pas un point vital.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Contrôle fonctionnel<\/b><\/td><td>Le chauffage, pas la fixation.<\/td><td>Inadaptée<\/td><\/tr><tr><td><b>Surveillance et audits<\/b><\/td><td>Ne regardaient pas les pratiques réelles des chefs d’équipe ; visite de l’autorité superficielle.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Équipage<\/b><\/td><td>Commandant retenu par l’équipage de cabine ; copilote aux commandes jusqu’à l’atterrissage.<\/td><td>A tenu<\/td><\/tr><\/table>"},{"id":"facteurs","label":"Les Dirty Dozen","html":"<div class=\"kicker\">Fiche mémo · les facteurs<\/div><h1>Les « Dirty Dozen » dans ce cas<\/h1>\n<p class=\"lead\">Les douze facteurs d’erreur en maintenance décrits par Gordon Dupont pour Transport Canada. Neuf d’entre eux se retrouvent dans cette seule nuit.<\/p>\n<table><tr><th>Facteur<\/th><th>Dans le cas réel<\/th><\/tr><tr><td><b>Fatigue<\/b><\/td><td>Une heure et demie de sommeil, fin de première nuit.<\/td><\/tr><tr><td><b>Pression<\/b><\/td><td>Avion prêt pour le lavage de 6 h 30 : une pression que personne n’exerçait, sinon lui-même.<\/td><\/tr><tr><td><b>Manque de ressources<\/b><\/td><td>Stock presque vide, outil hors étalonnage, plate-forme mal placée, carrousel non surveillé.<\/td><\/tr><tr><td><b>Normes<\/b><\/td><td>Identifier par comparaison, serrer au-dessus du manuel, certifier seul : des pratiques installées.<\/td><\/tr><tr><td><b>Complaisance<\/b><\/td><td>Trente ans de métier, une sensation « conforme à l’attente » au serrage.<\/td><\/tr><tr><td><b>Manque de communication<\/b><\/td><td>Le magasinier a des doutes et ne les pousse pas.<\/td><\/tr><tr><td><b>Manque d’assertivité<\/b><\/td><td>Personne n’ose interroger le chef d’équipe sur ses méthodes.<\/td><\/tr><tr><td><b>Manque de vigilance<\/b><\/td><td>Anneaux de fraisure et différence avec l’autre pare-brise non perçus.<\/td><\/tr><tr><td><b>Manque de travail d’équipe<\/b><\/td><td>Aucun second regard sur le travail du chef d’équipe.<\/td><\/tr><\/table>\n<p class=\"small\">Les trois autres : manque de connaissances, distraction, stress. Le chef d’équipe réel connaissait parfaitement la tâche.<\/p>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · à retenir<\/div><h1>Cinq éléments à retenir<\/h1><div class=\"keep\"><span class=\"n\">1<\/span><div><b>La référence vient du catalogue<\/b><br>Pas de la pièce déposée : elle peut être fausse, et la recopier recopie l’erreur.<\/div><\/div><div class=\"keep\"><span class=\"n\">2<\/span><div><b>La fin de nuit trompe les yeux<\/b><br>Placer les tâches critiques tôt, porter ses lunettes, et prévoir qui contrôlera.<\/div><\/div><div class=\"keep\"><span class=\"n\">3<\/span><div><b>Un contrôle prouve ce qu’il regarde<\/b><br>Un chauffage qui chauffe ne dit rien d’une fixation.<\/div><\/div><div class=\"keep\"><span class=\"n\">4<\/span><div><b>Ce que la règle n’exige pas, on peut le demander<\/b><br>Un second regard sur une tâche dont l’erreur ne se verrait qu’en vol.<\/div><\/div><div class=\"keep\"><span class=\"n\">5<\/span><div><b>Une bonne issue n’est pas une bonne pratique<\/b><br>Les normes durent tant que rien n’arrive. Les juger à la règle, pas à l’expérience.<\/div><\/div>"},{"id":"reco","label":"Les recommandations","html":"<div class=\"kicker\">Fiche mémo · recommandations<\/div><h1>Ce que recommande le rapport<\/h1>\n<p class=\"lead\">Sélection parmi les recommandations du rapport AAIB 1/92. Formulations résumées.<\/p>\n<table class=\"rec\"><tr><td>Autorité<\/td><td>Examiner l’auto-certification des tâches critiques non vérifiables par un essai fonctionnel, et la dérogation « points vitaux » pour les avions de plus de 5 700 kg.<\/td><\/tr><tr><td>Exploitant<\/td><td>Revoir le système d’assurance qualité et continuer d’encourager les retours d’information des ateliers.<\/td><\/tr><tr><td>Exploitant<\/td><td>Revoir l’échantillonnage des travaux et auditer en profondeur les pratiques de travail de l’atelier concerné.<\/td><\/tr><tr><td>Autorité<\/td><td>Revoir l’objet et la portée de ses visites de surveillance, qui n’avaient pas regardé les pratiques des chefs d’équipe.<\/td><\/tr><tr><td>Autorité<\/td><td>Examiner le besoin de formation et de contrôles périodiques pour les mécaniciens licenciés.<\/td><\/tr><tr><td>Autorité<\/td><td>Reconnaître la nécessité de porter les verres correcteurs prescrits pour les tâches de maintenance.<\/td><\/tr><tr><td>Autorité<\/td><td>Former les contrôleurs aériens à la gestion des situations d’urgence (communications difficiles avec l’équipage pendant l’événement).<\/td><\/tr><\/table>\n<p class=\"small\">Avec d’autres événements de la même période, ce cas a nourri la formation aux facteurs humains en maintenance, aujourd’hui exigée des ateliers agréés.<\/p>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · glossaire<\/div><h1>Les mots du scénario<\/h1><div class=\"gl\"><h3>Maintenance<\/h3><div class=\"e\"><b>Chef d’équipe de nuit.<\/b> Responsable de la vacation : répartit, supervise, certifie (shift maintenance manager).<\/div><div class=\"e\"><b>Catalogue illustré des pièces (IPC).<\/b> Document approuvé qui donne la référence et la quantité de chaque pièce.<\/div><div class=\"e\"><b>Manuel de maintenance (AMM).<\/b> Document approuvé qui décrit les tâches : dépose, pose, couples, contrôles.<\/div><div class=\"e\"><b>Point vital.<\/b> Tâche dont une erreur de montage peut compromettre le vol : inspection double obligatoire.<\/div><div class=\"e\"><b>Inspection double.<\/b> Contrôle d’un travail par une seconde personne habilitée qui ne l’a pas fait.<\/div><div class=\"e\"><b>Auto-certification.<\/b> Certification par le mécanicien de son propre travail.<\/div><div class=\"e\"><b>Remise en service (APRS).<\/b> Approbation pour remise en service : la signature qui déclare l’avion apte au vol.<\/div><div class=\"e\"><b>Tournevis limiteur de couple.<\/b> Outil qui débraye au couple réglé. Il doit être étalonné.<\/div><div class=\"e\"><b>Fraisure.<\/b> Logement conique d’une tête de vis. Une tête trop petite laisse un anneau vide.<\/div><div class=\"e\"><b>lbf·in.<\/b> Livre-force pouce, unité de couple : 15 lbf·in ≈ 1,7 N·m.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>Dirty Dozen.<\/b> Les douze facteurs d’erreur en maintenance (Dupont, Transport Canada).<\/div><div class=\"e\"><b>Norme.<\/b> Pratique non conforme devenue habituelle et tolérée, parce qu’elle n’a jamais posé de problème.<\/div><div class=\"e\"><b>Creux circadien.<\/b> Période, en fin de nuit, où vigilance et performance sont au plus bas.<\/div><div class=\"e\"><b>Signal faible.<\/b> Indice discret qu’une situation n’est pas celle que l’on croit.<\/div><div class=\"e\"><b>Biais de résultat.<\/b> Juger une pratique ou une décision sur son issue plutôt que sur sa qualité.<\/div><\/div><h2>Sources<\/h2><div class=\"src\">\n<p>AAIB, Aircraft Accident Report 1/92, « Report on the accident to BAC One-Eleven, G-BJRT, over Didcot, Oxfordshire on 10 June 1990 » : <a href=\"https://www.gov.uk/aaib-reports/1-1992-bac-one-eleven-g-bjrt-10-june-1990\">gov.uk<\/a>.<\/p>\n<p>Transport Canada, « Dirty Dozen » des facteurs humains en maintenance (G. Dupont).<\/p>\n<p class=\"small\">Les enquêtes de l’AAIB visent l’amélioration de la sécurité, non la recherche de responsabilités. Ce scénario utilise le rapport dans ce seul but ; atelier, compagnie, avion et références du jeu sont transposés.<\/p><\/div>"}]}},{"id":"s6","num":6,"version":"S6 v1","duration":"15 à 20 min","title":"Tour nord","short":"Tour nord","public":"Contrôleurs aériens et équipages","role":"Contrôleur local (LOC) d’une tour de grand aéroport","pitch":"Une nuit de travaux, deux tours regroupées et un trafic inhabituel. Quatre décisions, de la reprise de position à l’alignement d’un cargo.","dossierName":"Dossier de position","pileLabel":"Votre vacation","ambient":"tower","hideTokens":true,"compLabel":"Compétences du contrôleur (OACI)","lamp":{"label":"PISTE","colors":{"16":"green","8":"amber","19":"amber","5":"red"}},"resources":[],"costRes":null,"costIcon":null,"costName":"","tokens":{"BRIEFING":"Vous avez fait un point d’équipe : toute bretelle intermédiaire vous est annoncée de vive voix.","BRETELLE":"Vous savez que le cargo part de la bretelle 12.","ANGLAIS":"L’autorisation de décollage a été donnée en anglais : toute la fréquence l’a comprise.","COND":"L’alignement du cargo est conditionné au passage du biréacteur, identifié."},"tokenIcons":{"BRIEFING":"doc","BRETELLE":"map","ANGLAIS":"search","COND":"search"},"start":1,"decisions":{"1":{"idx":1,"title":"Retour de pause","front":[{"t":"2 h 05. Vous reprenez la position LOC après votre pause. Relève prévue à 3 h 30."},{"t":"Depuis 23 h, les deux tours sont regroupées à la tour nord : un contrôleur SOL, vous au LOC, le chef de tour. Le chef de service fait passer les strips d’une position à l’autre et donne un coup de main au roulage."},{"t":"La nuit n’est pas ordinaire : des vols supplémentaires repartent après un grand match européen. Des travaux éclairent violemment les voies proches du seuil 26 ; il pleut. Depuis le début de soirée, tous les départs passent par B et décollent du seuil."}],"notes":[],"tail":"","question":"Comment reprenez-vous la position ?","options":[{"to":4,"text":"Vous reprenez la position sans point d’équipe : rien n’a changé depuis 23 h, et l’équipe se connaît.","cost":0,"cls":"C","short":"Reprendre sans point d’équipe"},{"to":7,"text":"Vous faites un point de deux minutes avec le SOL et le chef de tour : travaux, voies fermées, bretelles utilisables, passage des strips. Et une règle : toute bretelle intermédiaire vous est annoncée de vive voix.","cost":0,"cls":"A","short":"Point d’équipe de deux minutes"},{"to":12,"text":"Vous demandez au SOL d’envoyer tous les départs au seuil, sauf exception : avec les travaux, ça simplifiera.","cost":0,"cls":"B","short":"Tous les départs au seuil"}],"enter":[],"auto":[4,12],"key":{"tabs":["vacation"],"tab":"vacation","mark":"d1","note":"Votre vacation : positions regroupées, strips passés par un tiers, transferts sans échange verbal, et aucun départ intermédiaire depuis votre prise de service. Une configuration où l’information écrite risque de ne pas être dite."}},"9":{"idx":2,"title":"Le strip","front":[{"t":"2 h 40. Le biréacteur Azur 807, 150 passagers pour Madrid, revient d’une panne technique : il a bloqué l’accès au seuil, il a fallu le renvoyer, et son strip est couvert de ratures : 26 imprimé, une autre piste au crayon, deux départs dont un mal barré. Vous démêlez tout ça avec l’équipage, en français."},{"t":"Le chef de service glisse dans votre tableau le strip du Northline 200, un biturbopropulseur cargo britannique pour Londres, deux pilotes. Sans un mot. Dans la case point de départ, au crayon : un 12 entouré."}],"notes":[{"if":"has:BRIEFING","head":"SOL","text":"Comme convenu au point d’équipe, le SOL vous le dit dans le casque : « Le Northline, je te l’ai envoyé par la 12. »"}],"tail":"","question":"Que faites-vous du strip du cargo ?","options":[{"to":15,"text":"Vous lisez le strip en entier et confirmez de vive voix avec le SOL : « Le Northline, il part d’où ? »","cost":0,"cls":"A","short":"Le lire et confirmer au SOL"},{"to":3,"text":"Vous rangez le strip à sa place dans la séquence, derrière celui du biréacteur, et vous finissez d’abord le biréacteur.","cost":0,"cls":"B","short":"Le ranger, finir le biréacteur"},{"to":18,"text":"Vous demandez au chef de service de vous annoncer les départs dans l’ordre : il voit passer les strips, vous gardez les yeux dehors.","cost":0,"cls":"C","short":"Déléguer la séquence au chef de service"}],"enter":[],"auto":[18,3],"key":{"tabs":["moyens","plateforme"],"tab":"moyens","mark":"d9","note":"Moyens de la tour : un départ intermédiaire est noté au crayon, numéro entouré. Plateforme : depuis la bretelle 12, un avion a le seuil 26 dans son dos ; il entre sur la piste devant le point de lâcher des freins."}},"14":{"idx":3,"title":"Le décollage","front":[{"t":"2 h 50. Un B737 vient d’atterrir sur la 26 et dégage. L’Azur 807 est aligné au seuil, prêt."},{"t":"Dehors : la pluie, l’éclairage du chantier, des feux partout. Sur l’écran radar sol, les plots du chantier et des échos brouillés autour des voies. L’écran de surface plus lisible n’existe qu’aux positions SOL."},{"t":"Le Northline 200 est à la bretelle 12, en approche du point d’arrêt.","if":"has:BRIEFING|has:BRETELLE"},{"t":"Le Northline 200 roule vers le seuil, derrière l’Azur, comme tous les départs de la soirée.","if":"not:BRIEFING&not:BRETELLE"}],"notes":[{"if":"not:BRIEFING&not:BRETELLE","head":"Votre image","text":"Deux avions au seuil 26 : l’Azur aligné, le Northline derrière."}],"tail":"","question":"Comment autorisez-vous le décollage de l’Azur 807 ?","options":[{"to":20,"text":"Un dernier balayage de la piste et de ses accès, puis l’autorisation en anglais, pour que toute la fréquence comprenne : « Azur 807, runway 26, cleared for take-off. »","cost":0,"cls":"A","short":"En anglais, après un balayage"},{"to":2,"text":"« Azur 807, piste 26, autorisé décollage. » En français, comme avec tous les équipages français ce soir : la phraséologie est la même.","cost":0,"cls":"B","short":"En français, comme d’habitude"},{"to":11,"text":"En français, tout de suite, pour caser le décollage avant la prochaine arrivée. Vous passez aussitôt aux avions suivants.","cost":0,"cls":"C","short":"En français, tout de suite"}],"cue":"radio","enter":[],"auto":[11,2],"key":{"tabs":["vacation","moyens"],"tab":"vacation","mark":"d14","note":"Langues : chacun dans la sienne, sur une seule fréquence. Moyens : de nuit, sous la pluie, avec le chantier, ni la vue ni le radar du LOC ne permettent de voir un avion à la bretelle 12."}},"6":{"idx":4,"title":"L’alignement","front":[{"t":"Cinq secondes plus tard, en anglais :"},{"t":"Northline 200, ready for departure.","radio":true},{"t":"Vous voulez aligner le cargo dans la foulée, derrière le biréacteur : la nuit est longue et la séquence est chargée."}],"notes":[{"if":"has:ANGLAIS","head":"Fréquence","text":"L’équipage du Northline a entendu l’autorisation de décollage de l’Azur, en anglais."},{"if":"not:ANGLAIS","head":"Fréquence","text":"Deux langues sur la même fréquence : l’équipage du Northline ne comprend pas le français."}],"tail":"","question":"Quelle clairance donnez-vous au cargo ?","options":[{"to":13,"text":"« Northline 200, line up runway 26 and wait, number two. »","cost":0,"cls":"B","short":"« Line up and wait, number two »"},{"to":17,"text":"« Northline 200, line up and wait. » Court : la fréquence est chargée.","cost":0,"cls":"C","short":"« Line up and wait »"},{"to":10,"text":"« Northline 200, behind the departing A320, line up and wait behind. »","cost":0,"cls":"A","short":"Clairance conditionnelle, trafic nommé"}],"cue":"radio","enter":[],"auto":[17,13],"key":{"tabs":["phraseo"],"tab":"phraseo","mark":"d6","note":"Phraséologie : « number two » donne un rang, pas derrière qui. La clairance conditionnelle nomme le trafic : l’équipage attend de l’avoir vu passer."}}},"suites":{"7":{"front":[{"t":"Deux minutes, debout derrière les consoles. Le SOL : « Les voies 13 sont fermées, le chantier éblouit tout le secteur. Si quelqu’un me demande une bretelle, je te le dis. »"},{"t":"Le chef de tour note la règle au tableau. Vous reprenez la fréquence."}],"changes":[{"tok":"BRIEFING"}],"go":9,"debrief":[["Pourquoi c’était coûteux","Deux minutes en pleine nuit chargée, pour dire ce que tout le monde croit savoir. Entre collègues qui se connaissent, cela peut paraître superflu."],["Ce qui protège","Une nuit de travaux, des positions regroupées et des strips qui passent par un tiers changent la façon dont l’information circule. Le rapport relève l’absence de briefing d’équipe parmi les facteurs : c’est le moment où l’on se met d’accord sur ce qui doit être dit, et pas seulement écrit."],["La limite","Une règle orale ne vaut que si chacun la tient à 2 h 40, quand la charge monte."]],"comp":"Travail en équipe · Coordination"},"12":{"front":[{"t":"Le SOL : « D’accord, tout le monde au seuil, sauf si on me demande autre chose. »"},{"t":"Vous reprenez la fréquence. L’image est simple : tous les départs par B, tous au seuil."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","Simplifier une configuration difficile est une bonne idée de contrôleur : moins de cas, moins d’erreurs."],["Le piège","« Sauf exception » : la règle renforce l’image que tout le monde part du seuil, sans prévoir comment l’exception vous sera signalée. Plus la règle marche, moins on attend l’exception."],["Ce qui protège","Une simplification n’est sûre que si ses exceptions sont annoncées. Le dire : « Toute exception, tu me la dis de vive voix. »"]],"comp":"Coordination · Conscience de la situation"},"4":{"front":[{"t":"Vous reprenez la fréquence. Les départs s’enchaînent par B, au seuil, comme depuis le début de soirée."},{"t":"Une routine s’installe : vous savez où sont les avions sans avoir besoin de les chercher."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","Rien n’a changé depuis 23 h, l’équipe se connaît, et chaque minute compte. C’est ce qui se passe le plus souvent."],["Le piège","La routine construit une image mentale (« tous au seuil ») que plus rien ne vient questionner. Le contrôleur réel a décrit ce sentiment de routine, et le rapport retient l’absence de briefing d’équipe."],["Ce qui protège","Un point d’équipe à chaque reprise de position, surtout quand la configuration n’est pas la configuration habituelle."]],"comp":"Conscience de la situation · Travail en équipe"},"15":{"front":[{"t":"« Il part de la 12, il me l’a demandée, et j’avais du monde au repoussage. » Vous rangez le strip à part et notez, sur votre image : le Northline entrera sur la piste devant le point de lâcher des freins de l’Azur."},{"t":"Vous repassez au biréacteur."}],"changes":[{"tok":"BRETELLE"}],"go":14,"debrief":[["Pourquoi c’était coûteux","Interrompre le démêlage d’un strip compliqué pour en lire un autre, et demander au SOL ce qui est écrit sous vos yeux."],["Ce qui protège","L’information était sur le strip : un 12 entouré. Le rapport relève que le strip a été transmis sans mention particulière, alors que l’attention du contrôleur était prise par le strip du biréacteur. Le dire à voix haute transforme une information écrite en information partagée."],["En plus","Une bretelle intermédiaire en pleine nuit, après des heures de départs au seuil, est exactement l’exception que l’image mentale n’attend pas."]],"comp":"Coordination · Conscience de la situation"},"3":{"front":[{"t":"Le strip du Northline prend sa place dans le tableau, sous celui du biréacteur. Vous finissez de démêler l’Azur : bonne piste, bon départ, tout est confirmé avec l’équipage."},{"t":"Le 12 entouré est là, dans sa case. Vous ne l’avez pas lu."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Une chose à la fois : finir proprement le problème en cours avant le suivant. Le strip est rangé, l’information ne se perdra pas."],["Le piège","Ranger un strip à sa place dans la séquence, c’est déjà l’interpréter : derrière le biréacteur. L’information qui contredisait cette place était écrite, mais personne ne l’a dite, et votre attention était ailleurs."],["Ce qui protège","Lire tout strip reçu, et faire dire de vive voix ce qui sort de la routine : bretelle, piste, départ."]],"comp":"Gestion de la charge · Coordination"},"18":{"front":[{"t":"Le chef de service : « D’accord. Après l’Azur, tu as le Northline. » Pour lui aussi, tous les départs de la soirée sont partis du seuil."},{"t":"Vous gardez les yeux dehors. Dehors, il pleut, et le chantier éblouit tout."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","Répartir le travail, garder les yeux dehors : c’est ce qu’on apprend. Le chef de service voit passer tous les strips."],["Le piège","Vous recevez une séquence, pas une position. Celui qui la donne partage la même routine que vous, et n’a pas la responsabilité de la piste. Le rapport compare : ailleurs, le contrôleur local ne peut être assisté que par un autre contrôleur qualifié."],["Ce qui protège","Déléguer des tâches, pas l’image de la piste. Les informations de position remontent au contrôleur qui tient la piste."]],"comp":"Travail en équipe · Conscience de la situation"},"20":{"front":[{"t":"Balayage : sur la piste, rien que l’Azur. Autour, des plots brouillés, le chantier, la pluie."},{"t":"Azur 807, runway 26, cleared for take-off.","radio":true},{"t":"L’équipage de l’Azur collationne, en anglais. Les moteurs montent."}],"changes":[{"tok":"ANGLAIS"}],"go":6,"debrief":[["Pourquoi c’était coûteux","Parler anglais à un équipage français, sur une plateforme où les deux langues sont autorisées, quand le français est plus naturel pour tout le monde."],["Ce qui protège","Sur une fréquence partagée, chaque message sert aussi aux autres équipages. Le rapport établit que l’équipage du cargo n’a pas compris l’autorisation de décollage donnée en français : il ignorait qu’un avion allait passer devant lui. Ailleurs, l’enquête relève que toutes les communications se font en anglais."],["La limite","Le balayage n’a rien montré : de nuit, sous la pluie, avec le chantier et un radar brouillé, voir un avion à la bretelle était presque impossible. C’est la langue qui protège ici, pas les yeux."]],"comp":"Communication · Conscience de la situation"},"2":{"front":[{"t":"Azur 807, piste 26, autorisé décollage.","radio":true},{"t":"L’équipage collationne. Les moteurs montent."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","C’est l’usage : on parle français aux équipages français, anglais aux autres. La phraséologie est la même, et c’est autorisé."],["Le piège","Deux langues sur une même fréquence, c’est deux images de la situation. L’équipage britannique n’a rien compris de ce message ; l’équipage français, de son côté, a pris les messages anglais pour des avions derrière lui."],["Ce qui protège","Une seule langue pour tous quand plusieurs avions partagent la piste. Et un balayage de la piste et de ses accès avant chaque autorisation."]],"comp":"Communication"},"11":{"front":[{"t":"Azur 807, piste 26, autorisé décollage.","radio":true},{"t":"Vous enchaînez aussitôt sur l’arrivée suivante, puis sur un avion au roulage."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","Une nuit chargée se gère en serrant les intervalles : un décollage casé entre deux arrivées, c’est du bon contrôle."],["Le piège","La pression du débit raccourcit les vérifications et la phraséologie. Et le message, en français, n’existe pas pour l’équipage britannique."],["Ce qui protège","Garder les vérifications incompressibles, même quand on serre la séquence : balayage, langue commune, position de chaque avion qui approche de la piste."]],"comp":"Gestion de la charge · Communication"},"10":{"front":[{"t":"Northline 200, behind the departing A320, line up and wait behind.","radio":true},{"t":"Behind the departing A320, line up and wait behind, Northline 200.","radio":true},{"t":"Au point d’arrêt de la 12, l’équipage du cargo cherche le biréacteur qui décolle. Il le voit arriver dans son dos, le laisse passer, puis s’aligne derrière lui."}],"changes":[{"tok":"COND"}],"go":16,"debrief":[["Pourquoi c’était coûteux","Une phrase plus longue, sur une fréquence chargée, pour un alignement qui semble évident."],["Ce qui protège","Une clairance conditionnelle nomme le trafic et la condition : l’équipage sait qui attendre, et ne bouge pas tant qu’il ne l’a pas vu passer. Même avec une image fausse au poste, la condition protège. L’enquête relève que d’autres aéroports l’imposent pour tout alignement derrière un avion."],["La limite","La condition suppose que l’équipage voie le trafic. De nuit, depuis une bretelle à angle aigu, il le voit tard : c’est pour cela qu’elle nomme l’avion."]],"comp":"Communication · Séparation"},"13":{"front":[{"t":"Northline 200, line up runway 26 and wait, number two.","radio":true},{"t":"Line up and wait, number two, Northline 200.","radio":true},{"t":"Au point d’arrêt de la 12, l’équipage du cargo cherche le numéro un devant lui. Il ne voit rien : la bretelle rejoint la piste à angle aigu, le seuil est dans son dos."},{"t":"Il a entendu l’Azur décoller en anglais. Le commandant appelle : « Northline 200, confirm we are number two behind the departing traffic? » Vous : « Affirm, hold position until it has passed. »","if":"has:ANGLAIS"},{"t":"Vous regardez la bretelle 12 : vous savez qu’il y est. Les feux du cargo se mettent à bouger vers la piste.","if":"not:ANGLAIS&has:BRIEFING|not:ANGLAIS&has:BRETELLE"},{"t":"Un avion vient d’atterrir et de dégager : pour l’équipage, le numéro un est passé. Il avance vers la piste.","if":"not:ANGLAIS&not:BRIEFING&not:BRETELLE"}],"changes":[],"goto":[{"if":"has:ANGLAIS","to":8,"label":"Avec le jeton ANGLAIS"},{"if":"has:BRIEFING|has:BRETELLE","to":19,"label":"Avec le jeton BRIEFING ou le jeton BRETELLE"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","« Numéro deux » est une formule courante, courte, et juste dans votre image : le cargo partira après le biréacteur. C’est la formule employée cette nuit-là."],["Le piège","« Numéro deux » dit un rang, pas derrière qui. L’équipage cherche un numéro un devant lui ; depuis une bretelle à angle aigu, l’avion qui décolle arrive dans son dos. Le rapport juge cette instruction incorrecte, l’avion étant à une bretelle intermédiaire."],["Ce qui protège","Une clairance conditionnelle qui nomme le trafic, et une langue commune pour que l’équipage sache qu’un avion décolle."]],"comp":"Communication · Conscience de la situation"},"17":{"front":[{"t":"Northline 200, line up and wait.","radio":true},{"t":"Line up and wait, Northline 200.","radio":true},{"t":"Au point d’arrêt de la 12, l’équipage du cargo regarde la piste devant lui : vide. Le seuil est dans son dos."},{"t":"Il a entendu l’Azur décoller en anglais. Le commandant appelle : « Northline 200, confirm line up? We have departing traffic. » Vous : « Negative, hold position! »","if":"has:ANGLAIS"},{"t":"Vous regardez la bretelle 12 : vous savez qu’il y est. Les feux du cargo se mettent à bouger vers la piste.","if":"not:ANGLAIS&has:BRIEFING|not:ANGLAIS&has:BRETELLE"},{"t":"Il avance vers la piste.","if":"not:ANGLAIS&not:BRIEFING&not:BRETELLE"}],"changes":[],"goto":[{"if":"has:ANGLAIS","to":8,"label":"Avec le jeton ANGLAIS"},{"if":"has:BRIEFING|has:BRETELLE","to":19,"label":"Avec le jeton BRIEFING ou le jeton BRETELLE"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","La fréquence est chargée, la phrase est standard et courte. Dans votre image, le cargo est derrière le biréacteur : il ne peut pas passer devant."],["Le piège","Sans condition ni rang, l’instruction autorise l’équipage à s’aligner tout de suite. C’est votre image, et non la clairance, qui le place derrière le biréacteur ; et votre image est fausse."],["Ce qui protège","Une clairance qui reste juste même si votre image est fausse : la condition, et le trafic nommé."]],"comp":"Communication · Séparation"}},"fins":{"16":{"n":1,"title":"Deux décollages","front":[{"t":"L’Azur 807 décolle et passe devant la bretelle 12. Le Northline s’aligne derrière lui, attend la turbulence de sillage, décolle à son tour."},{"t":"À 3 h 30, vous passez la position à votre relève. Rien à signaler."}],"changes":[],"question":"Votre relève : « Pourquoi tant de mots pour un alignement ? » Que lui répondez-vous ?","back":"Votre clairance est restée juste même là où votre image aurait pu être fausse : elle nommait le trafic et la condition. Cette nuit-là, la phrase réelle donnait un rang, et l’équipage a cherché un numéro un devant lui.","sound":"takeoff"},"8":{"n":2,"title":"Une question en anglais","front":[{"t":"L’équipage du cargo a compris qu’un avion décollait : il a posé une question au lieu d’avancer. Il reste au point d’arrêt ; l’Azur passe devant lui à pleine vitesse."},{"t":"Le Northline s’aligne ensuite et décolle. Vous notez de faire un compte rendu : « numéro deux », depuis une bretelle."}],"changes":[],"question":"Le compte rendu doit-il parler de l’équipage qui a posé la question, ou de votre clairance ?","back":"La langue commune a fait la différence : l’équipage du cargo savait qu’un avion décollait. Cette nuit-là, il ne le savait pas : l’autorisation était en français. Reste la clairance, qui laissait place à l’interprétation.","sound":"takeoff"},"19":{"n":3,"title":"Arrêt décollage","front":[{"t":"Les feux du cargo entrent sur la piste. « Azur 807, stop immediately! Arrêtez le décollage ! » Le biréacteur freine, inverseurs à fond, et s’arrête à quelques centaines de mètres du cargo."},{"t":"Personne n’est blessé. Incident grave : l’enquête est ouverte avant la fin de votre vacation."}],"changes":[],"question":"L’enquêteur : « Vous saviez où était le cargo. Pourquoi lui avez-vous donné cette clairance ? »","back":"Savoir où était le cargo vous a permis de le voir bouger, et d’arrêter le décollage à temps. Mais votre clairance laissait l’équipage s’aligner devant un avion qui décollait. La bonne image a rattrapé la mauvaise phrase, de justesse.","sound":"stop"},"5":{"n":4,"title":"La collision","front":[{"t":"Le cargo s’aligne. Ses phares éclairent la piste vide devant lui. Dans son dos, l’Azur accélère."},{"t":"L’équipage du cargo voit les feux au dernier moment et freine. À environ 155 kt, l’aile gauche du biréacteur frappe le poste du cargo. Le biréacteur interrompt son décollage. Dans le cargo, le copilote est tué sur le coup ; le commandant est grièvement blessé."}],"changes":[],"question":"L’enquêteur : « Où pensiez-vous que se trouvait le cargo ? » Que répondez-vous ?","back":"Vous avez rencontré l’issue réelle. Chacune de vos décisions avait une raison, et votre image de la piste était cohérente : seulement, elle était fausse. Le débriefing va reprendre comment cette image s’est formée, et ce qui aurait pu la corriger.","sound":"bigcrash"}},"dossier":[{"id":"vacation","label":"Votre vacation","html":"<div class=\"kicker\">Dossier de position · 1/5<\/div><h1>Votre vacation<\/h1>\n<p class=\"lead\">Tour de contrôle d’un grand aéroport international, nuit de semaine.<\/p>\n<div class=\"cols\"><div><h2>Vous<\/h2><table class=\"cast\"><tr><td>Fonction<\/td><td>Contrôleur instructeur à l’école de formation. Vous maintenez votre qualification sur cet aéroport par périodes de deux semaines, trois ou quatre fois par an.<\/td><\/tr><tr><td>Période en cours<\/td><td>Sixième jour. La précédente remonte à cinq mois : dans la limite autorisée.<\/td><\/tr><tr><td>Vacation<\/td><td>18 h à 5 h. Position LOC jusqu’à la relève de 3 h 30.<\/td><\/tr><tr data-key=\"d1\"><td>Ce soir<\/td><td>Aucun dép
