a été blessé, ni à bord ni sur la péniche : c’est de la chance, pas une barrière. Le débriefing va montrer comment une suite de silences, chacun logique dans ce secteur, y a conduit, et qui fixait le prix de chaque mot.","question":"Le lendemain, l’enquêteur : « Vous aviez vu le resserrement. Pourquoi ne pas l’avoir dit plus tôt, ou plus fort ? » Que répondez-vous ?","sound":"bigcrash"}},"dossier":[{"id":"situation","label":"Votre situation","html":"<div class=\"kicker\">Dossier de mission<\/div><h1>Votre situation<\/h1><p class=\"lead\">Lisez votre situation avant la carte 1. Le dossier reste à votre disposition pendant toute la partie.<\/p><div class=\"box tint rot\"><p>Vous êtes copilote, recruté après un début de carrière dans le transport civil. Ici, un copilote ne devient pas commandant de bord : son statut ne le prévoit pas.<\/p><p data-key=\"d1\">Votre second contrat de trois ans s’achève en décembre. L’avis de la cellule instruction comptera pour la suite. Son responsable est aussi le chef des personnels navigants : votre CDB du jour.<\/p><p>Le secteur est scindé en deux. D’un côté, les commandants de bord, anciens pilotes de chasse en fin de carrière. De l’autre, les copilotes : la technique, les butées, les check-lists.<\/p><p>Au printemps, vous avez rédigé une fiche RETEX sur votre travail en équipage avec lui. Le chef des PN a participé à son traitement. Rien n’a changé.<\/p><p>Entre copilotes, on dit qu’on appréhende de voler avec lui. Certains ajoutent : « Cette année, il aura un accident. »<\/p><\/div><p class=\"small\">Organisme et personnages fictifs, inspirés d’un événement réel présenté au débriefing.<\/p>"},{"id":"avion","label":"Avion et équipage","html":"<div class=\"kicker\">Dossier de mission · 1/3<\/div>\n<h1>Votre avion, votre équipage<\/h1>\n<p class=\"lead\" style=\"margin-bottom:0\">Lisez ce dossier avant la carte 1. Il reste à votre disposition pendant toute la partie.<\/p>\n<div><svg viewBox=\"0 0 760 310\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\"><defs><pattern id=\"sh\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#cfcfcf\" stroke-width=\"2\"/><\/pattern><\/defs><line x1=\"20\" y1=\"226\" x2=\"740\" y2=\"226\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"6 4\"/><path d=\"M196 116 L164 30 L130 28 L124 132 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M96 70 L182 66 Q190 70 182 74 L96 76 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M108 52 L120 50 L122 92 L110 94 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M706 170 Q712 150 694 140 L654 118 L604 110 L310 108 L196 112 L124 130 L122 152 L190 174 L428 198 L432 212 L646 212 Q696 202 706 170 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M428 198 L432 212\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"372\" y=\"150\" width=\"150\" height=\"44\" rx=\"4\" fill=\"url(#sh)\" stroke=\"#111\" stroke-width=\"1.1\" stroke-dasharray=\"4 3\"/><line x1=\"409\" y1=\"152\" x2=\"409\" y2=\"192\" stroke=\"#111\" stroke-width=\"0.9\" stroke-dasharray=\"3 3\"/><line x1=\"447\" y1=\"152\" x2=\"447\" y2=\"192\" stroke=\"#111\" stroke-width=\"0.9\" stroke-dasharray=\"3 3\"/><line x1=\"485\" y1=\"152\" x2=\"485\" y2=\"192\" stroke=\"#111\" stroke-width=\"0.9\" stroke-dasharray=\"3 3\"/><path d=\"M440 212 L446 222 L452 212\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M470 212 L476 222 L482 212\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M640 122 L672 134 L664 144 L632 136 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-width=\"1.3\"/><rect x=\"300\" y=\"122\" width=\"16\" height=\"12\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"330\" y=\"122\" width=\"16\" height=\"12\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"560\" y=\"122\" width=\"16\" height=\"12\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"590\" y=\"122\" width=\"16\" height=\"12\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M506 97 Q506 88 490 87 L376 92 L360 99 L376 103 L490 104 Q506 104 506 97 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M472 84 L552 82 Q568 92 552 102 L472 102 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M574 92 m-6 0 a6 64 0 1 0 12 0 a6 64 0 1 0 -12 0\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><path d=\"M568 92 L574 92\" stroke=\"#111\" stroke-width=\"3\"/><line x1=\"574\" y1=\"32\" x2=\"540\" y2=\"14\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"574\" cy=\"32\" r=\"2.5\" fill=\"#111\"/><text x=\"536\" y=\"18\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Deux turbopropulseurs<\/text><line x1=\"664\" y1=\"128\" x2=\"748\" y2=\"40\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"664\" cy=\"128\" r=\"2.5\" fill=\"#111\"/><text x=\"744\" y=\"44\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Poste : CDB à gauche,<\/text><text x=\"744\" y=\"59\" text-anchor=\"end\" font-size=\"12\" fill=\"#333\">copilote à droite<\/text><line x1=\"446\" y1=\"172\" x2=\"748\" y2=\"262\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"446\" cy=\"172\" r=\"2.5\" fill=\"#111\"/><text x=\"744\" y=\"266\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Quatre soutes : environ 6 t d’eau,<\/text><text x=\"744\" y=\"281\" text-anchor=\"end\" font-size=\"12\" fill=\"#333\">larguées ensemble ou séparément<\/text><line x1=\"446\" y1=\"218\" x2=\"430\" y2=\"272\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"446\" cy=\"218\" r=\"2.5\" fill=\"#111\"/><text x=\"426\" y=\"276\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Écopes sous la coque :<\/text><text x=\"426\" y=\"291\" text-anchor=\"end\" font-size=\"12\" fill=\"#333\">plein en 10 s sur eau calme<\/text><line x1=\"250\" y1=\"172\" x2=\"176\" y2=\"236\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"250\" cy=\"172\" r=\"2.5\" fill=\"#111\"/><text x=\"172\" y=\"240\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Coque : l’avion amerrit,<\/text><text x=\"172\" y=\"255\" text-anchor=\"end\" font-size=\"12\" fill=\"#333\">écope et redécolle<\/text><line x1=\"140\" y1=\"72\" x2=\"60\" y2=\"22\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"140\" cy=\"72\" r=\"2.5\" fill=\"#111\"/><text x=\"64\" y=\"26\" text-anchor=\"start\" font-size=\"12\" font-weight=\"600\">Empennage<\/text><text x=\"30\" y=\"304\" fill=\"#555\" font-size=\"11\">Vue de côté, nez à droite<\/text><\/svg><\/div>\n<div style=\"margin-top:-1mm\"><svg viewBox=\"0 0 760 220\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\"><path d=\"M20 186 Q120 182 220 186 T420 186 T620 186 T740 186\" fill=\"none\" stroke=\"#999\" stroke-width=\"1.2\"/><path d=\"M60 80 L700 80 L700 92 L60 92 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M60 80 L52 58 L60 58 L66 80 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><path d=\"M700 80 L708 58 L700 58 L694 80 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><circle cx=\"262\" cy=\"96\" r=\"56\" fill=\"none\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><ellipse cx=\"262\" cy=\"96\" rx=\"18\" ry=\"20\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><circle cx=\"262\" cy=\"96\" r=\"6\" fill=\"#111\"/><circle cx=\"498\" cy=\"96\" r=\"56\" fill=\"none\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><ellipse cx=\"498\" cy=\"96\" rx=\"18\" ry=\"20\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><circle cx=\"498\" cy=\"96\" r=\"6\" fill=\"#111\"/><path d=\"M352 70 Q380 58 408 70 L412 150 L380 182 L348 150 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><rect x=\"362\" y=\"74\" width=\"36\" height=\"16\" rx=\"4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><line x1=\"380\" y1=\"74\" x2=\"380\" y2=\"90\" stroke=\"#111\"/><line x1=\"104\" y1=\"92\" x2=\"108\" y2=\"162\" stroke=\"#111\" stroke-width=\"1.8\"/><line x1=\"120\" y1=\"92\" x2=\"116\" y2=\"162\" stroke=\"#111\" stroke-width=\"1.8\"/><ellipse cx=\"112\" cy=\"170\" rx=\"24\" ry=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><line x1=\"640\" y1=\"92\" x2=\"644\" y2=\"162\" stroke=\"#111\" stroke-width=\"1.8\"/><line x1=\"656\" y1=\"92\" x2=\"652\" y2=\"162\" stroke=\"#111\" stroke-width=\"1.8\"/><ellipse cx=\"648\" cy=\"170\" rx=\"24\" ry=\"10\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><line x1=\"112\" y1=\"178\" x2=\"150\" y2=\"212\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"112\" cy=\"178\" r=\"2.5\" fill=\"#111\"/><text x=\"154\" y=\"216\" text-anchor=\"start\" font-size=\"12\" font-weight=\"600\">Ballonnet : flotteur sous chaque bout d’aile<\/text><line x1=\"56\" y1=\"62\" x2=\"30\" y2=\"26\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"56\" cy=\"62\" r=\"2.5\" fill=\"#111\"/><text x=\"34\" y=\"30\" text-anchor=\"start\" font-size=\"12\" font-weight=\"600\">Winglet<\/text><line x1=\"620\" y1=\"86\" x2=\"610\" y2=\"30\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"620\" cy=\"86\" r=\"2.5\" fill=\"#111\"/><text x=\"606\" y=\"34\" text-anchor=\"end\" font-size=\"12\" font-weight=\"600\">Aile haute<\/text><line x1=\"380\" y1=\"168\" x2=\"470\" y2=\"212\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"380\" cy=\"168\" r=\"2.5\" fill=\"#111\"/><text x=\"474\" y=\"216\" text-anchor=\"start\" font-size=\"12\" font-weight=\"600\">Coque<\/text><text x=\"740\" y=\"212\" text-anchor=\"end\" fill=\"#555\" font-size=\"11\">Vue de face<\/text><\/svg><\/div>\n<div class=\"cols\" style=\"gap:6mm;grid-template-columns:62mm 1fr;margin-top:1mm\">\n<div><h2 style=\"margin-top:0\">Repères de vitesse<\/h2><table style=\"font-size:13.4px\"><tr data-key=\"d14\"><td>Finale avant écopage<\/td><td class='c num' style='font-size:16.0px;width:16mm'>90 kt<\/td><\/tr><tr><td>Vitesse dans l’eau<\/td><td class='c num' style='font-size:16.0px;width:16mm'>70 kt<\/td><\/tr><tr><td>Sortie de l’eau<\/td><td class='c num' style='font-size:16.0px;width:16mm'>78 kt<\/td><\/tr><tr><td>Décrochage, configuration écopage<\/td><td class='c num' style='font-size:16.0px;width:16mm'>72 kt<\/td><\/tr><tr><td>Vent de travers maximal en écopage<\/td><td class='c num' style='font-size:16.0px;width:16mm'>12 kt<\/td><\/tr><\/table>\n<p class=\"small\">Entre la sortie de l’eau et le décrochage : 6 kt. À cette vitesse, l’avion s’incline peu.<\/p><\/div>\n<div><h2 style=\"margin-top:0\">L'équipage du jour<\/h2><table class=\"cast\"><tr><td>Votre CDB<\/td><td>Chef des personnels navigants, responsable de la cellule instruction, instructeur. Près de 5 000 écopages. Ancien pilote de chasse, passé par la Patrouille de France ; forte personnalité, connu pour voler plus serré que les autres. Depuis le déménagement de la base, il cumule les dossiers : deux semaines de congés en huit mois.<\/td><\/tr><tr><td>Le leader<\/td><td>Commandant de bord depuis 2014, chef de noria depuis deux mois. Votre CDB est son chef et son instructeur.<\/td><\/tr><tr><td>Vous<\/td><td>Copilote recruté du civil, six ans au secteur : votre second contrat de trois ans s’achève en décembre. Des milliers d’écopages, presque tous sans être aux commandes. Vous volez souvent avec ce CDB.<\/td><\/tr><tr><td>Le contexte<\/td><td>Un secteur scindé en deux : les CDB, anciens de la chasse en fin de carrière ; les copilotes, recrutés du civil, souvent en contrat de trois ans renouvelable une fois, qui ne deviennent pas CDB. Voir la carte Votre situation.<\/td><\/tr><\/table><\/div>\n<\/div>\n\n<p class=\"small\" style=\"margin:0\">Schémas de principe, sans échelle. Vitesses tirées du rapport BEA-É S-2017-12-I.<\/p>"},{"id":"noria","label":"Noria et écopage","html":"<div class=\"kicker\">Dossier de mission · 2/3<\/div>\n<h1>La noria et l'écopage<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Une noria fait des allers-retours entre le plan d’eau et le feu. Les avions écopent en formation, à quelques centaines de mètres les uns des autres.<\/p>\n<h2 style=\"margin-top:1mm\">La règle de placement<\/h2>\n<div><svg viewBox=\"0 0 760 270\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\"><defs><pattern id=\"bk\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#bdbdbd\" stroke-width=\"2\"/><\/pattern><marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"720\" height=\"30\" fill=\"url(#bk)\" stroke=\"none\"/><line x1=\"20\" y1=\"50\" x2=\"740\" y2=\"50\" stroke=\"#111\" stroke-width=\"1.4\"/><rect x=\"20\" y=\"226\" width=\"720\" height=\"30\" fill=\"url(#bk)\" stroke=\"none\"/><line x1=\"20\" y1=\"226\" x2=\"740\" y2=\"226\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"30\" y=\"40\" font-weight=\"600\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">Rive sous le vent<\/text><text x=\"30\" y=\"248\" font-weight=\"600\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">Rive au vent<\/text><path d=\"M520 100 L290 54 L290 104 Z\" fill=\"#e6e6e6\" stroke=\"#999\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"300\" y=\"70\" fill=\"#333\" font-size=\"11\">souffle et sillage, déviés par le vent<\/text><path d=\"M60 100 L600 100\" stroke=\"#111\" stroke-width=\"1.6\" stroke-dasharray=\"7 4\" marker-end=\"url(#ra)\"/><path d=\"M60 160 L520 160\" stroke=\"#111\" stroke-width=\"1.6\" stroke-dasharray=\"7 4\" marker-end=\"url(#ra)\"/><path d=\"M60 202 L440 202\" stroke=\"#111\" stroke-width=\"1.2\" stroke-dasharray=\"7 4\" marker-end=\"url(#ra)\"/><g transform=\"translate(540 100) scale(1.1)\"><path d=\"M-16 0 L16 0\" stroke=\"#111\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M2 -17 L6 -17 L6 17 L2 17 Z\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1.4\"/><path d=\"M-15 -6 L-11 -6 L-11 6 L-15 6 Z\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1.2\"/><\/g><text x=\"540\" y=\"75.8\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">LEADER<\/text><g transform=\"translate(460 160) scale(1.1)\"><path d=\"M-16 0 L16 0\" stroke=\"#111\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M2 -17 L6 -17 L6 17 L2 17 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><path d=\"M-15 -6 L-11 -6 L-11 6 L-15 6 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.2\"/><\/g><text x=\"460\" y=\"135.8\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">N° 2<\/text><g transform=\"translate(380 202) scale(0.9)\"><path d=\"M-16 0 L16 0\" stroke=\"#111\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M2 -17 L6 -17 L6 17 L2 17 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><path d=\"M-15 -6 L-11 -6 L-11 6 L-15 6 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.2\"/><\/g><text x=\"380\" y=\"184\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"11\">N° 3<\/text><line x1=\"610\" y1=\"104\" x2=\"610\" y2=\"156\" stroke=\"#111\" stroke-width=\"1\" marker-start=\"url(#ra)\" marker-end=\"url(#ra)\"/><text x=\"618\" y=\"134\" font-weight=\"600\">150 m au moins<\/text><path d=\"M736 214 L708 168\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ra)\"/><text x=\"700\" y=\"216\" text-anchor=\"end\" font-weight=\"600\">vent<\/text><\/svg><\/div>\n<div class=\"cols\" style=\"gap:6mm\">\n<div><h3 style=\"margin-top:0\">Ce que prévoit la consigne<\/h3><ul style=\"font-size:13.9px\">\n<li>Le leader reconnaît le plan d’eau, évalue le vent et les obstacles, choisit l’axe.<\/li>\n<li data-key=\"d8\">Il prend de préférence une trajectoire sous le vent, serrée, rapide et longue, pour laisser de la place aux suivants.<\/li>\n<li>Chaque CDB est responsable de sa trajectoire, hors du souffle et du sillage des avions qui le précèdent.<\/li>\n<li>Espacement minimal : 150 m.<\/li><\/ul><\/div>\n<div><h3 style=\"margin-top:0\">Ce que dit l'usage<\/h3><ul style=\"font-size:13.9px\">\n<li>Le leader n’annonce ni le vent estimé ni sa trajectoire : le manuel ne le prévoit pas.<\/li>\n<li>On parle peu sur la fréquence de la noria, pour ne pas la saturer.<\/li>\n<li>Personne ne vérifie la position des autres : chacun gère la sienne.<\/li>\n<li>Une interruption d’écopage immobilise l’avion une dizaine de minutes ; la noria continue à trois. On ne l’entraîne que pour des pannes.<\/li><\/ul><\/div>\n<\/div>\n<h2 style=\"margin-top:1mm\">L'oreille<\/h2>\n<div><svg viewBox=\"0 0 760 230\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\"><defs><marker id=\"oa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs><rect x=\"60\" y=\"150\" width=\"640\" height=\"56\" rx=\"4\" fill=\"#f1f1f1\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"380\" y=\"220\" text-anchor=\"middle\" fill=\"#555\" font-size=\"11\">plan d'eau<\/text><path d=\"M90 140 L540 140 Q640 140 660 96 Q676 50 620 44 Q560 40 560 90 Q560 120 520 178 L120 178\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.8\" stroke-dasharray=\"7 4\" marker-end=\"url(#oa)\"/><text x=\"140\" y=\"130\" font-weight=\"600\">1 · Reconnaissance, face au nord<\/text><text x=\"548\" y=\"40\" text-anchor=\"end\" font-weight=\"600\">2 · Oreille<\/text><text x=\"548\" y=\"56\" text-anchor=\"end\" fill=\"#333\">demi-tour dans un plan oblique<\/text><path d=\"M700 20 L740 20\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#oa)\"/><text x=\"720\" y=\"36\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\">N<\/text><text x=\"200\" y=\"196\" font-weight=\"600\">3 · Descente et écopage, face au sud<\/text><text x=\"460\" y=\"120\" fill=\"#333\" font-size=\"11\">quelques secondes seulement<\/text><text x=\"460\" y=\"134\" fill=\"#333\" font-size=\"11\">entre l'oreille et l'eau<\/text><\/svg><\/div>\n<p class=\"small\" style=\"margin:0\">Schémas de principe. Ce cadre fait partie des règles du jeu.<\/p>"},{"id":"mission","label":"Mission et plan d'eau","html":"<div class=\"kicker\">Dossier de mission · 3/3<\/div>\n<h1>Votre mission, le plan d'eau<\/h1>\n<p class=\"lead\" style=\"margin-bottom:2mm\">Alerte à trente minutes depuis 8 h 30. Feu de forêt à 22 km au nord de la base. Quatre Canadair ; vous êtes numéro 2. Premier écopage sur le plan d’eau le plus proche, devenu le plan d’eau habituel depuis le déménagement de la base, il y a cinq mois.<\/p>\n<div class=\"mtr\"><b>METAR<\/b> ZZZZ 271630Z 19010KT CAVOK 30/13 Q1014=<br><b>TAF<\/b>&nbsp;&nbsp; ZZZZ 271400Z 2715/2724 19010KT CAVOK=<\/div>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.8px;line-height:1.4\">\n<div><h3 style=\"margin-top:0\">En clair<\/h3>Le 27 à 16 h 30 UTC (18 h 30 locale) : vent du 190° pour 10 kt ; CAVOK, ciel clair et visibilité supérieure à 10 km ; 30 °C ; QNH 1014 hPa. Prévision identique jusqu’à minuit.<\/div>\n<div><h3 style=\"margin-top:0\">Sur le plan d'eau<\/h3>Vent du sud-sud-ouest, 5 à 10 kt, estimé par l’équipage. Conditions de plan d’eau optimales. Turbulence faible.<\/div>\n<\/div>\n<div class=\"cols\" style=\"gap:6mm;grid-template-columns:92mm 1fr;margin-top:2mm\">\n<div><svg viewBox=\"0 0 400 470\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11\"><defs><marker id=\"ma\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><pattern id=\"ld\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#d6d6d6\" stroke-width=\"2\"/><\/pattern><\/defs><rect x=\"1\" y=\"1\" width=\"398\" height=\"468\" fill=\"url(#ld)\" stroke=\"#111\" stroke-width=\"1.4\"/><path d=\"M400 30 L300 26 Q220 24 186 70 Q166 100 166 150 L166 470 L234 470 L234 330 L232 300 Q236 260 262 214 Q290 170 330 140 Q360 118 400 112 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\"/><path d=\"M232 286 L262 286 L262 326 L234 326\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><line x1=\"232\" y1=\"286\" x2=\"232\" y2=\"326\" stroke=\"#111\" stroke-width=\"2.6\"/><rect x=\"224\" y=\"290\" width=\"7\" height=\"5\" fill=\"#111\"/><rect x=\"224\" y=\"300\" width=\"7\" height=\"5\" fill=\"#111\"/><rect x=\"224\" y=\"310\" width=\"7\" height=\"5\" fill=\"#111\"/><rect x=\"224\" y=\"320\" width=\"7\" height=\"5\" fill=\"#111\"/><rect x=\"246\" y=\"292\" width=\"10\" height=\"4\" fill=\"#777\"/><rect x=\"246\" y=\"306\" width=\"10\" height=\"4\" fill=\"#777\"/><rect x=\"246\" y=\"318\" width=\"10\" height=\"4\" fill=\"#777\"/><rect x=\"276\" y=\"268\" width=\"16\" height=\"12\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><rect x=\"296\" y=\"286\" width=\"12\" height=\"14\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><rect x=\"272\" y=\"300\" width=\"14\" height=\"12\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><rect x=\"300\" y=\"312\" width=\"16\" height=\"10\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><rect x=\"280\" y=\"330\" width=\"12\" height=\"10\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><rect x=\"318\" y=\"270\" width=\"12\" height=\"12\" fill=\"#bdbdbd\" stroke=\"#555\" stroke-width=\"0.6\"/><ellipse cx=\"200\" cy=\"446\" rx=\"12\" ry=\"9\" fill=\"url(#ld)\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"166\" y1=\"446\" x2=\"188\" y2=\"446\" stroke=\"#111\" stroke-width=\"4\"/><line x1=\"212\" y1=\"446\" x2=\"234\" y2=\"446\" stroke=\"#111\" stroke-width=\"4\"/><path d=\"M180 402 l10 0 l-2 4 l-6 0 z\" fill=\"#111\"/><path d=\"M206 120 L206 380\" stroke=\"#111\" stroke-width=\"1.2\" stroke-dasharray=\"6 5\" marker-end=\"url(#ma)\"/><line x1=\"166\" y1=\"352\" x2=\"234\" y2=\"352\" stroke=\"#111\" stroke-width=\"1\" marker-start=\"url(#ma)\" marker-end=\"url(#ma)\"/><path d=\"M60 430 L100 372\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ma)\"/><text x=\"250\" y=\"60\" text-anchor=\"start\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">coude du fleuve<\/text><text x=\"270\" y=\"250\" text-anchor=\"start\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">port de plaisance<\/text><text x=\"270\" y=\"263\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">bateaux à quai<\/text><text x=\"300\" y=\"350\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">village<\/text><text x=\"200\" y=\"368\" text-anchor=\"middle\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">460 m<\/text><text x=\"244\" y=\"450\" text-anchor=\"start\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">barrages<\/text><text x=\"176\" y=\"418\" text-anchor=\"end\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">embarcation<\/text><text x=\"212\" y=\"200\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">axe d’écopage<\/text><text x=\"212\" y=\"213\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">face au sud<\/text><text x=\"30\" y=\"450\" text-anchor=\"start\" font-weight=\"600\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">vent 5 à 10 kt<\/text><text x=\"30\" y=\"463\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">sud-sud-ouest<\/text><text x=\"160\" y=\"240\" text-anchor=\"end\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">rive droite<\/text><text x=\"330\" y=\"236\" text-anchor=\"start\" font-weight=\"400\" fill=\"#111\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">rive gauche<\/text><line x1=\"70\" y1=\"90\" x2=\"70\" y2=\"440\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"64\" y1=\"90\" x2=\"76\" y2=\"90\" stroke=\"#111\"/><line x1=\"64\" y1=\"440\" x2=\"76\" y2=\"440\" stroke=\"#111\"/><text x=\"62\" y=\"250\" text-anchor=\"middle\" font-weight=\"600\" transform=\"rotate(-90 62 250)\" paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"4\">≈ 2,5 km du coude au barrage<\/text><path d=\"M366 30 l8 22 l-8 -6 l-8 6 z\" fill=\"#111\"/><text x=\"366\" y=\"24\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"13\">N<\/text><\/svg><\/div>\n<div><h2 style=\"margin-top:0\">Le plan d'eau<\/h2>\n<p style=\"font-size:14.1px\">Un grand fleuve, fermé au sud par deux barrages. Du coude au premier barrage : environ 2,5 km. Au droit du port, le fleuve fait 460 m de large.<\/p>\n<p style=\"font-size:14.1px\">En écopage face au sud, le port de plaisance et ses bateaux à quai sont sur votre gauche. En amont du port, le coude du fleuve élargit l’eau de ce côté.<\/p>\n<h2>Vos fréquences<\/h2>\n<table style=\"font-size:13.8px\"><tr><td style=\"width:18mm\"><b>VHF 1<\/b><\/td><td>Noria : les quatre Canadair.<\/td><\/tr>\n<tr><td><b>VHF 2<\/b><\/td><td>Tour de la base. Arrivés il y a cinq mois, les Canadair sont encore mal connus des contrôleurs.<\/td><\/tr>\n<tr><td><b>FM<\/b><\/td><td>Centre de coordination de la sécurité civile.<\/td><\/tr><\/table>\n<div class=\"box tint small\" style=\"margin-top:3mm\">METAR, TAF et carte sont des reconstitutions pédagogiques, d’après le rapport BEA-É : indicateur fictif, lieux sans nom, schéma sans échelle exacte.<\/div>\n<\/div><\/div>"},{"id":"consignes","label":"Consignes de noria","html":"<div class=\"kicker\">Livret de consignes<\/div><h1>Consignes de noria<\/h1><section class=\"clf\"><h2>Consignes de noria <small>· Sommaire<\/small><\/h2><div class=\"cl-pg\">Canadair · secteur écopage<\/div><div class=\"toc\"><div class=\"r\"><b>1<\/b><span>Écopage en noria<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 2<\/span><\/div><div class=\"r\"><b>2<\/b><span>Rôles en écopage<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 3<\/span><\/div><div class=\"r\"><b>3<\/b><span>Check-list avant écopage<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 3<\/span><\/div><div class=\"r\"><b>4<\/b><span>Interruption d’écopage<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 4<\/span><\/div><div class=\"r\"><b>5<\/b><span>Largage de secours<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 5<\/span><\/div><div class=\"r\"><b>6<\/b><span>Messages d’urgence<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 5<\/span><\/div><div class=\"r\"><b>7<\/b><span>Communications<\/span><span class=\"dots\"><\/span><span class=\"p\">p. 6<\/span><\/div><\/div>\n<div class=\"tok plain\" style=\"margin-top:2.2mm\"><div>Ce livret fixe le cadre du jeu : seules ces consignes existent.<\/div><\/div><\/section><section class=\"clf\"><h2>Écopage en noria <small>· Rubrique 1<\/small><\/h2><div class=\"cl-sec\">1 · Écopage en noria<\/div><ul class=\"clp\"><li>Le chef de noria reconnaît le plan d’eau : vent, houle, obstacles, objets flottants. Il détermine l’axe d’écopage.<\/li><li>Il prend de préférence une trajectoire sous le vent, serrée, rapide et longue, pour laisser de la place aux suivants.<\/li><li>Chaque commandant de bord est responsable de sa trajectoire. Il se place hors du souffle et du sillage des avions qui le précèdent.<\/li><li data-key=\"d14\">Espacement minimal entre deux avions de la noria : 150 m.<\/li><\/ul><\/section><section class=\"clf\"><h2>Rôles · check-list <small>· Rubriques 2 et 3<\/small><\/h2><div class=\"cl-sec\">2 · Rôles en écopage<\/div>\n<table class=\"roles\"><tr><td>CDB<\/td><td>Place gauche. Pilote : trajectoire, décisions, appel des check-lists.<\/td><\/tr>\n<tr data-key=\"d8 d5\"><td>Copilote<\/td><td>Place droite. Butées des manettes, annonce du remplissage, check-lists, interruption de l’écopage si nécessaire.<\/td><\/tr><\/table>\n<div class=\"cl-sec\">3 · Check-list avant écopage<\/div>\n<div class=\"cl-row\"><span class=\"it\">Volets<\/span><span class=\"dots\"><\/span><span class=\"st\">15°<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Train<\/span><span class=\"dots\"><\/span><span class=\"st\">RENTRÉ<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Portes de largage<\/span><span class=\"dots\"><\/span><span class=\"st\">FERMÉES<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Butées des manettes<\/span><span class=\"dots\"><\/span><span class=\"st\">RÉGLÉES<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Vitesse de finale<\/span><span class=\"dots\"><\/span><span class=\"st\">90 KT<\/span><\/div><\/section><section class=\"clf\"><h2>Interruption <small>· Rubrique 4<\/small><\/h2><div class=\"cl-sec\">4 · Interruption d'écopage<\/div>\n<div class=\"cl-sub\" data-key=\"d1 d5\">Annoncée par le CDB ou par le copilote.<\/div>\n<div class=\"cl-row\"><span class=\"it\">Annonce<\/span><span class=\"dots\"><\/span><span class=\"st\">« INTERRUPTION ! »<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Manettes<\/span><span class=\"dots\"><\/span><span class=\"st\">RÉDUITES<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Avion<\/span><span class=\"dots\"><\/span><span class=\"st\">SUR LE PLAN D'EAU<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Soutes<\/span><span class=\"dots\"><\/span><span class=\"st\">VIDANGER<\/span><\/div>\n<div class=\"cl-sub\">Immobilisation sur le plan d’eau : environ 10 min.<\/div>\n<div class=\"cl-sub\" style=\"margin-top:1.4mm\">Cas entraînés : voyant FLOOD, panne moteur, avarie grave, divergence des paramètres en hydroplanage.<\/div><\/section><section class=\"clf\"><h2>Largage · urgence <small>· Rubriques 5 et 6<\/small><\/h2><div class=\"cl-sec\">5 · Largage de secours<\/div>\n<div class=\"cl-row\"><span class=\"it\">Commande<\/span><span class=\"dots\"><\/span><span class=\"st\">PILOTE OU COPILOTE<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Zone survolée<\/span><span class=\"dots\"><\/span><span class=\"st\">DÉGAGÉE<\/span><\/div><div class=\"cl-row\"><span class=\"it\">Largage<\/span><span class=\"dots\"><\/span><span class=\"st\">ACTIONNER<\/span><\/div>\n<div class=\"cl-sec\">6 · Messages d'urgence<\/div>\n<ul class=\"clp\"><li><b>MAYDAY<\/b> : détresse. Danger grave et imminent, assistance immédiate requise.<\/li>\n<li><b>PAN PAN<\/b> : urgence. Problème grave à bord, sans besoin d’assistance immédiate.<\/li><\/ul><\/section><section class=\"clf\"><h2>Communications <small>· Rubrique 7<\/small><\/h2><div class=\"cl-sec\">7 · Communications<\/div>\n<div class=\"cl-row\"><span class=\"it\">VHF 1<\/span><span class=\"dots\"><\/span><span class=\"st\">NORIA<\/span><\/div><div class=\"cl-row\"><span class=\"it\">VHF 2<\/span><span class=\"dots\"><\/span><span class=\"st\">TOUR<\/span><\/div><div class=\"cl-row\"><span class=\"it\">FM<\/span><span class=\"dots\"><\/span><span class=\"st\">CENTRE DE COORDINATION<\/span><\/div>\n<div class=\"cl-sub\" style=\"margin-top:1.6mm\">Écopage : aucune annonce n’est prévue pour le leader.<\/div>\n<div class=\"cl-sub\">Usage : limiter les échanges pour ne pas saturer les fréquences.<\/div><\/section>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><circle cx=\"16\" cy=\"16\" r=\"5\"/><circle cx=\"32\" cy=\"16\" r=\"5\"/><path d=\"M8 38c0-6 4-10 8-10s8 4 8 10M24 38c0-6 4-10 8-10s8 4 8 10\"/><path d=\"M28 6h10\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M8 36c0-14 10-24 24-24h6\"/><path d=\"M34 6l6 6-6 6\"/><path d=\"M4 42h40\" stroke-dasharray=\"4 4\"/><\/svg>","14":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 30l14-3 4 2-4 2-12 1z\"/><path d=\"M42 22l-14 3-4-2 4-2 12-1z\"/><path d=\"M22 36l4 0M14 40h20\" stroke-dasharray=\"3 3\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 30c4-3 8-3 12 0s8 3 12 0 8-3 12 0 4 3 4 3\"/><path d=\"M4 38c4-3 8-3 12 0s8 3 12 0 8-3 12 0\"/><path d=\"M12 22l18-4 6 2-6 3-16 2z\"/><\/svg>","3":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 34c4-3 8-3 12 0s8 3 12 0 8-3 12 0\"/><path d=\"M14 28l18-3 5 2-5 2-16 1z\"/><path d=\"M24 12v8M20 16h8\"/><\/svg>","18":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 38h40\"/><path d=\"M28 38l4-10h10l-2 10\"/><path d=\"M8 30l16-3 4 2-4 2-14 1z\"/><\/svg>","12":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M30 40V12M30 14l10 8H30\"/><path d=\"M4 40h40\"/><path d=\"M6 20l18-4 5 2-5 2-16 1z\"/><\/svg>","7":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M30 40V14\"/><path d=\"M4 40h40\"/><path d=\"M8 24l16-3 4 2-4 2-14 1z\"/><path d=\"M36 10l6 6M42 10l-6 6\"/><\/svg>"},"brief":"Vous êtes copilote. Votre crédit auprès du commandant de bord et du groupe est limité : chaque parole qui le contredit se paie.","eval":{"questions":[{"t":"En noria, selon la consigne, où le leader se place-t-il pour écoper ?","type":"single","options":["Sous le vent, en laissant la place au vent aux équipiers","Au vent, pour éviter son propre souffle","Au milieu du plan d’eau","Cela dépend de l’expérience du leader"],"answer":0,"notion":"Règle de placement en noria"},{"t":"Quels éléments rendent une alerte efficace ?","type":"multi","options":["Un fait chiffré","La conséquence attendue","Une question vague, pour ménager le CDB","Attendre que le CDB demande votre avis","Une action proposée ou annoncée","Une référence écrite : consigne ou check-list"],"answer":[0,1,4,5],"notion":"Alerte factuelle, adossée à un texte"},{"t":"Qu’appelle-t-on l’« effet spectateur » dans un équipage ?","type":"open","expected":"Ne pas intervenir parce qu’on pense qu’un autre, ici le CDB, a la situation en main","notion":"Effet spectateur"},{"t":"« Annoncer ses intentions sur la fréquence de la noria la sature et dégrade la sécurité. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Annonce des intentions en formation (recommandation R1)"},{"t":"Selon le BEA-É, qu’est-ce qui explique d’abord le silence du copilote ?","type":"single","options":["Un manque de compétence","Un retrait prévisible, produit par le climat du cockpit et l’organisation du secteur","La fatigue","Il n’avait rien remarqué"],"answer":1,"notion":"Lecture systémique du silence, et non individuelle"},{"t":"« Une interruption d’écopage est d’autant plus sûre qu’elle est décidée tôt, sur des critères fixés à l’avance. »","type":"single","options":["Vrai","Faux"],"answer":0,"notion":"Renoncement préparé"}],"q7":"« Je me sens capable d’interrompre une action engagée par un commandant de bord plus expérimenté que moi. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de mission suffisait pour comprendre la situation.","La durée était adaptée.","Les jetons CRÉDIT rendaient la pression réaliste."],"yn":["Connaissiez-vous l’événement réel avant la séance ?","Avez-vous déjà volé en équipage avec un commandant de bord qui ne laissait pas parler ?"],"open":["Quel choix vous a paru le plus difficile, et qu’est-ce qui le rendait coûteux ?"],"application":"Que direz-vous, et quand, lors de votre prochain vol en équipage ?"},"criteria":{"traps":[20,9],"fin_max":70,"fin1":null,"extra":[["Effet du prix de la parole","taux d’alerte (carte 6) selon le choix en D1 ; réactions aux options fermées"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un pair Canadair","aucune réserve technique majeure"]]},"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\" style=\"margin-bottom:2mm\">Transformer l’expérience du jeu en compréhension : le cas réel, le prix de la parole, les barrières, ce que recommande le BEA-É. Trois règles : faire parler avant d’expliquer ; analyser des situations, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"box tint small\" style=\"margin-bottom:2mm\">Matériel : tableau blanc, fiche mémo (une par participant, distribuée à la fin), répartition des choix, jetons CRÉDIT restants et réponses aux dernières questions relevés pendant la partie.<\/div>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Chacun garde sa pile de vol fermée. Tour de table rapide, copilotes et mécaniciens en premier.<\/div><div class=\"l\">Demander<\/div><div>« En un mot, qu’avez-vous ressenti en rendant votre premier jeton ? » puis « Et quand une option vous a été fermée ? »<\/div><div class=\"l\">Repère<\/div><div>Ne rien analyser encore. « C’est injuste », la gêne, la colère contre le CDB ou contre le jeu sont des données : c’est ce que vivait le copilote.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Pile de vol et dernières questions<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Chacun lit le dos de ses cartes SUITE, en silence (2 min). Main levée par décision ; reporter au tableau la répartition de D1 à D4, puis les fins et les jetons CRÉDIT restants. Faire lire une réponse à la dernière question par fin.<\/div><div class=\"l\">Repère<\/div><div>« Un silence choisi par beaucoup est un silence réaliste, pas un groupe faible. » Qui avait encore des jetons à l’abordage ?<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:07<small>4 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter l’événement à partir de la chronologie de la fiche mémo (page 1), sans la lire. Révéler l’issue.<\/div><div class=\"l\">Dire<\/div><div>Un CDB de près de 5 000 écopages, chef des personnels navigants. Un copilote de près de 5 000 écopages lui aussi. Aucune faute grossière isolée : une suite de silences, chacun logique sur le moment. Cinq à sept secondes entre l’oreille et l’eau.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:11<small>6 min<\/small><\/div><div><h3>Le prix de la parole<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Partir des jetons : qui a payé, qui a renoncé, qui a ri et récupéré un jeton ? Puis lire les faits du rapport (fiche mémo, page 3) : statut, contrat, deux clans, circuit RETEX qui revient au CDB.<\/div><div class=\"l\">Demander<\/div><div>« Qui fixait le prix de chaque mot ? » · « Qu’est-ce qui rendait la parole gratuite ? » (la consigne) · « Chez nous, que coûte une remarque d’un copilote à son commandant de bord ? »<\/div><div class=\"l\">Dire<\/div><div>Le jeu ne dit pas que se taire est rationnel : il montre que le silence se fabrique. Le BEA-É parle d’un « comportement prévisible de retrait », pas d’un défaut de caractère.<\/div><div class=\"l\">Repère<\/div><div>Ceux qui ont payé le contrat avaient raison sur le fond : le leur dire. C’est l’organisation qui en fixait le prix, et c’est elle que visent R6 et R9. Ne laisser personne conclure « il valait mieux se taire ».<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:17<small>6 min<\/small><\/div><div><h3>Analyse : six barrières<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Dessiner six tranches au tableau (modèle de Reason). Laisser le groupe trouver le trou de chaque tranche, puis compléter avec la fiche mémo (page 2).<\/div><div class=\"l\">Demander<\/div><div>« Quelle tranche le copilote pouvait-il boucher, et à quel prix ? » · « Et le leader ? » · « Laquelle notre unité laisse-t-elle ouverte ? »<\/div><div class=\"l\">Zoom<\/div><div>Un double gradient d’autorité : trop fort dans le cockpit (chef des PN face à un copilote sans perspective de carrière), inversé dans la noria (leader récent face à son propre chef).<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:23<small>3 min<\/small><\/div><div><h3>Ce que recommande le BEA-É<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter cinq des quinze recommandations (fiche mémo, page 5) : R1 et R2 (annonces, briefings en vol), R6 (rôle du copilote), R8 (suivi des recommandations), R9 (cursus des pilotes).<\/div><div class=\"l\">Demander<\/div><div>« Laquelle concerne aussi notre unité ? Qui la porterait, et pour quand ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai : c’est ainsi qu’un enseignement devient une barrière. Quatre audits en vingt-sept ans étaient restés sans effet.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:26<small>2 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler cinq distinctions, puis renvoyer au glossaire : gradient d’autorité fort ou inversé · discours atténué ou alerte factuelle · question ou annonce · silence défensif ou de résignation · signalement ou dissimulation.<\/div><div class=\"l\">Demander<\/div><div>« Dans le jeu, à quel moment avez-vous posé une question là où il fallait une annonce ? »<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les éléments à retenir et l’échelle de prise de parole (fiche mémo, page 4). Distribuer la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Sur votre avion, quelle décision d’arrêt relève de votre fonction, sur quel texte s’appuie-t-elle, et avec quels mots l’annoncez-vous ? » Puis tour de table : « Ce que je dirai, et quand, au prochain vol. »<\/div><\/div><\/div><\/div>\n<div class=\"box dark\" style=\"margin-top:3mm\"><div class=\"kicker\" style=\"color:#ccc\">Ensuite · 5 min<\/div>Questionnaire après, puis fiche « Ma pile de vol et mon avis ». Récupérer les fiches, les jetons et retrier les paquets.<\/div>\n<div class=\"box small\" style=\"margin-top:1mm\">Si le temps manque, ne coupez jamais « Le prix de la parole » ni l’analyse. Si des CDB et leurs copilotes sont dans la salle, ne demandez jamais à un copilote de juger son propre CDB : restez sur le cas. Un CDB qui se reconnaît dans le personnage est une occasion, pas une cible.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · 1/6<\/div>\n<h1>Ce qui s'est réellement passé<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.6mm\">Le 27 août 2017, à Vallabrègues (Gard), un Canadair CL 415 de la sécurité civile, numéro 2 d’une noria de quatre, heurte une péniche amarrée en décollant après un écopage sur le Rhône. L’équipage et les plaisanciers sont indemnes ; l’avion et deux bateaux sont endommagés.<\/p>\n<div class=\"tl\" style=\"margin-top:0\"><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">9 h 15<\/div><div>Après le briefing, au copilote qui juge que « tous les feux sont au vert », le CDB répond : « Cela ne t’empêchera pas de la fermer pendant le vol ! » Puis il part travailler à son bureau.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">18 h 51<\/div><div>Décollage du n° 2. Il rejoint le leader trop vite et doit cabrer et réduire pour reprendre sa place.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 1 min 19 s<\/div><div>Reconnaissance face au nord. Le n° 2 est à droite du leader, à 150 m. Vent du sud-sud-ouest, 5 à 10 kt.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 1 min<\/div><div>Pendant l’oreille, le n° 2 dépasse le leader sans l’annoncer.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 56 s<\/div><div>Écart d’une cinquantaine de mètres. Le n° 2 se place sous le vent, à gauche du leader, pensant qu’il écopera au milieu. Le leader serre le port.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 19 s<\/div><div>Début de l’écopage à 87 kt. Le copilote a fait la check-list sans qu’elle soit appelée.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 14 s<\/div><div>Le CDB voit le resserrement et cherche à sortir de l’eau en se rapprochant du leader.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 − 11 s<\/div><div>Rejeté à gauche par le souffle du leader. Écart : 80 m. Le copilote règle la butée droite et annonce le remplissage.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 (18 h 57)<\/div><div>À la sortie de l’eau, l’aile gauche heurte le mât d’une péniche à quai, occupée par des plaisanciers. Ballonnet gauche arraché.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">T0 + 10 s<\/div><div>Largage de secours, une fois la zone portuaire dépassée. Retour à 120-130 kt, sans PAN PAN ; les secours sont déclinés.<\/div><\/div><\/div>\n<h2 style=\"margin-top:2mm\">Ce que l'enquête a établi<\/h2>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.4px;line-height:1.38\">\n<div><ul style=\"margin:0\">\n<li>Aucune annonce, ni du leader ni du n° 2 : le manuel n’en prévoit pas, l’usage est au silence radio.<\/li>\n<li>Espacement inférieur à 100 m pour 150 m prescrits : une habitude connue de ce CDB.<\/li>\n<li>Le copilote, surpris, n’a rien dit ; il s’est décrit comme « spectateur ». Deux fiches RETEX sur ce binôme, au printemps, étaient restées sans suite.<\/li>\n<li>L’interruption d’écopage n’a pas été envisagée ; à la détection du piège, elle n’était plus possible sans risque.<\/li>\n<\/ul><\/div>\n<div><ul style=\"margin:0\">\n<li>Le leader, chef de noria depuis deux mois, a accéléré pour s’espacer plutôt que de demander au n° 2, son chef, de tenir sa place.<\/li>\n<li>Le CDB cumulait les fonctions de cadre ; deux semaines de congés en huit mois. Deux semaines plus tôt, il s’était assoupi au volant après une permanence ; il s’était jugé apte lui-même, avec son chef. Pas de médecin du personnel navigant depuis 2011.<\/li>\n<li>Inspection de piste réalisée deux jours plus tard, à l’initiative des enquêteurs.<\/li>\n<\/ul><\/div>\n<\/div>"},{"id":"raison","label":"Le raisonnement","html":"<div class=\"kicker\">Fiche mémo · 2/6<\/div>\n<h1>Pourquoi : six barrières traversées<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Modèle de Reason : un accident survient quand les trous de plusieurs barrières s’alignent. Ici, quatre barrières étaient déjà percées avant l’alerte.<\/p>\n<div style=\"margin:0 0 1mm\"><svg viewBox=\"0 0 690 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\">\n<defs><pattern id=\"h2\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#c4c4c4\" stroke-width=\"2\"/><\/pattern>\n<marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\".8\" fill=\"#111\">\n<path d=\"M78 22 V14 H236 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"157\" y=\"9\" text-anchor=\"middle\">ORGANISATION<\/text>\n<path d=\"M274 22 V14 H432 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"353\" y=\"9\" text-anchor=\"middle\">CONDITIONS PRÉALABLES<\/text>\n<path d=\"M470 22 V14 H628 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"549\" y=\"9\" text-anchor=\"middle\">ACTES EN VOL<\/text>\n<\/g>\n<path d=\"M82 46 L120 30 L120 178 L82 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"101\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"101\" cy=\"62\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M180 46 L218 30 L218 178 L180 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"199\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"199\" cy=\"160\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M278 46 L316 30 L316 178 L278 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"297\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"297\" cy=\"80\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M376 46 L414 30 L414 178 L376 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"395\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"395\" cy=\"150\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M474 46 L512 30 L512 178 L474 194 Z\" fill=\"#bdbdbd\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"493\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"493\" cy=\"58\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M572 46 L610 30 L610 178 L572 194 Z\" fill=\"#bdbdbd\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"591\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"591\" cy=\"165\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/>\n<line x1=\"8\" y1=\"112\" x2=\"676\" y2=\"112\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ra)\"/>\n<g font-size=\"10\" fill=\"#111\" text-anchor=\"middle\"><text x=\"101\" y=\"216\" font-weight=\"600\">1 · Organisation<\/text><text x=\"101\" y=\"230\">cumul, médecin<\/text><text x=\"199\" y=\"216\" font-weight=\"600\">2 · Consignes<\/text><text x=\"199\" y=\"230\">et entraînement<\/text><text x=\"297\" y=\"216\" font-weight=\"600\">3 · Noria<\/text><text x=\"297\" y=\"230\">silence, gradient<\/text><text x=\"395\" y=\"216\" font-weight=\"600\">4 · Cockpit<\/text><text x=\"395\" y=\"230\">climat fermé<\/text><text x=\"493\" y=\"216\" font-weight=\"600\">5 · CDB<\/text><text x=\"493\" y=\"230\">placement, écart<\/text><text x=\"591\" y=\"216\" font-weight=\"600\">6 · Copilote<\/text><text x=\"591\" y=\"230\">silence<\/text><\/g>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" fill=\"#111\"><text x=\"8\" y=\"100\">MISSION<\/text><text x=\"8\" y=\"134\">FEU<\/text><text x=\"676\" y=\"100\" text-anchor=\"end\">ABORDAGE<\/text><\/g>\n<\/svg><\/div>\n<table style=\"font-size:13.4px\"><tr><th>Barrière<\/th><th>Ce qui a cédé, selon le BEA-É<\/th><\/tr><tr><td style='width:40mm'><b>1 · Organisation<\/b><\/td><td>Responsabilités concentrées sur quelques cadres ; fatigue évaluée par l’intéressé et son chef, sans médecin ; clans CDB et copilotes ; audits antérieurs non suivis d’effet ; climat de sécurité jugé défavorable.<\/td><\/tr><tr><td style='width:40mm'><b>2 · Consignes et entraînement<\/b><\/td><td>Manuel sans annonce du leader ; aucune vérification du placement des équipiers ; interruption d’écopage entraînée seulement pour des pannes ; rôle du copilote réduit aux butées, au remplissage et aux check-lists.<\/td><\/tr><tr><td style='width:40mm'><b>3 · Noria<\/b><\/td><td>Silence radio par habitude ; trajectoires gérées chacun pour soi ; leader récent face à son propre chef, qui accélère au lieu de demander.<\/td><\/tr><tr><td style='width:40mm'><b>4 · Cockpit<\/b><\/td><td>Gradient d’autorité fort ; boutade du matin qui fixe la règle ; check-list non appelée ; difficultés connues du binôme, non traitées.<\/td><\/tr><tr><td style='width:40mm'><b>5 · CDB<\/b><\/td><td>Consigne réinterprétée sans l’annoncer ; espacement habituel réduit ; représentation erronée de la trajectoire du leader, confortée par le coude du fleuve ; sentiment de maîtrise ; fatigue.<\/td><\/tr><tr><td style='width:40mm'><b>6 · Copilote<\/b><\/td><td>Surprise non exprimée, dans un climat où parler coûtait ; « il a sûrement un plan » ; aucune alerte, aucune interruption proposée.<\/td><\/tr><\/table>\n<div class=\"box tint small\"><b>Expertise et règle.<\/b> Pour le leader, la consigne de placement est systématique ; pour le CDB du n° 2, elle dépend du vent et du nombre d’avions. Le BEA-É y voit l’attitude d’un expert qui s’autorise à réinterpréter la règle, et note que seule une communication systématique des intentions aurait levé l’ambiguïté.<\/div>"},{"id":"silence","label":"Le prix de la parole","html":"<div class=\"kicker\">Fiche mémo · 3/6<\/div>\n<h1>Pourquoi le copilote s'est tu<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.4mm\">Le BEA-É ne reproche pas au copilote son silence : il y voit un « comportement prévisible de retrait », produit par le leadership du CDB et par l’organisation du secteur.<\/p>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.0px;line-height:1.36\">\n<div><h3 style=\"margin-top:0\">Ce qu'établit le rapport<\/h3><ul style=\"margin:0\"><li><b>Un statut sans issue.<\/b> Les copilotes sont recrutés après un début de carrière civile ; leur statut ne leur permet pas de devenir commandant de bord. Ils signent le plus souvent des CDD de trois ans, renouvelables une fois.<\/li><li><b>Deux clans.<\/b> Un secteur « scindé en deux » : des CDB issus de la chasse, en fin de carrière, qui conduisent l’avion ; des copilotes cantonnés à la technique et aux check-lists. Démotivation et « positionnement asymétrique », déjà relevés par l’IMASSA en 2005.<\/li><li><b>Le CDB.<\/b> Chef des personnels navigants, responsable de l’instruction, ancien de la chasse et de la Patrouille de France, « forte personnalité », leadership « plutôt autocratique ». Des copilotes appréhendaient de voler avec lui ; certains annonçaient que « cette année ce CDB aurait un accident ».<\/li><li><b>Un circuit bouclé.<\/b> Les difficultés du binôme avaient été signalées par deux fiches RETEX au printemps, exploitées notamment par le chef des PN, c’est-à-dire le CDB lui-même. Aucune mesure concrète.<\/li><li><b>Des audits sans suite.<\/b> IFSA 1990, IMASSA 2005, BEAD-air 2006, DSAÉ 2017 : mesures non prises en compte ou non appliquées.<\/li><\/ul><\/div>\n<div><h3 style=\"margin-top:0\">Ce qu'en dit la psychologie du travail<\/h3><ul style=\"margin:0\"><li><b>Silence organisationnel.<\/b> Morrison et Milliken, 2000. On se tait quand deux croyances s’installent : parler ne sert à rien (les fiches restées sans suite) et parler est dangereux (statut, avis, réputation).<\/li><li><b>Défensif ou résigné.<\/b> Van Dyne et coll., 2003. Le silence défensif protège de la sanction ; le silence de résignation abandonne : « le CDB doit avoir son projet d’action », « spectateur ». Le copilote réel cumule les deux.<\/li><li><b>Sécurité psychologique.<\/b> Edmondson, 1999. Une équipe parle quand chacun est convaincu qu’il ne sera ni humilié ni puni pour l’avoir fait. Une boutade du chef devant les pairs la détruit en une phrase.<\/li><li><b>Le clan qui s’entretient.<\/b> Le groupe dominé transmet lui aussi la norme : « avec lui, tu fais tes butées et tu rentres ». Le silence est payé en tolérance.<\/li><\/ul><\/div>\n<\/div>\n<h2 style=\"margin-top:2mm\">Ce que le jeu vous a fait vivre<\/h2>\n<table style=\"font-size:13.1px\"><tr><td style='width:62mm'><b>Un jeton repris à la carte 1<\/b><\/td><td>La boutade fixe la règle du vol avant le décollage.<\/td><\/tr><tr><td style='width:62mm'><b>Rire rend un jeton<\/b><\/td><td>Le groupe récompense le silence.<\/td><\/tr><tr><td style='width:62mm'><b>Le contrat coûte deux jetons<\/b><\/td><td>Une demande personnelle à un chef autocratique se paie cher, même juste.<\/td><\/tr><tr><td style='width:62mm'><b>« Ça va passer ? » est gratuit<\/b><\/td><td>Le discours atténué est la parole de celui qui n’a plus de crédit.<\/td><\/tr><tr><td style='width:62mm'><b>CONSIGNE rend l’interruption gratuite<\/b><\/td><td>Un critère écrit et partagé change une contestation en application.<\/td><\/tr><tr><td style='width:62mm'><b>Les jetons gardés ne servent plus<\/b><\/td><td>Le silence ne protège personne longtemps.<\/td><\/tr><\/table>\n<div class=\"box dark\" style=\"margin-top:2mm;font-size:13.4px\"><div class=\"kicker\" style=\"color:#ccc\">Qui fixe le prix de la parole ?<\/div><b>Le copilote peut le baisser<\/b> : s’appuyer sur un texte, un fait chiffré ; ne pas contresigner la boutade. <b>Le CDB peut l’annuler<\/b> : un contrat de parole qu’il porte lui-même, au briefing. <b>Seule l’organisation peut le supprimer<\/b> : statut et cursus (R9), rôle du copilote (R6), circuit de signalement qui ne passe pas par la personne en cause, suivi des audits (R7, R8).<\/div>\n<p class=\"small\" style=\"margin:1mm 0 0\">Le personnage du jeu est composite : le copilote réel était au secteur depuis 2008, et le rapport ne précise pas son contrat. Le CDD décrit est celui de la plupart des copilotes.<\/p>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · 4/6<\/div>\n<h1>Les éléments à retenir<\/h1>\n<div style=\"margin-bottom:2mm\"><div class=\"keep\" style=\"padding:1.8mm 0\"><div class=\"n\" style=\"font-size:35.2px\">1<\/div><div><b>Le silence se fabrique.<\/b><br>Statut, clan, circuit de signalement bouclé : l’organisation fixe le prix de chaque mot. Le baisser est le travail de tous, d’abord des chefs.<\/div><\/div><div class=\"keep\" style=\"padding:1.8mm 0\"><div class=\"n\" style=\"font-size:35.2px\">2<\/div><div><b>Le ton se donne au sol, par le chef.<\/b><br>Une boutade d’autorité ferme un cockpit ; c’est au commandant de bord d’ouvrir le contrat de parole, pas au copilote de le quémander.<\/div><\/div><div class=\"keep\" style=\"padding:1.8mm 0\"><div class=\"n\" style=\"font-size:35.2px\">3<\/div><div><b>Un texte parle pour vous.<\/b><br>Consigne, check-list, critère écrit : une parole adossée à une règle coûte moins qu’un avis. En formation, annoncer ses intentions évite de deviner.<\/div><\/div><div class=\"keep\" style=\"padding:1.8mm 0\"><div class=\"n\" style=\"font-size:35.2px\">4<\/div><div><b>Un fait, un chiffre, une conséquence.<\/b><br>Puis monter d’un cran si l’alerte n’est pas entendue. La règle protège aussi l’expert.<\/div><\/div><div class=\"keep\" style=\"padding:1.8mm 0\"><div class=\"n\" style=\"font-size:35.2px\">5<\/div><div><b>Renoncer se prépare et se partage.<\/b><br>Des critères d’interruption fixés avant le vol ; un renoncement raconté et valorisé après.<\/div><\/div><\/div>\n<h2>L'échelle de la prise de parole<\/h2>\n<p style=\"font-size:14.1px;margin-bottom:1mm\">Quatre crans, du plus doux au plus ferme (modèle dit PACE). On monte d’un cran quand le précédent n’a pas été entendu, et d’autant plus vite que le temps manque.<\/p>\n<div class=\"ladder\"><div class=\"st s1\"><b>Questionner<\/b>« On passe sous le vent ? Il va serrer le port, non ? »<i>Hors jeu · fait dire au CDB ce qu’il croit<\/i><\/div><div class=\"st s2\"><b>Alerter<\/b>« Cent nœuds. Il serre le port, quatre-vingts mètres, on converge. »<i>Carte 6 · un fait, un chiffre, une conséquence<\/i><\/div><div class=\"st s3\"><b>Contester<\/b>« Quatre-vingts mètres pour cent cinquante. Je propose d’interrompre. »<i>Hors jeu · un écart à la règle et une solution<\/i><\/div><div class=\"st s4\"><b>Décider<\/b>« Interruption ! »<i>Carte 15 · la prérogative du copilote<\/i><\/div><\/div>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.8px\">\n<div><h3 style=\"margin-top:0\">Deux pièges du jeu<\/h3><ul style=\"margin:0\">\n<li><b>Le discours atténué<\/b> (carte 20) : « Ça va passer ? » n’apporte aucun fait et invite à répondre oui.<\/li>\n<li><b>La demande de permission<\/b> (cartes 9 et 11) : elle laisse la décision à celui qui a le plus de mal à renoncer, ou à céder.<\/li><\/ul><\/div>\n<div><h3 style=\"margin-top:0\">Et après l'événement<\/h3><ul style=\"margin:0\">\n<li>Se déclarer (PAN PAN), accepter les secours, demander une inspection de piste (recommandation R12).<\/li>\n<li>Signaler, même sans dégât : une fin « passée de justesse » est un événement.<\/li><\/ul><\/div>\n<\/div>"},{"id":"reco","label":"Les recommandations","html":"<div class=\"kicker\">Fiche mémo · 5/6<\/div>\n<h1>Les 15 recommandations du BEA-É<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.6mm\">Adressées à la direction générale de la sécurité civile et de la gestion des crises (DGSCGC), sauf R12, adressée à toutes les autorités d’emploi. R1 à R10 touchent directement l’événement ; R11 à R15 sont des constats faits en marge de l’enquête. Formulations résumées.<\/p>\n<table class=\"rec\"><tr><td>R1<\/td><td>Systématiser l’annonce, par le leader, du vent estimé et de son positionnement sur le plan d’eau.<\/td><\/tr><tr><td>R2<\/td><td>Mettre en place des briefings systématiques dans les phases clés du vol, avec une procédure CRM adaptée, et vérifier le placement relatif des équipiers.<\/td><\/tr><tr><td>R3<\/td><td>Mener une réflexion sur la charge de travail des cadres navigants.<\/td><\/tr><tr><td>R4<\/td><td>Créer un statut d’instructeur opérationnel dédié à la formation.<\/td><\/tr><tr><td>R5<\/td><td>Créer un statut de commandant de bord de réception, pour alléger les instructeurs.<\/td><\/tr><tr><td>R6<\/td><td>Revaloriser le rôle du copilote pendant l’écopage et les phases qui l’entourent.<\/td><\/tr><tr><td>R7<\/td><td>Prendre en compte les recommandations des audits antérieurs par de nouveaux plans d’action.<\/td><\/tr><tr><td>R8<\/td><td>Mettre en place un système pérenne de suivi des recommandations.<\/td><\/tr><tr><td>R9<\/td><td>Mettre en œuvre les recommandations des audits et faire évoluer les cursus des pilotes.<\/td><\/tr><tr><td>R10<\/td><td>Étudier la possibilité de disposer d’un médecin du personnel navigant.<\/td><\/tr><tr><td>R11<\/td><td>Rendre obligatoire le port du nouveau gilet de sauvetage.<\/td><\/tr><tr><td>R12<\/td><td>Rappeler aux équipages, même expérimentés, de prendre le temps de communiquer avec la tour et de décrire la situation.<\/td><\/tr><tr><td>R13<\/td><td>Transformer les salles de repos en chambres individuelles permettant un repos effectif.<\/td><\/tr><tr><td>R14<\/td><td>Étudier le report dans le cockpit de l’état du G-switch de l’enregistreur de conversations.<\/td><\/tr><tr><td>R15<\/td><td>Sensibiliser la commission d’analyse des vols à l’obligation de communiquer tout élément demandé par les enquêteurs.<\/td><\/tr><\/table>\n<h2 style=\"margin-top:1mm\">Notre lecture pour nos équipages<\/h2>\n<p class=\"small\" style=\"margin-bottom:1mm\">Propositions de ce kit, déduites du rapport : ce ne sont pas des recommandations du BEA-É.<\/p>\n<ul style=\"font-size:13.8px\">\n<li>En vol en formation : annoncer son intention et son placement, et vérifier ceux des autres.<\/li>\n<li>Au briefing : un contrat de parole explicite, porté par le commandant de bord, jamais quémandé par le copilote.<\/li>\n<li>Un circuit de signalement qui ne passe pas d’abord par la personne mise en cause.<\/li>\n<li>Pour chaque phase critique : un critère d’arrêt connu de tout l’équipage, et qui peut l’annoncer.<\/li>\n<\/ul>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · 6/6<\/div>\n<h1>Les mots du scénario<\/h1>\n<div class=\"gl\"><h3>Canadair et écopage<\/h3><div class=\"e\"><b>Noria.<\/b> Patrouille qui fait des allers-retours réguliers entre le plan d’eau et le feu.<\/div><div class=\"e\"><b>Chef de noria.<\/b> Commandant de bord qui mène la noria : reconnaissance du plan d’eau, choix de l’axe.<\/div><div class=\"e\"><b>Écopage.<\/b> Remplissage des soutes en glissant sur l’eau, écopes sorties. Environ dix secondes sur eau calme.<\/div><div class=\"e\"><b>Écopes.<\/b> Prises d’eau rétractables sous la coque.<\/div><div class=\"e\"><b>Soutes.<\/b> Quatre réservoirs d’eau, environ 6 t au total, larguées ensemble ou séparément.<\/div><div class=\"e\"><b>Largage de secours.<\/b> Délestage d’urgence de l’eau, commandé depuis le poste du pilote ou du copilote.<\/div><div class=\"e\"><b>Ballonnet.<\/b> Flotteur sous chaque bout d’aile. C’est lui qui a heurté le mât.<\/div><div class=\"e\"><b>Winglet.<\/b> Ailette verticale en bout d’aile.<\/div><div class=\"e\"><b>Oreille.<\/b> Demi-tour dans un plan oblique, pour revenir vers le plan d’eau dans peu d’espace.<\/div><div class=\"e\"><b>Souffle, sillage.<\/b> Air brassé par les hélices et turbulences laissées derrière un avion ; le vent les déplace.<\/div><div class=\"e\"><b>Sous le vent, au vent.<\/b> Côté vers lequel le vent pousse, côté d’où il vient.<\/div><div class=\"e\"><b>Piège de l’entonnoir.<\/b> Avion pris entre le souffle du leader d’un côté et la rive de l’autre, dans un espace qui se resserre.<\/div><div class=\"e\"><b>Butées des manettes.<\/b> Réglage par le copilote de la puissance maximale de chaque moteur pendant l’écopage.<\/div><div class=\"e\"><b>Interruption d’écopage.<\/b> Arrêt volontaire sur l’eau : environ dix minutes pour vidanger avant de repartir.<\/div><h3>Organisation et radio<\/h3><div class=\"e\"><b>GASC.<\/b> Groupement d’avions de la sécurité civile ; anciennement BASC, à Marignane.<\/div><div class=\"e\"><b>CPO.<\/b> Consignes permanentes d’opérations : règles internes de l’unité, dont l’espacement de 150 m.<\/div><div class=\"e\"><b>CCASC.<\/b> Centre de coordination avancé de la sécurité civile, sur fréquence FM.<\/div><div class=\"e\"><b>Chef des PN.<\/b> Chef des personnels navigants de l’unité.<\/div><div class=\"e\"><b>RETEX.<\/b> Retour d’expérience : fiche de signalement d’un événement ou d’une difficulté.<\/div><div class=\"e\"><b>PAN PAN.<\/b> Message d’urgence : problème grave à bord, sans besoin d’assistance immédiate.<\/div><div class=\"e\"><b>Inspection de piste.<\/b> Vérification de la piste après un incident, pour retirer d’éventuels débris.<\/div><div class=\"e\"><b>BEA-É.<\/b> Bureau enquêtes accidents pour la sécurité de l’aéronautique d’État.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>Gradient d’autorité.<\/b> Écart de statut et d’expérience entre deux membres d’équipage. Trop fort, il fait taire ; trop faible, il dilue la décision.<\/div><div class=\"e\"><b>Gradient inversé.<\/b> Celui qui commande a moins d’expérience ou de statut que son équipier, et peine à s’imposer.<\/div><div class=\"e\"><b>Leadership autocratique.<\/b> Style où le chef décide seul, informe peu et décourage les remarques.<\/div><div class=\"e\"><b>Contrat de parole.<\/b> Accord explicite, au briefing, sur le droit et le devoir de dire ce qui gêne. Il vaut quand le chef le porte.<\/div><div class=\"e\"><b>Silence organisationnel.<\/b> Retenue collective des informations utiles, quand parler paraît inutile ou dangereux.<\/div><div class=\"e\"><b>Silence défensif, de résignation.<\/b> Se taire pour se protéger d’une sanction ; se taire parce qu’on a renoncé à peser.<\/div><div class=\"e\"><b>Sécurité psychologique.<\/b> Conviction partagée qu’on peut parler, douter ou se tromper sans être humilié ni puni.<\/div><div class=\"e\"><b>Clan.<\/b> Groupe qui se définit contre un autre et transmet ses normes à ses membres, y compris celle du silence.<\/div><div class=\"e\"><b>Effet spectateur.<\/b> Tendance à ne pas intervenir parce qu’on pense qu’un autre a la situation en main.<\/div><div class=\"e\"><b>Discours atténué.<\/b> Formulation adoucie (question vague, allusion) qui ménage la relation mais n’apporte aucun fait.<\/div><div class=\"e\"><b>Prise de parole graduée.<\/b> Questionner, alerter, contester, décider : on monte d’un cran si le précédent n’est pas entendu. Modèle dit PACE.<\/div><div class=\"e\"><b>Conscience partagée.<\/b> Représentation commune de la situation et du plan au sein de l’équipage.<\/div><div class=\"e\"><b>Modèle mental.<\/b> Ce qu’un opérateur croit de la situation ; ici, « le leader écopera au milieu ».<\/div><div class=\"e\"><b>Réinterprétation experte.<\/b> L’expert adapte une consigne au contexte, en jugeant qu’elle ne s’applique pas à lui.<\/div><div class=\"e\"><b>Normalisation de l’écart.<\/b> Un écart toléré et répété finit par devenir la norme, ici l’espacement réduit.<\/div><div class=\"e\"><b>Biais d’optimisme.<\/b> Croire qu’une situation donnée tournera bien, et sous-estimer le risque.<\/div><div class=\"e\"><b>Continuation du plan.<\/b> Tendance à poursuivre l’action engagée malgré des signaux contraires ; changer de plan a un coût cognitif.<\/div><div class=\"e\"><b>Renoncement.<\/b> Décision d’abandonner un objectif pour un enjeu de sécurité. Il se prépare et se valorise.<\/div><div class=\"e\"><b>Charge de travail asymétrique.<\/b> Répartition des tâches concentrée sur le CDB, qui n’a plus de ressources pour anticiper.<\/div><div class=\"e\"><b>Fatigue chronique.<\/b> Fatigue accumulée sur des semaines, qui réduit les ressources attentionnelles.<\/div><div class=\"e\"><b>Climat de sécurité.<\/b> Perception partagée de la place réelle accordée à la sécurité dans une unité.<\/div><div class=\"e\"><b>Culture de la dissimulation.<\/b> Habitude de ne pas signaler les événements, par crainte ou par routine.<\/div><div class=\"e\"><b>Culture juste.<\/b> Climat où l’on peut signaler ses erreurs sans crainte, sans tolérer les négligences graves.<\/div><div class=\"e\"><b>Modèle de Reason.<\/b> Un accident survient quand les failles de plusieurs barrières s’alignent.<\/div><div class=\"e\"><b>Compétences OACI.<\/b> Neuf compétences comportementales, dont COM, LTW, SAW, PSD et WLM.<\/div><\/div><h2>Sources<\/h2>\n<div class=\"src\">\n<p>BEA-É, rapport d’enquête de sécurité S-2017-12-I, événement du 27 août 2017 : <a href=\"https://archives.defense.gouv.fr/content/download/544086/9308536/S-2017-012-I.pdf\">archives.defense.gouv.fr<\/a>.<\/p>\n<p>Étude de cas n° 003, « Heurt obstacle », fiches stagiaire et animateur : document de formation interne, non reproduit.<\/p>\n<p>Morrison E. W., Milliken F. J. (2000), Organizational silence, Academy of Management Review, 25(4). Van Dyne L., Ang S., Botero I. C. (2003), Journal of Management Studies, 40(6). Edmondson A. (1999), Psychological safety and learning behavior in work teams, Administrative Science Quarterly, 44(2).<\/p>\n<p class=\"small\">Le rapport rappelle que son unique objectif est la prévention, sans recherche de faute ni de responsabilité. Ce kit l’utilise dans ce seul but.<\/p>\n<\/div>"}]},"pressureLimit":60},{"id":"s3","num":3,"version":"S3 v2.11 + TEM","duration":"15 à 20 min","title":"Cabin ready","short":"Cabin ready","public":"PNC et chefs de cabine","role":"ASC au poste 10 d’un long-courrier","pitch":"Vol de nuit, retour vers Paris. Un avion de remplacement, 58 passagers en classe affaires au lieu de 14, une compagnie qui exige cinq étoiles.","dossierName":"Dossier de vol","ambient":"cabin","lamp":{"label":"CABIN READY","colors":{"16":"green","8":"amber","19":"amber","3":"red"}},"resources":[{"key":"TEMPS","label":"Temps","icon":"temps","start":3,"max":null,"display":"count","unit":"jeton TEMPS","units":"jetons TEMPS","desc":"Permet une action chronophage."},{"key":"ÉTOILE","label":"Étoiles","icon":"star","start":3,"max":5,"display":"stars","unit":"étoile","units":"étoiles","desc":"La note du vol. La compagnie en exige cinq.","fem":true,"legend":"3 au départ, 5 au maximum ; une note basse vous coûtera du temps."}],"costRes":"TEMPS","costIcon":"temps","costName":"sabliers","tokens":{"MENACE":"Prise de conscience d’une charge de travail élevée.","VERROU":"Une vérification de sécurité menée jusqu’au bout."},"tokenIcons":{"MENACE":"menace","VERROU":"verrou"},"start":1,"decisions":{"1":{"idx":1,"title":"Le briefing","front":[{"t":"Une heure avant le départ, l’équipage arrive à l’avion. Le catering charge encore, en désordre. Vous découvrez la fiche de postes de cette version quand le CCP vous la donne pour prise en compte."},{"t":"Vous êtes au poste 10 : le G0 (office avant), porte 1D au décollage, accueil de la classe affaires avec le poste 7 (porte 2D). En face de vous, porte 1G : le CCP. L’ASC du poste 4 (porte 2G) remplace le chef de cabine manquant. En classe affaires : 58 passagers au lieu de 14."},{"t":"Briefing. Le CCP prévient tout l’équipage : les passagers sont énervés. Faute de temps, l’ASC du poste 4 contrôlera en vol les prestations de certaines voitures."}],"notes":[],"tail":"","question":"Que faites-vous ?","options":[{"to":17,"text":"Le CCP a donné le cadre. Vous ferez comme d’habitude : vous avez l’expérience, tout se passera bien.","cost":0,"cls":"C","short":"Comme d’habitude"},{"to":12,"text":"Vous intervenez : « Avec 58 passagers en classe affaires, on priorise la sécurité ou le service ? Pour moi, la sécurité d’abord. On s’occupera du confort des passagers après le décollage. »","cost":0,"cls":"A","short":"La sécurité d’abord"},{"to":4,"text":"Vous proposez d’avancer le service : préparer boissons et trousses au galley pendant le chargement, pour être prêts à l’embarquement.","cost":1,"cls":"B","short":"Avancer le service"}],"enter":[],"auto":[17,4],"key":{"tabs":["doc2"],"tab":"doc2","mark":"d1","note":"Check hôtellerie : le CCP peut reporter tout ou partie du service au sol après le décollage, la sécurité prime. La question du briefing avait sa réponse dans votre documentation."},"sa":[{"t":"58 passagers en classe affaires au lieu de 14","ok":true,"k":"M","why":"Charge de travail inhabituelle à l’avant : la menace centrale du vol, annoncée dès le dossier."},{"t":"Un PNC supplémentaire affecté en renfort à l’avant","ok":false,"why":"Faux : l’équipage est au contraire incomplet, il manque un chef de cabine."},{"t":"Un chef de cabine manquant, remplacé par l’ASC du poste 4","ok":true,"k":"M","why":"Une barrière de supervision en moins, et un collègue qui cumule deux rôles."},{"t":"Une fiche de postes découverte à l’arrivée à l’avion","ok":true,"k":"M","why":"Version de cabine différente de celle prévue : rôles et zones se prennent en compte sous pression."},{"t":"Un embarquement déjà commencé pendant le briefing","ok":false,"why":"Faux : le briefing a lieu à H − 50, l’embarquement à H − 30."},{"t":"La possibilité, pour le CCP, de reporter le service au sol après le décollage","ok":true,"k":"R","why":"Check hôtellerie : la sécurité prime. C’est la ressource qui permettait de traiter la menace."}]},"9":{"idx":2,"title":"L’office avant","front":[{"t":"Vous prenez en compte le G0 : chariots repas équipage, armoires, fours, voiture des ventes à bord. Chaque chariot se range dans son logement, se freine à la pédale, et deux loquets rouges le verrouillent."},{"t":"Toutes les voitures livrées par le catering sont plombées. Normalement, le chef de cabine du galley casse les plombs au sol pour vérifier les prestations. Comme annoncé au briefing, l’ASC du poste 4, qui le remplace, le fera en vol pour certaines voitures."},{"t":"En porte 2, on vous appelle : les chariots repas ne correspondent pas au plan, il faut tout réagencer."}],"notes":[],"tail":"","question":"Que faites-vous ?","options":[{"to":2,"text":"Un coup d’œil : tout est là, les voitures sont plombées. Comme prévu au briefing, l’ASC du poste 4 s’en occupera en vol. Vous filez en porte 2.","cost":0,"cls":"C","short":"Compter sur l’ASC du poste 4"},{"to":20,"text":"Vous allez au bout : chaque chariot sorti, rangé dans son logement, freiné, loquets verrouillés. La porte 2 attendra.","cost":2,"cls":"A","short":"Office vérifié à fond"},{"to":11,"text":"Vous rangez et jetez un coup d’œil aux armoires non plombées, puis vous partez en porte 2.","cost":1,"cls":"B","short":"Ranger, coup d’œil"}],"enter":[],"auto":[2,11],"key":{"tabs":["g0","doc2"],"tab":"g0","mark":"d9","note":"Le G0 : un chariot est arrimé quand il est rangé, freiné à la pédale et ses deux loquets verrouillés. Plombé ne veut pas dire arrimé."},"sa":[{"t":"Une règle : un chariot n’est arrimé que rangé, freiné, ses deux loquets verrouillés","ok":true,"k":"R","why":"Dossier, page « Le G0 » : le repère qui définit une vérification complète."},{"t":"Des plombs qui garantissent que les voitures sont verrouillées","ok":false,"why":"Faux : le plomb atteste le contenu livré par le catering. Plombé ne veut pas dire arrimé."},{"t":"Un appel en porte 2 pendant votre prise en compte","ok":true,"k":"M","why":"Interruption de tâche : elle crée un risque d’oubli au moment de la reprise."},{"t":"Un catering qui peut encore charger au G0 après votre prise en compte","ok":true,"k":"M","why":"Dossier, page « Le G0 » : une vérification ne vaut qu’à l’instant où elle est faite."},{"t":"Un G0 placé dans la zone du poste 7","ok":false,"why":"Faux : le G0 est dans votre zone, celle du poste 10."},{"t":"Un contrôle des prestations confié en vol à l’ASC du poste 4","ok":true,"k":"M","why":"Délégation : elle porte sur les prestations, pas sur l’arrimage. La confusion des deux est le piège."}]},"15":{"idx":3,"title":"Seul en classe affaires","front":[{"t":"L’embarquement commence avant la fin du réagencement : on range les chariots comme on peut. Le PNC du poste 7 prépare les actions commerciales au sol au galley G2."},{"t":"Personne d’autre que vous pour la classe affaires : accueil, vestiaires, boisson d’accueil, trousses, fonctionnement des sièges. Les surclassés abusent de leur privilège et vous appellent sans cesse."}],"notes":[{"if":"has:MENACE","head":"Jeton MENACE","text":"Le CCP sait l’avant en tension : les trousses attendront le décollage."}],"tail":"","question":"Que faites-vous ?","options":[{"to":18,"text":"Vous absorbez tout. Un PNC, ça s’adapte, et ces passagers ont déjà assez attendu.","cost":2,"cls":"C","short":"Tout absorber"},{"to":7,"text":"Vous appelez le CCP : « Je suis seul pour 58 passagers dans ma zone, peux-tu m’envoyer quelqu’un pour m’aider, s’il te plaît ? »","cost":0,"cls":"A","short":"Alerter le CCP"},{"to":14,"text":"Vous appelez le PNC du poste 7 en renfort, sans rien changer au service.","cost":0,"cls":"B","short":"Renfort du poste 7"}],"enter":[{"type":"drain","res":"TEMPS","fb":"ÉTOILE","if":"not:MENACE","head":"Les sollicitations","text":"Sans le jeton M
