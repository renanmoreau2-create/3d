té.<\/div>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · 4/6<\/div>\n<h1>Les éléments à retenir<\/h1>\n<div style=\"margin-bottom:2mm\"><div class=\"keep\" style=\"padding:1.6mm 0\"><div class=\"n\" style=\"font-size:35.2px\">1<\/div><div><b>Une charge de travail inhabituelle est une menace.<\/b><br>Nommée au briefing, elle se traite : on reporte, on répartit.<\/div><\/div><div class=\"keep\" style=\"padding:1.6mm 0\"><div class=\"n\" style=\"font-size:35.2px\">2<\/div><div><b>La sécurité d’abord, le service après le décollage.<\/b><br>Un service se rattrape en vol ; un chariot libre, jamais.<\/div><\/div><div class=\"keep\" style=\"padding:1.6mm 0\"><div class=\"n\" style=\"font-size:35.2px\">3<\/div><div><b>Une vérification ne vaut qu’au moment où elle est faite.<\/b><br>Après une interruption ou un passage dans l’office, on revérifie.<\/div><\/div><div class=\"keep\" style=\"padding:1.6mm 0\"><div class=\"n\" style=\"font-size:35.2px\">4<\/div><div><b>La boucle de compte rendu crée le dernier passage.<\/b><br>Rendre compte assis à son poste, une fois toute sa zone vérifiée. « Zone pas prête » coûte une minute. Jamais d’annonce « cabin ready envoyé ».<\/div><\/div><div class=\"keep\" style=\"padding:1.6mm 0\"><div class=\"n\" style=\"font-size:35.2px\">5<\/div><div><b>Un doute après le cabin ready se dit tout de suite.<\/b><br>Le CCP coupe le cabin ready, l’avion attend au point d’arrêt : deux minutes.<\/div><\/div><\/div>\n<h2>La boucle du cabin ready<\/h2>\n<div style=\"margin:1mm 0 0.6mm\"><svg viewBox=\"0 0 690 170\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\">\n<defs><marker id=\"la\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs>\n<text x=\"0\" y=\"14\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\".8\">LA PROCÉDURE DE L'EXPLOITANT (RAPPORT BEA)<\/text>\n<g transform=\"translate(0,20)\"><rect x=\"0.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"59.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Vérifier<\/text><text x=\"59.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">sa zone<\/text><line x1=\"121.0\" y1=\"24\" x2=\"139.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"143.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"202.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Rejoindre<\/text><text x=\"202.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">son poste<\/text><line x1=\"264.0\" y1=\"24\" x2=\"282.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"286.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"345.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Interphone<\/text><text x=\"345.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">au CC<\/text><line x1=\"407.0\" y1=\"24\" x2=\"425.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"429.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"488.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">CC<\/text><text x=\"488.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">au CCP<\/text><line x1=\"550.0\" y1=\"24\" x2=\"568.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"572.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"631.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">CCP : « cabin<\/text><text x=\"631.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">ready » au poste<\/text><\/g>\n<text x=\"0\" y=\"104\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\".8\">LE JOUR DE L'ÉVÉNEMENT<\/text>\n<g transform=\"translate(0,110)\"><rect x=\"0.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"59.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Vérifier<\/text><text x=\"59.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">sa zone<\/text><line x1=\"121.0\" y1=\"24\" x2=\"139.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"143.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/><text x=\"202.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Compte rendu<\/text><text x=\"202.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">direct au CCP<\/text><line x1=\"264.0\" y1=\"24\" x2=\"282.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"286.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/><text x=\"345.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">« Cabin ready<\/text><text x=\"345.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">envoyé »<\/text><line x1=\"407.0\" y1=\"24\" x2=\"425.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"429.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"488.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">Retour en hâte,<\/text><text x=\"488.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#111\">journaux<\/text><line x1=\"550.0\" y1=\"24\" x2=\"568.0\" y2=\"24\" stroke=\"#111\" stroke-width=\"1.6\" marker-end=\"url(#la)\"/><rect x=\"572.0\" y=\"0\" width=\"118\" height=\"48\" rx=\"6\" fill=\"#111\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"631.0\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">Le G0<\/text><text x=\"631.0\" y=\"29\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\">non revu<\/text><\/g>\n<\/svg><\/div>\n<p class=\"small\" style=\"margin:0 0 2mm\">Dans le jeu, variante « all attendants » : le CCP fait sonner tous les interphones, chaque PNC rend compte par porte, assis à son poste. Le CCP n’appuie sur le bouton cabin ready qu’une fois toute la cabine confirmée.<\/p>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.8px\">\n<div><h3 style=\"margin-top:0\">Quatre pièges du jeu<\/h3><ul style=\"margin:0\">\n<li><b>« C’est rangé »<\/b> (carte 11) : un coup d’œil n’est pas une vérification.<\/li>\n<li><b>« C’est délégué »<\/b> (carte 2) : les plombs ne disent rien des loquets.<\/li>\n<li><b>Le tour rapide<\/b> (carte 5) : sous la charge, ce qui ne réclame rien s’oublie ; le G0 n’a pas été revu.<\/li>\n<li><b>Rendre compte, puis vérifier<\/b> (carte 10) : le compte rendu anticipé est faux.<\/li><\/ul><\/div>\n<div><h3 style=\"margin-top:0\">Et après l'événement<\/h3><ul style=\"margin:0\">\n<li>Appel à un médecin, téléconférence avec le SAMU, surveillance continue de la blessée : ce qui a bien fonctionné.<\/li>\n<li>Signaler, même sans blessé : une fin « plus de peur que de mal » est un événement.<\/li><\/ul><\/div>\n<\/div>"},{"id":"mesures","label":"Les mesures prises","html":"<div class=\"kicker\">Fiche mémo · 5/6<\/div>\n<h1>Enseignements et mesures prises<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.6mm\">Le rapport du BEA ne formule pas de recommandation de sécurité. Il présente les enseignements tirés par l’exploitant et les mesures qu’il a prises. Formulations résumées.<\/p>\n<table class=\"rec\"><tr><td style='width:44mm'><b>Publication « Safety First »<\/b><\/td><td>Diffusée à tous les PNC : principes de la vérification cabine et du cabin ready ; sécurisation des offices prioritaire, avant le repoussage ; prestations commerciales après le décollage quand les circonstances l’exigent.<\/td><\/tr><tr><td style='width:44mm'><b>Annonce proscrite<\/b><\/td><td>« Cabin ready enclenché » ou « envoyé » n’est pas une procédure : elle encourage les violations (PNC qui ne s’attachent pas aussitôt) et normalise la déviance.<\/td><\/tr><tr><td style='width:44mm'><b>Catalogue des versions<\/b><\/td><td>Sensibilisation des nouveaux régulateurs et des cadres PNC ; vérification croisée entre régulateur et cadre PNC.<\/td><\/tr><tr><td style='width:44mm'><b>Gestion des versions<\/b><\/td><td>Moyens mis en œuvre pour automatiser le système.<\/td><\/tr><tr><td style='width:44mm'><b>Documentation<\/b><\/td><td>Toute la documentation des configurations cabine sur les tablettes des PNC dès l’été 2019, avec une formation lors de points d’information.<\/td><\/tr><\/table>\n<h2 style=\"margin-top:2mm\">Notre lecture pour nos équipages<\/h2>\n<p class=\"small\" style=\"margin-bottom:1mm\">Propositions de ce kit, déduites du rapport : ce ne sont ni des recommandations du BEA, ni des mesures de l’exploitant.<\/p>\n<ul style=\"font-size:14.1px\">\n<li>Au briefing, une question systématique : « Qu’est-ce qui est inhabituel aujourd’hui, et que reporte-t-on ? »<\/li>\n<li>Pour chaque office : une vérification complète (chariots rangés, freinés, loquets verrouillés, plan de travail dégagé), refaite après tout passage du catering.<\/li>\n<li>Un compte rendu toujours assis à son poste. Le CCP attend tous les comptes rendus avant d’appuyer sur le bouton cabin ready, sans exception.<\/li>\n<li>Dans les mesures de satisfaction : ne jamais pénaliser un report de prestation décidé pour la sécurité.<\/li>\n<\/ul>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · 6/6<\/div>\n<h1>Les mots du scénario<\/h1>\n<div class=\"gl\"><h3>Cabine et escale<\/h3><div class=\"e\"><b>CCP, CC, ASC.<\/b> Chef de cabine principal ; chef de cabine ; assistant sécurité cabine (steward ou hôtesse).<\/div><div class=\"e\"><b>All attendants.<\/b> Appel du CCP qui fait sonner tous les interphones : chaque PNC de porte ou de zone rend compte, assis, que sa zone est sécurisée et prête au décollage.<\/div><div class=\"e\"><b>Fiche de postes (FRV).<\/b> Document propre à chaque version d’exploitation : numéro de poste, porte ou zone, rôles de sécurité et de service de chaque PNC.<\/div><div class=\"e\"><b>Version physique, version d’exploitation.<\/b> Répartition réelle des sièges ; niveau de service effectivement vendu. Une version physique peut avoir plusieurs versions d’exploitation.<\/div><div class=\"e\"><b>Catalogue des versions.<\/b> Document du centre de contrôle des opérations qui indique la version d’exploitation adaptée à un avion de remplacement.<\/div><div class=\"e\"><b>Office, galley.<\/b> Cuisine de bord. Le G0 : office avant.<\/div><div class=\"e\"><b>Voiture de ventes.<\/b> Chariot des ventes à bord, scellé par des plombs, verrouillé dans son logement par des loquets.<\/div><div class=\"e\"><b>Arrimage.<\/b> Immobilisation d’un objet pour qu’il ne se déplace pas : rangement dans son logement, frein, loquets verrouillés.<\/div><div class=\"e\"><b>Cabin ready.<\/b> Bouton actionné par le CCP quand toute la cabine est confirmée : au poste de pilotage, le voyant passe au vert ; cet item de la check-list avant décollage doit être vert pour la mise en puissance.<\/div><div class=\"e\"><b>Mise en puissance.<\/b> Application de la puissance de décollage.<\/div><div class=\"e\"><b>Repoussage.<\/b> Recul de l’avion depuis son poste de stationnement, avant le roulage.<\/div><div class=\"e\"><b>Prestations sol.<\/b> Services rendus aux passagers avant le départ : accueil, vestiaires, boisson, trousses, fonctionnement des sièges.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>Menace (TEM).<\/b> Événement ou situation extérieure à l’équipage qui augmente la complexité et doit être gérée : ici, une charge de travail inhabituelle.<\/div><div class=\"e\"><b>Erreur (TEM).<\/b> Action ou inaction de l’équipage qui s’écarte de l’intention ou de la procédure.<\/div><div class=\"e\"><b>État indésirable (TEM).<\/b> Situation dégradée qui résulte d’une menace ou d’une erreur non gérée : une voiture non verrouillée.<\/div><div class=\"e\"><b>Principe ETTO.<\/b> Efficiency-Thoroughness Trade-Off (Hollnagel) : arbitrage permanent entre efficacité et rigueur.<\/div><div class=\"e\"><b>Erreur d’omission.<\/b> Oubli d’une étape d’une tâche. C’est l’erreur la plus fréquente dans les tâches procédurales, surtout sous la charge ou après une interruption (Reason).<\/div><div class=\"e\"><b>Mémoire prospective.<\/b> Capacité à se souvenir d’exécuter plus tard une action prévue. Très vulnérable aux interruptions.<\/div><div class=\"e\"><b>Interruption de tâche.<\/b> Arrêt d’une tâche pour en traiter une autre. Elle crée un risque d’oubli au moment de la reprise.<\/div><div class=\"e\"><b>Normalisation de la déviance.<\/b> Un écart toléré et répété finit par devenir la norme (Vaughan).<\/div><div class=\"e\"><b>Violation de routine.<\/b> Écart habituel à une procédure, devenu la façon normale de faire.<\/div><div class=\"e\"><b>Délégation.<\/b> Confier une tâche ; elle reste à suivre par celui qui la confie.<\/div><div class=\"e\"><b>Surcharge de travail.<\/b> Demandes supérieures aux ressources disponibles ; elle réduit la vigilance et pousse aux raccourcis.<\/div><div class=\"e\"><b>Conscience de la situation.<\/b> Perception et compréhension de ce qui se passe, et anticipation de ce qui va arriver.<\/div><div class=\"e\"><b>Culture juste.<\/b> Climat où l’on peut signaler ses erreurs sans crainte, sans tolérer les négligences graves.<\/div><div class=\"e\"><b>Modèle de Reason.<\/b> Un accident survient quand les failles de plusieurs barrières s’alignent.<\/div><\/div><h2>Sources<\/h2>\n<div class=\"src\">\n<p>BEA, rapport d’enquête BEA2018-0764, accident du Boeing 777-328ER F-GSQL survenu le 16 septembre 2018 à Maurice, mai 2020 : <a href=\"https://bea.aero/en/investigation-reports/notified-events/detail/accident-to-boeing-777-328er-registered-f-gsql-operated-by-air-france-on-16-09-2018-at-sir-seewoosagur-ramgoolam-airport-mauritius/\">bea.aero<\/a>.<\/p>\n<p>Étude de cas n° 11, « Voiture de ventes » : document de formation interne, non reproduit.<\/p>\n<p>Hollnagel E. (2009), The ETTO Principle, Ashgate. Loukopoulos L., Dismukes R. K., Barshi I. (2009), The Multitasking Myth, Ashgate. Vaughan D. (1996), The Challenger Launch Decision, University of Chicago Press. Reason J. (1990), Human Error, Cambridge University Press.<\/p>\n<p class=\"small\">Les enquêtes du BEA ont pour unique objectif l’amélioration de la sécurité aérienne et ne visent nullement à la détermination de fautes ou de responsabilités. Ce kit utilise le rapport dans ce seul but.<\/p>\n<\/div>"}]},"pressureLimit":60,"tem":[{"t":"58 passagers en classe affaires au lieu de 14.","k":"M","why":"Extérieure à l’équipage, elle augmente la complexité et doit être gérée : c’est une menace."},{"t":"Au briefing, personne ne parle des priorités ni de ce que l’on reporte.","k":"E","why":"Une inaction de l’équipage : la menace n’est pas nommée, donc pas traitée."},{"t":"Le voyant cabin ready est vert alors que la voiture de ventes est déverrouillée.","k":"I","why":"Situation à marge réduite, née d’une erreur non rattrapée : c’est un état indésirable."},{"t":"Il manque un chef de cabine ; un ASC le remplace.","k":"M","why":"L’équipage ne l’a pas choisi : une menace d’organisation, à anticiper."},{"t":"« Zone sécurisée » est annoncé avant que la zone soit vérifiée.","k":"E","why":"Une action de l’équipage qui s’écarte de la procédure : vérifier, s’asseoir, rendre compte."},{"t":"L’avion roule, des bouilloires pleines sont restées sur le plan de travail du G0.","k":"I","why":"La marge de sécurité est entamée : il reste à détecter et à récupérer avant la mise en puissance."},{"t":"Le catering charge encore, en désordre, une heure avant le départ.","k":"M","why":"Extérieure à l’équipage et prévisible à l’arrivée à l’avion : une menace."}],"reason":[{"t":"Répondre « zone sécurisée », puis repartir vérifier : « tout le monde l’a déjà fait ».","k":"V","why":"Écart délibéré à la procédure, devenu habituel : une violation de routine. L’intention n’est pas de nuire, mais de gagner du temps."},{"t":"Sous la charge, le G0 sort de la tête : il n’est pas revu avant le compte rendu.","k":"L","why":"Défaillance de mémoire : une étape prévue est oubliée (erreur d’omission). L’intention était bonne, l’exécution incomplète."},{"t":"« Les voitures sont plombées, donc tout est en ordre. »","k":"F","why":"Le plan lui-même est faux : une règle erronée est appliquée avec soin (plombé ne veut pas dire arrimé)."},{"t":"Absorber seul l’accueil de 58 passagers, sans prévenir le CCP.","k":"F","why":"Erreur de décision : l’action est exécutée comme voulu, mais le plan ne convient pas à la situation."}]},{"id":"s4","num":4,"version":"S4 v1 + TEM","duration":"15 à 20 min","title":"Navette de 15 h","short":"Navette de 15 h","public":"Équipages de transport","role":"Commandant de bord d’un biréacteur moyen-courrier","pitch":"Une navette d’hiver, 150 passagers, un équipage chevronné et une journée en retard. Quatre décisions, d’un départ ordinaire jusqu’au bout du vol.","dossierName":"Dossier de vol","ambient":"jet","ambientSwitch":{"9":"glide"},"hideTokens":true,"lamp":{"label":"CEINTURES","colors":{"16":"green","8":"amber","19":"amber","5":"red"}},"resources":[],"costRes":null,"costIcon":null,"costName":"","tokens":{"BRIEFING":"Vous avez refait le briefing départ après le changement de piste : trajectoire, panne au décollage, terrains, NOTAM.","CONTRE-QFU":"Vous êtes parti en contre-QFU : montée initiale limitée à 2 000 ft, le long du fleuve.","APU":"L’APU tourne : électricité rétablie, protections des commandes de vol conservées.","DEMI-TOUR":"Vous avez viré vers la piste dès les premières secondes.","ESSENTIEL":"Vous avez dit tôt l’option probable et fait passer la check-list à l’essentiel."},"tokenIcons":{"BRIEFING":"doc","CONTRE-QFU":"map","APU":"gauge","DEMI-TOUR":"back","ESSENTIEL":"search"},"start":1,"decisions":{"1":{"idx":1,"title":"Le vent a tourné","front":[{"t":"15 h 05, navette d’hiver vers le sud, 150 passagers. Embarquement long : trente minutes de retard. La compagnie vous a demandé de rattraper ce que vous pourrez."},{"t":"Mise en route terminée. Le copilote est pilote aux commandes pour l’étape ; vous êtes pilote surveillant. Briefing départ fait au parking, pour la piste en service : la 05."},{"t":"Le contrôle sol : « Le vent tourne au sud-ouest, changement de QFU dans une dizaine de minutes. Je peux vous proposer tout de suite la 23 en contre-QFU : montée initiale limitée à 2 000 ft à cause des arrivées 05, puis virage à droite le long du fleuve. Sinon, attente au point d’arrêt. »"}],"notes":[],"tail":"","question":"Que répondez-vous ?","options":[{"to":4,"text":"Vous acceptez : c’est la même piste, dans l’autre sens. Le copilote reprogramme le départ dans le FMS pendant le roulage ; vous vérifierez les performances au point d’arrêt.","cost":0,"cls":"C","short":"Accepter et reprogrammer en roulant"},{"to":7,"text":"Vous acceptez, mais vous arrêtez l’avion deux minutes pour refaire le briefing départ : nouvelle trajectoire, limitation à 2 000 ft, panne au décollage, terrains autour, NOTAM.","cost":0,"cls":"A","short":"Accepter et refaire le briefing"},{"to":12,"text":"Vous refusez : vous partirez dans le sens normal, après le changement de QFU. Dix minutes de plus pour 150 passagers.","cost":0,"cls":"B","short":"Refuser et attendre le QFU"}],"enter":[],"auto":[4,12],"key":{"tabs":["meteo","region"],"tab":"meteo","mark":"d1","note":"NOTAM 1 : activité aviaire le long du fleuve, jusqu’à 3 000 ft. Départ 23 en contre-QFU : montée limitée à 2 000 ft. Accepter, c’est voler plus bas dans la zone du NOTAM : un changement qui mérite un briefing."},"sa":[{"t":"Une consigne de la compagnie : rattraper le retard","ok":true,"k":"M","why":"Pression temporelle venue de l’organisation : elle pèse sur chaque arbitrage du départ."},{"t":"Une piste 23 plus courte que la piste 05","ok":false,"why":"Faux : c’est la même piste de 2 100 m, dans l’autre sens."},{"t":"Un NOTAM d’activité aviaire le long du fleuve, jusqu’à 3 000 ft","ok":true,"k":"M","why":"Dossier, page « Météo et NOTAM », rappelé par l’ATIS : la menace que le départ proposé rapproche."},{"t":"Un départ en contre-QFU limité à 2 000 ft, le long du fleuve","ok":true,"k":"M","why":"Le changement proposé maintient l’avion plus longtemps dans la tranche d’altitude du NOTAM."},{"t":"Un élément reporté en liste minimale (MEL)","ok":false,"why":"Faux : la fiche avion indique qu’aucun élément n’est reporté."},{"t":"Un briefing départ fait pour une autre piste","ok":true,"k":"M","why":"Trajectoire, performances et panne au décollage ont été préparées pour la 05 : le briefing n’est plus valide."}]},"9":{"idx":2,"title":"Les oiseaux","front":[{"t":"Une minute et demie après le décollage. En palier à 2 000 ft, sous les arrivées, le fleuve défile sous l’aile gauche. Le copilote pilote.","if":"has:CONTRE-QFU"},{"t":"Une minute et demie après le décollage. En montée, vous passez 2 800 ft ; le fleuve défile sous l’aile gauche. Le copilote pilote.","if":"not:CONTRE-QFU"},{"t":"« Oiseaux ! » De grandes silhouettes sombres remplissent le pare-brise. Des chocs sourds, une odeur de brûlé dans la ventilation."},{"t":"Les deux moteurs ralentissent ensemble. Le bruit tombe. Vous n’aviez jamais entendu ce silence dans un avion de ligne."}],"notes":[{"if":"has:BRIEFING","head":"Votre briefing","text":"Au point d’arrêt, vous avez dit : « Panne au décollage : retour piste 05 si possible. Autour : le terrain d’affaires, de l’autre côté du fleuve. »"}],"tail":"","question":"Que faites-vous dans les premières secondes ?","options":[{"to":15,"text":"Allumage continu, APU démarré. « Mes commandes. » Vous demandez au copilote la check-list double panne moteur.","cost":0,"cls":"A","short":"APU, « mes commandes », check-list"},{"to":18,"text":"Demi-tour immédiat vers la piste, en virage serré. Vous déclarerez la détresse dans le virage.","cost":0,"cls":"C","short":"Demi-tour immédiat"},{"to":3,"text":"Le copilote reste aux commandes : c’est lui le pilote aux commandes. Vous prenez la radio et la check-list.","cost":0,"cls":"B","short":"Le copilote garde les commandes"}],"cue":"birdstrike","enter":[],"auto":[18,3],"key":{"tabs":["avion","qrh"],"tab":"avion","mark":"d9","note":"Fiche avion : sans moteur, l’électricité vient des batteries et de l’éolienne, et les protections de vol se réduisent ; l’APU démarre en vol. QRH : il n’apparaît qu’à la page 2.2, après les essais de rallumage."},"sa":[{"t":"Deux moteurs qui perdent leur poussée en même temps","ok":true,"k":"M","why":"La situation n’est pas la panne d’un moteur au décollage, pour laquelle l’équipage est entraîné."},{"t":"Une check-list double panne qui commence par le démarrage de l’APU","ok":false,"why":"Faux : l’APU n’apparaît qu’à la page 2.2, après les essais de rallumage."},{"t":"Un APU démarrable en vol, qui fournit l’électricité","ok":true,"k":"R","why":"Fiche avion : la ressource qui conserve l’alimentation normale et les protections de vol."},{"t":"Des protections de vol réduites sur l’alimentation de secours","ok":true,"k":"M","why":"Fiche avion : sans moteur ni APU, il ne reste que les batteries et l’éolienne de secours."},{"t":"Un seul moteur touché par les oiseaux","ok":false,"why":"Faux : les deux moteurs ralentissent ensemble."},{"t":"Un copilote aux commandes, qualifié sur le type depuis six semaines","ok":true,"k":"R","why":"Dossier, page « Votre vol » : il sort de formation et connaît la QRH par cœur. Un repère pour répartir les rôles."}]},"14":{"idx":3,"title":"La quarantième seconde","front":[{"t":"Le copilote lit la QRH : DOUBLE PANNE MOTEUR, première partie, rallumage. Vitesse optimale de rallumage : 300 kt ; vous en avez à peine plus de 200. « Attendre trente secondes. » La procédure fait trois pages."},{"t":"Il vous reste 1 700 ft.","if":"has:CONTRE-QFU"},{"t":"Il vous reste 2 500 ft, et vous descendez.","if":"not:CONTRE-QFU"},{"t":"Le contrôle : « Piste 05 disponible, cap au 120. Vous voulez la 05 ? »"}],"notes":[{"if":"not:APU","head":"Électricité","text":"Sur batteries et éolienne de secours. Plusieurs écrans se sont éteints. L’APU figure dans la check-list, après les essais de rallumage."},{"if":"has:DEMI-TOUR","head":"Trajectoire","text":"Vous êtes déjà en virage vers la piste."}],"tail":"","question":"Que répondez-vous, et que faites-vous de la check-list ?","options":[{"to":2,"text":"« On tente la 05. » Le copilote poursuit la check-list dans l’ordre ; vous pilotez.","cost":0,"cls":"B","short":"« On tente la 05 », check-list dans l’ordre"},{"to":20,"text":"« Impossible. Nous allons peut-être finir dans le fleuve. » Au copilote : « Un essai de rallumage, puis l’essentiel : APU, amerrissage. »","cost":0,"cls":"A","short":"Annoncer l’option probable, aller à l’essentiel"},{"to":11,"text":"Pas de réponse au contrôle. « Ils vont repartir. » Vous coupez et remettez les moteurs, l’un après l’autre.","cost":0,"cls":"C","short":"Encore un rallumage"}],"enter":[],"auto":[11,2],"key":{"tabs":["qrh"],"tab":"qrh","mark":"d14","note":"QRH : procédure établie pour la croisière, rallumage optimal à 300 kt, essais de 30 secondes ; l’amerrissage n’arrive qu’à la page 2.3. À 2 000 ft, il reste environ deux minutes."},"sa":[{"t":"Une procédure double panne établie pour la croisière","ok":true,"k":"M","why":"QRH : plusieurs essais de rallumage sont prévus, ce que la hauteur disponible ne permet pas."},{"t":"Un moteur qui a partiellement redémarré","ok":false,"why":"Faux : aucun rallumage n’est obtenu."},{"t":"Une vitesse de rallumage optimale hors de portée","ok":true,"k":"M","why":"300 kt demandés, à peine plus de 200 disponibles : la procédure ne correspond pas à la situation."},{"t":"Des items d’amerrissage placés à la dernière page de la procédure","ok":true,"k":"M","why":"QRH, page 2.3 : déroulée dans l’ordre, la check-list ne les atteint pas à temps."},{"t":"Un aéroport de dégagement à 10 NM","ok":false,"why":"Faux : le dégagement prévu est à 60 NM au nord."},{"t":"Un contrôleur qui attend une réponse sur la piste 05","ok":true,"k":"M","why":"Une sollicitation extérieure de plus : elle pousse à répondre « oui » avant d’avoir fait le point."}]},"6":{"idx":4,"title":"Le choix","front":[{"t":"1 000 ft.","if":"has:CONTRE-QFU"},{"t":"1 500 ft.","if":"not:CONTRE-QFU"},{"t":"Le contrôle vous accorde le terrain d’affaires, de l’autre côté du fleuve. Devant, les ponts. Sous l’aile, le fleuve : large, dégagé, quelques bateaux."},{"t":"Le copilote : « Toujours pas de rallumage. »"}],"notes":[{"if":"has:DEMI-TOUR","head":"Trajectoire","text":"Vous êtes face à la piste 05. Elle paraît accessible."},{"if":"has:ESSENTIEL","head":"Cabine","text":"La cabine se prépare depuis une minute. Le contrôle a prévenu les bateaux du fleuve."},{"if":"has:BRIEFING","head":"Votre briefing","text":"« Le terrain d’affaires, sinon le fleuve » : vous l’avez dit au sol."}],"tail":"","question":"Où posez-vous l’avion ?","options":[{"to":13,"text":"Le terrain d’affaires : c’est une piste, avec des secours. Si ça ne passe pas, le fleuve.","cost":0,"cls":"B","short":"Le terrain d’affaires"},{"to":17,"text":"La piste de départ : longue, connue, les secours y sont déjà.","cost":0,"cls":"C","short":"La piste de départ"},{"to":10,"text":"Le fleuve, maintenant. « Ici le commandant : position de sécurité ! »","cost":0,"cls":"A","short":"Le fleuve, maintenant"}],"enter":[],"auto":[17,13],"key":{"tabs":["avion","region"],"tab":"avion","mark":"d6","note":"Fiche avion : environ 2,5 NM (4,6 km) de plané par 1 000 ft. À 1 500 ft, environ 7 km : ni la piste de départ, ni le terrain d’affaires à 13 km ne sont à portée sans moteur. Le fleuve est sous l’avion."},"sa":[{"t":"Un plané d’environ 2,5 NM par 1 000 ft","ok":true,"k":"R","why":"Fiche avion : le repère qui dit ce qui est à portée et ce qui ne l’est pas."},{"t":"Un terrain d’affaires sans service de contrôle à cette heure","ok":false,"why":"Faux : le service est assuré de 8 h à 20 h. Le terrain est ouvert, mais trop loin."},{"t":"Un terrain d’affaires à 13 km, de l’autre côté du fleuve","ok":true,"k":"M","why":"Dossier, page « Départs et région » : hors de portée sans moteur à cette hauteur."},{"t":"Un fleuve large et dégagé sous l’avion","ok":true,"k":"R","why":"La seule surface à portée certaine : large d’un kilomètre, sans obstacle, avec des bateaux à proximité."},{"t":"Un avion sans gilets ni radeaux","ok":false,"why":"Faux : l’avion est équipé pour le survol maritime, même si le trajet du jour ne l’exige pas."},{"t":"Des moteurs toujours sans rallumage","ok":true,"k":"M","why":"Aucune énergie à attendre : la hauteur restante est tout ce dont vous disposez."}]}},"suites":{"7":{"front":[{"t":"Vous rangez l’avion au bord du taxiway. Le copilote lit la nouvelle trajectoire ; vous recalculez les performances et ajoutez : « Panne au décollage : retour piste 05 si possible. Autour : le terrain d’affaires, de l’autre côté du fleuve. Et le NOTAM : oiseaux le long du fleuve, jusqu’à 3 000 ft. »"},{"t":"Le contrôle s’impatiente un peu. Décollage piste 23, deux minutes plus tard."}],"changes":[{"tok":"BRIEFING"},{"tok":"CONTRE-QFU"}],"go":9,"debrief":[["Pourquoi c’était coûteux","Deux minutes quand le contrôle attend et que la compagnie compte les minutes. Refaire un briefing pour la même piste dans l’autre sens paraît du zèle."],["Ce qui protège","Un changement de piste de dernière minute est une menace au sens du TEM : trajectoire, performances et briefing deviennent faux d’un coup. Il se traite par un nouveau briefing, même court, avant le décollage."],["La limite","Le briefing n’a pas changé les oiseaux. Il a préparé votre tête : le terrain d’affaires, le fleuve, l’altitude. C’est ce qui servira deux minutes plus tard."]],"comp":"PSD · WLM · COM"},"4":{"front":[{"t":"Le copilote reprogramme le départ tête basse pendant le roulage ; vous surveillez le roulage et la radio. Performances vérifiées au point d’arrêt, check-list avant décollage."},{"t":"Décollage piste 23, sans attente. Dix minutes de gagnées."}],"changes":[{"tok":"CONTRE-QFU"}],"go":9,"debrief":[["Pourquoi c’était tentant","Même piste, dix minutes gagnées, un contrôleur qui rend service, une compagnie qui compte. Tout le monde l’a déjà fait."],["Le piège","Le changement s’est traité tête basse, en roulant : le briefing départ, fait pour la 05, n’a jamais été refait. La nouvelle trajectoire passe plus bas, dans la zone du NOTAM, et personne n’a reparlé des terrains autour."],["Ce qui protège","Tout changement de piste appelle un nouveau briefing. S’il n’y a pas le temps de le faire, il n’y a pas le temps d’accepter."]],"comp":"PSD · WLM · KNO"},"12":{"front":[{"t":"« Merci, on attendra. » Dix minutes au point d’arrêt. Le chef de cabine vous signale des passagers qui s’impatientent."},{"t":"Changement de QFU annoncé. Décollage normal piste 23, montée vers 5 000 ft, virage à droite le long du fleuve."}],"changes":[],"go":9,"debrief":[["Pourquoi c’était tentant","Refuser protège de la précipitation : on part dans le sens prévu, avec la montée normale."],["Le piège","Refuser une menace n’en traite pas les autres. Le départ a changé lui aussi avec le QFU, et le briefing n’a pas été refait : ni les terrains autour, ni le NOTAM des oiseaux."],["Ce qui protège","Savoir dire non à ce qui arrange l’horaire, puis refaire le point avant de partir, quelle que soit la piste."]],"comp":"PSD · LTW"},"15":{"front":[{"t":"L’APU démarre. L’électricité revient : les commandes de vol gardent leurs protections. « Mes commandes. » « Tes commandes. »"},{"t":"Le copilote ouvre la QRH à la double panne moteur. Les moteurs ne répondent plus."}],"changes":[{"tok":"APU"}],"go":14,"debrief":[["Pourquoi c’était difficile","Trois secondes, sans check-list, dans le silence. Démarrer l’APU n’était pas la première ligne de la procédure : il fallait le penser."],["Ce qui protège","Piloter d’abord, puis les gestes qui donnent des moyens et du temps. Dans le cas réel, l’APU démarré avant la check-list a gardé l’électricité et les protections de vol ; le NTSB estime qu’il a amélioré l’issue."],["Répartir les rôles","Celui qui a l’expérience et la vue pilote ; celui qui connaît la QRH la lit. Le dire à voix haute : « mes commandes », « tes commandes »."]],"comp":"FPM · LTW · PRO"},"3":{"front":[{"t":"Le copilote garde l’avion. La vitesse baisse, il rend la main avec hésitation. Vous déclarez la détresse et ouvrez la QRH en même temps."},{"t":"Personne n’a démarré l’APU : il est dans la check-list, plus loin."}],"changes":[],"go":14,"debrief":[["Pourquoi c’était tentant","C’est la règle par défaut : le pilote aux commandes pilote, le pilote surveillant traite la panne. Changer de rôle en pleine urgence paraît risqué."],["Le piège","La règle par défaut n’est pas toujours la meilleure répartition. Vous cumulez radio, check-list et décision ; le copilote, qui connaît la QRH par cœur, pilote un plané qu’il n’a jamais fait. Et le geste qui donne des moyens, l’APU, attend son tour dans la check-list."],["Ce qui protège","Une répartition explicite et adaptée à la situation, annoncée à voix haute. Le choix de garder les rôles peut être bon, s’il est fait, et pas subi."]],"comp":"LTW · WLM · COM"},"18":{"front":[{"t":"Virage serré vers la piste 05 ; la vitesse fond dans le virage. Détresse déclarée en virage."},{"t":"Le copilote cherche la check-list, l’avion penché. L’APU attend."}],"changes":[{"tok":"DEMI-TOUR"}],"go":14,"debrief":[["Pourquoi c’était tentant","La piste est derrière vous, longue, connue. Après l’accident réel, des pilotes en simulateur ont réussi à la rejoindre, à condition de virer immédiatement."],["Le piège","À trois secondes, vous ne savez ni si les moteurs repartiront, ni l’énergie disponible. Virer tout de suite engage l’avion sur un pari, et reporte les gestes qui donnent des moyens."],["Ce qui protège","Piloter, sécuriser l’énergie, comprendre, puis choisir. Vite, mais pas avant de savoir."]],"comp":"PSD · SAW"},"20":{"front":[{"t":"Le contrôle prévient les secours et les bateaux du fleuve. Le copilote saute les pages : un essai de rallumage, puis la partie amerrissage."},{"t":"Bouton DITCHING enclenché, alarmes sol inhibées. À l’interphone, au chef de cabine : « Préparez un amerrissage, deux minutes. »"}],"changes":[{"tok":"ESSENTIEL"}],"go":6,"debrief":[["Pourquoi c’était coûteux","Renoncer aux rallumages et à la piste à la quarantième seconde, c’est accepter l’idée de l’amerrissage avant d’en être sûr."],["Ce qui protège","Le tri des tâches : une procédure faite pour la croisière ne se déroule pas en entier à 2 000 ft. Dire tôt l’option probable prépare le contrôle, la cabine, et vous-même. Le NTSB a demandé une check-list et un entraînement pour la double panne à basse altitude, centrés sur ce tri."],["La limite","En sautant des lignes, on peut manquer un rallumage possible. Mais rien, dans le poste, n’indiquait que les moteurs étaient perdus."]],"comp":"PRO · WLM · COM"},"2":{"front":[{"t":"Le contrôle dégage la 05. Le copilote déroule : allumage, manettes, vitesse… Pas de rallumage. Moteurs coupés trente secondes, puis remis, l’un après l’autre."},{"t":"Les items d’amerrissage sont à la page trois."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","La discipline de check-list : la dérouler dans l’ordre, c’est ce qu’on attend d’un équipage. Garder la piste ouverte, c’est garder une chance."],["Le piège","La procédure était faite pour une panne en croisière. Dans le cas réel, l’équipage, excellent, n’a jamais atteint les items d’amerrissage : le bouton qui ferme les ouvertures du fuselage n’a pas été enclenché. Ce n’est pas une faute de l’équipage : c’est un défaut de conception que le NTSB a demandé de corriger."],["Ce qui protège","Reconnaître qu’une check-list ne correspond pas à la situation, et le dire. Et décider tôt de ce qu’on garde."]],"comp":"PRO · SAW"},"11":{"front":[{"t":"Moteur 1 coupé, remis. Moteur 2… Rien. Le contrôle répète sa question deux fois."},{"t":"Personne n’a regardé la suite de la check-list."}],"changes":[],"go":6,"debrief":[["Pourquoi c’était tentant","Un moteur qui repart règle tout. Tant qu’on essaie, on agit."],["Le piège","La fixation. Les moteurs n’indiquaient pas qu’ils étaient irrécupérables, et chaque essai consomme la hauteur. Pendant ce temps, personne ne pilote la décision, ni ne parle au contrôle."],["Ce qui protège","Un nombre d’essais fixé à l’avance, puis passer à la suite. Et répondre au contrôle, même d’un mot : « Attendez. »"]],"comp":"WLM · SAW · COM"},"10":{"front":[{"t":"Virage vers le fleuve. Volets, vitesse visée. Le copilote annonce les hauteurs."},{"t":"Alarmes sol inhibées : le poste est silencieux.","if":"has:ESSENTIEL"},{"t":"L’alarme sol crie « terrain, pull up » jusqu’au bout. Vous tenez mal votre vitesse.","if":"not:ESSENTIEL"}],"changes":[],"goto":[{"if":"n:2:APU,ESSENTIEL,BRIEFING","to":16,"label":"Au moins deux jetons parmi APU, ESSENTIEL, BRIEFING"},{"to":8,"label":"Sinon"}],"debrief":[["Pourquoi c’était difficile","Poser un avion de ligne sur l’eau, volontairement, avec 150 personnes à bord. Aucun simulateur ne vous y a vraiment entraîné."],["Ce qui protège","Décider tôt laisse le temps de préparer : vitesse, assiette, cabine, bateaux. Le NTSB a conclu que l’amerrissage offrait la meilleure probabilité de survie."],["Ce qui a compté","Chaque barrière dressée avant (briefing, APU, check-list triée) réduit la charge des dernières secondes, celles où l’on tient la vitesse."]],"comp":"PSD · FPM · WLM"},"13":{"front":[{"t":"Vous visez le terrain. Le copilote compte : « Huit cents… sept cents… » Le terrain ne se rapproche pas assez vite."},{"t":"Vous l’aviez dit tôt : vous renoncez à temps et virez vers le fleuve.","if":"has:ESSENTIEL|has:BRIEFING"},{"t":"Vous y croyez encore. Les toits approchent.","if":"not:ESSENTIEL&not:BRIEFING"}],"changes":[],"goto":[{"if":"has:ESSENTIEL|has:BRIEFING","to":8,"label":"Avec le jeton ESSENTIEL ou le jeton BRIEFING"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","Une piste, des secours : le réflexe de l’aviateur. Le contrôle venait de vous l’accorder."],["Le piège","Le biais de continuation du plan : plus on s’approche, plus il est difficile de renoncer. Dans le cas réel, le commandant a accepté le terrain, puis y a renoncé en quelques secondes : « On ne peut pas. »"],["Ce qui protège","Un plan B dit à voix haute tôt, au sol ou en vol, rend le renoncement possible au bon moment."]],"comp":"PSD · SAW"},"17":{"front":[{"t":"Virage vers la piste 05. La ville défile sous l’avion. Le copilote : « On ne l’aura pas. »"},{"t":"Mais vous avez viré tout de suite : la piste est là, de justesse.","if":"has:DEMI-TOUR&not:CONTRE-QFU"}],"changes":[],"goto":[{"if":"has:DEMI-TOUR&not:CONTRE-QFU","to":19,"label":"Avec le jeton DEMI-TOUR, sans le jeton CONTRE-QFU"},{"to":5,"label":"Sinon"}],"debrief":[["Pourquoi c’était tentant","Le contrôle vous l’a proposée, vous la connaissez, les secours y sont. Et vous savez peut-être qu’en simulateur, c’était possible."],["Le piège","Le biais rétrospectif. Les simulations réussies supposaient un virage immédiat, par des pilotes prévenus. Avec trente-cinq secondes pour reconnaître la panne et décider, la tentative a échoué."],["Ce qui protège","Décider avec ce que l’on sait au moment où l’on décide, et l’énergie qu’il reste vraiment."]],"comp":"PSD · SAW · FPM"}},"fins":{"16":{"n":1,"title":"Amerrissage préparé","front":[{"t":"Cabine prête, passagers en position de sécurité, bouton DITCHING enclenché. Vous touchez l’eau à la vitesse visée, assiette tenue. L’avion glisse, ralentit, flotte."},{"t":"Évacuation par les portes avant et les issues d’ailes. Les bateaux arrivent en quelques minutes. Des blessés légers, du froid, personne de grave."}],"changes":[],"question":"Un collègue : « Tu aurais pu tenter la piste. En simulateur, ça passe. » Que lui répondez-vous ?","back":"Vos barrières ont fait cette fin : un briefing refait, l’APU tout de suite, une check-list triée, une option dite tôt. L’équipage réel, remarquable, n’avait pas eu le temps de toutes les dresser : c’est l’objet des recommandations du NTSB sur la double panne à basse altitude.","sound":"splashstop"},"8":{"n":2,"title":"Tous vivants","front":[{"t":"Vous touchez l’eau sous la vitesse visée, avec un taux de descente trop fort. L’arrière du fuselage se déchire, l’eau monte dans la cabine arrière. Une porte arrière ouverte la laisse entrer plus vite."},{"t":"Évacuation par l’avant et les ailes. Peu de passagers ont pris leur gilet ; certains attendent debout sur les ailes, dans l’eau glacée. Les bateaux arrivent. Tout le monde est vivant ; quelques blessés graves."}],"changes":[],"question":"Au débriefing, on vous félicite. Dans votre vol, qu’est-ce qui relevait de la chance ?","back":"Vous avez rencontré l’issue réelle : tous vivants. Une issue exceptionnelle, qui doit beaucoup à l’équipage, et aussi à la chance : un avion équipé de radeaux sans y être obligé, des bateaux à quelques minutes, le jour et la visibilité. Le débriefing va faire la part des deux.","sound":"splashstop"},"19":{"n":3,"title":"Posé de justesse","front":[{"t":"Vous franchissez le seuil à quelques mètres de hauteur. L’avion touche dur, des pneus éclatent ; il s’arrête sur la piste."},{"t":"Les secours sont là. Personne n’est blessé."}],"changes":[],"question":"La compagnie veut faire de votre vol un exemple en formation. Qu’en pensez-vous ?","back":"Une bonne issue ne fait pas une bonne décision. Vous avez viré avant de savoir si les moteurs repartiraient et quelle énergie il restait. En simulateur, des pilotes prévenus y arrivent une fois sur deux ; avec trente-cinq secondes de délai réaliste, jamais. Vous avez gagné un pari.","sound":"landing"},"5":{"n":4,"title":"Trop court","front":[{"t":"La piste reste trop loin. L’avion touche avant elle, dans une zone construite."},{"t":"Fin du vol."}],"changes":[],"question":"L’enquêteur : « À quel moment avez-vous su que la piste ne passerait pas ? » Que répondez-vous ?","back":"Vous avez cherché une piste trop longtemps. C’est l’issue que l’équipage réel a évitée en renonçant en quelques secondes, et en le disant. Le débriefing va montrer pourquoi une piste attire, et ce qui permet d’y renoncer.","sound":"bigcrash"}},"dossier":[{"id":"vol","label":"Votre vol","html":"<div class=\"kicker\">Dossier de vol · 1/5<\/div><h1>Votre vol<\/h1>\n<p class=\"lead\">Préparation habituelle d’une navette : lisez le dossier comme avant n’importe quel départ.<\/p>\n<div class=\"cols\"><div><h2>Plan de vol · extrait<\/h2><table class=\"cast\"><tr><td>Vol<\/td><td>NV 215, navette vers une ville du sud, 1 h 50 de vol<\/td><\/tr><tr><td>Horaires<\/td><td>Départ prévu 14 h 30 locales ; retard de 30 min (embarquement)<\/td><\/tr><tr><td>Avion<\/td><td>Biréacteur moyen-courrier, 150 sièges<\/td><\/tr><tr><td>À bord<\/td><td>150 passagers, 5 membres d’équipage<\/td><\/tr><tr><td>Carburant<\/td><td>Délestage prévu + réserve finale + dégagement : conforme<\/td><\/tr><tr><td>Dégagement<\/td><td>Aéroport de la région, à 60 NM au nord<\/td><\/tr><tr><td>Départ prévu<\/td><td>Piste 05, départ omnidirectionnel nord, montée 5 000 ft<\/td><\/tr><\/table><\/div>\n<div><h2>Équipage<\/h2><table class=\"cast\"><tr><td>Commandant de bord<\/td><td>Vous. 19 000 heures de vol, instructeur, ancien de la sécurité des vols de la compagnie. Pilote surveillant sur cette étape.<\/td><\/tr><tr><td>Copilote<\/td><td>15 000 heures de vol, qualifié sur ce type depuis six semaines : il sort de formation et connaît la QRH par cœur. Pilote aux commandes sur cette étape.<\/td><\/tr><tr><td>Cabine<\/td><td>Un chef de cabine et deux PNC. Briefing équipage fait à l’escale.<\/td><\/tr><\/table>\n<div class=\"box tint\"><p style=\"margin:0\">Note compagnie du jour : la matinée a pris du retard sur tout le réseau. Rattrapez ce qui peut l’être, sans compromis sur la sécurité.<\/p><\/div><\/div><\/div>\n<p class=\"small\">Compagnie, terrains et personnages fictifs. Le scénario s’inspire d’un événement réel présenté au débriefing.<\/p>"},{"id":"meteo","label":"Météo et NOTAM","html":"<div class=\"kicker\">Dossier de vol · 2/5<\/div><h1>Météo et NOTAM<\/h1>\n<div class=\"mtr\"><b>METAR<\/b> ZZZZ 151350Z VRB03KT 9999 FEW040 M06/M17 Q1022 NOSIG=<br><b>TAF<\/b> ZZZZ 151100Z 1512/1612 04006KT 9999 FEW040 BECMG 1514/1516 23008KT=<\/div>\n<div class=\"cols\"><div><h2>En clair<\/h2><p>À 13 h 50 UTC (14 h 50 locales) : vent faible et variable, visibilité 10 km ou plus, quelques nuages à 4 000 ft. Température −6 °C, point de rosée −17 °C. QNH 1022 hPa.<\/p>\n<p>Prévision : vent du nord-est faible, devenant sud-ouest 8 kt entre 14 h et 16 h UTC. Changement de piste en service attendu dans l’après-midi.<\/p><\/div>\n<div><h2>ATIS<\/h2><p>Information K : piste en service 05. Vent variable 3 kt, tendance sud-ouest. Visibilité supérieure à 10 km. Prudence : activité aviaire signalée le long du fleuve.<\/p><\/div><\/div>\n<h2>NOTAM<\/h2><table><tr><th>N°<\/th><th>Lieu<\/th><th>Objet<\/th><\/tr><tr data-key=\"d1\"><td class='num'>1<\/td><td>ZZZZ<\/td><td>Activité aviaire importante (oiseaux de grande taille, en groupes) le long du fleuve et à ses abords, de la surface à 3 000 ft. Période hivernale, jusqu’au 31 mars.<\/td><\/tr><tr><td class='num'>2<\/td><td>ZZZZ<\/td><td>Voie de circulation B fermée entre B2 et B4 (travaux). Roulage par A.<\/td><\/tr><tr><td class='num'>3<\/td><td>ZZZZ<\/td><td>Grue de 85 m à 1,2 km au nord-est du seuil 23, balisée de jour et de nuit.<\/td><\/tr><tr><td class='num'>4<\/td><td>ZZZZ<\/td><td>ILS 23 : alignement de piste en maintenance de 13 h à 16 h UTC. Approches 23 : VOR uniquement.<\/td><\/tr><tr><td class='num'>5<\/td><td>ZZZX<\/td><td>Terrain d’affaires : service ATS de 8 h à 20 h locales. Sauvetage et lutte contre l’incendie : niveau 5.<\/td><\/tr><tr><td class='num'>6<\/td><td>Région<\/td><td>Zone réglementée R 12 (centrale électrique) active, de la surface à 2 500 ft.<\/td><\/tr><\/table>\n<p class=\"small\">Indicateurs, METAR, TAF et NOTAM fictifs, reconstitués pour le jeu.<\/p>"},{"id":"region","label":"Départs et région","html":"<div class=\"kicker\">Dossier de vol · 3/5<\/div><h1>Départs et région<\/h1>\n<p class=\"lead\">Départs omnidirectionnels publiés, schéma de principe. Le départ effectif est confirmé par le contrôle.<\/p>\n<div style=\"max-width:640px\"><svg viewBox=\"0 0 640 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" role=\"img\" aria-label=\"Carte schématique des départs et de la région\">\n<rect x=\"0\" y=\"0\" width=\"640\" height=\"420\" fill=\"#fbfbf9\"/>\n<g fill=\"#e7e9e6\" stroke=\"none\"><rect x=\"292\" y=\"10\" width=\"330\" height=\"250\" rx=\"6\"/><rect x=\"430\" y=\"260\" width=\"192\" height=\"60\" rx=\"6\"/><\/g>\n<text x=\"460\" y=\"40\" fill=\"#5b6470\" font-weight=\"600\" letter-spacing=\"2\">VILLE<\/text>\n<path d=\"M248 0 C 240 80, 262 150, 250 230 C 240 300, 262 360, 255 420 L 205 420 C 214 360, 192 300, 200 230 C 212 150, 190 80, 198 0 Z\" fill=\"#cfe0ee\" stroke=\"#8fb3cf\"/>\n<text x=\"150\" y=\"190\" fill=\"#3d6f96\" font-weight=\"600\" transform=\"rotate(-84 150 190)\">le fleuve · ≈ 1 km<\/text>\n<g stroke=\"#444\" stroke-width=\"3\"><line x1=\"186\" y1=\"58\" x2=\"262\" y2=\"64\"/><line x1=\"186\" y1=\"110\" x2=\"264\" y2=\"116\"/><\/g>\n<text x=\"270\" y=\"56\" fill=\"#333\">ponts<\/text>\n<path d=\"M170 20 L 290 20 L 300 330 L 172 330 Z\" fill=\"none\" stroke=\"#b5651d\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n<text x=\"176\" y=\"346\" fill=\"#8a4a12\">NOTAM 1 · activité aviaire, SFC–3 000 ft<\/text>\n<g transform=\"translate(470 330) rotate(-24)\"><rect x=\"-70\" y=\"-6\" width=\"140\" height=\"12\" fill=\"#2b2f36\"/><text x=\"-66\" y=\"22\" font-size=\"11\" fill=\"#2b2f36\">05<\/text><text x=\"52\" y=\"-12\" font-size=\"11\" fill=\"#2b2f36\">23<\/text><\/g>\n<text x=\"446\" y=\"380\" fill=\"#111\" font-weight=\"700\">Aéroport de départ (ZZZZ)<\/text>\n<text x=\"446\" y=\"396\" fill=\"#444\">piste 05/23 · 2 100 m<\/text>\n<path d=\"M534 302 L 580 282 Q 600 274 598 250 L 596 120\" fill=\"none\" stroke=\"#1d4f91\" stroke-width=\"2\"/>\n<polygon points=\"596,112 591,124 601,124\" fill=\"#1d4f91\"/>\n<text x=\"604\" y=\"200\" fill=\"#1d4f91\" transform=\"rotate(90 604 200)\">Départ 05 · gauche cap 360 · 5 000 ft<\/text>\n<path d=\"M406 358 L 330 380 Q 296 388 290 350 L 282 160 L 280 40\" fill=\"none\" stroke=\"#1b7a4a\" stroke-width=\"2\"/>\n<polygon points=\"280,32 275,44 285,44\" fill=\"#1b7a4a\"/>\n<text x=\"300\" y=\"250\" fill=\"#1b7a4a\" font-weight=\"600\">Départ 23 · droite cap 340<\/text>\n<text x=\"300\" y=\"266\" fill=\"#1b7a4a\">montée 5 000 ft<\/text>\n<text x=\"300\" y=\"282\" fill=\"#1b7a4a\">contre-QFU : 2 000 ft<\/text>\n<g transform=\"translate(70 240)\"><rect x=\"-5\" y=\"-40\" width=\"10\" height=\"80\" fill=\"#2b2f36\"/><text x=\"-30\" y=\"58\" fill=\"#111\" font-weight=\"700\">Terrain d'affaires (ZZZX)<\/text><text x=\"-30\" y=\"74\" fill=\"#444\">piste 01/19 · 1 800 m<\/text><\/g>\n<g transform=\"translate(40 30)\"><path d=\"M0 18 L 8 0 L 16 18 L 8 13 Z\" fill=\"#111\"/><text x=\"4\" y=\"32\" font-weight=\"700\">N<\/text><\/g>\n<g transform=\"translate(40 400)\"><line x1=\"0\" y1=\"0\" x2=\"92\" y2=\"0\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"0\" y1=\"-5\" x2=\"0\" y2=\"5\" stroke=\"#111\"/><line x1=\"92\" y1=\"-5\" x2=\"92\" y2=\"5\" stroke=\"#111\"/><text x=\"0\" y=\"-8\" font-size=\"11\">5 km<\/text><\/g>\n<\/svg><\/div>\n<div class=\"cols\"><div><h2>Départs<\/h2><table>\n<tr><td class=\"num\">05<\/td><td>Virage à gauche, cap 360, montée 5 000 ft.<\/td><\/tr>\n<tr><td class=\"num\">23<\/td><td>Virage à droite, cap 340, le long du fleuve, montée 5 000 ft.<\/td><\/tr>\n<tr data-key=\"d1\"><td class=\"num\">23*<\/td><td>En contre-QFU, sur proposition du contrôle : montée initiale limitée à 2 000 ft (arrivées 05), puis montée sur instruction.<\/td><\/tr><\/table><\/div>\n<div><h2>Terrains et repères<\/h2><table class=\"cast\"><tr><td>Aéroport de départ (ZZZZ)<\/td><td>Piste 05/23, 2 100 m. Pompiers niveau 9.<\/td><\/tr><tr data-key=\"d6\"><td>Terrain d’affaires (ZZZX)<\/td><td>Piste 01/19, 1 800 m, de l’autre côté du fleuve, à 13 km à l’ouest de l’aéroport.<\/td><\/tr><tr><td>Le fleuve<\/td><td>Large d’environ un kilomètre, sans obstacle entre les ponts du nord et l’aéroport. Navettes fluviales en journée.<\/td><\/tr><tr><td>Dégagement<\/td><td>Aéroport de la région, à 60 NM au nord.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Carte fictive, sans échelle exacte. Ne pas utiliser pour la navigation.<\/p>"},{"id":"avion","label":"Votre avion","html":"<div class=\"kicker\">Dossier de vol · 4/5<\/div><h1>Votre avion<\/h1>\n<div class=\"cols\"><div><h2>Fiche technique<\/h2><table class=\"cast\"><tr><td>Type<\/td><td>Biréacteur moyen-courrier, 150 sièges, commandes de vol électriques.<\/td><\/tr><tr><td>Moteurs<\/td><td>Deux réacteurs à double flux, régulation numérique.<\/td><\/tr><tr data-key=\"d9\"><td>APU<\/td><td>Groupe auxiliaire de puissance, démarrable en vol : fournit électricité et air.<\/td><\/tr><tr><td>Électricité de secours<\/td><td>Sans moteur ni APU : batteries et éolienne de secours (RAT), sortie automatique. Fonctions réduites.<\/td><\/tr><tr><td>Protections de vol<\/td><td>En alimentation normale, les commandes protègent le domaine de vol (incidence, vitesse). Réduites en secours.<\/td><\/tr><tr data-key=\"d6\"><td>Plané<\/td><td>Moteurs arrêtés, en lisse, à la meilleure finesse : environ 2,5 NM (4,6 km) par 1 000 ft. Ordre de grandeur.<\/td><\/tr><\/table><\/div>\n<div><h2>Équipement et état<\/h2><table class=\"cast\"><tr><td>Survol maritime<\/td><td>L’avion dessert aussi des îles : toboggans-radeaux aux quatre portes, gilet sous chaque siège, cordes de sécurité. Le trajet du jour ne l’exige pas.<\/td><\/tr><tr><td>Bouton DITCHING<\/td><td>Ferme les vannes et ouvertures basses du fuselage avant un amerrissage.<\/td><\/tr><tr><td>Liste minimale (MEL)<\/td><td>Aucun élément reporté.<\/td><\/tr><\/table><\/div><\/div>\n<p class=\"small\">Fiche reconstituée pour le jeu : elle ne décrit pas un avion réel immatriculé.<\/p>"},{"id":"qrh","label":"QRH","html":"<div class=\"kicker\">Dossier de vol · 5/5 · documentation de bord<\/div><h1>QRH · extraits<\/h1>\n<p class=\"lead\">Le manuel de procédures d’urgence (QRH) est à bord, à portée des deux pilotes. Extraits.<\/p>\n<h2>Sommaire<\/h2><table><tr><th>N°<\/th><th>Procédure<\/th><th>Pages<\/th><\/tr><tr><td class='num'>1<\/td><td>Panne moteur au décollage<\/td><td>1.1<\/td><\/tr><tr><td class='num'>2<\/td><td>Feu moteur<\/td><td>1.4<\/td><\/tr><tr><td class='num'>3<\/td><td>Double panne moteur<\/td><td>2.1 à 2.3<\/td><\/tr><tr><td class='num'>4<\/td><td>Amerrissage préparé<\/td><td>3.1<\/td><\/tr><tr><td class='num'>5<\/td><td>Atterrissage forcé<\/td><td>3.2<\/td><\/tr><tr><td class='num'>6<\/td><td>Fumée<\/td><td>4.1<\/td><\/tr><tr><td class='num'>7<\/td><td>Dépressurisation<\/td><td>5.1<\/td><\/tr><tr><td class='num'>8<\/td><td>Évacuation d’urgence<\/td><td>6.1<\/td><\/tr><\/table>\n<div class=\"cols\"><div>\n<div class=\"ck-sec\">1 · Panne moteur au décollage<\/div><div class=\"ck\"><span class=\"it\">Vitesse, trajectoire<\/span><span class=\"d\"><\/span><span class=\"st\">TENIR<\/span><\/div><div class=\"ck\"><span class=\"it\">Moteur en panne<\/span><span class=\"d\"><\/span><span class=\"st\">IDENTIFIER<\/span><\/div><div class=\"ck\"><span class=\"it\">Manette du moteur en panne<\/span><span class=\"d\"><\/span><span class=\"st\">RALENTI<\/span><\/div><div class=\"ck\"><span class=\"it\">Retour terrain ou dégagement<\/span><span class=\"d\"><\/span><span class=\"st\">DÉCIDER<\/span><\/div>\n<div class=\"ck-sec\">4 · Amerrissage préparé<\/div><div class=\"ck\"><span class=\"it\">Cabine<\/span><span class=\"d\"><\/span><span class=\"st\">PRÉVENIR (TEMPS DISPONIBLE)<\/span><\/div><div class=\"ck\"><span class=\"it\">Gilets<\/span><span class=\"d\"><\/span><span class=\"st\">PASSAGERS ET ÉQUIPAGE<\/span><\/div><div class=\"ck\"><span class=\"it\">Bouton DITCHING<\/span><span class=\"d\"><\/span><span class=\"st\">ON<\/span><\/div><div class=\"ck\"><span class=\"it\">Train<\/span><span class=\"d\"><\/span><span class=\"st\">RENTRÉ<\/span><\/div><div class=\"ck\"><span class=\"it\">Volets<\/span><span class=\"d\"><\/span><span class=\"st\">CONFIG 2<\/span><\/div><div class=\"ck\"><span class=\"it\">Vitesse<\/span><span class=\"d\"><\/span><span class=\"st\">VISER, ASSIETTE ≈ 11°<\/span><\/div>\n<div class=\"ck-note\">Préparation complète : 10 à 15 minutes, cabine comprise.<\/div>\n<\/div><div>\n<div class=\"ck-sec\">3 · Double panne moteur · page 2.1<\/div>\n<div class=\"ck-note\" data-key=\"d14\">Procédure établie pour une double panne en croisière : plusieurs essais de rallumage possibles.<\/div><div class=\"ck\"><span class=\"it\">Allumage moteurs<\/span><span class=\"d\"><\/span><span class=\"st\">CONTINU<\/span><\/div><div class=\"ck\"><span class=\"it\">Manettes de poussée<\/span><span class=\"d\"><\/span><span class=\"st\">RALENTI<\/span><\/div><div class=\"ck\"><span class=\"it\">Vitesse<\/span><span class=\"d\"><\/span><span class=\"st\">300 KT (rallumage optimal)<\/span><\/div><div class=\"ck\"><span class=\"it\">Rallumage<\/span><span class=\"d\"><\/span><span class=\"st\">SURVEILLER 30 S<\/span><\/div><div class=\"ck\"><span class=\"it\">Sans rallumage après 30 s : master moteur<\/span><span class=\"d\"><\/span><span class=\"st\">OFF 30 S, PUIS ON<\/span><\/div><div class=\"ck\"><span class=\"it\">Rallumage<\/span><span class=\"d\"><\/span><span class=\"st\">SURVEILLER<\/span><\/div>\n<div class=\"ck-sec\">Page 2.2 · sans rallumage<\/div><div class=\"ck\" data-key=\"d9\"><span class=\"it\">APU (si disponible)<\/span><span class=\"d\"><\/span><span class=\"st\">DÉMARRER<\/span><\/div><div class=\"ck\"><span class=\"it\">Message de détresse<\/span><span class=\"d\"><\/span><span class=\"st\">ÉMETTRE<\/span><\/div><div class=\"ck\"><span class=\"it\">Vitesse<\/span><span class=\"d\"><\/span><span class=\"st\">FINESSE MAX<\/span><\/div><div class=\"ck\"><span class=\"it\">Terrain<\/span><span class=\"d\"><\/span><span class=\"st\">CHOISIR<\/span><\/div><div class=\"ck\"><span class=\"it\">Électricité non essentielle<\/span><span class=\"d\"><\/span><span class=\"st\">DÉLESTER<\/span><\/div>\n<div class=\"ck-sec\" data-key=\"d14\">Page 2.3 · atterrissage forcé ou amerrissage<\/div><div class=\"ck\"><span class=\"it\">Cabine<\/span><span class=\"d\"><\/span><span class=\"st\">PRÉVENIR<\/span><\/div><div class=\"ck\"><span class=\"it\">Bouton DITCHING (amerrissage)<\/span><span class=\"d\"><\/span><span class=\"st\">ON<\/span><\/div><div class=\"ck\"><span class=\"it\">Alarmes sol<\/span><span class=\"d\"><\/span><span class=\"st\">INHIBER<\/span><\/div><div class=\"ck\"><span class=\"it\">Volets<\/span><span class=\"d\"><\/span><span class=\"st\">CONFIG 2 (EAU) / 3 (SOL)<\/span><\/div><div class=\"ck\"><span class=\"it\">Vitesse d’approche<\/span><span class=\"d\"><\/span><span class=\"st\">VISER<\/span><\/div><div class=\"ck\"><span class=\"it\">À 500 ft : annonce<\/span><span class=\"d\"><\/span><span class=\"st\">« POSITION DE SÉCURITÉ »<\/span><\/div><div class=\"ck\"><span class=\"it\">Assiette à l’impact (eau)<\/span><span class=\"d\"><\/span><span class=\"st\">≈ 11°<\/span><\/div>\n<\/div><\/div>\n<p class=\"small\">Procédures fictives, reconstituées pour le jeu. Elles ne reproduisent la documentation d’aucun constructeur ni d’aucune compagnie.<\/p>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M10 42V8\"/><path d=\"M10 10l26 4v10l-26 4z\"/><path d=\"M19 11.5v15M28 12.8v12.4\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 16c4-4 8-4 10 0 2-4 6-4 10 0\"/><path d=\"M22 26c3-3 6-3 8 0 2-3 5-3 8 0\"/><circle cx=\"30\" cy=\"38\" r=\"6\"/><path d=\"M30 32v-2M24 38h-2\"/><\/svg>","14":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"10\" y=\"6\" width=\"22\" height=\"30\" rx=\"2\"/><rect x=\"16\" y=\"12\" width=\"22\" height=\"30\" rx=\"2\" fill=\"#f2f3f1\"/><path d=\"M21 20h12M21 26h12M21 32h7\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M24 42V26\"/><path d=\"M24 26L12 12M24 26l12-14\"/><path d=\"M8 14l4-2 1 4M40 14l-4-2-1 4\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 34c4-3 8-3 12 0s8 3 12 0 8-3 12 0 4 3 4 3\"/><path d=\"M10 28l22-4 6 2-6 3-20 2z\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 36c4-3 8-3 12 0s8 3 12 0 8-3 12 0\"/><path d=\"M12 30l18-8 6 1-4 4-18 6z\"/><path d=\"M36 14v6M33 17h6\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M4 40h40\"/><path d=\"M14 40l4-10M24 40v-10M34 40l-4-10\"/><path d=\"M10 22l20-4 6 2-6 3-18 2z\"/><\/svg>","5":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M28 42V20h12v22M30 26h3M35 26h3M30 32h3M35 32h3\"/><path d=\"M4 42h40\"/><path d=\"M6 24l16-4 4 2-4 2-14 1z\"/><\/svg>"},"brief":"Vous êtes commandant de bord d’un biréacteur moyen-courrier, sur une navette d’hiver. Le copilote est pilote aux commandes pour l’étape. Lisez votre dossier de vol comme avant n’importe quel départ.","eval":{"questions":[{"t":"Lors d’une panne grave en vol, quel est l’ordre des priorités ?","type":"single","options":["Communiquer, naviguer, piloter","Piloter, naviguer, communiquer","Diagnostiquer, communiquer, piloter","Naviguer, piloter, communiquer"],"answer":1,"notion":"Priorités : piloter, naviguer, communiquer"},{"t":"Quels éléments font d’un changement de piste au roulage une menace à traiter ?","type":"multi","options":["Une nouvelle trajectoire de départ","Des performances à recalculer","Un briefing départ devenu faux","Une pression horaire","Une piste plus longue"],"answer":[0,1,2,3],"notion":"Menace au sens du TEM"},{"t":"Qu’appelle-t-on le biais rétrospectif ?","type":"open","expected":"Juger une décision passée avec ce que l’on sait après coup (son issue, des informations alors indisponibles)","notion":"Biais rétrospectif"},{"t":"« Une check-list d’urgence se déroule toujours dans l’ordre, jusqu’au bout. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Trier une check-list inadaptée à la situation"},{"t":"« Plus on s’approche d’un objectif, plus il devient difficile d’y renoncer. »","type":"single","options":["Vrai","Faux"],"answer":0,"notion":"Biais de continuation du plan"},{"t":"Une bonne issue prouve-t-elle une bonne décision ?","type":"single","options":["Oui : l’issue valide la décision","Non : une décision se juge sur l’information et le temps disponibles au moment de décider","Seulement si l’issue se répète"],"answer":1,"notion":"Biais de résultat"}],"q7":"« Je me sens capable de renoncer à une option en moins d’une minute, sous forte charge de travail. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les choix étaient difficiles : aucune option n’était évidente.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de vol ressemblait à un vrai dossier.","La durée était adaptée."],"yn":["Connaissiez-vous l’événement réel avant la séance ?"],"choice":[{"t":"À quel moment avez-vous reconnu l’événement réel ?","options":["Dès le dossier de vol","À la décision 1 (le vent a tourné)","À la décision 2 (les oiseaux)","Plus tard dans la partie","Je ne l’ai pas reconnu"]}],"open":["Quel choix vous a paru le plus difficile, et pourquoi ?","Qu’est-ce qui vous a semblé irréaliste ou confus ?"],"application":"Lors de votre prochain briefing départ, que direz-vous de plus ?"},"criteria":{"traps":[3,13],"fin_max":70,"fin1":null,"extra":[["Reconnaissance de l'événement (avis)","comparer les choix de ceux qui l'ont reconnu avant la décision 2 et des autres"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un pilote de ligne sur biréacteur","aucune réserve technique majeure"]]},"pressureLimit":60,"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\">Transformer la surprise en compréhension : les premières secondes, la check-list, la décision, et la part de la chance. Trois règles : faire parler avant d’expliquer ; analyser des décisions, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Tour de table rapide, avant toute explication. Afficher les réactions saisies au tableau de bord.<\/div><div class=\"l\">Demander<\/div><div>« En un mot : qu’avez-vous ressenti au moment des oiseaux ? » puis « Qu’avez-vous fait de vos trois premières secondes ? »<\/div><div class=\"l\">Repère<\/div><div>La surprise est une donnée, pas un échec. Personne n’avait été prévenu, comme l’équipage réel.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Les choix du groupe<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Projeter la répartition des choix et des fins. Puis l’avis « À quel moment avez-vous reconnu l’événement ? »<\/div><div class=\"l\">Demander<\/div><div>« Ceux qui ont reconnu l’événement ont-ils joué la situation, ou le film ? »<\/div><div class=\"l\">Repère<\/div><div>Reconnaître le cas aide à choisir le fleuve ; cela n’aide pas à démarrer l’APU, ni à trier la check-list.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:07<small>4 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter l’événement à partir de la chronologie de la fiche mémo, sans la lire : impact à 2 818 ft, APU à la onzième seconde, « impossible » à la cinquante-cinquième, amerrissage vers 3 min 30.<\/div><div class=\"l\">Dire<\/div><div>La décision 1 est une invention du scénario : le vol réel est parti normalement. Elle sert à travailler le changement de piste de dernière minute.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:11<small>6 min<\/small><\/div><div><h3>Les secondes qui comptent<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Reprendre les décisions 2 et 3 : l’APU, la répartition des rôles, la check-list faite pour la croisière.<\/div><div class=\"l\">Demander<\/div><div>« Quelle ligne de votre QRH n’auriez-vous jamais le temps d’atteindre à 2 000 ft ? » · « Qui pilote, chez nous, quand le pilote aux commandes est le moins expérimenté sur le type ? »<\/div><div class=\"l\">Repère<\/div><div>Les items d’amerrissage n’ont jamais été atteints : un défaut de conception, pas une faute d’équipage.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:17<small>4 min<\/small><\/div><div><h3>Le biais rétrospectif<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter les simulations : retour réussi 7 fois sur 13 en virant immédiatement ; échec avec 35 secondes de délai.<\/div><div class=\"l\">Demander<\/div><div>« Les joueurs arrivés en fin 3 ont-ils pris une meilleure décision que ceux arrivés en fin 2 ? »<\/div><div class=\"l\">Repère<\/div><div>On juge une décision sur l’information et le temps disponibles au moment de décider, pas sur l’issue.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:21<small>4 min<\/small><\/div><div><h3>Ce que recommande le NTSB<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Présenter les recommandations de la fiche mémo : check-list et entraînement pour la double panne à basse altitude, conception des check-lists, formation à l’amerrissage, gilets et briefing passagers.<\/div><div class=\"l\">Demander<\/div><div>« Laquelle existe chez nous ? Laquelle manque ? Qui la porterait ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:25<small>3 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler cinq distinctions : QFU et contre-QFU · pilote aux commandes et pilote surveillant · dérouler et trier une check-list · biais de continuation et biais rétrospectif · bonne issue et bonne décision.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir. Distribuer ou projeter la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Au prochain briefing départ, que direz-vous de plus ? » Puis tour de table.<\/div><\/div><\/div><\/div><div class=\"box tint small\">Si le groupe cite le film consacré à l’événement : il dramatise l’enquête, présentée comme une accusation. L’enquête réelle ne cherchait pas de coupable et a conclu que la décision d’amerrir était la bonne. Revenir au rapport.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · le cas réel<\/div><h1>Le cas réel<\/h1>\n<p class=\"lead\">Janvier 2009, un biréacteur de 150 passagers décolle d’un aéroport urbain en bord de fleuve. À moins de 3 000 ft, il percute un groupe de grands oiseaux. Les deux moteurs perdent presque toute leur poussée. Rapport d’enquête : NTSB AAR-10/03.<\/p>\n<div class=\"tl\"><div class=\"ev\"><span class=\"h\">+0 s<\/span><span>2 818 ft, copilote aux commandes. « Oiseaux ! » Chocs, les deux moteurs ralentissent.<\/span><\/div><div class=\"ev\"><span class=\"h\">+9 s<\/span><span>Le commandant met l’allumage ; deux secondes plus tard, il démarre l’APU.<\/span><\/div><div class=\"ev\"><span class=\"h\">+13 s<\/span><span>« Mes commandes. » Le commandant prend les commandes.<\/span><\/div><div class=\"ev\"><span class=\"h\">+18 s<\/span><span>Il demande la check-list double panne moteur ; le copilote la commence une vingtaine de secondes plus tard.<\/span><\/div><div class=\"ev\"><span class=\"h\">+23 s<\/span><span>Message de détresse : « on revient vers l’aéroport ».<\/span><\/div><div class=\"ev\"><span class=\"h\">+55 s<\/span><span>Le contrôle propose une piste : « Impossible. On finira peut-être dans le fleuve. »<\/span><\/div><div class=\"ev\"><span class=\"h\">+96 s<\/span><span>Le commandant accepte un terrain de l’autre côté du fleuve, puis y renonce : « On ne peut pas. »<\/span><\/div><div class=\"ev\"><span class=\"h\">+2 min<\/span><span>« Ici le commandant : position de sécurité. » Toujours pas de rallumage.<\/span><\/div><div class=\"ev\"><span class=\"h\">+3 min 30<\/span><span>Amerrissage, environ 20 kt sous la vitesse visée. Évacuation en quelques minutes. 155 personnes à bord, toutes vivantes.<\/span><\/div><\/div>\n<p class=\"small\">Chronologie d’après l’enregistreur de conversations du poste (rapport NTSB, pages 2 à 5). Temps arrondis, comptés depuis l’impact.<\/p>"},{"id":"barrieres","label":"Les barrières","html":"<div class=\"kicker\">Fiche mémo · les barrières<\/div><h1>Ce qui a tenu, ce qui a cédé<\/h1>\n<p class=\"lead\">Lecture par barrières, à la manière du modèle de Reason : une issue heureuse n’empêche pas d’analyser les failles.<\/p>\n<table><tr><th>Barrière<\/th><th>Ce qui s'est passé<\/th><th>État<\/th><\/tr><tr><td><b>Briefing départ<\/b><\/td><td>Standard. La double panne à basse altitude n’avait ni procédure dédiée ni entraînement requis.<\/td><td>Manquante (système)<\/td><\/tr><tr><td><b>Premiers gestes<\/b><\/td><td>APU démarré avant la check-list ; commandant aux commandes.<\/td><td>A tenu<\/td><\/tr><tr><td><b>Check-list<\/b><\/td><td>Faite pour la croisière : les items d’amerrissage ne sont jamais atteints.<\/td><td>A cédé (conception)<\/td><\/tr><tr><td><b>Information moteurs<\/b><\/td><td>Rien n’indiquait que les moteurs étaient perdus : du temps passé à rallumer.<\/td><td>Manquante (conception)<\/td><\/tr><tr><td><b>Décision<\/b><\/td><td>Option probable dite à 55 s, terrain abandonné en quelques secondes.<\/td><td>A tenu<\/td><\/tr><tr><td><b>Amerrissage<\/b><\/td><td>Vitesse difficile à tenir sous la charge : arrière du fuselage déchiré.<\/td><td>Partielle<\/td><\/tr><tr><td><b>Cabine<\/b><\/td><td>Ordre de position de sécurité à 2 min ; peu de gilets pris ; une porte arrière ouverte.<\/td><td>Partielle<\/td><\/tr><tr><td><b>Chance<\/b><\/td><td>Radeaux non obligatoires à bord, bateaux à quelques minutes, jour, visibilité.<\/td><td>Hors système<\/td><\/tr><\/table>"},{"id":"biais","label":"Le biais rétrospectif","html":"<div class=\"kicker\">Fiche mémo · le biais rétrospectif<\/div><h1>« En simulateur, ça passait »<\/h1>\n<div class=\"cols\"><div><h2>Ce qu'ont montré les simulations<\/h2><ul>\n<li>Retour vers l’aéroport de départ en virant immédiatement : 7 réussites sur 13.<\/li>\n<li>Vers le terrain de l’autre côté du fleuve : 1 réussite sur 2.<\/li>\n<li>Avec 35 secondes pour reconnaître la panne et décider : échec.<\/li><\/ul><\/div>\n<div><h2>Ce qu'en a conclu le NTSB<\/h2><p>Le virage immédiat des simulations ne reflétait pas les conditions réelles : des pilotes prévenus de la panne, sans temps pour la reconnaître ni pour décider. La décision d’amerrir offrait la meilleure probabilité de survie.<\/p><\/div><\/div>\n<div class=\"box tint\"><p style=\"margin:0\">Biais rétrospectif : juger une décision avec ce que l’on sait après coup. Biais de résultat : juger une décision sur son issue. Dans le jeu, la fin 3 récompense un pari ; la fin 2 suit une bonne décision.<\/p><\/div>"},{"id":"retenir","label":"À retenir","html":"<div class=\"kicker\">Fiche mémo · à retenir<\/div><h1>Cinq éléments à retenir<\/h1><div class=\"keep\"><span class=\"n\">1<\/span><div><b>Un changement de piste est une menace<\/b><br>Trajectoire, performances et briefing deviennent faux d’un coup. Pas le temps de rebriefer, pas le temps d’accepter.<\/div><\/div><div class=\"keep\"><span class=\"n\">2<\/span><div><b>Piloter, puis donner des moyens<\/b><br>Les premières secondes : tenir l’avion, puis les gestes qui donnent du temps et de l’énergie, comme l’APU.<\/div><\/div><div class=\"keep\"><span class=\"n\">3<\/span><div><b>Une check-list peut ne pas correspondre<\/b><br>Faite pour la croisière, elle ne se déroule pas à 2 000 ft. La trier, et le dire.<\/div><\/div><div class=\"keep\"><span class=\"n\">4<\/span><div><b>Dire tôt l’option probable<\/b><br>« On finira peut-être dans le fleuve » prépare le contrôle, la cabine, et soi-même. C’est ce qui permet de renoncer à une piste.<\/div><\/div><div class=\"keep\"><span class=\"n\">5<\/span><div><b>Une bonne issue n’est pas une bonne décision<\/b><br>Juger avec l’information et le temps disponibles au moment de décider.<\/div><\/div>"},{"id":"reco","label":"Les recommandations","html":"<div class=\"kicker\">Fiche mémo · recommandations<\/div><h1>Ce que recommande le NTSB<\/h1>\n<p class=\"lead\">Sélection parmi les recommandations du rapport AAR-10/03, adressées à la FAA et à l’AESA. Formulations résumées.<\/p>\n<table class=\"rec\"><tr><td>A-10-66, 67<\/td><td>Développer et imposer une check-list et une procédure pour la double panne moteur à basse altitude.<\/td><\/tr><tr><td>A-10-68<\/td><td>Établir des règles de conception des check-lists d’urgence : ordre des items, longueur, temps de déroulement, charge de travail.<\/td><\/tr><tr><td>A-10-69<\/td><td>Entraîner les équipages à la double panne à basse altitude : jugement, tri des tâches, décision, gestion de la charge.<\/td><\/tr><tr><td>A-10-70<\/td><td>Former à l’amerrissage : illusions visuelles sur l’eau, techniques d’approche et de contact, avec et sans moteurs.<\/td><\/tr><tr><td>A-10-72<\/td><td>Certifier que les paramètres d’amerrissage peuvent être tenus sans moteurs, sans habileté exceptionnelle.<\/td><\/tr><tr><td>A-10-73<\/td><td>Ajouter à la check-list l’inhibition des alarmes sol pendant la descente finale.<\/td><\/tr><tr><td>A-10-62, 63<\/td><td>Informer l’équipage de l’état réel d’un moteur (récupérable ou non).<\/td><\/tr><tr><td>A-10-82 à 86<\/td><td>Gilets et coussins flottants sur tous les vols, briefing complet, gilets plus faciles à prendre et à enfiler, et des moyens de capter l’attention des passagers.<\/td><\/tr><\/table>"},{"id":"gloss","label":"Glossaire","html":"<div class=\"kicker\">Fiche mémo · glossaire<\/div><h1>Les mots du scénario<\/h1><div class=\"gl\"><h3>Vol et procédures<\/h3><div class=\"e\"><b>QFU, contre-QFU.<\/b> Orientation magnétique de la piste en service ; décoller ou atterrir en sens inverse du sens en service.<\/div><div class=\"e\"><b>PF, PM.<\/b> Pilote aux commandes ; pilote surveillant, qui gère radio, check-lists et surveillance.<\/div><div class=\"e\"><b>QRH.<\/b> Manuel de référence rapide : procédures d’urgence et anormales.<\/div><div class=\"e\"><b>APU.<\/b> Groupe auxiliaire de puissance : fournit électricité et air, y compris en vol.<\/div><div class=\"e\"><b>RAT.<\/b> Éolienne de secours, qui sort automatiquement en cas de perte d’alimentation.<\/div><div class=\"e\"><b>Bouton DITCHING.<\/b> Ferme les vannes et ouvertures basses du fuselage avant un amerrissage.<\/div><h3>Facteurs humains<\/h3><div class=\"e\"><b>TEM.<\/b> Gestion des menaces et des erreurs : identifier les menaces avant qu’elles ne produisent des erreurs.<\/div><div class=\"e\"><b>Tri des tâches.<\/b> Abandonner ou reporter les tâches non essentielles quand le temps manque (task shedding).<\/div><div class=\"e\"><b>Biais de continuation.<\/b> Tendance à poursuivre un plan engagé malgré des indices qu’il ne fonctionne plus.<\/div><div class=\"e\"><b>Biais rétrospectif.<\/b> Juger une décision passée avec ce que l’on sait après coup.<\/div><div class=\"e\"><b>Biais de résultat.<\/b> Juger une décision sur son issue plutôt que sur sa qualité au moment où elle a été prise.<\/div><div class=\"e\"><b>Effet de surprise.<\/b> Perturbation du jugement et de l’action face à un événement inattendu.<\/div><\/div><h2>Sources<\/h2><div class=\"src\">\n<p>NTSB, rapport d’accident AAR-10/03, « Loss of Thrust in Both Engines After Encountering a Flock of Birds and Subsequent Ditching on the Hudson River », mai 2010 : <a href=\"https://www.ntsb.gov/investigations/AccidentReports/Reports/AAR1003.pdf\">ntsb.gov<\/a>.<\/p>\n<p>FAA, bibliothèque « Lessons Learned », constatations et recommandations du rapport : <a href=\"https://www.faa.gov/sites/faa.gov/files/2025-04/usairways1549_findings.pdf\">faa.gov<\/a>.<\/p>\n<p class=\"small\">Les enquêtes du NTSB visent l’amélioration de la sécurité, non la recherche de responsabilités. Ce scénario utilise le rapport dans ce seul but ; lieux, compagnie et personnages du jeu sont fictifs.<\/p><\/div>"}]},"tem":[{"t":"Le contrôle propose un départ en contre-QFU pendant le roulage.","k":"M","why":"Elle vient de l’extérieur de l’équipage et complique le départ : une menace, à gérer par un nouveau briefing."},{"t":"Le briefing départ n’est pas refait après le changement de piste.","k":"E","why":"Une inaction de l’équipage qui s’écarte de ce qu’il attend de lui-même : une erreur."},{"t":"Sans APU, l’avion vole sur batteries et éolienne de secours, protections de vol réduites.","k":"I","why":"Un état de l’avion à marge réduite, conséquence d’une menace et d’un geste non fait."},{"t":"Un groupe de grands oiseaux percute l’avion ; les deux moteurs perdent leur poussée.","k":"M","why":"Extérieure à l’équipage, annoncée par un NOTAM : une menace environnementale."},{"t":"Personne ne répond au contrôle pendant les essais de rallumage.","k":"E","why":"Une erreur de communication : la décision n’est plus pilotée, ni partagée."},{"t":"Virage serré à basse hauteur, sans moteur, la vitesse fond.","k":"I","why":"L’énergie et la trajectoire sont dégradées par une décision de l’équipage : un état indésirable à récupérer."},{"t":"La check-list double panne est conçue pour la croisière.","k":"M","why":"Une menace latente, logée dans la documentation : l’équipage ne l’a pas créée, il doit la gérer."}],"reason":[{"t":"Accepter le changement de piste et reprogrammer en roulant, sans refaire le briefing : « tout le monde l’a déjà fait ».","k":"V","why":"Une étape connue est sautée délibérément pour gagner du temps, par habitude : une violation de routine."},{"t":"Dérouler dans l’ordre, à 2 000 ft, une check-list conçue pour la croisière.","k":"F","why":"Une bonne règle appliquée hors de son domaine : l’exécution est rigoureuse, c’est le plan qui ne convient pas."},{"t":"Toucher l’eau sous la vitesse visée, sous la charge de travail et l’alarme sol.","k":"R","why":"L’intention était correcte, l’exécution s’en écarte : un raté, favorisé par la saturation."},{"t":"Poursuivre vers la piste en comptant sur un résultat obtenu au simulateur.","k":"F","why":"Erreur d’évaluation : le plan repose sur une connaissance qui ne s’applique pas aux conditions réelles."}]},{"id":"s5","num":5,"version":"S5 v1","duration":"15
