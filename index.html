ENACE, les sollicitations vous prennent du temps : {effet}.","sound":"bell"}],"auto":[18,14],"key":{"tabs":["escale"],"tab":"escale","mark":"d15","note":"Escale et service : l’accueil de la classe affaires est partagé entre les postes 7 et 10. Seul, vous êtes hors du plan prévu, et le CCP, qui dirige l’équipage, doit le savoir."},"sa":[{"t":"Un accueil de la classe affaires prévu à deux, postes 7 et 10","ok":true,"k":"R","why":"Fiche de postes : seul, vous êtes hors du plan prévu. C’est le repère qui justifie l’alerte."},{"t":"Un embarquement retardé jusqu’à la fin du réagencement","ok":false,"why":"Faux : l’embarquement a commencé avant la fin du réagencement."},{"t":"Un poste 7 retenu au galley G2 par les actions commerciales","ok":true,"k":"M","why":"Votre binôme est indisponible : la charge prévue pour deux repose sur vous."},{"t":"Des chariots rangés « comme on peut » pendant l’embarquement","ok":true,"k":"M","why":"L’état des offices a changé depuis votre prise en compte."},{"t":"Des trousses de confort exclues des prestations au sol","ok":false,"why":"Faux : elles figurent dans les prestations sol de la classe affaires."},{"t":"Un CCP qui dirige l’équipage et peut décider d’un renfort ou d’un report","ok":true,"k":"R","why":"La ressource à activer : rendre la surcharge visible à celui qui peut la traiter."}]},"6":{"idx":4,"title":"All attendants","front":[{"t":"Portes fermées, démonstrations faites. Vous vérifiez votre zone. Tous les interphones sonnent. Le CCP : « PNC, rendez compte par porte. » Les portes répondent une à une. En cabine, les passagers ont hâte de décoller."},{"t":"Dans votre zone, le passager du siège 4A refuse de redresser son siège, les toilettes avant sont occupées, des journaux jonchent l’allée, un rideau a été tiré. Un passager vous arrête pour une couverture, un autre pour un verre d’eau."}],"notes":[],"tail":"","question":"Que faites-vous ?","options":[{"to":5,"text":"Vous dites au 4A de redresser son siège, ramassez les journaux, ouvrez le rideau et allez vous asseoir. « Porte 1 droite, zone sécurisée. » Vous commencez votre check-list silencieuse avant décollage.","cost":0,"cls":"C","short":"Tour rapide, sans le G0"},{"to":10,"text":"« Porte 1 droite, zone sécurisée. » Vous raccrochez et repartez faire un dernier tour de votre zone, le temps que les dernières portes répondent.","cost":1,"cls":"B","short":"Rendre compte, puis la zone"},{"to":13,"text":"« Porte 1 droite, zone pas prête, une minute. » Vous revoyez toute votre zone, puis vous rendez compte assis à votre poste.","cost":2,"cls":"A","short":"Zone pas prête, tout revoir"}],"enter":[{"type":"drain","res":"TEMPS","fb":"ÉTOILE","if":"lte:ÉTOILE:2","head":"Le passager du 4A","text":"Avec 2 étoiles ou moins, le passager du 4A exige de parler au chef de cabine. Le calmer vous coûte : {effet}.","sound":"bell"}],"cue":"allAttendants","auto":[5,10],"key":{"tabs":["doc1","doc2"],"tab":"doc1","mark":"d6","note":"Fiche de postes : votre zone comprend le G0. Check sécurité : voitures rangées, freinées, loquets verrouillés, puis compte rendu assis ; sinon « zone pas prête »."},"sa":[{"t":"Un G0 compris dans votre zone","ok":true,"k":"R","why":"Fiche de postes : votre compte rendu engage aussi l’office avant."},{"t":"Un bouton cabin ready actionné par le commandant de bord","ok":false,"why":"Faux : c’est le CCP qui l’actionne, quand toute la cabine est confirmée."},{"t":"Un siège non redressé, des toilettes occupées, un rideau tiré","ok":true,"k":"M","why":"Zone non conforme, avec des sollicitations qui captent l’attention loin du G0."},{"t":"Un compte rendu à donner assis, service et sécurité terminés","ok":true,"k":"R","why":"Check sécurité : vérifier, s’asseoir, puis rendre compte."},{"t":"Une réponse « zone pas prête » absente de la check","ok":false,"why":"Faux : la check prévoit « zone sécurisée » ou « zone pas prête »."},{"t":"Des portes qui répondent une à une, des passagers pressés de décoller","ok":true,"k":"M","why":"Pression de conformité et pression temporelle : répondre comme les autres devient automatique."}]}},"suites":{"12":{"front":[{"t":"Le CCP soupire : « La compagnie les a surclassés pour se faire pardonner du retard. D’accord, la sécurité d’abord. L’accueil et la boisson, on les fait ; les trousses attendront le décollage. »"},{"t":"Deux collègues échangent un regard. On vous trouve alarmiste."}],"changes":[{"tok":"MENACE"},{"res":"ÉTOILE","d":-1}],"debrief":[["Pourquoi c’était coûteux","Poser la question « sécurité ou service ? », c’est passer pour alarmiste. Et le CCP ne peut pas tout reporter : surclassés pour se faire pardonner du retard, ces passagers attendent un vrai service."],["Ce qui protège","La gestion des menaces et des erreurs (TEM) : une charge de travail inhabituelle est une menace. Nommée, elle se traite, même partiellement. Et le CCP sait désormais que l’avant est en tension. Le BEA note que ce n’est pas ce qui s’est passé."]],"comp":"COM · WLM","go":9},"4":{"front":[{"t":"« Bonne idée. » Le CCP valide. Vous faites le tour de votre zone en pensant aux prestations : boissons, trousses, vestiaires. Pendant que le catering finit, vous préparez tout au galley."},{"t":"Vous serez prêts pour l’accueil. Votre zone, vous l’avez vue ; sa sécurité, vous ne l’avez pas regardée."}],"changes":[{"res":"ÉTOILE","d":1}],"debrief":[["Pourquoi c’était tentant","Le service sera impeccable."],["Le piège","Vous avez vu votre zone avec les yeux du service, pas avec ceux de la sécurité. Le BEA relève une focalisation sur le service au détriment de certaines actions de sécurité."],["Ce qui protège","Une zone se regarde d’abord avec les yeux de la sécurité. Un service se rattrape en vol ; un chariot mal arrimé, non."]],"comp":"WLM · PSD","go":9},"17":{"front":[{"t":"Le briefing se termine. Personne n’a parlé des priorités."},{"t":"Chacun part vers son poste."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Le CCP a donné le cadre, et l’habitude rassure : des vols difficiles, vous en avez déjà fait."],["Le piège","Faire comme d’habitude un jour qui n’a rien d’habituel. Une menace non nommée ne se traite pas : le BEA relève que la charge de travail au sol n’a pas été identifiée comme une menace au briefing, et qu’aucune prestation n’a été reportée."],["Ce qui protège","Au briefing, une question simple : qu’est-ce qui est inhabituel aujourd’hui, et que reporte-t-on ?"]],"comp":"COM · SAW","go":9},"20":{"front":[{"t":"Chariot par chariot : sorti, rangé, freiné, loquets verrouillés. Toutes les voitures sont vérifiées."},{"t":"Cinq bonnes minutes. En porte 2, le réagencement s’est fait sans vous : il manquera des plateaux en classe affaires."}],"changes":[{"tok":"VERROU"},{"res":"ÉTOILE","d":-1}],"debrief":[["Pourquoi c’était coûteux","Cinq minutes quand l’équipe vous attend, et un service moins bien préparé pour des passagers déjà mécontents : deux jetons et une étoile."],["Ce qui protège","Une vérification complète (sortir, ranger, freiner, verrouiller) plutôt qu’un constat de présence."],["La limite","Une vérification ne vaut qu’à l’instant où elle est faite. Tout passage dans l’office après elle peut l’annuler."]],"comp":"PRO · SAW","go":15},"2":{"front":[{"t":"Rapidement, vous balayez du regard le galley. Les voitures sont bien plombées : leur contenu doit donc être conforme à la documentation. En vol, l’ASC du poste 4 cassera les plombs pour vérifier les prestations."},{"t":"En porte 2, on réagence à quatre."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Les voitures sont plombées et la vérification des prestations est confiée à l’ASC du poste 4 : tout semble en ordre."],["Le piège","La vérification visuelle des plombs vous a fait passer à côté de la sécurisation des voitures : freinées, loquets verrouillés."],["Ce qui protège","La confiance n’exclut pas le contrôle. Ce qui est dans votre zone se vérifie par vous, avant le décollage, quoi qu’on ait délégué par ailleurs."]],"comp":"PRO · LTW","go":15},"11":{"front":[{"t":"Vous rangez, puis un coup d’œil aux armoires non plombées : tout semble en ordre. L’ASC du poste 4 fera le reste en vol."},{"t":"En porte 2, vous réagencez les chariots repas à quatre. L’embarquement commence."}],"changes":[{"res":"ÉTOILE","d":1}],"debrief":[["Pourquoi c’était tentant","Vous avez avancé le travail : le G0 est rangé, les armoires sont vues, le reste est confié. Le temps passé donne le sentiment d’avoir vérifié le G0."],["Le piège","Ranger et jeter un coup d’œil, ce n’est pas vérifier. Aucune voiture n’a été vérifiée rangée, freinée, loquets verrouillés."],["Ce qui protège","Au sol, la sécurité avant les prestations : finir la check sécurité du G0 avant de quitter sa zone."]],"comp":"WLM · SAW","go":15},"7":{"front":[{"t":"« Reçu, je t’envoie le PNC du poste 7, et on décale ce qui peut l’être. »"},{"t":"Quelques passagers soupirent : la boisson attendra. Vous reprenez votre souffle."}],"changes":[{"tok":"MENACE"},{"res":"TEMPS","d":2},{"res":"ÉTOILE","d":-1}],"debrief":[["Pourquoi c’était coûteux","Demander de l’aide au CCP, devant des passagers qui attendent, c’est avouer qu’on ne s’en sort pas seul. Et une étoile de moins."],["Ce qui protège","Annoncer une surcharge en fait une information d’équipe. Le CCP peut alors décider : renfort, report. Rendre visible plutôt qu’absorber."]],"comp":"COM · WLM","go":6},"14":{"front":[{"t":"Le PNC du poste 7 vient dix minutes, puis repart au G2 finir le service au sol."},{"t":"Le CCP ne sait rien de votre situation."}],"changes":[{"res":"TEMPS","d":1}],"debrief":[["Pourquoi c’était tentant","L’entraide entre collègues règle le problème sans déranger le chef, et sans perdre d’étoile."],["Le piège","Un renfort ponctuel ne change pas le plan : la surcharge reste invisible pour celui qui peut reporter le service."],["Ce qui protège","Prévenir d’abord le CCP : c’est lui qui peut reporter, et qui saura, plus tard, que l’avant est en difficulté."]],"comp":"COM · LTW","go":6},"18":{"front":[{"t":"Vous tenez : accueil, vestiaires, boisson, trousses, fonctionnement des sièges. Tout est fait."},{"t":"La vague vous submerge, mais les passagers sont ravis."}],"changes":[{"res":"ÉTOILE","d":1}],"debrief":[["Pourquoi c’était tentant","Bien faire son métier et satisfaire des passagers déjà mécontents. La note du vol remonte."],["Le piège","La vraie PNC s’est dite « submergée ». Une surcharge absorbée en silence ne laisse plus aucune marge pour la sécurité : deux jetons de temps, et personne d’autre ne le sait."],["Ce qui protège","Prioriser : la sécurité d’abord, le service peut attendre le décollage. Le dire au CCP."]],"comp":"WLM · PSD","go":6},"13":{"front":[{"t":"Le CCP attend : sans votre compte rendu, pas de cabin ready. Avec le jeton MENACE, il sait l’avant en tension et fait patienter la cabine par une annonce. Sans ce jeton, personne n’explique rien : des passagers soupirent, l’un d’eux sonne. Ils ont hâte de décoller."},{"t":"En refaisant votre zone, vous arrivez au G0 : il est en vrac, des bouilloires et des plateaux équipage sont restés sur le plan de travail. Les loquets de la voiture de ventes sont déverrouillés. Vous rangez, freinez, verrouillez. Assis à votre poste, vous rappelez le CCP : « Porte 1 droite, zone sécurisée. »"}],"changes":[{"if":"not:MENACE","res":"ÉTOILE","d":-1}],"debrief":[["Pourquoi c’était coûteux","Faire attendre toutes les portes et des passagers pressés de décoller, et dépenser deux jetons de temps : beaucoup de joueurs ne les avaient plus."],["Ce qui protège","Ne rendre compte qu’une fois toute sa zone vérifiée, assis à son poste. « Zone pas prête » coûte une minute ; c’est le seul compte rendu vrai."]],"comp":"PRO · COM","go":16},"10":{"front":[{"t":"Les dernières portes répondent ; le CCP appuie sur le bouton cabin ready : au poste de pilotage, le voyant passe au vert. Votre dernier tour vous mène au G0, loin de votre poste : il est en vrac, des bouilloires et des plateaux équipage sur le plan de travail."},{"t":"Les loquets de la voiture de ventes sont déverrouillés."},{"t":"Votre compte rendu était faux. L’avion commence à rouler."}],"changes":[],"debrief":[["Pourquoi c’était tentant","Répondre d’abord pour ne pas faire attendre, vérifier ensuite : tout le monde l’a déjà fait, et cela passe presque toujours."],["Le piège","Un compte rendu donné avant la vérification est faux, et après le compte rendu on reste assis. Le cabin ready passe au vert sur une information que personne n’a vérifiée."],["Ce qui protège","Vérifier, s’asseoir, puis rendre compte, jamais l’inverse. Si le temps manque : « zone pas prête »."]],"comp":"PRO · COM","go":8},"5":{"front":[{"t":"Toutes les portes ont rendu compte. Le CCP appuie sur le bouton cabin ready ; au poste de pilotage, le voyant passe au vert. Check-list silencieuse terminée, vous pensez déjà à l’organisation du service."},{"t":"Avant l’embarquement, vous avez rangé, freiné et verrouillé chaque voiture. Depuis, le G0 a vécu, et vous ne l’avez pas revu.","if":"has:VERROU"},{"t":"Une omission a pu être faite lors de la vérification du G0.","if":"not:VERROU"}],"changes":[],"debrief":[["Pourquoi c’était tentant","Tout ce qui réclamait votre attention était traité : le 4A, les journaux, le rideau. Quand toutes les portes ont répondu et que le temps manque, « zone sécurisée » se dit de manière automatique."],["Le piège","L’erreur d’omission : sous la charge, ce qui ne réclame rien s’oublie. Le G0, vérifié avant l’embarquement, n’était plus dans votre tête ; depuis, le catering et l’équipage y étaient passés, et il était en vrac. Le jour de l’événement, le dernier passage au G0 n’a pas eu lieu."],["Ce qui protège","Une vérification réelle, refaite après tout passage du catering : chariots rangés, freinés, loquets verrouillés, rien de posé sur le plan de travail. Sinon, « zone pas prête »."]],"comp":"SAW · PRO","branch":{"tok":"VERROU","a":19,"b":3}}},"fins":{"16":{"n":1,"title":"Rien à signaler","front":[{"t":"Cabin ready, vraiment : chaque PNC est assis, chaque office est sécurisé. Le décollage se déroule sans encombre, le vol aussi."},{"t":"Personne ne saura ce que votre dernier passage au G0 a évité. Au débriefing de fin de vol, on parle surtout des passagers mécontents."}],"changes":[],"note":"","question":"Un collègue : « Tout ça pour des bouilloires ? On aurait décollé pareil. » Que lui répondez-vous ?","back":"Le succès en sécurité est invisible : il ressemble à un vol ordinaire, souvent moins bien noté. Ce qui a fait cette fin : une vérification complète de votre zone, le G0 compris, avant le compte rendu, et le choix de dire « zone pas prête ».","sound":"takeoff"},"8":{"n":2,"title":"Au point d’arrêt","front":[{"t":"Vous appelez le CCP à l’interphone : « Le G0 n’est pas sécurisé. » Il coupe le cabin ready. Au poste de pilotage, le voyant n’est plus vert : la check-list attend, l’avion s’immobilise au point d’arrêt."},{"t":"Bouilloires et plateaux rangés, voiture de ventes freinée, loquets verrouillés. Assis, vous rendez compte ; le voyant repasse au vert. Mise en puissance avec deux minutes de retard."}],"changes":[{"res":"ÉTOILE","d":-1}],"note":"Deux minutes de retard, des passagers agacés.","question":"Le commandant de bord demande pourquoi le cabin ready s’est éteint. Que lui dites-vous, et qui d’autre doit le savoir ?","back":"Une barrière a tenu au dernier moment : votre passage au G0, puis le CCP qui accepte de couper son propre cabin ready. Mais votre compte rendu « zone sécurisée » était faux : vous l’avez donné avant de vérifier. C’est un événement à signaler.","sound":"stop"},"19":{"n":3,"title":"Plus de peur que de mal","front":[{"t":"À la mise en puissance, les bouilloires laissées sur le plan de travail se renversent et se vident ; des plateaux équipage tombent dans l’allée."},{"t":"La voiture de ventes, déverrouillée depuis votre vérification, sort de son logement. Freinée, elle ne roule pas : une roue grippée la fait basculer, et elle se coince en travers de l’office. Personne n’est touché, dégâts matériels seulement."}],"changes":[{"res":"ÉTOILE","d":-1}],"note":"Service perturbé, office encombré jusqu’à l’arrivée.","question":"À l’arrivée, un collègue : « Personne n’est blessé, pas la peine de faire une fiche. » Que faites-vous ?","back":"Vous n’avez pas vérifié la totalité du G0. Votre vérification d’avant l’embarquement a suffi à éviter le pire : freinée, la voiture n’a pas dévalé le couloir. Cependant, il faut aussi vérifier son galley avant de s’asseoir. La chance n’est pas un facteur sur lequel compter dans notre métier.","sound":"spoolcrash"},"3":{"n":4,"title":"Couloir droit","front":[{"t":"À la mise en puissance, les bouilloires laissées sur le galley se renversent et se vident. La voiture de ventes jaillit de son logement, dévale le couloir droit et finit sa course au rang 39."},{"t":"Huit passagers blessés, dont une gravement au visage : elle s’était penchée dans le couloir. Un médecin à bord, une téléconférence avec le SAMU : pas de déroutement, prise en charge à l’arrivée."}],"changes":[],"note":"","question":"Le lendemain, l’enquêteur : « Le G0 était dans votre zone. Qu’est-ce qui a empêché un dernier passage avant le décollage ? » Que répondez-vous ?","back":"Vous avez rencontré l’issue réelle. Aucune étape n’était absurde : chacune répondait à une demande légitime de service. Le débriefing va montrer où le temps de la sécurité a été dépensé, et qui le mesurait.","sound":"spoolbigcrash"}},"dossier":[{"id":"vol","label":"Rotation et cabine","html":"<div class=\"kicker\">Dossier de vol · 1/5<\/div>\n<h1>Votre vol, votre cabine<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.4mm\">Lisez ce dossier avant la carte 1, en commençant par votre rotation. Il reste à votre disposition pendant toute la partie.<\/p>\n<div class=\"box tint rot\" style=\"margin:0 0 1mm\"><div class=\"kicker\" style=\"margin-bottom:1.2mm\">Votre rotation<\/div><p>Vol de nuit retour vers Paris, depuis une île de l’océan Indien. Hier, le CCP a appris que l’avion serait remplacé par une version de cabine différente de celle pour laquelle l’équipage est prévu, sans plus d’informations sur sa configuration.<\/p><p>Au départ de l’hôtel, pas de fiches de poste. À l’arrivée à l’avion, le CCP constate qu’il manque un chef de cabine au regard des qualifications de l’équipage.<\/p><p>La pression vient de toutes parts : la compagnie, la gestion de l’équipage, et des passagers qui ont subi d’énormes retards, voire des reports de vol.<\/p><p>Pour se faire pardonner, la compagnie a surclassé une cinquantaine de passagers ; la configuration de l’avion le permet. En classe affaires, vous aurez 58 passagers au lieu de 14. Énervés, fatigués, certains vont abuser de leur petit privilège.<\/p><p>Votre compagnie exige une note de cinq étoiles sur chacun de ses vols. Vos chefs vous en parlent à chaque entretien et à chaque réunion.<\/p><\/div>\n<div style=\"margin:0.4mm auto 0;width:94%\"><svg viewBox=\"0 0 760 300\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\"><defs><pattern id=\"sh\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#cfcfcf\" stroke-width=\"2\"/><\/pattern><\/defs><path d=\"M110 70 H730 Q748 70 748 90 V210 Q748 230 730 230 H110 Q40 230 22 150 Q40 70 110 70 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.8\"/><path d=\"M30 150 Q46 88 92 84 V216 Q46 212 30 150 Z\" fill=\"url(#sh)\" stroke=\"#111\" stroke-width=\"1\"/><text x=\"58\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" fill=\"#333\">Poste<\/text><rect x=\"96\" y=\"110\" width=\"30\" height=\"80\" fill=\"#ececec\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"111.0\" y=\"154\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"800\" font-size=\"13\">G0<\/text><rect x=\"262\" y=\"110\" width=\"24\" height=\"80\" fill=\"#ececec\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"274.0\" y=\"154\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"800\" font-size=\"13\">G2<\/text><rect x=\"436\" y=\"110\" width=\"22\" height=\"80\" fill=\"#ececec\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"447.0\" y=\"154\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"800\" font-size=\"13\">G3<\/text><rect x=\"700\" y=\"110\" width=\"30\" height=\"80\" fill=\"#ececec\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"715.0\" y=\"154\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"800\" font-size=\"13\">G5<\/text><rect x=\"140\" y=\"78\" width=\"116\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"140\" y=\"128\" width=\"116\" height=\"44\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"140\" y=\"188\" width=\"116\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><text x=\"198.0\" y=\"148\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"1\">AFFAIRES<\/text><text x=\"198.0\" y=\"162\" text-anchor=\"middle\" font-size=\"10\" fill=\"#333\">58 sièges<\/text><rect x=\"300\" y=\"78\" width=\"130\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"300\" y=\"128\" width=\"130\" height=\"44\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"300\" y=\"188\" width=\"130\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><text x=\"365.0\" y=\"148\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"1\">PREMIUM<\/text><text x=\"365.0\" y=\"162\" text-anchor=\"middle\" font-size=\"10\" fill=\"#333\">28 sièges<\/text><rect x=\"464\" y=\"78\" width=\"230\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"464\" y=\"128\" width=\"230\" height=\"44\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><rect x=\"464\" y=\"188\" width=\"230\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/><text x=\"579.0\" y=\"148\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"1\">ÉCONOMIE<\/text><text x=\"579.0\" y=\"162\" text-anchor=\"middle\" font-size=\"10\" fill=\"#333\">206 sièges<\/text><text x=\"600\" y=\"124\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">couloir droit<\/text><text x=\"600\" y=\"184\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"#555\">couloir gauche<\/text><rect x=\"123\" y=\"66\" width=\"18\" height=\"8\" fill=\"#111\"/><rect x=\"123\" y=\"226\" width=\"18\" height=\"8\" fill=\"#111\"/><text x=\"132\" y=\"58\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">1D<\/text><text x=\"132\" y=\"252\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">1G<\/text><rect x=\"279\" y=\"66\" width=\"18\" height=\"8\" fill=\"#111\"/><rect x=\"279\" y=\"226\" width=\"18\" height=\"8\" fill=\"#111\"/><text x=\"288\" y=\"58\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">2D<\/text><text x=\"288\" y=\"252\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">2G<\/text><rect x=\"451\" y=\"66\" width=\"18\" height=\"8\" fill=\"#111\"/><rect x=\"451\" y=\"226\" width=\"18\" height=\"8\" fill=\"#111\"/><text x=\"460\" y=\"58\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">3D<\/text><text x=\"460\" y=\"252\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">3G<\/text><rect x=\"581\" y=\"66\" width=\"18\" height=\"8\" fill=\"#111\"/><rect x=\"581\" y=\"226\" width=\"18\" height=\"8\" fill=\"#111\"/><text x=\"590\" y=\"58\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">4D<\/text><text x=\"590\" y=\"252\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">4G<\/text><rect x=\"687\" y=\"66\" width=\"18\" height=\"8\" fill=\"#111\"/><rect x=\"687\" y=\"226\" width=\"18\" height=\"8\" fill=\"#111\"/><text x=\"696\" y=\"58\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">5D<\/text><text x=\"696\" y=\"252\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\">5G<\/text><circle cx=\"132\" cy=\"84\" r=\"7\" fill=\"#111\"/><text x=\"132\" y=\"88\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\">10<\/text><circle cx=\"288\" cy=\"84\" r=\"7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"288\" y=\"88\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\">7<\/text><circle cx=\"132\" cy=\"216\" r=\"7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"132\" y=\"219.5\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\">1<\/text><circle cx=\"288\" cy=\"216\" r=\"7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"288\" y=\"219.5\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\">4<\/text><circle cx=\"590\" cy=\"216\" r=\"7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><text x=\"590\" y=\"219.5\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\">2<\/text><line x1=\"132\" y1=\"41\" x2=\"170\" y2=\"26\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"132\" cy=\"41\" r=\"2.5\" fill=\"#111\"/><text x=\"174\" y=\"30\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Poste 10 : vous<\/text><text x=\"174\" y=\"44.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">porte 1D, le G0<\/text><line x1=\"288\" y1=\"41\" x2=\"320\" y2=\"26\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"288\" cy=\"41\" r=\"2.5\" fill=\"#111\"/><text x=\"324\" y=\"30\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Poste 7<\/text><text x=\"324\" y=\"44.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">porte 2D, galley G2<\/text><line x1=\"132\" y1=\"261\" x2=\"110\" y2=\"280\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"132\" cy=\"261\" r=\"2.5\" fill=\"#111\"/><text x=\"106\" y=\"284\" text-anchor=\"end\" font-size=\"11.5\" font-weight=\"600\">Poste 1 : CCP<\/text><text x=\"106\" y=\"298.5\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#333\">porte 1G<\/text><line x1=\"288\" y1=\"261\" x2=\"320\" y2=\"280\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"288\" cy=\"261\" r=\"2.5\" fill=\"#111\"/><text x=\"324\" y=\"284\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Poste 4 : ASC<\/text><text x=\"324\" y=\"298.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">porte 2G, remplace le CC<\/text><line x1=\"590\" y1=\"261\" x2=\"620\" y2=\"280\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"590\" cy=\"261\" r=\"2.5\" fill=\"#111\"/><text x=\"624\" y=\"284\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Poste 2 : CC<\/text><text x=\"624\" y=\"298.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">porte 4G<\/text><text x=\"742\" y=\"40\" text-anchor=\"end\" font-size=\"11\" fill=\"#333\">côté droit (D) en haut · nez à gauche<\/text><\/svg><\/div>\n<h2 style=\"margin-top:0.6mm\">La version du jour<\/h2>\n<table class=\"grid vt\"><tr><th>Sièges par classe<\/th><th class=\"c\">Affaires<\/th><th class=\"c\">Premium<\/th><th class=\"c\">Économie<\/th><\/tr><tr><td>Version prévue pour l’équipage<\/td><td class='c num' style='font-size:16.8px'>14<\/td><td class='c num' style='font-size:16.8px'>32<\/td><td class='c num' style='font-size:16.8px'>422<\/td><\/tr><tr><td>Version de l’avion du jour, découverte à bord<\/td><td class='c num' style='font-size:16.8px'>58<\/td><td class='c num' style='font-size:16.8px'>28<\/td><td class='c num' style='font-size:16.8px'>206<\/td><\/tr><\/table>\n<h2>L'équipage et vous<\/h2>\n<table class=\"cast\"><tr><td>L’équipage<\/td><td>Commandant de bord et deux copilotes. Dix PNC : le CCP à l’avant (poste 1, porte 1G), un chef de cabine à l’arrière (poste 2, porte 4G), huit ASC. Il manque le chef de cabine de la cabine avant : l’ASC du poste 4 (porte 2G) le remplace.<\/td><\/tr><tr><td>Vous<\/td><td>ASC long-courrier depuis neuf ans, au poste 10 : le G0 (office avant), porte 1D au décollage, accueil de la classe affaires avec le poste 7 (porte 2D).<\/td><\/tr><\/table>\n\n<p class=\"small\" style=\"margin:0\">Plan de principe, sans échelle. Compagnie et personnages fictifs, inspirés d’un événement réel présenté au débriefing. La note par étoiles et les surclassements volontaires sont inventés pour le jeu.<\/p>"},{"id":"g0","label":"Le G0","html":"<div class=\"kicker\">Dossier de vol · 2/5<\/div>\n<h1>Le G0, office avant<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Le G0 est dans votre zone. Tout ce qui peut s’y déplacer doit être arrimé avant le roulage.<\/p>\n<div><svg viewBox=\"0 0 760 340\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\"><defs><pattern id=\"sh2\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#d4d4d4\" stroke-width=\"2\"/><\/pattern><\/defs><rect x=\"60\" y=\"20\" width=\"520\" height=\"300\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.8\"/><rect x=\"70\" y=\"32\" width=\"117\" height=\"58\" rx=\"3\" fill=\"url(#sh2)\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"128\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\">Four<\/text><rect x=\"197\" y=\"32\" width=\"117\" height=\"58\" rx=\"3\" fill=\"url(#sh2)\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"255\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\">Four<\/text><rect x=\"324\" y=\"32\" width=\"117\" height=\"58\" rx=\"3\" fill=\"url(#sh2)\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"382\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\">Cafetière<\/text><rect x=\"451\" y=\"32\" width=\"117\" height=\"58\" rx=\"3\" fill=\"url(#sh2)\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"509\" y=\"66\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"600\">Compartiment<\/text><rect x=\"60\" y=\"100\" width=\"520\" height=\"14\" fill=\"#111\"/><text x=\"320.0\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" fill=\"#fff\" letter-spacing=\"2\">PLAN DE TRAVAIL<\/text><rect x=\"70\" y=\"124\" width=\"117\" height=\"186\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><rect x=\"78\" y=\"136\" width=\"101\" height=\"160\" rx=\"4\" fill=\"#f3f3f3\" stroke=\"#555\" stroke-width=\"1\"/><rect x=\"85\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><rect x=\"143\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><text x=\"128\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">Armoires<\/text><rect x=\"197\" y=\"124\" width=\"117\" height=\"186\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><rect x=\"205\" y=\"136\" width=\"101\" height=\"160\" rx=\"4\" fill=\"#f3f3f3\" stroke=\"#555\" stroke-width=\"1\"/><rect x=\"212\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><rect x=\"270\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><text x=\"255\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">Voiture de<\/text><text x=\"255\" y=\"219\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">ventes<\/text><rect x=\"290\" y=\"150\" width=\"8\" height=\"12\" rx=\"1.5\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><line x1=\"294\" y1=\"162\" x2=\"294\" y2=\"168\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"241\" y=\"286\" width=\"28\" height=\"8\" rx=\"2\" fill=\"#111\"/><rect x=\"324\" y=\"124\" width=\"117\" height=\"186\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><rect x=\"332\" y=\"136\" width=\"101\" height=\"160\" rx=\"4\" fill=\"#f3f3f3\" stroke=\"#555\" stroke-width=\"1\"/><rect x=\"339\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><rect x=\"397\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><text x=\"382\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">Chariot repas<\/text><text x=\"382\" y=\"219\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">équipage<\/text><rect x=\"417\" y=\"150\" width=\"8\" height=\"12\" rx=\"1.5\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><line x1=\"421\" y1=\"162\" x2=\"421\" y2=\"168\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"368\" y=\"286\" width=\"28\" height=\"8\" rx=\"2\" fill=\"#111\"/><rect x=\"451\" y=\"124\" width=\"117\" height=\"186\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><rect x=\"459\" y=\"136\" width=\"101\" height=\"160\" rx=\"4\" fill=\"#f3f3f3\" stroke=\"#555\" stroke-width=\"1\"/><rect x=\"466\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><rect x=\"524\" y=\"125\" width=\"18\" height=\"9\" rx=\"2\" fill=\"#111\"/><text x=\"509\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">Chariot repas<\/text><text x=\"509\" y=\"219\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\">équipage<\/text><rect x=\"544\" y=\"150\" width=\"8\" height=\"12\" rx=\"1.5\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/><line x1=\"548\" y1=\"162\" x2=\"548\" y2=\"168\" stroke=\"#111\" stroke-width=\"1\"/><rect x=\"495\" y=\"286\" width=\"28\" height=\"8\" rx=\"2\" fill=\"#111\"/><line x1=\"533\" y1=\"129\" x2=\"640\" y2=\"130\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"533\" cy=\"129\" r=\"2.5\" fill=\"#111\"/><text x=\"644\" y=\"134\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Loquets rouges<\/text><text x=\"644\" y=\"148.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">deux par logement<\/text><line x1=\"548\" y1=\"156\" x2=\"640\" y2=\"180\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"548\" cy=\"156\" r=\"2.5\" fill=\"#111\"/><text x=\"644\" y=\"184\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Plomb<\/text><text x=\"644\" y=\"198.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">scellé du catering<\/text><line x1=\"509\" y1=\"290\" x2=\"640\" y2=\"290\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"509\" cy=\"290\" r=\"2.5\" fill=\"#111\"/><text x=\"644\" y=\"294\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Frein à pied<\/text><text x=\"644\" y=\"308.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">pédale sous la voiture<\/text><line x1=\"580\" y1=\"70\" x2=\"640\" y2=\"60\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"580\" cy=\"70\" r=\"2.5\" fill=\"#111\"/><text x=\"644\" y=\"64\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Fours, cafetières<\/text><text x=\"644\" y=\"78.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">arrêtés au roulage<\/text><line x1=\"580\" y1=\"236\" x2=\"640\" y2=\"236\" stroke=\"#111\" stroke-width=\"0.9\"/><circle cx=\"580\" cy=\"236\" r=\"2.5\" fill=\"#111\"/><text x=\"644\" y=\"240\" text-anchor=\"start\" font-size=\"11.5\" font-weight=\"600\">Logements<\/text><text x=\"644\" y=\"254.5\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#333\">face au couloir<\/text><\/svg><\/div>\n<h2 style=\"margin-top:2mm\">À savoir<\/h2><ul style=\"font-size:14.4px\"><li data-key=\"d9\">Un chariot est arrimé quand il est rangé dans son logement, freiné à la pédale, et ses deux loquets verrouillés.<\/li><li>Un chariot plein pèse plusieurs dizaines de kilos.<\/li><li>Toutes les voitures sont livrées plombées par le catering. Au sol, le chef de cabine du galley casse les plombs pour vérifier la conformité des prestations : il faut sortir chaque voiture, puis la replacer.<\/li><li>Les plateaux et prestations équipage sont chargés par le catering au G0, parfois après la prise en compte de l’office. Au décollage, rien ne reste posé sur le plan de travail.<\/li><\/ul>\n\n<p class=\"small\" style=\"margin:0\">Schémas de principe, sans échelle. L’agencement réel d’un office varie selon l’avion et la version.<\/p>"},{"id":"escale","label":"Escale et service","html":"<div class=\"kicker\">Dossier de vol · 3/5<\/div>\n<h1>L'escale et le service<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Horaires indicatifs, comptés à rebours depuis le départ prévu (H).<\/p>\n<table style=\"font-size:14.1px\"><tr><td class='num' style='font-size:16.8px;width:20mm'>J − 1<\/td><td>Le CCP apprend que l’avion sera remplacé par une autre version de cabine, sans plus d’informations sur sa configuration.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 2 h<\/td><td>Départ de l’hôtel : pas de fiches de postes.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 1 h<\/td><td>Arrivée à l’avion, le catering charge encore. Le CCP constate qu’il manque un chef de cabine : l’ASC du poste 4 le remplacera. Il trouve les fiches de postes dans l’armoire de documentation et les remet à chacun pour prise en compte.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 50<\/td><td>Briefing du CCP à tout l’équipage.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 45<\/td><td>Prise en compte des postes et des offices. Embarquement décalé de quelques minutes, à la demande du CCP.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 30<\/td><td>Embarquement des passagers. Prestations sol en classe affaires.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 10<\/td><td>Portes fermées. Démonstrations de sécurité, sécurisation de chaque zone.<\/td><\/tr><tr><td class='num' style='font-size:16.8px;width:20mm'>H − 3<\/td><td>« All attendants » : comptes rendus par porte, bouton cabin ready, roulage, décollage.<\/td><\/tr><\/table>\n<div class=\"cols\" style=\"gap:6mm;margin-top:1mm\">\n<div><h2 style=\"margin-top:1mm\">Prestations sol en classe affaires<\/h2><table style=\"font-size:13.8px\"><tr><td>Accueil et placement<\/td><td style='width:30mm'>postes 7 et 10<\/td><\/tr><tr><td>Vestiaires<\/td><td style='width:30mm'>postes 7 et 10<\/td><\/tr><tr><td>Boisson d’accueil<\/td><td style='width:30mm'>postes 7 et 10<\/td><\/tr><tr><td>Trousses de confort<\/td><td style='width:30mm'>postes 7 et 10<\/td><\/tr><tr><td>Fonctionnement des sièges<\/td><td style='width:30mm'>postes 7 et 10<\/td><\/tr><tr><td>Actions commerciales au sol, au galley G2<\/td><td style='width:30mm'>poste 7<\/td><\/tr><\/table>\n<p class=\"small\" data-key=\"d15\">Sur la fiche de postes, l’accueil de la classe affaires est partagé entre les postes 7 et 10. Le poste 7 prépare aussi les actions commerciales au sol au galley G2.<\/p><\/div>\n<div><h2 style=\"margin-top:1mm\">Les mots du bord<\/h2><table style=\"font-size:13.3px\"><tr><td style='width:30mm'><b>CCP<\/b><\/td><td>Chef de cabine principal : dirige l’équipage de cabine, actionne le bouton cabin ready.<\/td><\/tr><tr><td style='width:30mm'><b>CC, ASC<\/b><\/td><td>Chef de cabine ; assistant sécurité cabine (steward ou hôtesse).<\/td><\/tr><tr><td style='width:30mm'><b>All attendants<\/b><\/td><td>Appel du CCP qui fait sonner tous les interphones : chaque PNC de porte ou de zone rend compte, assis, que sa zone est sécurisée et prête au décollage.<\/td><\/tr><tr><td style='width:30mm'><b>Fiche de postes<\/b><\/td><td>Document propre à chaque version : poste, porte, zone et rôles de chaque PNC.<\/td><\/tr><tr><td style='width:30mm'><b>Office, galley<\/b><\/td><td>Cuisine de bord : chariots, fours, armoires. Le G0 : office avant.<\/td><\/tr><tr><td style='width:30mm'><b>Cabin ready<\/b><\/td><td>Bouton actionné par le CCP quand toute la cabine est confirmée : le voyant passe au vert au poste de pilotage, item de la check-list avant décollage.<\/td><\/tr><tr><td style='width:30mm'><b>Mise en puissance<\/b><\/td><td>Application de la puissance de décollage : début du roulement au décollage.<\/td><\/tr><\/table><\/div>\n<\/div>\n\n<p class=\"small\" style=\"margin:0\">Ce cadre fait partie des règles du jeu : rien n’existe en dehors de ce que décrit ce dossier, documentation de bord comprise.<\/p>"},{"id":"doc1","label":"Fiche de postes","html":"<div class=\"kicker\">Dossier de vol · 4/5 · documentation de bord<\/div>\n<h1>Fiche de postes et plan d'armement<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Votre documentation de bord : la fiche de postes de la version du jour et vos trois checks. Un PNC travaille avec deux checks pour sa zone, sécurité et hôtellerie, et une check commune à tout l’équipage.<\/p>\n<h2 style=\"margin-top:2mm\">Fiche de postes · extrait<\/h2>\n<table class=\"grid roles\"><tr><th>Poste<\/th><th>Porte<\/th><th>Fonction et rôle au sol<\/th><\/tr><tr><td class='num' style='width:14mm;font-size:16.8px'>1<\/td><td style='width:14mm'>1G<\/td><td>CCP. Supervision cabine, appel « all attendants », bouton cabin ready.<\/td><\/tr><tr><td class='num' style='width:14mm;font-size:16.8px'>2<\/td><td style='width:14mm'>4G<\/td><td>CC. Cabine arrière.<\/td><\/tr><tr><td class='num' style='width:14mm;font-size:16.8px'>4<\/td><td style='width:14mm'>2G<\/td><td>ASC. Remplace le chef de cabine manquant de la cabine avant : vérification des prestations (plombs).<\/td><\/tr><tr><td class='num' style='width:14mm;font-size:16.8px'>7<\/td><td style='width:14mm'>2D<\/td><td>ASC. Accueil classe affaires (partie), actions commerciales au sol au galley G2.<\/td><\/tr><tr><td class='num' style='width:14mm;font-size:16.8px'>10<\/td><td style='width:14mm'>1D<\/td><td>ASC. Le G0 (office avant). Accueil classe affaires, vestiaires, boisson d’accueil, trousses.<\/td><\/tr><\/table>\n<p class=\"small\" style=\"margin:0.6mm 0 0\">Postes 3, 5, 6, 8 et 9 (ASC) : portes 3 à 5. ASC : assistant sécurité cabine, steward ou hôtesse. La porte est la place assise du PNC au roulage, au décollage et à l’atterrissage.<\/p>\n<h2>Check sécurité · plan d'armement de votre zone<\/h2>\n<p class=\"small\" style=\"margin:0 0 1mm\" data-key=\"d6\">Zone du poste 10 : porte 1D, G0, toilettes avant, rangs 1 à 7 de la classe affaires. À vérifier à la prise en compte du poste.<\/p>\n<div style=\"margin:0 auto 2mm;width:88%\"><svg viewBox=\"0 0 320 142\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\"><defs><pattern id=\"hz\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#cfcfcf\" stroke-width=\"2\"/><\/pattern><\/defs><path d=\"M318 22 H62 Q14 22 6 71 Q14 120 62 120 H318\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.4\"/><line x1=\"318\" y1=\"22\" x2=\"318\" y2=\"120\" stroke=\"#111\" stroke-width=\"0.8\" stroke-dasharray=\"3 3\"/><path d=\"M12 71 Q16 36 50 31 V111 Q16 106 12 71 Z\" fill=\"url(#hz)\" stroke=\"#111\" stroke-width=\"0.7\"/><text x=\"33\" y=\"74\" text-anchor=\"middle\" font-size=\"7\" fill=\"#333\">Poste<\/text><rect x=\"72\" y=\"18\" width=\"16\" height=\"7\" fill=\"#111\"/><rect x=\"72\" y=\"117\" width=\"16\" height=\"7\" fill=\"#111\"/><text x=\"80\" y=\"13\" text-anchor=\"middle\" font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"9\">1D<\/text><text x=\"80\" y=\"137\" text-anch ll=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"224\" y=\"62\" width=\"12\" height=\"18\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"224\" y=\"103\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"241\" y=\"28\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"241\" y=\"62\" width=\"12\" height=\"18\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"241\" y=\"103\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"258\" y=\"28\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"258\" y=\"62\" width=\"12\" height=\"18\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"258\" y=\"103\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"275\" y=\"28\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"275\" y=\"62\" width=\"12\" height=\"18\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><rect x=\"275\" y=\"103\" width=\"12\" height=\"11\" rx=\"1.5\" fill=\"#f3f3f3\" stroke=\"#999\" stroke-width=\"0.6\"/><text x=\"240\" y=\"56\" text-anchor=\"middle\" font-size=\"6.2\" fill=\"#333\">classe affaires, rangs 1 à 7<\/text><circle cx=\"106\" cy=\"56\" r=\"5.4\" fill=\"#111\"/><text x=\"106\" y=\"58.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">1<\/text><circle cx=\"124\" cy=\"56\" r=\"5.4\" fill=\"#111\"/><text x=\"124\" y=\"58.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">2<\/text><circle cx=\"106\" cy=\"36\" r=\"5.4\" fill=\"#111\"/><text x=\"106\" y=\"38.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">3<\/text><circle cx=\"115\" cy=\"90\" r=\"5.4\" fill=\"#111\"/><text x=\"115\" y=\"92.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">4<\/text><circle cx=\"63\" cy=\"31\" r=\"5.4\" fill=\"#111\"/><text x=\"63\" y=\"33.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">5<\/text><circle cx=\"142\" cy=\"72\" r=\"5.4\" fill=\"#111\"/><text x=\"142\" y=\"74.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">6<\/text><circle cx=\"155\" cy=\"32\" r=\"5.4\" fill=\"#111\"/><text x=\"155\" y=\"34.4\" text-anchor=\"middle\" font-size=\"6.6\" font-weight=\"700\" fill=\"#fff\">7<\/text><\/svg><\/div>\n<div class=\"cols\" style=\"gap:8mm\">\n<div><div class=\"ck\"><span class=\"it\">Porte 1D, toboggan<\/span><span class=\"d\"><\/span><span class=\"st\">PRESSION OK<\/span><\/div><div class=\"ck\"><span class=\"it\">Strapontin 1D, harnais<\/span><span class=\"d\"><\/span><span class=\"st\">OK<\/span><\/div><div class=\"ck\"><span class=\"it\">1 · Extincteur<\/span><span class=\"d\"><\/span><span class=\"st\">PLOMBÉ, PLEIN<\/span><\/div><div class=\"ck\"><span class=\"it\">2 · Cagoule anti-fumée<\/span><span class=\"d\"><\/span><span class=\"st\">PLOMBÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">3 · Bouteille d’oxygène<\/span><span class=\"d\"><\/span><span class=\"st\">PLEINE<\/span><\/div><\/div>\n<div><div class=\"ck\"><span class=\"it\">4 · Trousse de secours<\/span><span class=\"d\"><\/span><span class=\"st\">PLOMBÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">5 · Lampe torche<\/span><span class=\"d\"><\/span><span class=\"st\">CHARGÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">6 · Mégaphone<\/span><span class=\"d\"><\/span><span class=\"st\">PRÉSENT<\/span><\/div><div class=\"ck\"><span class=\"it\">7 · WC, détecteur de fumée<\/span><span class=\"d\"><\/span><span class=\"st\">OK<\/span><\/div><\/div>\n<\/div>\n\n<p class=\"small\" style=\"margin:0\">Extraits reconstitués pour le jeu. Ils ne reproduisent la documentation d’aucune compagnie.<\/p>"},{"id":"doc2","label":"Checks","html":"<div class=\"kicker\">Dossier de vol · 5/5 · documentation de bord<\/div>\n<h1>Les checks du poste 10<\/h1>\n<div class=\"cols\" style=\"gap:8mm\">\n<div><h2 style=\"margin-top:1mm\">Check sécurité · avant décollage<\/h2><div class=\"ck-sec\">Zone<\/div><div class=\"ck\"><span class=\"it\">Porte 1D<\/span><span class=\"d\"><\/span><span class=\"st\">NON OBSTRUÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">Allée<\/span><span class=\"d\"><\/span><span class=\"st\">DÉGAGÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">Rideaux<\/span><span class=\"d\"><\/span><span class=\"st\">OUVERTS<\/span><\/div><div class=\"ck\"><span class=\"it\">Toilettes<\/span><span class=\"d\"><\/span><span class=\"st\">VÉRIFIÉES, FERMÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Passagers<\/span><span class=\"d\"><\/span><span class=\"st\">ASSIS, ATTACHÉS<\/span><\/div><div class=\"ck\"><span class=\"it\">Sièges<\/span><span class=\"d\"><\/span><span class=\"st\">REDRESSÉS<\/span><\/div><div class=\"ck-sec\">G0<\/div><div class=\"ck\" data-key=\"d9\"><span class=\"it\">Voitures<\/span><span class=\"d\"><\/span><span class=\"st\">RANGÉES, FREINÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Loquets<\/span><span class=\"d\"><\/span><span class=\"st\">VERROUILLÉS<\/span><\/div><div class=\"ck\"><span class=\"it\">Armoires<\/span><span class=\"d\"><\/span><span class=\"st\">VERROUILLÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Plan de travail<\/span><span class=\"d\"><\/span><span class=\"st\">DÉGAGÉ<\/span><\/div><div class=\"ck\"><span class=\"it\">Fours, cafetières<\/span><span class=\"d\"><\/span><span class=\"st\">ARRÊTÉS<\/span><\/div><div class=\"ck-sec\">Compte rendu<\/div><p class=\"ck-note\" data-key=\"d6\">Service et sécurité terminés, assis à son poste, à l’appel « all attendants » : « Porte 1 droite, zone sécurisée » ou « zone pas prête ». Le CCP n’appuie sur le bouton cabin ready que lorsque toute la cabine est confirmée.<\/p><\/div>\n<div><h2 style=\"margin-top:1mm\">Check hôtellerie · zone du poste 10<\/h2><div class=\"ck-sec\">Classe affaires<\/div><div class=\"ck\"><span class=\"it\">Sièges, écrans<\/span><span class=\"d\"><\/span><span class=\"st\">FONCTIONNELS<\/span><\/div><div class=\"ck\"><span class=\"it\">Couvertures, oreillers<\/span><span class=\"d\"><\/span><span class=\"st\">EN PLACE<\/span><\/div><div class=\"ck\"><span class=\"it\">Trousses de confort<\/span><span class=\"d\"><\/span><span class=\"st\">CHARGÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Journaux<\/span><span class=\"d\"><\/span><span class=\"st\">CHARGÉS<\/span><\/div><div class=\"ck\"><span class=\"it\">Vestiaires<\/span><span class=\"d\"><\/span><span class=\"st\">LIBRES<\/span><\/div><div class=\"ck\"><span class=\"it\">Toilettes avant<\/span><span class=\"d\"><\/span><span class=\"st\">APPROVISIONNÉES<\/span><\/div><div class=\"ck-sec\">G0<\/div><div class=\"ck\"><span class=\"it\">Voitures<\/span><span class=\"d\"><\/span><span class=\"st\">PLOMBÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Prestations<\/span><span class=\"d\"><\/span><span class=\"st\">CONFORMES<\/span><\/div><div class=\"ck\"><span class=\"it\">Boissons d’accueil<\/span><span class=\"d\"><\/span><span class=\"st\">PRÊTES<\/span><\/div><div class=\"ck\"><span class=\"it\">Fours, cafetières<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉS<\/span><\/div><p class=\"ck-note\" data-key=\"d1\">Les voitures arrivent plombées du catering. Au sol, le chef de cabine du galley casse les plombs et contrôle les prestations. Le CCP peut reporter tout ou partie du service au sol après le décollage : la sécurité prime.<\/p><\/div>\n<\/div>\n<h2>Check commune · tout l'équipage<\/h2>\n<p class=\"small\" style=\"margin:0 0 1.4mm\">Avant l’embarquement, chaque PNC à son poste ; le CCP dirige la check à l’interphone.<\/p>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:6mm\"><div><div class=\"ck-sec\" style=\"margin-top:0\">Éclairages<\/div><div class=\"ck\"><span class=\"it\">Éclairage cabine<\/span><span class=\"d\"><\/span><span class=\"st\">TOUTES INTENSITÉS<\/span><\/div><div class=\"ck\"><span class=\"it\">Lumières de lecture<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Éclairage de secours<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉ<\/span><\/div><div class=\"ck\"><span class=\"it\">Balisage au sol<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉ<\/span><\/div><div class=\"ck\"><span class=\"it\">Signaux ceintures<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉS<\/span><\/div><\/div><div><div class=\"ck-sec\" style=\"margin-top:0\">Communications<\/div><div class=\"ck\"><span class=\"it\">Interphones<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉS<\/span><\/div><div class=\"ck\"><span class=\"it\">Annonces passagers<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉES<\/span><\/div><div class=\"ck\"><span class=\"it\">Appel pilotes<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉ<\/span><\/div><div class=\"ck\"><span class=\"it\">Appels des sièges<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉS<\/span><\/div><\/div><div><div class=\"ck-sec\" style=\"margin-top:0\">Alarmes<\/div><div class=\"ck\"><span class=\"it\">Alarme d’évacuation<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉE<\/span><\/div><div class=\"ck\"><span class=\"it\">Détecteurs de fumée<\/span><span class=\"d\"><\/span><span class=\"st\">TESTÉS<\/span><\/div><\/div><\/div>\n\n<p class=\"small\" style=\"margin:0\">Extraits reconstitués pour le jeu. Ils ne reproduisent la documentation d’aucune compagnie.<\/p>"}],"art":{"1":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"11\" y=\"8\" width=\"26\" height=\"34\" rx=\"2.5\"/><path d=\"M18 8V5.5h12V8\"/><path d=\"M17 17h14M17 23h14M17 29h9\"/><circle cx=\"31\" cy=\"33\" r=\"3.5\"/><\/svg>","9":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"10\" y=\"9\" width=\"28\" height=\"30\" rx=\"2\"/><path d=\"M10 24h28\"/><rect x=\"14\" y=\"6\" width=\"6\" height=\"4\" fill=\"currentColor\"/><rect x=\"28\" y=\"6\" width=\"6\" height=\"4\" fill=\"currentColor\"/><circle cx=\"16\" cy=\"42\" r=\"2.6\"/><circle cx=\"32\" cy=\"42\" r=\"2.6\"/><rect x=\"34\" y=\"13\" width=\"3\" height=\"5\" fill=\"currentColor\"/><\/svg>","15":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M14 7c4 0 6 2 6 6v14h12c3 0 5 2 5 5v3H17c-3 0-5-2-5-5V11c0-2 1-4 2-4z\"/><path d=\"M17 35v6M33 35v6M12 41h26\"/><path d=\"M33 21h6\"/><\/svg>","6":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M12 8c-3 0-5 3-4 7 2 9 9 18 18 22 4 1 7-1 7-4l-1-3-7-3-3 3c-5-2-9-7-11-11l3-3-3-7z\"/><path d=\"M30 8a10 10 0 0 1 10 10M30 14a4 4 0 0 1 4 4\"/><\/svg>","16":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 36l30-14c3-1.5 6 0 5 2l-6 4-20 9-6 1z\"/><path d=\"M20 28l-5-9h4l9 6\"/><path d=\"M6 42h36\"/><\/svg>","8":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 14h36M6 20h36\"/><path d=\"M6 30h36M6 36h36\" stroke-dasharray=\"5 4\"/><\/svg>","19":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><g transform=\"rotate(-24 24 26)\"><rect x=\"12\" y=\"12\" width=\"24\" height=\"24\" rx=\"2\"/><path d=\"M12 24h24\"/><circle cx=\"17\" cy=\"39\" r=\"2.4\"/><circle cx=\"31\" cy=\"39\" r=\"2.4\"/><\/g><path d=\"M6 43h36\"/><\/svg>","3":"<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"20\" y=\"14\" width=\"18\" height=\"20\" rx=\"2\"/><path d=\"M20 24h18\"/><circle cx=\"24\" cy=\"37\" r=\"2.4\"/><circle cx=\"34\" cy=\"37\" r=\"2.4\"/><path d=\"M4 18h10M2 24h12M5 30h9\"/><path d=\"M42 6v8M42 18v.5\"/><\/svg>"},"brief":"Vous êtes ASC au poste 10. Ici, la sécurité coûte du temps, et le temps se paie souvent en étoiles : la note que la compagnie exige à cinq.","eval":{"questions":[{"t":"Avant le cabin ready, comment un PNC rend-il compte que sa zone est sécurisée ?","type":"single","options":["En allant trouver le CCP, là où il se trouve","À l’appel « all attendants » du CCP, assis à son poste, une fois toute sa zone vérifiée","Au poste de pilotage, directement","Dès que ses passagers sont attachés, l’office pouvant attendre"],"answer":1,"notion":"Sécurisation de zone et cabin ready"},{"t":"Quels éléments font d’une charge de travail une menace à traiter au briefing ?","type":"multi","options":["Une version de cabine inhabituelle","Des rôles découverts le jour même","Un chargement en retard","Des passagers nombreux à découvrir le service","Une équipe expérimentée"],"answer":[0,1,2,3],"notion":"Menace au sens du TEM"},{"t":"Qu’appelle-t-on la « normalisation de la déviance » ?","type":"open","expected":"Un écart toléré et répété finit par devenir la norme ; exemple : l’annonce « cabin ready envoyé »","notion":"Normalisation de la déviance"},{"t":"« Une vérification faite avant une interruption reste valable jusqu’au décollage. »","type":"single","options":["Vrai","Faux"],"answer":1,"notion":"Validité d’une vérification ; interruptions et mémoire prospective"},{"t":"« Reporter une prestation commerciale après le décollage peut être une décision de sécurité. »","type":"single","options":["Vrai","Faux"],"answer":0,"notion":"Priorité de la sécurité sur le service"},{"t":"L’annonce « cabin ready envoyé », faite en cabine par le CCP, est :","type":"single","options":["Une procédure standard","Une pratique non référencée, qui incite à ne pas s’attacher aussitôt","Une obligation réglementaire"],"answer":1,"notion":"Mesure prise par l’exploitant après l’événement"}],"q7":"« Je me sens capable de répondre “zone pas prête” à l’appel du CCP pour finir une vérification. »","likert":["Le scénario est réaliste.","Les options proposées étaient toutes plausibles.","Les choix étaient difficiles : aucune option n’était évidente.","Les règles étaient claires dès le briefing.","Le débriefing m’a aidé à comprendre mes choix.","Ce jeu est utile pour ma pratique.","Le dossier de vol suffisait pour comprendre la situation.","La durée était adaptée.","Les jetons TEMPS et les étoiles rendaient la pression réaliste."],"yn":["Connaissiez-vous l’événement réel avant la séance ?","Avez-vous déjà reporté une vérification de sécurité pour finir un service ?"],"open":["Quel choix vous a paru le plus difficile, et qu’est-ce qui le rendait coûteux ?"],"application":"Que direz-vous, et quand, lors de votre prochain vol en équipage ?"},"criteria":{"traps":[11,5],"fin_max":70,"fin1":[20,60],"extra":[["Étoiles et fins","les fins sûres ont en moyenne moins d’étoiles que les fins 3 et 4 : c’est l’effet recherché"],["Durée de partie, hors dossier","15 à 20 min pour 80 % des joueurs"],["Validation par un CCP de ligne","aucune réserve majeure sur les procédures"]]},"debriefPages":{"guide":"<h1>Débriefing · 30 minutes<\/h1>\n<p class=\"lead\" style=\"margin-bottom:2mm\">Transformer l’expérience du jeu en compréhension : le cas réel, le prix du temps, les barrières, ce qu’a changé l’exploitant. Trois règles : faire parler avant d’expliquer ; analyser des situations, pas des personnes ; distinguer un fait du rapport d’une interprétation.<\/p>\n<div class=\"box tint small\" style=\"margin-bottom:2mm\">Matériel : tableau blanc, fiche mémo (une par participant, distribuée à la fin), répartition des choix, jetons TEMPS et étoiles restants, réponses aux dernières questions relevés pendant la partie.<\/div>\n<div class=\"blk\"><div class=\"t\">0:00<small>3 min<\/small><\/div><div><h3>Réactions à chaud<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Chacun garde sa pile de vol fermée. Tour de table rapide, PNC en premier, chefs de cabine ensuite.<\/div><div class=\"l\">Demander<\/div><div>« En un mot, qu’avez-vous ressenti quand votre dernier jeton TEMPS est parti ? » puis « Ceux qui ont fait le tour rapide : à quel moment avez-vous eu le sentiment d’avoir vérifié ? »<\/div><div class=\"l\">Repère<\/div><div>Ne rien analyser encore. « C’est injuste », « je n’avais plus le temps » sont des données : c’est ce que vit un équipage pressé.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:03<small>4 min<\/small><\/div><div><h3>Pile de vol, étoiles et dernières questions<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Chacun lit le dos de ses cartes SUITE, en silence (2 min). Reporter au tableau la répartition de D1 à D4, puis un tableau à deux colonnes : la fin obtenue et le nombre d’étoiles. Faire lire une réponse à la dernière question par fin.<\/div><div class=\"l\">Repère<\/div><div>Le tableau parle seul : les fins sûres ont souvent moins d’étoiles que l’accident. La note récompensait le service, pas la sécurité.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:07<small>4 min<\/small><\/div><div><h3>Le cas réel<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Raconter l’événement à partir de la chronologie de la fiche mémo (page 1), sans la lire. Révéler l’issue.<\/div><div class=\"l\">Dire<\/div><div>Une erreur de lecture loin de l’avion, au centre des opérations. Puis une escale où chacun fait bien son travail de service. Aucune faute grossière isolée : une suite d’arbitrages raisonnables, tous en faveur du service.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:11<small>6 min<\/small><\/div><div><h3>Le prix du temps<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Partir des jetons : où chacun a-t-il dépensé son temps ? Qui a reporté une prestation, qui l’a refusé, pourquoi ? Puis lire ce que dit l’exploitant lui-même (fiche mémo, page 3).<\/div><div class=\"l\">Demander<\/div><div>« Qui mesurait le service ce jour-là ? Et qui mesurait la sécurité ? » · « Chez nous, que se passe-t-il pour un PNC qui reporte la boisson d’accueil ? »<\/div><div class=\"l\">Dire<\/div><div>Le principe ETTO de Hollnagel : sous pression, on échange de la rigueur contre de l’efficacité, presque toujours avec succès. C’est ce qui rend l’échange invisible, jusqu’au jour où il échoue.<\/div><div class=\"l\">Repère<\/div><div>Aucun hasard dans ce jeu : la fin 3 tient à une voiture freinée avant l’embarquement, la fin 4 à une omission. Une fin 3 n’est pas une réussite.<\/div><\/div><\/div><\/div><div class=\"blk\"><div class=\"t\">0:17<small>6 min<\/small><\/div><div><h3>Analyse : six barrières<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Dessiner six tranches au tableau (modèle de Reason). Laisser le groupe trouver le trou de chaque tranche, puis compléter avec la fiche mémo (page 2).<\/div><div class=\"l\">Demander<\/div><div>« Quelle tranche le PNC du poste 10 pouvait-il boucher, et avec quel temps ? » · « Et le CCP ? » · « Laquelle notre compagnie laisse-t-elle ouverte ? »<\/div><div class=\"l\">Zoom<\/div><div>La gestion des menaces et des erreurs (TEM) : la menace (charge de travail) n’est pas nommée au briefing ; les erreurs (vérification incomplète, raccourci de compte rendu) ne sont pas rattrapées ; l’état indésirable (voiture non verrouillée) n’est pas détecté.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:23<small>3 min<\/small><\/div><div><h3>Ce qu’a changé l’exploitant<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Le rapport ne formule pas de recommandation : présenter les mesures prises par l’exploitant (fiche mémo, page 5) et les relier aux choix du jeu.<\/div><div class=\"l\">Demander<\/div><div>« Laquelle de ces mesures existe chez nous ? Laquelle manque ? Qui la porterait ? »<\/div><div class=\"l\">Repère<\/div><div>Une mesure, un responsable, un délai : c’est ainsi qu’un enseignement devient une barrière.<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:26<small>2 min<\/small><\/div><div><h3>Le vocabulaire qui compte<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Travailler cinq distinctions, puis renvoyer au glossaire : présence ou arrimage · vérifié ou verrouillé · regarder ou vérifier · menace ou erreur · report ou abandon du service.<\/div><div class=\"l\">Demander<\/div><div>« Dans le jeu, à quel moment avez-vous cru qu’une tâche était faite parce qu’elle avait été confiée à quelqu’un ? »<\/div><\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"t\">0:28<small>2 min<\/small><\/div><div><h3>Synthèse et transposition<\/h3><div class=\"r\"><div class=\"l\">Faire<\/div><div>Lire les cinq éléments à retenir et la boucle du cabin ready (fiche mémo, page 4). Distribuer la fiche mémo.<\/div><div class=\"l\">Demander<\/div><div>« Sur votre prochain vol, quelle prestation reporterez-vous si la préparation déraille, et avec quels mots le direz-vous au CCP ? » Puis tour de table : « Ce que je ferai au prochain cabin ready. »<\/div><\/div><\/div><\/div>\n<div class=\"box dark\" style=\"margin-top:3mm\"><div class=\"kicker\" style=\"color:#ccc\">Ensuite · 5 min<\/div>Questionnaire après, puis fiche « Ma pile de vol et mon avis ». Récupérer les fiches, les jetons et retrier les paquets.<\/div>\n<div class=\"box small\" style=\"margin-top:1mm\">Si le temps manque, ne coupez jamais « Le prix du temps » ni l’analyse. Si des chefs de cabine et leurs PNC sont dans la salle, ne demandez jamais à un PNC de juger son propre chef de cabine : restez sur le cas.<\/div>","memo":[{"id":"cas","label":"Le cas réel","html":"<div class=\"kicker\">Fiche mémo · 1/6<\/div>\n<h1>Ce qui s'est réellement passé<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.6mm\">Le 16 septembre 2018, à Maurice, le Boeing 777 F-GSQL d’Air France décolle pour Paris avec 279 passagers. C’est un avion de remplacement, d’une version de cabine inhabituelle sur cette ligne. Rapport BEA2018-0764, mai 2020.<\/p>\n<div class=\"tl\" style=\"margin-top:0\"><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">La veille<\/div><div>Le CCP et le chef de cabine apprennent que l’avion sera remplacé. Au centre des opérations, une erreur de lecture du catalogue des versions fait transmettre une version erronée : 58 sièges affaires au lieu de 16.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Arrivée<\/div><div>Les fiches de postes ne sont pas sur les tablettes : le CCP les trouve dans l’armoire de documentation. Le catering n’a pas fini ; l’embarquement est décalé de quelques minutes.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Briefings<\/div><div>Commercial par le chef de cabine (passagers peu détendus), sécurité par une hôtesse faisant fonction de chef de cabine. La charge de travail au sol n’est pas identifiée comme une menace.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Chargement<\/div><div>Important et anarchique : les PNC aident le catering. Le contrôle des plombs de la voiture de ventes est délégué à cette hôtesse, et reporté en vol.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Poste 10<\/div><div>Vérifie le G0 et la présence de la voiture, sans les plombs. Part en porte 2 réagencer les chariots ; l’embarquement commence avant la fin.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Embarquement<\/div><div>Seule pour tout l’accueil d’une classe affaires pleine de surclassés, elle se dit « submergée ».<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Compte rendu<\/div><div>Directement au CCP en porte 2. Le CCP annonce « cabin ready envoyé » alors que certains PNC ne sont pas à leur poste. En 1D, elle range des journaux ; pas le temps de revoir le G0.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Décollage<\/div><div>À la mise en puissance, la voiture de ventes (environ 80 kg) sort de son logement et dévale le couloir droit jusqu’au siège 39J. Huit passagers blessés, dont une gravement au visage.<\/div><\/div><div class=\"ev\"><div class=\"h\" style=\"font-size:16.8px\">Ensuite<\/div><div>Un médecin passager, une téléconférence avec le SAMU : pas de déroutement. Atterrissage à Paris, prise en charge de la passagère sur l’aire de stationnement.<\/div><\/div><\/div>\n<h2 style=\"margin-top:2mm\">Ce que l'enquête a établi<\/h2>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.3px;line-height:1.38\">\n<div><ul style=\"margin:0\">\n<li>L’enquête n’a pas pu déterminer si les loquets avaient été mal vérifiés, ou si la voiture avait été manipulée après la vérification.<\/li>\n<li>Les tâches de réagencement ont fait déroger les PNC aux rôles commerciaux de la fiche de postes.<\/li>\n<\/ul><\/div>\n<div><ul style=\"margin:0\">\n<li>Le compte rendu direct au CCP et l’annonce « cabin ready envoyé » n’ont pas permis une dernière vérification du G0.<\/li>\n<li>Selon la sécurité des vols de l’exploitant, la culture PNC reste très centrée sur le service, au détriment de certaines actions de sécurité.<\/li>\n<li>Écart avec le jeu : les 58 places affaires viennent ici d’une erreur de lecture du catalogue, pas d’un surclassement voulu. L’effet sur la charge de travail est le même.<\/li>\n<\/ul><\/div>\n<\/div>"},{"id":"raison","label":"Le raisonnement","html":"<div class=\"kicker\">Fiche mémo · 2/6<\/div>\n<h1>Pourquoi : six barrières traversées<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1mm\">Modèle de Reason : un accident survient quand les trous de plusieurs barrières s’alignent. Ici, le premier trou s’est ouvert la veille, loin de l’avion.<\/p>\n<div style=\"margin:0 0 1mm\"><svg viewBox=\"0 0 690 250\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\">\n<defs><pattern id=\"h2\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#c4c4c4\" stroke-width=\"2\"/><\/pattern>\n<marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#111\"/><\/marker><\/defs>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\".8\" fill=\"#111\">\n<path d=\"M78 22 V14 H236 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"157\" y=\"9\" text-anchor=\"middle\">ORGANISATION<\/text>\n<path d=\"M274 22 V14 H432 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"353\" y=\"9\" text-anchor=\"middle\">CONDITIONS PRÉALABLES<\/text>\n<path d=\"M470 22 V14 H628 V22\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"/><text x=\"549\" y=\"9\" text-anchor=\"middle\">ACTES AU SOL<\/text>\n<\/g>\n<path d=\"M82 46 L120 30 L120 178 L82 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"101\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"101\" cy=\"62\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M180 46 L218 30 L218 178 L180 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"199\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"199\" cy=\"160\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M278 46 L316 30 L316 178 L278 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"297\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"297\" cy=\"80\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M376 46 L414 30 L414 178 L376 194 Z\" fill=\"url(#h2)\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"395\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"395\" cy=\"150\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M474 46 L512 30 L512 178 L474 194 Z\" fill=\"#bdbdbd\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"493\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"493\" cy=\"58\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/><path d=\"M572 46 L610 30 L610 178 L572 194 Z\" fill=\"#bdbdbd\" stroke=\"#111\" stroke-width=\"1.4\"/><ellipse cx=\"591\" cy=\"112\" rx=\"7\" ry=\"13\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.1\"/><ellipse cx=\"591\" cy=\"165\" rx=\"5\" ry=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1\"/>\n<line x1=\"8\" y1=\"112\" x2=\"676\" y2=\"112\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ra)\"/>\n<g font-size=\"10\" fill=\"#111\" text-anchor=\"middle\"><text x=\"101\" y=\"216\" font-weight=\"600\">1 · Organisation<\/text><text x=\"101\" y=\"230\">catalogue, outil manuel<\/text><text x=\"199\" y=\"216\" font-weight=\"600\">2 · Préparation<\/text><text x=\"199\" y=\"230\">documents, rôles<\/text><text x=\"297\" y=\"216\" font-weight=\"600\">3 · Briefing<\/text><text x=\"297\" y=\"230\">menace non nommée<\/text><text x=\"395\" y=\"216\" font-weight=\"600\">4 · Délégation<\/text><text x=\"395\" y=\"230\">plombs reportés<\/text><text x=\"493\" y=\"216\" font-weight=\"600\">5 · Procédure<\/text><text x=\"493\" y=\"230\">compte rendu, annonce<\/text><text x=\"591\" y=\"216\" font-weight=\"600\">6 · Dernier passage<\/text><text x=\"591\" y=\"230\">le G0 non revu<\/text><\/g>\n<g font-family=\"Barlow Condensed, IBM Plex Sans, sans-serif\" font-weight=\"700\" font-size=\"12\" fill=\"#111\"><text x=\"8\" y=\"100\">ESCALE<\/text><text x=\"676\" y=\"100\" text-anchor=\"end\">COULOIR DROIT<\/text><\/g>\n<\/svg><\/div>\n<table style=\"font-size:13.4px\"><tr><th>Barrière<\/th><th>Ce qui a cédé, selon le rapport<\/th><\/tr><tr><td style='width:40mm'><b>1 · Organisation<\/b><\/td><td>Changement d’avion traité avec un outil non automatique ; erreur de lecture du catalogue des versions ; version erronée transmise à l’équipage et au catering.<\/td><\/tr><tr><td style='width:40mm'><b>2 · Préparation<\/b><\/td><td>Fiches de postes absentes des tablettes ; rôles découverts juste avant l’embarquement ; un chef de cabine manquant, remplacé par une hôtesse faisant fonction ; catering en retard.<\/td><\/tr><tr><td style='width:40mm'><b>3 · Briefing<\/b><\/td><td>Passagers tendus évoqués, charge de travail non identifiée comme une menace : aucune prestation reportée.<\/td><\/tr><tr><td style='width:40mm'><b>4 · Délégation<\/b><\/td><td>Contrôle des plombs délégué puis reporté en vol ; la voiture n’a pas été sortie avant le départ.<\/td><\/tr><tr><td style='width:40mm'><b>5 · Procédure<\/b><\/td><td>Compte rendu direct au CCP au lieu de l’interphone depuis le poste ; annonce non référencée « cabin ready envoyé » alors que des PNC ne sont pas assis.<\/td><\/tr><tr><td style='width:40mm'><b>6 · Dernier passage<\/b><\/td><td>En 1D, rangement des journaux ; plus le temps de revoir le G0 avant le décollage.<\/td><\/tr><\/table>\n<div class=\"box tint small\"><b>Lecture TEM.<\/b> Menace : une charge de travail inhabituelle, connue dès l’arrivée à l’avion. Erreurs : vérification incomplète du G0, compte rendu hors procédure. État indésirable : une voiture de 80 kg non verrouillée face au couloir. Aucune de ces étapes n’a été rattrapée.<\/div>"},{"id":"temps","label":"Le temps de la sécurité","html":"<div class=\"kicker\">Fiche mémo · 3/6<\/div>\n<h1>Le prix du temps<\/h1>\n<p class=\"lead\" style=\"margin-bottom:1.4mm\">Personne n’a choisi l’insécurité. Chacun a choisi le service, au moment où le temps manquait.<\/p>\n<div class=\"cols\" style=\"gap:6mm;font-size:13.0px;line-height:1.36\">\n<div><h3 style=\"margin-top:0\">Ce que disent l'enquête et les acteurs<\/h3><ul style=\"margin:0\"><li><b>Ce que dit l’exploitant.<\/b> Sa direction de la sécurité des vols constate que « la culture PNC demeure très centrée sur la réalisation des prestations commerciales et sur l’envie de satisfaire les passagers, au détriment de certaines actions de sécurité ».<\/li><li><b>Ce que dit la PNC.<\/b> Il devient compliqué d’équilibrer service et sécurité ; certaines actions commerciales ne sont pas réalisables avec l’effectif prévu sur certaines configurations.<\/li><li><b>Ce qu’ajoute l’exploitant.<\/b> La priorité au service est d’autant plus difficile à corriger que les informations qui l’auraient remise en cause n’étaient pas disponibles assez tôt.<\/li><\/ul><\/div>\n<div><h3 style=\"margin-top:0\">Ce qu'en disent les facteurs humains<\/h3><ul style=\"margin:0\"><li><b>Le principe ETTO.<\/b> Hollnagel, 2009. Sous pression, on échange de la rigueur (thoroughness) contre de l’efficacité (efficiency). L’échange réussit presque toujours : il devient invisible, puis habituel.<\/li><li><b>Interruptions et mémoire prospective.<\/b> Loukopoulos, Dismukes et Barshi, 2009. Une intention différée (« je reviendrai ») est la première victime des interruptions. Une vérification interrompue doit être refaite.<\/li><li><b>Normalisation de la déviance.<\/b> Vaughan, 1996. Un écart toléré et répété devient la norme : « cabin ready envoyé » a fini par paraître normal.<\/li><li><b>La mesure façonne le geste.<\/b> Ce qu’une organisation mesure et commente (satisfaction, ponctualité) oriente les arbitrages au sol. Ce qu’elle ne mesure pas (un loquet revérifié) reste invisible.<\/li><\/ul><\/div>\n<\/div>\n<h2 style=\"margin-top:2mm\">Ce que le jeu vous a fait vivre<\/h2>\n<table style=\"font-size:13.1px\"><tr><td style='width:64mm'><b>Les jetons TEMPS<\/b><\/td><td>La sécurité et le service puisent dans le même temps, qui ne se rallonge pas.<\/td><\/tr><tr><td style='width:64mm'><b>Les étoiles<\/b><\/td><td>Le service se voit et se note ; la sécurité réussie ne se voit pas.<\/td><\/tr><tr><td style='width:64mm'><b>Reporter coûte une étoile et rend du temps<\/b><\/td><td>C’est la mesure prise par l’exploitant : le service après le décollage quand il le faut.<\/td><\/tr><tr><td style='width:64mm'><b>« Zone pas prête » coûte deux jetons<\/b><\/td><td>Répondre « zone sécurisée » sans tout revoir ne coûte rien sur le moment ; cela supprime le dernier passage.<\/td><\/tr><tr><td style='width:64mm'><b>Une note basse vous coûte du temps<\/b><\/td><td>Des passagers mécontents réclament : la pression commerciale s’entretient elle-même.<\/td><\/tr><tr><td style='width:64mm'><b>Le tour rapide ne coûte aucun jeton<\/b><\/td><td>Il traite ce qui se voit et oublie ce qui ne réclame rien. Sans vérification complète avant l’embarquement, c’est l’accident.<\/td><\/tr><tr><td style='width:64mm'><b>Rendre compte, puis vérifier<\/b><\/td><td>Un compte rendu anticipé est faux, même si la vérification suit.<\/td><\/tr><tr><td style='width:64mm'><b>Réel : 4 étoiles ; prudent : 0<\/b><\/td><td>La note récompensait exactement ce qui a conduit à l’accident.<\/td><\/tr><\/table>\n<div class=\"box dark\" style=\"margin-top:2mm;font-size:13.4px\"><div class=\"kicker\" style=\"color:#ccc\">Qui décide de la priorité ?<\/div><b>Le PNC<\/b> nomme la surcharge, finit ou refait ses vérifications, rend compte à son interphone, répond « zone pas prête » s’il doute. <b>Le CCP<\/b> reporte les prestations, tient la boucle de compte rendu, n’annonce jamais un cabin ready par anticipation. <b>La compagnie<\/b> ajuste prestations et effectifs, met les documents à disposition à temps, et ne pénalise jamais un report décidé pour la sécuri
